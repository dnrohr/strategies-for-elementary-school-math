<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">The times-eleven digit pattern for twelve</title><desc id="desc">Twelve is shown as first digit one, middle sum one plus two equals three, and last digit two, producing 132. A caution badge says the shortcut needs adjustment when the digit sum carries.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">For 12 × 11, insert 1 + 2</text><path d="M230 310H450M750 310H970" stroke="#7652A8" stroke-width="6" stroke-dasharray="10 12"/><text x="230" y="340" font-size="90" font-weight="700">1</text><rect x="450" y="220" width="300" height="150" rx="30" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="600" y="315" font-size="58" font-weight="700">1 + 2 = 3</text><text x="970" y="340" font-size="90" font-weight="700">2</text><text x="600" y="520" font-size="100" font-weight="700" fill="#287A55">132</text><g class="carry-caution"><path d="M345 610H855L825 710H375Z" fill="#FFF4CF" stroke="#8A5A00" stroke-width="6"/><text x="600" y="653" font-size="23" font-weight="700">CAUTION: other inputs may carry</text><text x="600" y="687" font-size="21">Always check: 120 + 12 = 132</text></g></g></svg>
