<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Ten fingers and one external tally track eleven groups of twelve</title>
  <desc id="desc">Two anatomically plausible hands provide exactly ten finger positions for groups one through ten. A separate tally card marks group eleven. A twelve-dot unit card and equation show that eleven groups of twelve equal 132.</desc>
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
  </defs>
  <image href="../../raster/ch05/ch05_m17_fingers-group-counter_raster.png" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect x="55" y="35" width="1090" height="235" rx="28" fill="#FFFDF8" fill-opacity=".95" stroke="#18324A" stroke-width="4" filter="url(#soft)"/>
  <g font-family="Arial,sans-serif" fill="#18324A">
    <text x="90" y="88" font-size="31" font-weight="700">Ten fingers track groups 1–10; one separate mark tracks group 11.</text>
    <g class="counters-twelve" fill="#2764B8" stroke="#18324A" stroke-width="2">
      <circle cx="105" cy="145" r="11"/><circle cx="135" cy="145" r="11"/><circle cx="165" cy="145" r="11"/><circle cx="195" cy="145" r="11"/>
      <circle cx="105" cy="178" r="11"/><circle cx="135" cy="178" r="11"/><circle cx="165" cy="178" r="11"/><circle cx="195" cy="178" r="11"/>
      <circle cx="105" cy="211" r="11"/><circle cx="135" cy="211" r="11"/><circle cx="165" cy="211" r="11"/><circle cx="195" cy="211" r="11"/>
    </g>
    <text x="150" y="250" text-anchor="middle" font-size="21" font-weight="700">one group = 12</text>
    <text x="300" y="175" font-size="34" font-weight="700">10 groups × 12 = 120</text>
    <text x="676" y="175" font-size="34" font-weight="700">+</text>
    <g class="external-tally">
      <rect x="715" y="115" width="150" height="112" rx="18" fill="#F6E7C8" stroke="#D97706" stroke-width="5"/>
      <line x1="790" y1="138" x2="790" y2="186" stroke="#D97706" stroke-width="10" stroke-linecap="round"/>
      <text x="790" y="214" text-anchor="middle" font-size="20" font-weight="700">group 11</text>
    </g>
    <text x="890" y="175" font-size="28" font-weight="700">1 group × 12 = 12</text>
    <text x="1085" y="258" text-anchor="end" font-size="30" font-weight="700" fill="#287A55">120 + 12 = 132</text>
  </g>
  <g class="ten-finger-groups" font-family="Arial,sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFDF8" stroke="#18324A" stroke-width="2">
    <circle cx="255" cy="480" r="21"/><circle cx="310" cy="455" r="21"/><circle cx="360" cy="440" r="21"/><circle cx="410" cy="470" r="21"/><circle cx="470" cy="570" r="21"/>
    <circle cx="755" cy="575" r="21"/><circle cx="790" cy="480" r="21"/><circle cx="835" cy="440" r="21"/><circle cx="890" cy="465" r="21"/><circle cx="940" cy="500" r="21"/>
    <g fill="#18324A" stroke="none"><text x="255" y="487">1</text><text x="310" y="462">2</text><text x="360" y="447">3</text><text x="410" y="477">4</text><text x="470" y="577">5</text><text x="755" y="582">6</text><text x="790" y="487">7</text><text x="835" y="447">8</text><text x="890" y="472">9</text><text x="940" y="507">10</text></g>
  </g>
</svg>
