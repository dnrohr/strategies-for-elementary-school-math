<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Measure the seven-unit gap between eight and fifteen</title><desc id="desc">A static number line places endpoints at eight and fifteen with six interior ticks. A heavy double bracket spans exactly seven equal intervals, subdivided at ten into two units and five units. There are no removal arrows.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Difference as distance</text><text x="64" y="110" font-size="24" fill="#52605A">Nothing disappears: measure the interval from 8 to 15.</text><path d="M160 420H1040" stroke="#24312D" stroke-width="7"/><g stroke="#24312D" stroke-width="5"><path d="M180 395v50M300 395v50M420 395v50M540 395v50M660 395v50M780 395v50M900 395v50M1020 395v50"/></g><g font-size="25" text-anchor="middle" fill="#24312D"><text x="180" y="490">8</text><text x="300" y="490">9</text><text x="420" y="490">10</text><text x="540" y="490">11</text><text x="660" y="490">12</text><text x="780" y="490">13</text><text x="900" y="490">14</text><text x="1020" y="490">15</text></g><path d="M180 325v-42h840v42" fill="none" stroke="#287A55" stroke-width="10"/><path d="M180 312v-29h840v29" fill="none" stroke="#287A55" stroke-width="4"/><text x="600" y="245" text-anchor="middle" font-size="40" font-weight="700" fill="#287A55">7 equal unit lengths</text><path d="M180 550v28h240v-28M420 550v28h600v-28" fill="none" stroke="#7652A8" stroke-width="5"/><text x="300" y="625" text-anchor="middle" font-size="28" font-weight="700" fill="#7652A8">2</text><text x="720" y="625" text-anchor="middle" font-size="28" font-weight="700" fill="#7652A8">5</text><text x="600" y="710" text-anchor="middle" font-size="36" font-weight="700">15 − 8 = 2 + 5 = 7</text></g></svg>
