<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Long division records twenty-three divided by five as four remainder three</title>
  <desc id="desc">A large written division workspace shows five outside twenty-three, quotient four above, four times five equals twenty beneath, and subtraction leaving remainder three. Arrows connect the quotient to the product and the product to the subtraction.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="90" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">The written algorithm exposes the remainder</text>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="70" font-weight="700"><text x="350" y="390">5</text><text x="500" y="260">4</text><text x="475" y="390">23</text><text x="475" y="500">−20</text><text x="520" y="620">3</text></g><path d="M430 315q0-55 55-55h170M455 520h210" fill="none" stroke="#18324A" stroke-width="7"/>
  <path d="M610 245C760 230 800 320 690 395" fill="none" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/><text x="820" y="300" font-family="Arial,sans-serif" font-size="27" fill="#553A78">4 × 5 = 20</text><path d="M690 430C820 470 800 560 660 585" fill="none" stroke="#C66A12" stroke-width="6" stroke-dasharray="12 8" marker-end="url(#a)"/><text x="820" y="530" font-family="Arial,sans-serif" font-size="27" fill="#8A4308">23 − 20 = 3</text><rect x="450" y="550" width="165" height="95" rx="18" fill="none" stroke="#B33A3A" stroke-width="5" stroke-dasharray="10 7"/><text x="600" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#7A2525">23 ÷ 5 = 4 R3</text>
<g data-qa-detail="numbered-order"><g font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><circle cx="1010" cy="300" r="24" fill="#7652A8"/><text x="1010" y="308" fill="#FFFDF8">1</text><circle cx="1010" cy="515" r="24" fill="#C66A12"/><text x="1010" y="523" fill="#FFFDF8">2</text></g></g></svg>
