<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Verbal unit language coordinates three fractions</title><desc id="desc">Four speech-like cards state that fourths are renamed as twelfths, three fourths becomes 9 twelfths, two thirds becomes 8 twelfths, and five twelfths stays 5. A final card adds 9 plus 8 plus 5 same-sized units to make 22 twelfths.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="78" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Keep saying what the unit means</text><path d="M90 135q15-20 30 0t30 0t30 0t30 0t30 0t30 0" fill="none" stroke="#7652A8" stroke-width="5"/><text x="330" y="145" font-family="Arial,sans-serif" font-size="23" fill="#553A78">inner-speech motif · constructed account</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><rect x="80" y="200" width="490" height="130" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="115" y="255" font-size="26" font-weight="700">“Fourths are not the unit yet.”</text><text x="115" y="302" font-size="24">3/4 → 9 twelfths</text><rect x="630" y="200" width="490" height="130" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="665" y="255" font-size="26" font-weight="700">“Thirds become twelfths too.”</text><text x="665" y="302" font-size="24">2/3 → 8 twelfths</text><rect x="80" y="385" width="490" height="130" rx="24" fill="#FFFDF8" stroke="#347C5A" stroke-width="5"/><text x="115" y="440" font-size="26" font-weight="700">“Five twelfths is ready.”</text><text x="115" y="487" font-size="24">5/12 → 5 twelfths</text><rect x="630" y="385" width="490" height="130" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="665" y="440" font-size="26" font-weight="700">“Now add the same units.”</text><text x="665" y="487" font-size="24">9 + 8 + 5 = 22 twelfths</text></g><rect x="260" y="600" width="680" height="105" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#347C5A">22/12 = 11/6 = 1 5/6</text><text x="600" y="760" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#5A6570">Words can track a unit; they are not required for correct reasoning.</text>
</svg>
