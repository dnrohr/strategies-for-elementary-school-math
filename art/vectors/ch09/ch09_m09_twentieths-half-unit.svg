<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Twentieths reveal the half-unit difference</title>
  <desc id="desc">Two equal 800-unit bars are divided into twenty exact 40-unit cells. Three fifths fills 12 cells. Five eighths fills 12 full cells plus exactly half of the thirteenth cell, or 12.5 twentieths, not 13 twentieths.</desc>
  <defs><pattern id="grid" x="230" width="40" height="110" patternUnits="userSpaceOnUse"><path d="M40 0V110" stroke="#18324A" stroke-width="3"/></pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#176B73" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18324A">Twenty equal units</text>
  <text x="85" y="280" font-family="Arial, sans-serif" font-size="27" fill="#18324A">3/5</text><rect x="230" y="215" width="480" height="110" fill="url(#hatch)"/><rect x="230" y="215" width="800" height="110" fill="url(#grid)" stroke="#18324A" stroke-width="5"/><text x="710" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#12545A">12/20</text>
  <text x="85" y="530" font-family="Arial, sans-serif" font-size="27" fill="#18324A">5/8</text><rect x="230" y="465" width="500" height="110" fill="#F2B35F"/><rect x="230" y="465" width="800" height="110" fill="url(#grid)" stroke="#18324A" stroke-width="5"/><path d="M710 455v130" stroke="#B33A3A" stroke-width="4" stroke-dasharray="7 6"/><path d="M730 455v130" stroke="#B33A3A" stroke-width="7"/><text x="730" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#8A4308">12.5/20</text><text x="600" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7A2525">Half of the 13th unit—not 13 full units</text>
</svg>
