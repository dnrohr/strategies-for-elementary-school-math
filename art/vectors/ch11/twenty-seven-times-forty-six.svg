<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Twenty-seven times forty-six split into forty and six</title><desc id="desc">A large area model splits forty-six into a wide forty region and a narrow six region. The narrow region is repeated in a labeled enlarged inset, so both partial products are legible before they combine to 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">27 × 46 = 27 × 40 + 27 × 6</text>
  <rect x="90" y="165" width="760" height="390" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><rect x="850" y="165" width="114" height="390" fill="#F2B35F" stroke="#18324A" stroke-width="5" stroke-dasharray="12 8"/><text x="470" y="340" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="39" font-weight="700">27 × 40 = 1,080</text><text x="907" y="360" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27" font-weight="700" transform="rotate(-90 907 360)">27 × 6</text>
  <path d="M964 285H995" stroke="#7652A8" stroke-width="4"/><rect x="995" y="200" width="175" height="205" rx="22" fill="#FFFDF8" stroke="#C66A12" stroke-width="5"/><text x="1082" y="250" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="26" font-weight="700">ENLARGED</text><text x="1082" y="315" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28">27 × 6</text><text x="1082" y="365" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31" font-weight="700">= 162</text>
  <path d="M90 605v30h760v-30M850 605v30h114v-30" fill="none" stroke="#18324A" stroke-width="4"/><text x="470" y="680" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">40 units wide</text><text x="907" y="680" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">6</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text></svg>
