<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">The same partial products appear in a translucent mental workspace</title>
  <desc id="desc">Two translucent paper-like cards hold 27 times 40 equals 1,080 and 27 times 6 equals 162. Alignment guides slide the exact partial products into a third card where 1,080 plus 162 equals 1,242. This is the same mathematics as decomposition in a different representational format.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">A mental notebook: same math, different format</text>
  <g opacity="0.82"><rect x="85" y="170" width="420" height="190" rx="25" fill="#FFFDF8" stroke="#176B73" stroke-width="5" stroke-dasharray="12 8"/><rect x="135" y="390" width="420" height="190" rx="25" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/></g><text x="295" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700">27 × 40 = 1,080</text><text x="345" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700">27 × 6 = 162</text><path d="M535 275C650 280 655 360 740 380M585 485C680 470 680 420 740 400" fill="none" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/>
  <rect x="770" y="210" width="355" height="390" rx="28" fill="#DDEDE4" fill-opacity="0.86" stroke="#347C5A" stroke-width="6"/><path d="M825 285h245M825 365h245M825 445h245" stroke="#A7A095" stroke-width="2" stroke-dasharray="9 7"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="947" y="335" font-size="35">1,080</text><text x="947" y="415" font-size="35">+ 162</text><text x="947" y="505" font-size="43" font-weight="700">1,242</text><text x="600" y="700" font-size="27" fill="#5A6570">Exact vector numerals remain auditable even when the workspace is imagined.</text></g>
</svg>
