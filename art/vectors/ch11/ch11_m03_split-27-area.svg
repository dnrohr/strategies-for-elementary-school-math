<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split twenty-seven into twenty and seven</title><desc id="desc">An area rectangle keeps width 46 and splits its height in the exact ratio 20 to 7. The height-20 region is labeled 20 times 46 equals 920; the height-7 region is labeled 7 times 46 equals 322. Together they equal 1,242.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#176B73" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">(20 + 7) × 46</text><rect x="250" y="155" width="700" height="400" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><rect x="250" y="451.3" width="700" height="103.7" fill="url(#h)" stroke="#18324A" stroke-width="5"/><text x="600" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18324A">20 × 46 = 920</text><text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">7 × 46 = 322</text><path d="M205 155h-35v296h35M205 451h-35v104h35" fill="none" stroke="#18324A" stroke-width="4"/><text x="135" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">20</text><text x="135" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">7</text><path d="M250 600v35h700v-35" fill="none" stroke="#18324A" stroke-width="4"/><text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">common width 46</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">920 + 322 = 1,242</text></svg>
