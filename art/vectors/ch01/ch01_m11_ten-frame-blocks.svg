<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 11: Move three of five equal blocks into a ten-frame</title><desc id="desc">Two stages use identically sized blocks. Before, seven blue blocks fill part of a ten-frame and five orange hatched blocks sit in a tray. Three traced blocks move into the empty cells while two remain loose, producing ten plus two.</desc><defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFF3DF"/><path d="M0 0v10" stroke="#D97706" stroke-width="4"/></pattern><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5 0 7Z" fill="#7652A8"/></marker></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h1{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:20px;font-weight:700}.m{font-size:30px;font-weight:700}.cell{fill:#FFFDF8;stroke:#68707A;stroke-width:3}.b{fill:#2764B8;stroke:#174478;stroke-width:4}.o{fill:url(#h);stroke:#A95805;stroke-width:4}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 11 · PHYSICAL GROUPING</text><text x="70" y="116" class="h1">The same five blocks change position</text><text x="70" y="154" class="s">Three move into the frame; two stay loose. Unit size never changes.</text><rect x="64" y="190" width="500" height="455" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/><rect x="674" y="190" width="462" height="455" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <text x="95" y="235" class="l">BEFORE</text><text x="95" y="272" class="m">7 in frame + 5 in tray</text><g class="cell"><rect x="95" y="305" width="72" height="72"/><rect x="167" y="305" width="72" height="72"/><rect x="239" y="305" width="72" height="72"/><rect x="311" y="305" width="72" height="72"/><rect x="383" y="305" width="72" height="72"/><rect x="95" y="377" width="72" height="72"/><rect x="167" y="377" width="72" height="72"/><rect x="239" y="377" width="72" height="72"/><rect x="311" y="377" width="72" height="72"/><rect x="383" y="377" width="72" height="72"/></g><g class="b"><rect x="105" y="315" width="52" height="52" rx="8"/><rect x="177" y="315" width="52" height="52" rx="8"/><rect x="249" y="315" width="52" height="52" rx="8"/><rect x="321" y="315" width="52" height="52" rx="8"/><rect x="393" y="315" width="52" height="52" rx="8"/><rect x="105" y="387" width="52" height="52" rx="8"/><rect x="177" y="387" width="52" height="52" rx="8"/></g>
  <rect x="95" y="495" width="390" height="92" rx="18" fill="#FFF9EF" stroke="#D97706" stroke-width="3" stroke-dasharray="9 7"/><g class="o"><rect x="110" y="515" width="52" height="52" rx="8"/><rect x="185" y="515" width="52" height="52" rx="8"/><rect x="260" y="515" width="52" height="52" rx="8"/><rect x="335" y="515" width="52" height="52" rx="8"/><rect x="410" y="515" width="52" height="52" rx="8"/></g>
  <g fill="none" stroke="#7652A8" stroke-width="4" stroke-dasharray="5 8" marker-end="url(#a)"><path d="M136 505Q510 330 845 410"/><path d="M211 505Q550 350 917 410"/><path d="M286 505Q590 370 989 410"/></g><text x="619" y="375" class="l" text-anchor="middle">move 3</text><text x="619" y="585" class="l" text-anchor="middle">leave 2</text>
  <text x="705" y="235" class="l">AFTER</text><text x="705" y="272" class="m">10 in frame + 2 loose</text><g class="cell"><rect x="705" y="305" width="72" height="72"/><rect x="777" y="305" width="72" height="72"/><rect x="849" y="305" width="72" height="72"/><rect x="921" y="305" width="72" height="72"/><rect x="993" y="305" width="72" height="72"/><rect x="705" y="377" width="72" height="72"/><rect x="777" y="377" width="72" height="72"/><rect x="849" y="377" width="72" height="72"/><rect x="921" y="377" width="72" height="72"/><rect x="993" y="377" width="72" height="72"/></g><g class="b"><rect x="715" y="315" width="52" height="52" rx="8"/><rect x="787" y="315" width="52" height="52" rx="8"/><rect x="859" y="315" width="52" height="52" rx="8"/><rect x="931" y="315" width="52" height="52" rx="8"/><rect x="1003" y="315" width="52" height="52" rx="8"/><rect x="715" y="387" width="52" height="52" rx="8"/><rect x="787" y="387" width="52" height="52" rx="8"/></g><g class="o"><rect x="859" y="387" width="52" height="52" rx="8"/><rect x="931" y="387" width="52" height="52" rx="8"/><rect x="1003" y="387" width="52" height="52" rx="8"/><rect x="825" y="515" width="52" height="52" rx="8"/><rect x="900" y="515" width="52" height="52" rx="8"/></g><text x="888" y="610" class="l" text-anchor="middle">2 loose</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 → 10 + 2 = 12</text>
</svg>
