<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Two-axis legend for the arithmetic atlas</title><desc id="desc">A full-width visual legend separates computational strategy from mental representation and shows that any strategy can combine with several changing forms of experience.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Two questions describe every method</text>
  <text x="64" y="120" font-family="Arial,sans-serif" font-size="25" fill="#5A6570">The axes cross; they do not sort people into fixed types.</text>
  <rect x="70" y="165" width="500" height="520" rx="32" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/>
  <text x="320" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12545A">WHAT MATHEMATICS CHANGED?</text>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="28"><text x="120" y="300">Count</text><text x="120" y="365">Retrieve</text><text x="120" y="430">Decompose</text><text x="120" y="495">Compensate</text><text x="120" y="560">Use geometry</text><text x="120" y="625">Follow a pattern</text></g>
  <rect x="630" y="165" width="500" height="520" rx="32" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="14 9"/>
  <text x="880" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#8A450D">HOW DID IT APPEAR OR FEEL?</text>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="28"><text x="680" y="300">Words or sounds</text><text x="680" y="365">Written numerals</text><text x="680" y="430">Objects or groups</text><text x="680" y="495">Space or distance</text><text x="680" y="560">Movement or rhythm</text><text x="680" y="625">Abstract relation</text></g>
  <path d="M570 425H630" stroke="#7652A8" stroke-width="4" stroke-dasharray="7 8"/><circle cx="600" cy="425" r="10" fill="#7652A8"/><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28" font-weight="700">Same strategy, different experience · different strategy, similar experience</text></svg>
