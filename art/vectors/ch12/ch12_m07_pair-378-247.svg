<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Pair 378 and 247 to make 625, then add 596</title><desc id="desc">The first two tiles are bracketed as 378 plus 247, making 625. A short plus-596 connector points directly from the untouched 596 tile into the final equation, producing 1,221.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Reorder to make a friendly pair</text>
  <defs><marker id="pair-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><rect x="110" y="175" width="250" height="150" rx="24" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="235" y="270" font-size="46" font-weight="700">378</text><rect x="430" y="175" width="250" height="150" rx="24" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><text x="555" y="270" font-size="46" font-weight="700">247</text><rect x="850" y="175" width="250" height="150" rx="24" fill="#FFFDF8" stroke="#7652A8" stroke-width="4" stroke-dasharray="12 8"/><text x="975" y="270" font-size="46" font-weight="700">596</text><path d="M100 365v45h590v-45" fill="none" stroke="#176B73" stroke-width="6"/><text x="395" y="468" font-size="32">378 + 247 = 625</text><path d="M975 335V440Q975 505 805 550" fill="none" stroke="#7652A8" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#pair-arrow)"/><text x="930" y="455" font-size="27" fill="#553A78">+596</text><text x="600" y="605" font-size="43" font-weight="700">625 + 596 = <tspan fill="#347C5A">1,221</tspan></text><text x="600" y="705" font-size="25" fill="#5A6570">The order changes; the quantities do not.</text></g></svg>
