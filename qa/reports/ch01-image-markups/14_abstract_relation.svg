<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 14 abstract relation</title><desc id="d">Three callouts reduce pictorial boxes, straighten the relation, and remove a duplicate equation rail.</desc><image href="../../../art/vectors/ch01/ch01_m14_relation-without-picture.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="90" y="300" width="1030" height="200" rx="34"/><path d="M740 485v105h300"/><rect x="70" y="680" width="1060" height="80" rx="20"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1100" cy="320" r="28"/><circle cx="1030" cy="575" r="28"/><circle cx="1100" cy="690" r="28"/></g><g fill="#fff" font-size="28"><text x="1100" y="330">1</text><text x="1030" y="585">2</text><text x="1100" y="700">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 14 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Honor “without a scene”</tspan><tspan x="1240" dy="32">Large colored nodes create a scene;</tspan><tspan x="1240" dy="29">prefer quiet typographic equality.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Equality, not travel</tspan><tspan x="1240" dy="32">Replace the bent directional route</tspan><tspan x="1240" dy="29">with a direct equals relation.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Remove duplication</tspan><tspan x="1240" dy="32">The bottom rail repeats the complete</tspan><tspan x="1240" dy="29">central relation.</tspan></text></g>
</svg>
