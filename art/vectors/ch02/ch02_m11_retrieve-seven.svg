<svg data-qa-image-pass="2026-09-26" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Seven appears as a remembered subtraction fact and is checked</title><desc id="desc">The quiet equality fifteen minus eight equals seven is shown without a process arrow. A smaller detached card below offers the later inverse check seven plus eight equals fifteen.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">A remembered relation</text><text x="64" y="110" font-size="24" fill="#52605A">The answer may arrive without reported intermediate steps.</text><g text-anchor="middle" fill="#24312D"><text x="505" y="390" font-size="82" font-weight="700">15 − 8</text><text x="680" y="390" font-size="68" fill="#7652A8">=</text><text x="800" y="390" font-size="108" font-weight="700" fill="#287A55">7</text></g><path d="M340 455H860" stroke="#287A55" stroke-width="4"/><text x="600" y="500" text-anchor="middle" font-size="23" fill="#52605A">no pictured route between question and answer</text><rect x="395" y="575" width="410" height="90" rx="45" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="631" text-anchor="middle" font-size="34" font-weight="700">later check: 7 + 8 = 15</text></g></svg>
