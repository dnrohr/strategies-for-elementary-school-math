<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Regroup pennies into a dime to make eighty-five cents</title><desc id="desc">The before panel labels seven dime tokens and fifteen penny tokens, with ten pennies bracketed for exchange. The after panel labels eight dimes and five pennies, totaling eighty-five cents. Tokens are exact abstract vector coin silhouettes.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 11 11"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Ten pennies exchange for one dime</text><g transform="translate(55 135)"><rect width="500" height="540" rx="25" fill="#F7F0E5" stroke="#24312D" stroke-width="5"/><text x="250" y="42" text-anchor="middle" font-size="24" font-weight="700">BEFORE · 7 dimes + 15 pennies</text><g fill="#E7EEF8" stroke="#2764B8" stroke-width="5"><circle cx="65" cy="120" r="27"/><circle cx="130" cy="120" r="27"/><circle cx="195" cy="120" r="27"/><circle cx="260" cy="120" r="27"/><circle cx="325" cy="120" r="27"/><circle cx="390" cy="120" r="27"/><circle cx="455" cy="120" r="27"/></g><g fill="#F7EFE3" stroke="#D97706" stroke-width="4"><circle cx="45" cy="245" r="23"/><circle cx="95" cy="245" r="23"/><circle cx="145" cy="245" r="23"/><circle cx="195" cy="245" r="23"/><circle cx="245" cy="245" r="23"/><circle cx="45" cy="300" r="23"/><circle cx="95" cy="300" r="23"/><circle cx="145" cy="300" r="23"/><circle cx="195" cy="300" r="23"/><circle cx="245" cy="300" r="23"/><circle cx="340" cy="245" r="23"/><circle cx="390" cy="245" r="23"/><circle cx="440" cy="245" r="23"/><circle cx="365" cy="300" r="23"/><circle cx="415" cy="300" r="23"/></g><path d="M15 210v125h260V210" fill="none" stroke="#7652A8" stroke-width="6"/><text x="145" y="375" text-anchor="middle" font-size="25">10 pennies</text><text x="250" y="475" text-anchor="middle" font-size="29" font-weight="700">70¢ + 15¢</text></g><path d="M580 405H645" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10" marker-end="url(#a)"/><g transform="translate(675 135)"><rect width="470" height="540" rx="25" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="235" y="42" text-anchor="middle" font-size="24" font-weight="700">AFTER · 8 dimes + 5 pennies</text><g fill="#E7EEF8" stroke="#2764B8" stroke-width="5"><circle cx="55" cy="125" r="22"/><circle cx="110" cy="125" r="22"/><circle cx="165" cy="125" r="22"/><circle cx="220" cy="125" r="22"/><circle cx="275" cy="125" r="22"/><circle cx="330" cy="125" r="22"/><circle cx="385" cy="125" r="22"/><circle cx="440" cy="125" r="22"/></g><g fill="#F7EFE3" stroke="#D97706" stroke-width="4"><circle cx="125" cy="265" r="25"/><circle cx="180" cy="265" r="25"/><circle cx="235" cy="265" r="25"/><circle cx="290" cy="265" r="25"/><circle cx="345" cy="265" r="25"/></g><text x="235" y="440" text-anchor="middle" font-size="52" font-weight="700">85¢</text><text x="235" y="490" text-anchor="middle" font-size="24" fill="#52605A">optional unit analogy</text></g></g></svg>
