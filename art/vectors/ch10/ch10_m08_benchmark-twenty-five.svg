<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Use twenty-five as a benchmark, remove two, then regroup twenty-three</title>
  <desc id="desc">The first panel has five outlined groups with five candies each, exactly twenty-five. Two candies in the fifth group are crossed out. The second panel resolves the remaining twenty-three as four complete groups of five plus a separate remainder of three.</desc>
  <defs><circle id="c" r="12" fill="#F2B35F" stroke="#18324A" stroke-width="2"/><g id="five"><rect x="-48" y="-42" width="96" height="122" rx="22" fill="#FFFDF8" stroke="#176B73" stroke-width="3"/><use href="#c" y="-10"/><use href="#c" x="-25" y="25"/><use href="#c" x="25" y="25"/><use href="#c" x="-25" y="60"/><use href="#c" x="25" y="60"/></g><g id="row5"><rect x="-150" y="-30" width="300" height="60" rx="20" fill="#FFFDF8" stroke="#176B73" stroke-width="3"/><use href="#c" x="-100"/><use href="#c" x="-50"/><use href="#c"/><use href="#c" x="50"/><use href="#c" x="100"/></g><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/>
  <rect x="55" y="115" width="500" height="565" rx="28" fill="#FFFDF8" stroke="#A7A095" stroke-width="3"/><text x="305" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">BENCHMARK · 25</text><use href="#five" x="145" y="260"/><use href="#five" x="305" y="260"/><use href="#five" x="465" y="260"/><use href="#five" x="225" y="470"/><use href="#five" x="385" y="470"/><path d="M392 505l36 36m0-36l-36 36M342 505l36 36m0-36l-36 36" stroke="#B33A3A" stroke-width="7"/><text x="305" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">25 − 2 = 23</text>
  <path d="M570 395h75" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><rect x="670" y="115" width="475" height="565" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4" stroke-dasharray="13 9"/><text x="908" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">RESOLVE · 23</text><use href="#row5" x="908" y="235"/><use href="#row5" x="908" y="315"/><use href="#row5" x="908" y="395"/><use href="#row5" x="908" y="475"/><rect x="758" y="535" width="300" height="65" rx="22" fill="#FFFDF8" stroke="#B33A3A" stroke-width="4" stroke-dasharray="10 7"/><use href="#c" x="858" y="568"/><use href="#c" x="908" y="568"/><use href="#c" x="958" y="568"/><text x="908" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324A">23 = 5 × 4 + 3 · quotient 4 R3</text>
</svg>
