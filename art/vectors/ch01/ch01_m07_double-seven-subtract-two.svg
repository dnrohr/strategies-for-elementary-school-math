<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 7: Double seven and subtract two</title>
  <desc id="desc">Two groups of seven show fourteen dots before correction. Exactly two dots in the second group have dashed red outlines and red X strikes. Removing those two leaves twelve. Seven plus five equals seven plus seven minus two equals fourteen minus two equals twelve.</desc>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:23px;font-weight:700}.math{font-size:34px;font-weight:700}.dot{fill:#2764B8;stroke:#174478;stroke-width:5}.adjust{fill:#FFFDF8;stroke:#C2413B;stroke-width:5;stroke-dasharray:10 8}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 07 · COMPENSATION</text><text x="70" y="116" class="heading">Double 7, then correct by 2</text><text x="70" y="154" class="sub">Build 14 first; the red X marks show exactly what is removed.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <g aria-label="first group of seven retained dots"><rect x="105" y="245" width="440" height="280" rx="24" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><circle class="dot" cx="180" cy="320" r="29"/><circle class="dot" cx="325" cy="320" r="29"/><circle class="dot" cx="470" cy="320" r="29"/><circle class="dot" cx="180" cy="440" r="29"/><circle class="dot" cx="325" cy="440" r="29"/><circle class="dot" cx="470" cy="440" r="29"/><circle class="dot" cx="325" cy="380" r="29"/><text x="325" y="570" class="label" text-anchor="middle">first 7 · all retained</text></g>
  <g aria-label="second group of seven with five retained and two removed"><rect x="575" y="245" width="520" height="280" rx="24" fill="#FFF9EF" stroke="#D97706" stroke-width="5"/><circle class="dot" cx="650" cy="320" r="29"/><circle class="dot" cx="795" cy="320" r="29"/><circle class="dot" cx="940" cy="320" r="29"/><circle class="dot" cx="650" cy="440" r="29"/><circle class="dot" cx="795" cy="440" r="29"/><circle class="adjust" cx="940" cy="440" r="29"/><circle class="adjust" cx="1018" cy="380" r="29"/><g stroke="#C2413B" stroke-width="8" stroke-linecap="round"><path d="M918 418l44 44m0-44l-44 44M996 358l44 44m0-44l-44 44"/></g><text x="835" y="570" class="label" text-anchor="middle">second 7 · remove exactly 2</text></g>
  <text x="600" y="225" class="math" text-anchor="middle">7 + 7 = 14</text><path d="M875 594h78" stroke="#C2413B" stroke-width="5" stroke-dasharray="10 8"/><text x="1080" y="602" class="label" text-anchor="end">2 corrected</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 = 7 + 7 − 2 = 14 − 2 = 12</text>
</svg>
