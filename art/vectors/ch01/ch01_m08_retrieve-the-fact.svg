  <path d="M310 515C390 605 780 605 900 520" fill="none" stroke="#7652A8" stroke-width="5" stroke-dasharray="4 14" marker-end="url(#arrow)"/><text x="605" y="595" class="label" text-anchor="middle">optional: check afterward</text>
