<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Partition twenty-four counters into four contiguous groups of six</title>
  <desc id="desc">A horizontal sequence of exactly twenty-four counters is divided by four heavy brackets into four contiguous groups of six. Four numbered group markers answer how many sixes fit.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D">
    <text x="600" y="70" font-size="38" font-weight="700">Known: group size 6 · Find: number of groups</text>
    <g class="twenty-four-counters" fill="#F7EFE3" stroke="#24312D" stroke-width="3">
      <circle cx="117" cy="325" r="18"/><circle cx="159" cy="325" r="18"/><circle cx="201" cy="325" r="18"/><circle cx="243" cy="325" r="18"/><circle cx="285" cy="325" r="18"/><circle cx="327" cy="325" r="18"/>
      <circle cx="369" cy="325" r="18"/><circle cx="411" cy="325" r="18"/><circle cx="453" cy="325" r="18"/><circle cx="495" cy="325" r="18"/><circle cx="537" cy="325" r="18"/><circle cx="579" cy="325" r="18"/>
      <circle cx="621" cy="325" r="18"/><circle cx="663" cy="325" r="18"/><circle cx="705" cy="325" r="18"/><circle cx="747" cy="325" r="18"/><circle cx="789" cy="325" r="18"/><circle cx="831" cy="325" r="18"/>
      <circle cx="873" cy="325" r="18"/><circle cx="915" cy="325" r="18"/><circle cx="957" cy="325" r="18"/><circle cx="999" cy="325" r="18"/><circle cx="1041" cy="325" r="18"/><circle cx="1083" cy="325" r="18"/>
    </g>
    <g class="four-group-brackets" stroke="#287A55" stroke-width="8" fill="none"><path d="M96 400v35h252v-35"/><path d="M348 400v35h252v-35"/><path d="M600 400v35h252v-35"/><path d="M852 400v35h252v-35"/></g>
    <g font-size="27" font-weight="700"><text x="222" y="495">group 1 · six</text><text x="474" y="495">group 2 · six</text><text x="726" y="495">group 3 · six</text><text x="978" y="495">group 4 · six</text></g>
    <text x="600" y="650" font-size="38" font-weight="700">6 + 6 + 6 + 6 = 24 → 4 groups</text>
  </g>
</svg>
