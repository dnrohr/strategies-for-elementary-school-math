<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 12: Five equal beat marks carry the spoken counts eight to twelve</title><desc id="desc">A compact held-start badge contains seven. Five equal circular beat marks align one-to-one with eight, nine, ten, eleven, and twelve; small labels identify taps one through five.</desc><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:20px;font-weight:700}.n{font-size:34px;font-weight:700;text-anchor:middle}.m{font-size:34px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 12 · VERBAL RHYTHM</text><text x="70" y="116" class="h">One beat for each new number word</text><text x="70" y="154" class="s">Equal marks track the count; their size does not encode magnitude or volume.</text><rect x="64" y="190" width="1072" height="455" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="90" y="330" width="145" height="150" rx="26" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="162" y="370" class="l" text-anchor="middle">held start</text><text x="162" y="430" class="n">7</text><text x="162" y="462" class="l" text-anchor="middle">no tap</text>
  <path d="M285 475H1085" stroke="#68707A" stroke-width="4"/><g fill="#FFF3DF" stroke="#D97706" stroke-width="5"><ellipse cx="350" cy="420" rx="30" ry="30"/><ellipse cx="515" cy="420" rx="30" ry="30"/><ellipse cx="680" cy="420" rx="30" ry="30"/><ellipse cx="845" cy="420" rx="30" ry="30"/><ellipse cx="1010" cy="420" rx="30" ry="30"/></g><g class="n"><text x="350" y="330">8</text><text x="515" y="330">9</text><text x="680" y="330">10</text><text x="845" y="330">11</text><text x="1010" y="330">12</text></g><g text-anchor="middle" font-size="18" font-weight="700"><text x="350" y="535">tap 1</text><text x="515" y="535">tap 2</text><text x="680" y="535">tap 3</text><text x="845" y="535">tap 4</text><text x="1010" y="535">tap 5</text></g><text x="680" y="610" class="l" text-anchor="middle">five equal beats · five new number words</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 = 12</text>
</svg>
