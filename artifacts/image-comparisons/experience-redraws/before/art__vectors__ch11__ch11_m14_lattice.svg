<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Lattice multiplication for twenty-seven times forty-six</title><desc id="desc">Three numbered stages show a large two-by-two lattice. Each cell product is written in large digits across a diagonal. Color-independent numbered diagonal bands are then read from right to left with carries, producing 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Lattice multiplication: fill, add diagonals, read</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><circle cx="95" cy="150" r="27" fill="#176B73"/><text x="95" y="160" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFDF8">1</text><text x="140" y="160" font-size="28" font-weight="700">Fill each cell with a two-digit product</text></g>
  <g stroke="#18324A" stroke-width="5" fill="#FFFDF8"><rect x="120" y="215" width="440" height="440"/><path d="M340 215v440M120 435h440M120 215l220 220M340 215l220 220M120 435l220 220M340 435l220 220"/></g>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="47" font-weight="700" text-anchor="middle"><text x="230" y="195">2</text><text x="450" y="195">7</text><text x="600" y="340">4</text><text x="600" y="560">6</text></g>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="38" font-weight="700"><text x="155" y="275">0</text><text x="295" y="400">8</text><text x="375" y="275">2</text><text x="515" y="400">8</text><text x="155" y="495">1</text><text x="295" y="620">2</text><text x="375" y="495">4</text><text x="515" y="620">2</text></g>
  <rect x="665" y="125" width="465" height="555" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 9"/>
  <g font-family="Arial,sans-serif" fill="#18324A"><circle cx="715" cy="185" r="27" fill="#7652A8"/><text x="715" y="195" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFDF8">2</text><text x="760" y="195" font-size="28" font-weight="700">Add diagonals right → left</text>
  <text x="715" y="270" font-size="28">A · sum 2 → write 2</text><text x="715" y="330" font-size="28">B · sum 14 → write 4</text><text x="755" y="372" font-size="25" fill="#5A6570">carry 1 into the next diagonal</text><text x="715" y="435" font-size="28">C · sum 12 → write 2, carry 1</text><text x="715" y="495" font-size="28">D · sum 1 → write 1</text>
  <circle cx="715" cy="565" r="27" fill="#347C5A"/><text x="715" y="575" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFDF8">3</text><text x="760" y="575" font-size="28" font-weight="700">Read D C B A</text><text x="895" y="640" text-anchor="middle" font-size="46" font-weight="700" fill="#347C5A">1,242</text></g></svg>
