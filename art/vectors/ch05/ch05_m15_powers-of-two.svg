<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">A doubling ladder selects eight, two, and one groups</title><desc id="desc">The ladder lists one, two, four, and eight groups of twelve as 12, 24, 48, and 96; selected eight plus two plus one groups total eleven and 96 plus 24 plus 12 equals 132.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="75" font-size="38" font-weight="700">Build powers of two</text><g font-size="33" font-weight="700"><rect x="100" y="170" width="220" height="100" rx="20" fill="#E8F3ED" stroke="#287A55" stroke-width="7"/><text x="210" y="235">1 × 12 = 12</text><rect x="360" y="170" width="220" height="100" rx="20" fill="#E8F3ED" stroke="#287A55" stroke-width="7"/><text x="470" y="235">2 × 12 = 24</text><rect x="620" y="170" width="220" height="100" rx="20" fill="#F2F2EF" stroke="#68707A" stroke-width="5" stroke-dasharray="10 8"/><text x="730" y="235">4 × 12 = 48</text><rect x="880" y="170" width="220" height="100" rx="20" fill="#E8F3ED" stroke="#287A55" stroke-width="7"/><text x="990" y="235">8 × 12 = 96</text></g><text x="600" y="410" font-size="39" font-weight="700">11 = 8 + 2 + 1</text><text x="600" y="520" font-size="44" font-weight="700">96 + 24 + 12 = 132</text></g><g data-qa-detail="not-selected"><text x="470" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">not selected</text></g></svg>
