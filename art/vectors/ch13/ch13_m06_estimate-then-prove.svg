<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Estimate near one point three, then prove thirty-one twenty-fourths</title>
<desc id="desc">A benchmark line marks 1, one and one quarter, and one and one half. The estimate near 1.3 is clearly dashed. A separate exact inset marks 31 twenty-fourths between one and one quarter and one and one half, equal to about 1.292.</desc>
<rect width="1200" height="800" fill="#F8F2E7"/>
<text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Estimate guards the scale; common units prove it</text>
<rect x="70" y="145" width="1060" height="255" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/>
<text x="120" y="205" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#553A78">ESTIMATE</text>
<path d="M180 300H1020" stroke="#18324A" stroke-width="6"/>
<path d="M180 270v60M600 270v60M1020 270v60M684 255v90" stroke="#18324A" stroke-width="4"/>
<g font-family="Arial,sans-serif" font-size="24" text-anchor="middle">
<text x="180" y="365">1</text>
<text x="600" y="365">1 1/4</text>
<text x="1020" y="365">1 1/2</text>
<text x="684" y="245" fill="#553A78">near 1.3</text>
</g>
<rect x="70" y="450" width="1060" height="235" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/>
<text x="120" y="510" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12545A">EXACT</text>
<text x="600" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700">16/24 + 15/24 = 31/24</text>
<text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">= 1 7/24 ≈ 1.292</text>
<text x="600" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Above 1 and below 1 1/2, as predicted.</text>
</svg>
