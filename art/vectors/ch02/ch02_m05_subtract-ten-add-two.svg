<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Subtract ten from fifteen, then add two back</title><desc id="desc">A two-direction number-line route goes left ten units from fifteen to five, then right two units to seven. Five is labeled as an intermediate stop and seven has a heavy double result marker.</desc><defs><marker id="l" markerWidth="11" markerHeight="11" refX="2" refY="5.5" orient="auto"><path d="M11 0L0 5.5 11 11z" fill="#C2413B"/></marker><marker id="r" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#D97706"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Overshoot, then correct</text><text x="64" y="110" font-size="24" fill="#52605A">Subtract 10 to reach 5; restore 2 to finish at 7.</text><path d="M130 465H1070" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="4"><path d="M180 445v40M260 445v40M340 445v40M420 445v40M500 445v40M580 445v40M660 445v40M740 445v40M820 445v40M900 445v40M980 445v40"/></g><g font-size="24" text-anchor="middle" fill="#24312D"><text x="180" y="525">5</text><text x="340" y="525">7</text><text x="580" y="525">10</text><text x="980" y="525">15</text></g><path d="M970 410Q580 110 190 410" fill="none" stroke="#C2413B" stroke-width="8" marker-end="url(#l)"/><text x="580" y="190" text-anchor="middle" font-size="34" font-weight="700" fill="#C2413B">−10</text><path d="M190 400Q260 285 330 400" fill="none" stroke="#D97706" stroke-width="8" marker-end="url(#r)"/><text x="260" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#D97706">+2</text><circle cx="180" cy="465" r="17" fill="#FFFDF8" stroke="#68707A" stroke-width="6"/><text x="180" y="585" text-anchor="middle" font-size="21" fill="#52605A">intermediate</text><circle cx="340" cy="465" r="22" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><circle cx="340" cy="465" r="12" fill="none" stroke="#287A55" stroke-width="3"/><text x="600" y="680" text-anchor="middle" font-size="38" font-weight="700">15 − 10 + 2 = 7</text><text x="600" y="724" text-anchor="middle" font-size="25" fill="#7652A8">net change: −10 + 2 = −8</text></g></svg>
