<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 8 retrieval</title><desc id="d">Three callouts recommend less directional imagery, a meaningful optional check, and a quieter answer treatment.</desc><image href="../../../art/vectors/ch01/ch01_m08_retrieve-the-fact.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><ellipse cx="620" cy="395" rx="160" ry="95"/><ellipse cx="600" cy="555" rx="330" ry="80"/><rect x="760" y="270" width="280" height="250" rx="35"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="740" cy="330" r="28"/><circle cx="900" cy="565" r="28"/><circle cx="1040" cy="285" r="28"/></g><g fill="#fff" font-size="28"><text x="740" y="340">1</text><text x="900" y="575">2</text><text x="1040" y="295">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 08 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Avoid invented travel</tspan><tspan x="1240" dy="32">A large arrow makes direct retrieval</tspan><tspan x="1240" dy="29">look like a two-stage process.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Make the check meaningful</tspan><tspan x="1240" dy="32">Name a verification method or omit</tspan><tspan x="1240" dy="29">the unexplained loop.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Quiet the answer</tspan><tspan x="1240" dy="32">Reduce the double border and scale</tspan><tspan x="1240" dy="29">to fit the non-sensory account.</tspan></text></g>
</svg>
