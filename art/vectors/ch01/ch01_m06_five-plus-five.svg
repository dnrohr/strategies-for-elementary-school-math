<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 6: Decompose seven into five and two, then pair two fives</title><desc id="desc">A blue seven-card contains a blue five-pattern and two blue extras. An orange hatched five-card stays intact. A brace pairs the two five-patterns to make ten while the blue pair remains as two extra.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><path d="M0 0v12" stroke="#D97706" stroke-width="5"/></pattern></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.m{font-size:32px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 06 · NEAR-DOUBLE</text><text x="70" y="116" class="h">Find two fives inside 7 + 5</text><text x="70" y="154" class="s">Blue stays with the original 7; hatching stays with the original 5.</text><rect x="64" y="190" width="1072" height="460" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="105" y="240" width="505" height="305" rx="28" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="357" y="280" class="l" text-anchor="middle">7 = 5 + 2</text><rect x="145" y="310" width="285" height="205" rx="22" fill="#F7FAFE" stroke="#2764B8" stroke-width="4"/><g fill="#2764B8" stroke="#174478" stroke-width="5"><circle cx="200" cy="360" r="25"/><circle cx="375" cy="360" r="25"/><circle cx="287" cy="412" r="25"/><circle cx="200" cy="465" r="25"/><circle cx="375" cy="465" r="25"/><circle cx="505" cy="385" r="28"/><circle cx="505" cy="455" r="28"/></g><text x="505" y="515" class="l" text-anchor="middle">two extra</text>
  <rect x="665" y="240" width="420" height="305" rx="28" fill="#FFF9EF" stroke="#D97706" stroke-width="5"/><text x="875" y="280" class="l" text-anchor="middle">the original 5</text><rect x="730" y="310" width="290" height="205" rx="22" fill="#FFFDF8" stroke="#D97706" stroke-width="4"/><g fill="url(#h)" stroke="#A95805" stroke-width="5"><circle cx="785" cy="360" r="25"/><circle cx="965" cy="360" r="25"/><circle cx="875" cy="412" r="25"/><circle cx="785" cy="465" r="25"/><circle cx="965" cy="465" r="25"/></g>
  <path d="M145 565v24h875v-24" fill="none" stroke="#287A55" stroke-width="6"/><text x="582" y="625" class="l" text-anchor="middle">the blue five + the hatched five = 10</text><g class="m" fill="#287A55" text-anchor="middle"><text x="170" y="735">7 + 5</text><text x="310" y="735">=</text><text x="500" y="735">(5 + 2) + 5</text><text x="675" y="735">=</text><text x="810" y="735">10 + 2</text><text x="930" y="735">=</text><text x="1020" y="735">12</text></g>
</svg>
