<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Cross products compared in two untangled rows</title><desc id="desc">Two straight rows show three times eight equals twenty-four and five times five equals twenty-five. Straight labeled connectors keep each numerator with the opposite denominator, and the products align for the comparison twenty-four less than twenty-five.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Cross products, separated into two clear rows</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="95" y="180" width="250" height="145" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="220" y="270" font-size="45" font-weight="700">3/5</text><path d="M360 252H405 M625 252H690" stroke="#176B73" stroke-width="5"/><text x="525" y="225" font-size="27" fill="#12545A">3 × opposite 8</text><rect x="710" y="180" width="390" height="145" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="905" y="270" font-size="41" font-weight="700">3 × 8 = 24</text>
  <rect x="95" y="405" width="250" height="145" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="220" y="495" font-size="45" font-weight="700">5/8</text><path d="M360 477H405 M625 477H690" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="525" y="450" font-size="27" fill="#8A450D">5 × opposite 5</text><rect x="710" y="405" width="390" height="145" rx="24" fill="#FFF3DF" stroke="#C66A12" stroke-width="5"/><text x="905" y="495" font-size="41" font-weight="700">5 × 5 = 25</text></g>
  <text x="600" y="670" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="40" font-weight="700">24 &lt; 25, so 3/5 &lt; 5/8</text></svg>
