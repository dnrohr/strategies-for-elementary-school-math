<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Build twenty-seven rows as twenty-three plus four</title><desc id="desc">An area rectangle with common width 46 is split in the exact height ratio 23 to 4. The larger region is 23 times 46, or 1,058; the smaller is 4 times 46, or 184. Their sum is 1,242.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#C66A12" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">27 = 23 + 4</text><rect x="250" y="155" width="700" height="400" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><rect x="250" y="495.7" width="700" height="59.3" fill="url(#h)" stroke="#18324A" stroke-width="5"/><text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18324A">23 × 46 = 1,058</text><text x="600" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18324A">4 × 46 = 184</text><path d="M205 155h-35v341h35M205 496h-35v59h35" fill="none" stroke="#18324A" stroke-width="4"/><text x="130" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">23</text><text x="130" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">4</text><path d="M250 600v35h700v-35" fill="none" stroke="#18324A" stroke-width="4"/><text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">common width 46</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">1,058 + 184 = 1,242</text></svg>
