<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-seven labeled forty-bundles and six-single sets combine</title><desc id="desc">A compact multiplicity diagram labels 27 copies of one plain 40-unit bundle and 27 copies of six singles. It explicitly says representative forms are not literal object counts. The exact totals 1,080 and 162 combine to 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">46 units in each of 27 envelopes</text><text x="70" y="135" font-family="Arial,sans-serif" font-size="22" fill="#5A6570">Representative tokens use written multiplicity; they are not literal counts.</text>
  <rect x="90" y="190" width="470" height="380" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><rect x="170" y="270" width="240" height="90" rx="14" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="290" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700">40 units</text><text x="325" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">27 × [40-unit bundle]</text><text x="325" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#12545A">= 1,080 units</text>
  <rect x="640" y="190" width="470" height="380" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><g fill="#F2B35F" stroke="#18324A" stroke-width="3"><circle cx="760" cy="315" r="22"/><circle cx="820" cy="315" r="22"/><circle cx="880" cy="315" r="22"/><circle cx="940" cy="315" r="22"/><circle cx="1000" cy="315" r="22"/><circle cx="1060" cy="315" r="22"/></g><text x="875" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">27 × [6 singles]</text><text x="875" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#8A4308">= 162 units</text><text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">27 × (40 + 6)</text>
</svg>
