<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Compare three fifths and five eighths with a magnified interval</title><desc id="desc">A full number line places both fractions, while a large inset magnifies only 0.60 through 0.625. Separate label levels and exact endpoint dots show that five eighths is one fortieth farther right.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Zoom in on the close comparison</text>
  <path d="M100 300H1100" stroke="#18324A" stroke-width="6"/><path d="M100 275v50M600 265v70M1100 275v50" stroke="#18324A" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#18324A" font-size="25" text-anchor="middle"><text x="100" y="370">0</text><text x="600" y="370">1/2</text><text x="1100" y="370">1</text></g>
  <circle cx="700" cy="300" r="11" fill="#176B73"/><circle cx="725" cy="300" r="11" fill="#C66A12"/><path d="M680 330v55h70v-55" fill="none" stroke="#7652A8" stroke-width="4"/>
  <rect x="180" y="445" width="840" height="220" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="13 9"/><text x="600" y="495" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25" font-weight="700">MAGNIFIED: 0.600 TO 0.625</text>
  <path d="M300 575H900" stroke="#18324A" stroke-width="7"/><path d="M300 535v80M900 535v80" stroke="#18324A" stroke-width="5"/><circle cx="300" cy="575" r="14" fill="#176B73"/><circle cx="900" cy="575" r="14" fill="#C66A12"/>
  <text x="300" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12545A">3/5 = 0.600</text><text x="900" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#8A450D">5/8 = 0.625</text><text x="600" y="715" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="30" font-weight="700">5/8 is 0.025 = 1/40 farther right</text></svg>
