<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Inner-speech rhythm keeps tens and ones in order</title><desc id="desc">Three labeled speech ribbons state thirty plus forty equals seventy, seven plus eight equals fifteen, and seventy plus fifteen equals eighty-five. A separate exchange note states fifteen ones equals one ten plus five ones.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Say the place values inside</text><text x="60" y="108" font-size="24" fill="#52605A">Words can carry the same exact decomposition.</text><g text-anchor="middle" font-size="31" font-weight="700"><path d="M90 185h860q45 0 45 45t-45 45H260l-70 45 18-45H90q-45 0-45-45t45-45z" fill="#E7EEF8" stroke="#2764B8" stroke-width="6"/><text x="520" y="242">“thirty plus forty is seventy”</text><path d="M250 330h860q45 0 45 45t-45 45H400l-70 45 18-45h-98q-45 0-45-45t45-45z" fill="#F7EFE3" stroke="#D97706" stroke-width="6"/><text x="680" y="387">“seven plus eight is fifteen”</text><path d="M90 500h860q45 0 45 45t-45 45H260l-70 45 18-45H90q-45 0-45-45t45-45z" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="520" y="557">“seventy plus fifteen is eighty-five”</text></g><text x="870" y="690" text-anchor="middle" font-size="27" font-weight="700" fill="#7652A8">15 ones → 1 ten + 5 ones</text><path d="M110 690h520" stroke="#D97706" stroke-width="6" stroke-dasharray="5 12"/><g fill="#D97706"><circle cx="150" cy="690" r="9"/><circle cx="300" cy="690" r="9"/><circle cx="450" cy="690" r="9"/><circle cx="600" cy="690" r="9"/></g></g></svg>
