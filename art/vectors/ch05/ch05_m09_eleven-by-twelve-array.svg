<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">An eleven-row by twelve-column array</title><desc id="desc">A precisely ruled grid has eleven rows and twelve columns, totaling 132 unit cells, with dimension brackets labeled eleven and twelve.</desc><defs><pattern id="g" x="180" y="150" width="70" height="45" patternUnits="userSpaceOnUse"><circle cx="35" cy="22.5" r="11" fill="#D97706" stroke="#24312D" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">11 rows × 12 columns</text><rect x="180" y="150" width="840" height="495" fill="url(#g)" stroke="#24312D" stroke-width="6"/><path d="M180 120v-25h840v25M145 150h-25v495h25" fill="none" stroke="#2764B8" stroke-width="6"/><text x="600" y="115" font-size="25">12 columns</text><text x="100" y="410" font-size="25">11 rows</text><text x="600" y="715" font-size="36" font-weight="700">11 × 12 = 132 dots</text></g></svg>
