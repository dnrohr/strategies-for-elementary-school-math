<svg data-qa-image-pass="2026-09-26" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Subtract ten from fifteen, then add two back</title>
  <desc id="desc">A number-line route first goes left ten units above the line from fifteen to the intermediate five. A separate route below the line then goes right two units from five to the double-marked final seven.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/>
  <g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Overshoot, then correct</text><text x="64" y="110" font-size="24" fill="#52605A">First subtract 10 to reach 5; then restore 2 to finish at 7.</text>
    <path d="M130 430H1070" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="4"><path d="M180 410v40M260 410v40M340 410v40M420 410v40M500 410v40M580 410v40M660 410v40M740 410v40M820 410v40M900 410v40M980 410v40"/></g>
    <g font-size="24" text-anchor="middle" fill="#24312D"><text x="180" y="485">5</text><text x="340" y="485">7</text><text x="580" y="485">10</text><text x="980" y="485">15</text></g>
    <path d="M970 380Q580 105 205 380" fill="none" stroke="#C2413B" stroke-width="8"/><path d="M205 368l-24 12 24 12z" fill="#C2413B"/><text x="580" y="185" text-anchor="middle" font-size="34" font-weight="700" fill="#C2413B">1 · subtract 10</text>
    <path d="M190 475Q255 575 302 485" fill="none" stroke="#D97706" stroke-width="8"/><path d="M301 473l23 9-20 15z" fill="#D97706"/><text x="260" y="570" text-anchor="middle" font-size="30" font-weight="700" fill="#D97706">2 · add 2 back</text>
    <circle cx="180" cy="430" r="17" fill="#FFFDF8" stroke="#68707A" stroke-width="6"/><text x="180" y="625" text-anchor="middle" font-size="24" fill="#52605A">intermediate</text><circle cx="340" cy="430" r="22" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><circle cx="340" cy="430" r="12" fill="none" stroke="#287A55" stroke-width="3"/>
    <text x="650" y="650" text-anchor="middle" font-size="38" font-weight="700">15 − 10 + 2 = 7</text><text x="650" y="698" text-anchor="middle" font-size="25" fill="#7652A8">net change: −10 + 2 = −8</text>
  </g>
</svg>
