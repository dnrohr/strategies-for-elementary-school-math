<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split seventy-two into seventy and two, then restore two</title><desc id="desc">Seventy-two splits into seventy and a separately labeled two tile. Seventy minus thirty-nine produces the explicitly intermediate thirty-one; joining the preserved two yields the double-framed result thirty-three.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Keep the extra 2 visible</text><rect x="90" y="190" width="300" height="150" rx="25" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="240" y="280" font-size="40" font-weight="700">72 = 70 + 2</text><rect x="470" y="190" width="300" height="150" rx="25" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="620" y="250" font-size="34" font-weight="700">70 − 39 = 31</text><text x="620" y="305" font-size="20" fill="#52605A">intermediate</text><rect x="825" y="205" width="100" height="120" rx="20" fill="#F7EFE3" stroke="#D97706" stroke-width="6"/><text x="875" y="280" font-size="38" font-weight="700">+2</text><rect x="970" y="175" width="170" height="180" rx="30" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><rect x="982" y="187" width="146" height="156" rx="21" fill="none" stroke="#287A55" stroke-width="3"/><text x="1055" y="290" font-size="55" font-weight="700">33</text><path d="M390 265H450M770 265H810M925 265H955" stroke="#7652A8" stroke-width="6" stroke-dasharray="7 10"/><text x="600" y="650" font-size="36" font-weight="700">(70 − 39) + 2 = 31 + 2 = 33</text></g></svg>
