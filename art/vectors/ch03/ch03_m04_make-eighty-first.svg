<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Split forty-eight into forty-three and five to make eighty</title><desc id="desc">A decomposition card states forty-eight equals forty-three plus five. A purple bridge carries thirty-seven plus forty-three to eighty, then an orange five-unit step reaches eighty-five.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 11 11"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="68" font-size="38" font-weight="700" fill="#24312D">Make 80 as a landing place</text><rect x="370" y="120" width="460" height="90" rx="45" fill="#F7EFE3" stroke="#D97706" stroke-width="5"/><text x="600" y="177" font-size="35" font-weight="700">48 = 43 + 5</text><g font-size="50" font-weight="700"><circle cx="180" cy="410" r="90" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="180" y="428">37</text><circle cx="600" cy="410" r="94" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="600" y="428">80</text><circle cx="1020" cy="410" r="98" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><circle cx="1020" cy="410" r="84" fill="none" stroke="#287A55" stroke-width="3"/><text x="1020" y="428">85</text></g><path d="M280 410H495" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#a)"/><text x="390" y="365" font-size="31" font-weight="700" fill="#7652A8">+43</text><path d="M704 410H915" stroke="#D97706" stroke-width="7" marker-end="url(#a)"/><text x="810" y="365" font-size="31" font-weight="700" fill="#D97706">+5</text><text x="600" y="650" font-size="36" font-weight="700">37 + 43 + 5 = 80 + 5 = 85</text></g></svg>
