<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Extend to seven by ten and remove one column of seven</title><desc id="desc">An exact seven-row by ten-column grid represents 70 square units. Its rightmost column of exactly seven cells is hatched and crossed as excess, leaving the seven-by-nine area of 63.</desc>
  <defs><pattern id="g" x="180" y="150" width="84" height="70" patternUnits="userSpaceOnUse"><rect width="84" height="70" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#C2413B" stroke-width="4"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Make 70, then remove 7</text><rect x="180" y="150" width="840" height="490" fill="url(#g)" stroke="#24312D" stroke-width="6"/><rect class="seven-excess-cells" x="936" y="150" width="84" height="490" fill="url(#h)" stroke="#C2413B" stroke-width="7"/><path d="M940 155L1016 635M1016 155L940 635" stroke="#C2413B" stroke-width="5"/><text x="600" y="710" font-size="37" font-weight="700">7 × 10 = 70 · 70 − 7 = 63</text></g>
</svg>
