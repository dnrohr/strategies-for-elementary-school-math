<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 8: Retrieve seven plus five as twelve</title><desc id="desc">A quiet typographic composition places seven plus five beside twelve with a minimal equals sign. A small detached note names counting as an optional later check.</desc><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.p{font-size:76px;font-weight:700}.a{font-size:100px;font-weight:700;fill:#287A55}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 08 · RETRIEVAL</text><text x="70" y="116" class="h">The fact comes directly</text><text x="70" y="154" class="s">The picture records the report; it does not invent an internal route.</text><rect x="64" y="190" width="1072" height="460" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <text x="360" y="410" class="p" text-anchor="middle">7 + 5</text><text x="600" y="410" class="p" text-anchor="middle" fill="#7652A8">=</text><text x="835" y="425" class="a" text-anchor="middle">12</text><path d="M275 475H920" stroke="#D7D0C4" stroke-width="3"/><text x="600" y="520" class="l" text-anchor="middle">no pictured objects · no spoken count · no staged journey</text>
  <rect x="410" y="550" width="380" height="80" rx="22" fill="#FFFDF8" stroke="#7652A8" stroke-width="3" stroke-dasharray="8 7"/><text x="600" y="582" class="l" text-anchor="middle">OPTIONAL LATER CHECK</text><text x="600" y="615" class="s" text-anchor="middle">count on: 8, 9, 10, 11, 12</text>
</svg>
