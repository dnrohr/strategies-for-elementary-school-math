  <title id="title">Measure the gap from thirty-nine to seventy-two</title><desc id="desc">A proportional forward route travels from thirty-nine to forty by one, forty to seventy by thirty, and seventy to seventy-two by two. A double bracket labels the complete distance thirty-three; no removal occurs.</desc><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Difference as forward distance</text><path d="M120 475H1080" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="5"><path d="M160 450v50M190 450v50M990 450v50M1050 450v50"/></g><g font-size="25"><text x="150" y="545" text-anchor="end">39</text><text x="200" y="545" text-anchor="start">40</text><text x="990" y="545">70</text><text x="1050" y="545">72</text></g><path d="M160 425Q175 365 190 425" fill="none" stroke="#087E8B" stroke-width="7" marker-end="url(#qa-arrow)"/><path d="M190 425Q590 100 990 425" fill="none" stroke="#087E8B" stroke-width="7" marker-end="url(#qa-arrow)"/><path d="M990 425Q1020 335 1050 425" fill="none" stroke="#087E8B" stroke-width="7" marker-end="url(#qa-arrow)"/><text x="175" y="350" font-size="25">+1</text><text x="590" y="190" font-size="34">+30</text><text x="1020" y="320" font-size="25">+2</text><path d="M160 595v35h890v-35" fill="none" stroke="#287A55" stroke-width="9"/><path d="M160 607v23h890v-23" fill="none" stroke="#287A55" stroke-width="4"/><text x="605" y="700" font-size="36" font-weight="700" fill="#287A55">distance = 1 + 30 + 2 = 33</text></g>
