<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">A magnified half-twentieth shows why five eighths exceeds three fifths</title><desc id="desc">Twelve full twentieths represent three fifths. Five eighths adds exactly half of the thirteenth twentieth. A large inset explicitly divides that thirteenth cell into two equal halves.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">The difference is half of one twentieth</text>
  <g><rect x="95" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="165" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="235" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="305" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="375" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="445" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="515" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="585" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="655" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="725" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="795" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="865" y="245" width="70" height="95" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="935" y="245" width="70" height="95" fill="#FFFDF8" stroke="#18324A" stroke-width="3"/></g><rect x="935" y="245" width="35" height="95" fill="#F2B35F" stroke="#18324A" stroke-width="3"/>
  <text x="515" y="395" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28" font-weight="700">12/20 = 3/5</text><text x="935" y="215" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">13th twentieth</text>
  <rect x="260" y="485" width="680" height="190" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="13 9"/><text x="600" y="535" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="24" font-weight="700">MAGNIFIED THIRTEENTH CELL</text><rect x="430" y="565" width="340" height="70" fill="#FFFDF8" stroke="#18324A" stroke-width="5"/><rect x="430" y="565" width="170" height="70" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><path d="M600 565v70" stroke="#18324A" stroke-width="5"/><text x="515" y="612" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">half</text><text x="685" y="612" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">half</text>
  <text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31" font-weight="700">12 1/2 twentieths = 5/8, so 5/8 is larger</text></svg>
