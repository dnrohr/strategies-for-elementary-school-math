<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Two thirds plus five eighths in common twenty-fourths</title><desc id="desc">Three large equal-length bars are faintly divided into twenty-fourths. Sixteen filled units represent two thirds, fifteen patterned units represent five eighths, and a result bar shows one whole plus seven twenty-fourths.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Rename both fractions in twenty-fourths</text>
  <defs><pattern id="u" width="32" height="95" patternUnits="userSpaceOnUse"><path d="M32 0V95" stroke="#5A6570" stroke-width="1.5" opacity=".38"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C66A12" stroke-width="3"/></pattern></defs>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="29"><text x="65" y="230">2/3 = 16/24</text><rect x="300" y="175" width="768" height="95" fill="#FFFDF8" stroke="#18324A" stroke-width="5"/><rect x="300" y="175" width="512" height="95" fill="#B9D8D5"/><rect x="300" y="175" width="768" height="95" fill="url(#u)"/>
  <text x="65" y="405">5/8 = 15/24</text><rect x="300" y="350" width="768" height="95" fill="#FFFDF8" stroke="#18324A" stroke-width="5"/><rect x="300" y="350" width="480" height="95" fill="url(#h)"/><rect x="300" y="350" width="768" height="95" fill="url(#u)"/></g>
  <rect x="150" y="540" width="900" height="150" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="37" font-weight="700">16/24 + 15/24 = 31/24</text><text x="600" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">= 1 whole + 7/24</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">Faint ticks keep every common unit auditable.</text></svg>
