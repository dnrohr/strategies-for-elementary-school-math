<svg data-qa-image-pass="2026-09-26" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Transfer three units from forty-eight to thirty-seven</title><desc id="desc">Two quantity bars label the source forty-eight and destination thirty-seven. Three hatched source units move left to three matching dashed destination positions. The new addends are forty and forty-five, preserving the total eighty-five.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#D97706" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Redistribute without changing the total</text><text x="280" y="155" text-anchor="middle" font-size="29" font-weight="700">37 · destination</text><rect x="80" y="185" width="400" height="150" rx="20" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><g fill="#FFFDF8" stroke="#2764B8" stroke-width="4" stroke-dasharray="7 6"><ellipse cx="330" cy="260" rx="26" ry="26"/><ellipse cx="390" cy="260" rx="26" ry="26"/><ellipse cx="450" cy="260" rx="26" ry="26"/></g><text x="920" y="155" text-anchor="middle" font-size="29" font-weight="700">48 · source</text><rect x="660" y="185" width="460" height="150" rx="20" fill="#F7EFE3" stroke="#D97706" stroke-width="7"/><g fill="url(#h)" stroke="#24312D" stroke-width="4"><circle cx="900" cy="260" r="26"/><circle cx="960" cy="260" r="26"/><circle cx="1020" cy="260" r="26"/></g><path d="M870 385Q620 495 485 345" fill="none" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11"/><path d="M493 335L470 337 482 358Z" fill="#7652A8"/><text x="650" y="455" text-anchor="middle" font-size="28" font-weight="700" fill="#7652A8">same 3 units move left</text><rect x="80" y="565" width="430" height="110" rx="20" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="295" y="633" text-anchor="middle" font-size="35" font-weight="700">37 + 3 = 40</text><rect x="690" y="565" width="430" height="110" rx="20" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="905" y="633" text-anchor="middle" font-size="35" font-weight="700">48 − 3 = 45</text><text x="600" y="750" text-anchor="middle" font-size="30" font-weight="700">40 + 45 = 85</text></g></svg>
