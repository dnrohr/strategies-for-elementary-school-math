<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Thirty-seven plus forty-eight with a visible ten-ones trade</title><desc id="desc">Two spacious panels show a base-ten route and a written route. Ten separate one-dots are visibly bracketed and traded for one ten, while the written panel carries one ten and reaches eighty-five.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">37 + 48 = 85 · regroup ten ones as one ten</text>
  <rect x="55" y="135" width="650" height="545" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="380" y="195" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="29" font-weight="700">Base-ten exchange</text><g fill="#2764B8" stroke="#18324A" stroke-width="3"><rect x="95" y="245" width="38" height="170"/><rect x="150" y="245" width="38" height="170"/><rect x="205" y="245" width="38" height="170"/><rect x="260" y="245" width="38" height="170"/><rect x="315" y="245" width="38" height="170"/><rect x="370" y="245" width="38" height="170"/><rect x="425" y="245" width="38" height="170"/></g><g fill="#F2B35F" stroke="#18324A" stroke-width="2"><circle cx="110" cy="485" r="17"/><circle cx="162" cy="485" r="17"/><circle cx="214" cy="485" r="17"/><circle cx="266" cy="485" r="17"/><circle cx="318" cy="485" r="17"/><circle cx="370" cy="485" r="17"/><circle cx="422" cy="485" r="17"/><circle cx="474" cy="485" r="17"/><circle cx="526" cy="485" r="17"/><circle cx="578" cy="485" r="17"/><circle cx="110" cy="545" r="17"/><circle cx="162" cy="545" r="17"/><circle cx="214" cy="545" r="17"/><circle cx="266" cy="545" r="17"/><circle cx="318" cy="545" r="17"/></g><path d="M85 445v145h545V445" fill="none" stroke="#7652A8" stroke-width="5"/><text x="380" y="625" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">trade 10 of the 15 ones → one ten + 5 ones</text>
  <rect x="755" y="135" width="390" height="545" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="950" y="195" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="29" font-weight="700">Written route</text><g fill="#18324A" font-family="Consolas,monospace" font-size="61" text-anchor="end"><text x="1010" y="330">37</text><text x="1010" y="420">+48</text><path d="M850 450h180" stroke="#18324A" stroke-width="6"/><text x="1010" y="545" font-weight="700">85</text><text x="925" y="250" font-size="29" fill="#7652A8">carry 1 ten</text></g><text x="950" y="625" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">7 + 8 = 15 ones; write 5, carry 1</text>
  <text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">8 tens + 5 ones = 85</text></svg>
