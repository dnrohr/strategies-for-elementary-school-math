<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Skip-count to twenty-four with four equal jumps of six</title><desc id="desc">A proportional number line from zero to twenty-four has exactly four equal forward arcs of six. Four numbered beat markers align with six, twelve, eighteen, and twenty-four.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Four beats of six reach 24</text><path d="M120 500H1080" stroke="#24312D" stroke-width="6"/><path d="M140 460Q250 240 360 460Q470 240 580 460Q690 240 800 460Q910 240 1020 460" fill="none" stroke="#087E8B" stroke-width="8"/><g font-size="26" font-weight="700"><text x="140" y="550">0</text><text x="360" y="550">6</text><text x="580" y="550">12</text><text x="800" y="550">18</text><text x="1020" y="550">24</text><text x="250" y="275">1 · +6</text><text x="470" y="275">2 · +6</text><text x="690" y="275">3 · +6</text><text x="910" y="275">4 · +6</text></g><text x="600" y="675" font-size="36" font-weight="700">6, 12, 18, 24 → four counts</text></g></svg>
