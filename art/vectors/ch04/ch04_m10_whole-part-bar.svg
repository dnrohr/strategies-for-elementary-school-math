<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A seventy-two-unit bar split into thirty-nine and thirty-three</title><desc id="desc">One proportional bar of length seventy-two has a known segment thirty-nine subdivided into thirty and nine, plus a double-outlined unknown segment thirty-three. Labels state whole equals known plus unknown.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Whole = known part + missing part</text><path d="M100 220v-30h1000v30" fill="none" stroke="#2764B8" stroke-width="6"/><text x="600" y="160" font-size="28" font-weight="700">WHOLE = 72</text><g transform="translate(100 270)"><rect width="1000" height="220" rx="18" fill="#FFFDF8" stroke="#24312D" stroke-width="7"/><rect width="416.667" height="220" rx="15" fill="#F7ECEA" stroke="#C2413B" stroke-width="6"/><rect x="416.667" width="125" height="220" fill="#F7ECEA" stroke="#C2413B" stroke-width="6"/><rect x="541.667" width="458.333" height="220" rx="15" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><rect x="554" y="13" width="433" height="194" rx="10" fill="none" stroke="#287A55" stroke-width="3"/><text x="208" y="130" font-size="36" font-weight="700">30</text><text x="479" y="130" font-size="36" font-weight="700">9</text><text x="771" y="130" font-size="42" font-weight="700">33</text></g><text x="371" y="560" font-size="28" fill="#C2413B">known = 39</text><text x="871" y="560" font-size="28" fill="#287A55">unknown = 33</text><text x="600" y="690" font-size="36" font-weight="700">72 = 39 + 33</text></g></svg>
