<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Rearrange twelve five-unit sections from three twenties into four fifteens</title>
  <desc id="desc">Three twenty-unit bars, each partitioned into four equal fives, form sixty. The same twelve sections are rearranged into four groups of three fives, demonstrating conservation without a misleading stretched-numerator metaphor.</desc>
  <defs>
    <pattern id="m04-unit-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#2764B8" stroke-width="3"/></pattern>
    <marker id="m04-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker>
    <g id="m04-unit"><rect width="64" height="64" rx="10" fill="url(#m04-unit-hatch)" stroke="#2764B8" stroke-width="4"/><text x="32" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24312D">5</text></g>
  </defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">The same twelve 5-unit sections are rearranged</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">20 × 3 = 60 · 60 ÷ 4 = 15</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="260" y="176" font-size="27" font-weight="700" fill="#2764B8">1 · MAKE 60</text><text x="260" y="208" font-size="21" fill="#52605A">3 rows of 20 · twelve equal sections</text></g>
  <g transform="translate(105 245)">
    <g><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><use href="#m04-unit" x="216"/><text x="315" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24312D">= 20</text></g>
    <g transform="translate(0 82)"><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><use href="#m04-unit" x="216"/><text x="315" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24312D">= 20</text></g>
    <g transform="translate(0 164)"><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><use href="#m04-unit" x="216"/><text x="315" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24312D">= 20</text></g>
  </g>
  <text x="250" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#2764B8">12 sections · total 60</text>
  <path d="M515 380H685" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 11" marker-end="url(#m04-arrow)"/><text x="600" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#7652A8">regroup ÷ 4</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="925" y="176" font-size="27" font-weight="700" fill="#287A55">2 · SHARE 60 FOUR WAYS</text><text x="925" y="208" font-size="21" fill="#52605A">the same sections · three in each share</text></g>
  <g transform="translate(805 220)">
    <g><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><text x="255" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#287A55">= 15</text></g>
    <g transform="translate(0 76)"><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><text x="255" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#287A55">= 15</text></g>
    <g transform="translate(0 152)"><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><text x="255" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#287A55">= 15</text></g>
    <g transform="translate(0 228)"><use href="#m04-unit"/><use href="#m04-unit" x="72"/><use href="#m04-unit" x="144"/><text x="255" y="42" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#287A55">= 15</text></g>
  </g>
  <text x="925" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#287A55">4 shares · each 15</text>
  <rect x="337" y="680" width="526" height="72" rx="36" fill="#F4EBFA" stroke="#7652A8" stroke-width="4"/><text x="600" y="727" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#24312D">(20 × 3) ÷ 4 = 15</text>
</svg>
