<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Eleven additions of twelve reach 132</title><desc id="desc">Exactly eleven group cards each contain the value twelve; the running totals below are 12 through 132.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Add one group of 12 eleven times</text><g font-size="25" font-weight="700" fill="#E7EEF8" stroke="#2764B8" stroke-width="5"><rect x="55" y="170" width="90" height="100" rx="15"/><rect x="155" y="170" width="90" height="100" rx="15"/><rect x="255" y="170" width="90" height="100" rx="15"/><rect x="355" y="170" width="90" height="100" rx="15"/><rect x="455" y="170" width="90" height="100" rx="15"/><rect x="555" y="170" width="90" height="100" rx="15"/><rect x="655" y="170" width="90" height="100" rx="15"/><rect x="755" y="170" width="90" height="100" rx="15"/><rect x="855" y="170" width="90" height="100" rx="15"/><rect x="955" y="170" width="90" height="100" rx="15"/><rect x="1055" y="170" width="90" height="100" rx="15"/></g><g font-size="25" font-weight="700"><text x="100" y="230">12</text><text x="200" y="230">12</text><text x="300" y="230">12</text><text x="400" y="230">12</text><text x="500" y="230">12</text><text x="600" y="230">12</text><text x="700" y="230">12</text><text x="800" y="230">12</text><text x="900" y="230">12</text><text x="1000" y="230">12</text><text x="1100" y="230">12</text></g><text x="600" y="400" font-size="25">12 · 24 · 36 · 48 · 60 · 72 · 84 · 96 · 108 · 120 · 132</text><text x="600" y="560" font-size="38" font-weight="700">11 groups × 12 = 132</text></g></svg>
