<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split forty-six into forty and six</title><desc id="desc">An exact proportioned area rectangle has height 27 and total width 46. Its width-40 region is labeled 27 times 40 equals 1,080; its width-6 region is labeled 27 times 6 equals 162. The sum is 1,242.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#176B73" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">27 × (40 + 6)</text><text x="100" y="330" font-family="Arial,sans-serif" font-size="27" fill="#18324A" transform="rotate(-90 100 330)">height 27</text><rect x="180" y="175" width="696" height="380" fill="#F2B35F" stroke="#18324A" stroke-width="5"/><rect x="876" y="175" width="104.4" height="380" fill="url(#h)" stroke="#18324A" stroke-width="5"/><text x="528" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18324A">27 × 40</text><text x="528" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="33" fill="#18324A">= 1,080</text><text x="928" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324A">27 × 6</text><text x="928" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#18324A">= 162</text><path d="M180 595v35h696v-35M876 595v35h104v-35" fill="none" stroke="#18324A" stroke-width="4"/><text x="528" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">width 40</text><text x="928" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">6</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text></svg>
