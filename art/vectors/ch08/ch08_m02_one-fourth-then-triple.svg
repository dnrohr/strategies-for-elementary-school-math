<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Find one fourth of twenty, then make three copies</title>
  <desc id="desc">A twenty-unit bar is divided into four equal five-unit sections. One section is bracketed as one fourth, then three exact copies appear below and total fifteen.</desc>
  <defs><pattern id="m02-dot" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.5" fill="#2764B8"/></pattern><marker id="m02-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/>
  <text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">Find the unit fraction; then copy it</text>
  <text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">1/4 of 20 = 5</text>
  <g transform="translate(100 180)"><rect width="1000" height="160" rx="18" fill="#F7F0E5" stroke="#24312D" stroke-width="5"/><rect width="250" height="160" rx="16" fill="url(#m02-dot)" stroke="#2764B8" stroke-width="7"/><path d="M250 0v160M500 0v160M750 0v160" stroke="#24312D" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#24312D"><text x="125" y="95">5</text><text x="375" y="95">5</text><text x="625" y="95">5</text><text x="875" y="95">5</text></g></g>
  <path d="M100 370v28h250v-28" fill="none" stroke="#2764B8" stroke-width="6"/><text x="225" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2764B8">one fourth = 5</text>
  <path d="M370 425C500 425 510 520 590 520" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="6 12" marker-end="url(#m02-arrow)"/>
  <g transform="translate(260 545)" font-family="Arial,sans-serif" text-anchor="middle"><g fill="url(#m02-dot)" stroke="#287A55" stroke-width="6"><rect width="190" height="105" rx="18"/><rect x="235" width="190" height="105" rx="18"/><rect x="470" width="190" height="105" rx="18"/></g><g font-size="32" font-weight="700" fill="#24312D"><text x="95" y="66">5</text><text x="330" y="66">5</text><text x="565" y="66">5</text></g><text x="330" y="160" font-size="34" font-weight="700" fill="#287A55">3 copies × 5 = 15</text></g>
</svg>
