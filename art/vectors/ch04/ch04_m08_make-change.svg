<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Make thirty-three cents change using three dimes and three pennies</title><desc id="desc">Cents milestones go from thirty-nine to forty by one cent, forty to seventy by thirty cents, and seventy to seventy-two by two cents. Three dime tokens and three penny tokens total thirty-three cents.</desc><rect width="1200" height="800" fill="#FFFDF8"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Change is the gap in cents</text><path d="M100 360H1100" stroke="#24312D" stroke-width="6"/><path d="M150 335v50M180 335v50M950 335v50M1010 335v50" stroke="#24312D" stroke-width="5"/><g font-size="24"><text x="140" y="425" text-anchor="end">39¢</text><text x="190" y="425" text-anchor="start">40¢</text><text x="950" y="425">70¢</text><text x="1010" y="425">72¢</text><text x="165" y="300">+1¢</text><text x="565" y="250">+30¢</text><text x="980" y="300">+2¢</text></g><text x="540" y="500" font-size="23" font-weight="700" fill="#2764B8">3 dimes = 30¢</text><g class="three-dimes" fill="#E7EEF8" stroke="#2764B8" stroke-width="5"><circle cx="420" cy="570" r="50"/><circle cx="540" cy="570" r="50"/><circle cx="660" cy="570" r="50"/></g><text x="870" y="500" font-size="21" font-weight="700" fill="#D97706">3 pennies = 3¢</text><g class="three-pennies" fill="#F7EFE3" stroke="#D97706" stroke-width="4"><circle cx="800" cy="570" r="28"/><circle cx="870" cy="570" r="28"/><circle cx="940" cy="570" r="28"/></g><text x="600" y="710" font-size="35" font-weight="700">1¢ + 30¢ + 2¢ = 33¢</text></g>
</svg>
