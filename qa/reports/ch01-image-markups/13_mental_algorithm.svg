<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 13 tiny mental algorithm</title><desc id="d">Three callouts identify disappearing terms, sideways process arrows, and an oversized pen cue.</desc><image href="../../../art/vectors/ch01/ch01_m13_tiny-mental-algorithm.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="180" y="245" width="330" height="330" rx="20"/><rect x="505" y="235" width="300" height="260" rx="20"/><ellipse cx="1000" cy="455" rx="120" ry="150"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="500" cy="260" r="28"/><circle cx="805" cy="250" r="28"/><circle cx="1090" cy="345" r="28"/></g><g fill="#fff" font-size="28"><text x="500" y="270">1</text><text x="805" y="260">2</text><text x="1090" y="355">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 13 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · MAJOR: preserve terms</tspan><tspan x="1240" dy="32">Show 7+(3+2), then (7+3)+2;</tspan><tspan x="1240" dy="29">the current +2 disappears briefly.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Match reading order</tspan><tspan x="1240" dy="32">Put action labels between rows with</tspan><tspan x="1240" dy="29">small downward cues.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Demote the pen</tspan><tspan x="1240" dy="32">Shrink it to a corner cue so the</tspan><tspan x="1240" dy="29">derivation is the hero.</tspan></text></g>
</svg>
