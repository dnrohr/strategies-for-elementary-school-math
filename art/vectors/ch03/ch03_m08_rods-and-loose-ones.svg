<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Seven tens rods and fifteen loose ones regroup to eighty-five</title><desc id="desc">A top-down place-value layout shows seven blue rods and fifteen orange one tiles split into a bracketed group of ten and a group of five. An exchange arrow leads to the symbolic result eight tens plus five ones equals eighty-five.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">See units before digits</text><text x="60" y="108" font-size="24" fill="#52605A">70 + 15 = 70 + 10 + 5</text><g fill="#2764B8" stroke="#24312D" stroke-width="3"><rect x="70" y="170" width="44" height="270"/><rect x="130" y="170" width="44" height="270"/><rect x="190" y="170" width="44" height="270"/><rect x="250" y="170" width="44" height="270"/><rect x="310" y="170" width="44" height="270"/><rect x="370" y="170" width="44" height="270"/><rect x="430" y="170" width="44" height="270"/></g><text x="270" y="490" text-anchor="middle" font-size="26" font-weight="700" fill="#2764B8">7 rods = 70</text><g fill="#D97706" stroke="#24312D" stroke-width="3"><rect x="560" y="180" width="42" height="42"/><rect x="616" y="180" width="42" height="42"/><rect x="672" y="180" width="42" height="42"/><rect x="728" y="180" width="42" height="42"/><rect x="784" y="180" width="42" height="42"/><rect x="560" y="236" width="42" height="42"/><rect x="616" y="236" width="42" height="42"/><rect x="672" y="236" width="42" height="42"/><rect x="728" y="236" width="42" height="42"/><rect x="784" y="236" width="42" height="42"/><rect x="900" y="180" width="42" height="42"/><rect x="956" y="180" width="42" height="42"/><rect x="1012" y="180" width="42" height="42"/><rect x="928" y="236" width="42" height="42"/><rect x="984" y="236" width="42" height="42"/></g><path d="M545 165v130h296V165" fill="none" stroke="#7652A8" stroke-width="6"/><text x="693" y="340" text-anchor="middle" font-size="25" font-weight="700">group 10 ones</text><path d="M850 390V520" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10" marker-end="url(#a)"/><rect x="590" y="560" width="510" height="120" rx="30" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="845" y="635" text-anchor="middle" font-size="40" font-weight="700">8 tens + 5 ones = 85</text></g></svg>
