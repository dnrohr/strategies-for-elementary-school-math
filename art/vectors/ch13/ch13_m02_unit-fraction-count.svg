<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Count sixteen and fifteen copies of one twenty-fourth</title><desc id="desc">A 24-cell unit strip is bracketed into three groups of eight and eight groups of three to show how thirds and eighths share the same unit. Two thirds counts 16 twenty-fourths; five eighths counts 15; the running count reaches 31 twenty-fourths.</desc><defs><pattern id="g" x="230" width="30" height="110" patternUnits="userSpaceOnUse"><path d="M30 0V110" stroke="#18324A" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Count the same-sized unit fraction</text><rect x="230" y="250" width="720" height="110" fill="#FFFDF8" stroke="#18324A" stroke-width="5"/><rect x="230" y="250" width="480" height="110" fill="#B9D8D5"/><rect x="230" y="250" width="720" height="110" fill="url(#g)" stroke="#18324A" stroke-width="5"/><path d="M230 210v-35h240v35M470 210v-35h240v35M710 210v-35h240v35" fill="none" stroke="#176B73" stroke-width="5"/><text x="590" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">thirds: 8 + 8 + 8 cells</text><path d="M230 400v35h90v-35M320 400v35h90v-35M410 400v35h90v-35M500 400v35h90v-35M590 400v35h90v-35M680 400v35h90v-35M770 400v35h90v-35M860 400v35h90v-35" fill="none" stroke="#C66A12" stroke-width="4"/><text x="590" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">eighths: 3 cells in each bracket</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="600" y="595" font-size="38" font-weight="700">16 units + 15 units = 31 units</text><text x="600" y="665" font-size="34" fill="#347C5A">31 × 1/24 = 31/24 = 1 7/24</text><text x="600" y="730" font-size="26" fill="#5A6570">The denominator names the unit; the numerator counts it.</text></g><g data-qa-detail="unit-callout"><rect x="970" y="250" width="110" height="110" fill="#FFFDF8" stroke="#7652A8" stroke-width="4"/><text x="1025" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">one cell</text><text x="1025" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700">= 1/24</text></g></svg>
