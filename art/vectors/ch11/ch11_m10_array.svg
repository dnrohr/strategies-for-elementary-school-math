<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Grouped twenty-seven by forty-six array</title><desc id="desc">A schematic array groups twenty-seven rows as ten, ten, and seven. Forty columns and six columns are separated, and an enlarged callout makes the narrow six-column strip and its contribution legible.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Group rows and enlarge the narrow strip</text>
  <rect x="90" y="170" width="720" height="420" fill="#FFFDF8" stroke="#18324A" stroke-width="5"/><rect x="90" y="170" width="625" height="420" fill="#B9D8D5"/><rect x="715" y="170" width="95" height="420" fill="#F2B35F"/><path d="M90 325h720M90 480h720M715 170v420" stroke="#18324A" stroke-width="5"/>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="27" text-anchor="middle"><text x="55" y="250">10</text><text x="55" y="405">10</text><text x="55" y="545">7</text><text x="400" y="640">40 columns</text><text x="762" y="640">6</text><text x="400" y="385" font-size="34" font-weight="700">27 × 40 = 1,080</text></g>
  <path d="M810 280H870" stroke="#7652A8" stroke-width="4" stroke-dasharray="8 7"/><rect x="870" y="205" width="260" height="270" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="13 9"/><text x="1000" y="255" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="24" font-weight="700">ENLARGED 6-COLUMN STRIP</text><rect x="930" y="295" width="140" height="95" fill="#F2B35F" stroke="#18324A" stroke-width="5"/><text x="1000" y="355" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="32" font-weight="700">27 × 6</text><text x="1000" y="435" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31">= 162</text>
  <text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text></svg>
