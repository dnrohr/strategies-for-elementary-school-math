<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Seven appears as a remembered subtraction fact and is checked</title><desc id="desc">The expression fifteen minus eight crosses a quiet dotted transition to a large double-outlined seven card. A subordinate verification loop states seven plus eight equals fifteen without depicting a brain or claiming speed.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">A remembered relation</text><text x="64" y="110" font-size="24" fill="#52605A">The route may feel immediate; the inverse fact checks it.</text><rect x="85" y="220" width="370" height="190" rx="34" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="270" y="337" text-anchor="middle" font-size="57" font-weight="700">15 − 8</text><path d="M490 315H735" stroke="#7652A8" stroke-width="5" stroke-dasharray="3 18" marker-end="url(#a)"/><text x="612" y="278" text-anchor="middle" font-size="22" fill="#52605A">no reported steps</text><rect x="775" y="195" width="340" height="240" rx="38" fill="#E8F3ED" stroke="#287A55" stroke-width="10"/><rect x="790" y="210" width="310" height="210" rx="29" fill="none" stroke="#287A55" stroke-width="4"/><text x="945" y="352" text-anchor="middle" font-size="104" font-weight="700">7</text><path d="M945 470C945 620 255 620 255 455" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="7 12" marker-end="url(#a)"/><rect x="395" y="600" width="410" height="90" rx="45" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="656" text-anchor="middle" font-size="34" font-weight="700">check: 7 + 8 = 15</text></g></svg>
