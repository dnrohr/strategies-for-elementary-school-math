<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Count every square in a seven-by-nine grid</title><desc id="desc">An exact seven-row by nine-column grid contains 63 square unit cells. One continuous serpentine route passes through every cell center once; seven embedded arrowheads show the row directions and exterior checkpoints mark 1, 9, 18, 27, 36, 45, 54, and 63.</desc>
  <defs><pattern id="g" x="210" y="150" width="86" height="70" patternUnits="userSpaceOnUse"><rect width="86" height="70" fill="#FFFDF8" stroke="#24312D" stroke-width="2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0 0L7 3.5L0 7Z" fill="#087E8B"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Visit each unit square once</text><g transform="translate(114.0698 -5) scale(.813953488 1)"><rect x="210" y="150" width="774" height="490" fill="url(#g)" stroke="#24312D" stroke-width="6" vector-effect="non-scaling-stroke"/></g>
    <g fill="none" stroke="#087E8B" stroke-width="5" stroke-dasharray="10 8"><path d="M320 180H880" marker-end="url(#arrow)"/><path d="M880 180V250"/><path d="M880 250H320" marker-end="url(#arrow)"/><path d="M320 250V320"/><path d="M320 320H880" marker-end="url(#arrow)"/><path d="M880 320V390"/><path d="M880 390H320" marker-end="url(#arrow)"/><path d="M320 390V460"/><path d="M320 460H880" marker-end="url(#arrow)"/><path d="M880 460V530"/><path d="M880 530H320" marker-end="url(#arrow)"/><path d="M320 530V600"/><path d="M320 600H880" marker-end="url(#arrow)"/></g>
    <g fill="#087E8B"><path d="M880 180l-18-9v18z"/><path d="M320 250l18-9v18z"/><path d="M880 320l-18-9v18z"/><path d="M320 390l18-9v18z"/><path d="M880 460l-18-9v18z"/><path d="M320 530l18-9v18z"/><path d="M880 600l-18-9v18z"/></g><circle cx="320" cy="180" r="9" fill="#087E8B"/><g font-size="24" font-weight="700" fill="#287A55"><text x="225" y="188">start</text><text x="270" y="188">1</text><text x="955" y="188">9</text><text x="245" y="258">18</text><text x="955" y="328">27</text><text x="245" y="398">36</text><text x="955" y="468">45</text><text x="245" y="538">54</text><text x="955" y="608">63</text></g><text x="600" y="710" font-size="35" font-weight="700">7 × 9 = 63 square units</text></g>
</svg>
