<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Retrieved middle facts form stepping-stones to eighty-five</title><desc id="desc">A restrained sequence moves from thirty-seven plus forty to the intermediate result seventy-seven, then adds eight to reach eighty-five. Seventy-seven is explicitly labeled as a stepping-stone rather than the final answer.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="68" font-size="38" font-weight="700" fill="#24312D">Useful facts arrive along the route</text><rect x="70" y="250" width="300" height="150" rx="28" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="220" y="342" font-size="42" font-weight="700">37 + 40</text><path d="M400 325H515" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 11" marker-end="url(#a)"/><rect x="550" y="230" width="220" height="190" rx="34" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="660" y="345" font-size="59" font-weight="700">77</text><text x="660" y="470" font-size="22" fill="#52605A">stepping-stone</text><path d="M800 325H910" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 11" marker-end="url(#a)"/><text x="855" y="285" font-size="28" font-weight="700" fill="#D97706">+8</text><rect x="945" y="215" width="200" height="220" rx="38" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><rect x="958" y="228" width="174" height="194" rx="29" fill="none" stroke="#287A55" stroke-width="3"/><text x="1045" y="350" font-size="67" font-weight="700">85</text><text x="600" y="640" font-size="36" font-weight="700">37 + 40 = 77 · 77 + 8 = 85</text></g></svg>
