<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split twelve into ten and two across eleven rows</title><desc id="desc">An eleven-row area model is partitioned into a ten-column region of 110 unit cells and a two-column region of 22 unit cells, totaling 132.</desc><defs><pattern id="ten-grid" x="130" y="155" width="75" height="40" patternUnits="userSpaceOnUse"><rect width="75" height="40" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="two-grid" x="880" y="155" width="75" height="40" patternUnits="userSpaceOnUse"><rect width="75" height="40" fill="#F7EFE3" stroke="#24312D" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Split 12 columns into 10 + 2</text><rect x="130" y="155" width="750" height="440" fill="url(#ten-grid)" stroke="#2764B8" stroke-width="7"/><rect x="880" y="155" width="150" height="440" fill="url(#two-grid)" stroke="#D97706" stroke-width="7"/><rect x="280" y="320" width="450" height="110" rx="24" fill="#FFFDF8" fill-opacity=".92"/><text x="505" y="388" font-size="39" font-weight="700">11 × 10 = 110</text><rect x="895" y="320" width="120" height="110" rx="20" fill="#FFFDF8" fill-opacity=".92"/><text x="955" y="365" font-size="25" font-weight="700">11 × 2</text><text x="955" y="400" font-size="25" font-weight="700">= 22</text><text x="600" y="675" font-size="38" font-weight="700">110 + 22 = 132</text></g></svg>
