<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Direct retrieval of fifteen followed by an equal-groups check</title>
  <desc id="desc">The expression three fourths of twenty crosses a short field of negative space to the answer fifteen, suggesting retrieval without a sensory metaphor. Below, four five-unit tiles verify the answer, with three selected and one unselected.</desc>
  <defs><marker id="m10-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker><pattern id="m10-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#287A55" stroke-width="4"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">The answer appears; then I verify it</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">Retrieval is the route. Equal groups provide the warrant.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="190" width="330" height="170" rx="30" fill="#E7EEF8" stroke="#2764B8" stroke-width="6"/><text x="255" y="290" font-size="49" font-weight="700" fill="#24312D">3/4 of 20</text><path d="M445 275H745" stroke="#7652A8" stroke-width="5" stroke-dasharray="3 18" marker-end="url(#m10-arrow)"/><text x="595" y="240" font-size="25" fill="#52605A">minimal transition</text><rect x="780" y="170" width="330" height="210" rx="34" fill="#E8F3ED" stroke="#287A55" stroke-width="10"/><rect x="794" y="184" width="302" height="182" rx="25" fill="none" stroke="#287A55" stroke-width="4"/><text x="945" y="310" font-size="82" font-weight="700" fill="#24312D">15</text></g>
  <path d="M945 402v70" stroke="#7652A8" stroke-width="5" stroke-dasharray="5 10"/><text x="945" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#7652A8">check</text>
  <g transform="translate(170 500)" font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#24312D" stroke-width="5"><rect width="210" height="105" rx="16" fill="url(#m10-hatch)"/><rect x="220" width="210" height="105" rx="16" fill="url(#m10-hatch)"/><rect x="440" width="210" height="105" rx="16" fill="url(#m10-hatch)"/><rect x="660" width="210" height="105" rx="16" fill="#F2F2EF" stroke="#68707A" stroke-dasharray="11 8"/></g><g font-size="33" font-weight="700" fill="#24312D"><text x="105" y="67">5</text><text x="325" y="67">5</text><text x="545" y="67">5</text><text x="765" y="67">5</text></g><path d="M0 140v27h650v-27" fill="none" stroke="#287A55" stroke-width="8"/><text x="325" y="220" font-size="32" font-weight="700" fill="#287A55">three fives = 15</text><text x="765" y="162" font-size="26" fill="#52605A">four fives = 20</text></g>
</svg>
