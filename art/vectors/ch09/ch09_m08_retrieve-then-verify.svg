<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Retrieve the ordering, then verify it</title>
  <desc id="desc">A minimal first panel shows the remembered result five eighths is greater than three fifths. A separate verification panel converts three fifths to 0.600 and five eighths to 0.625, making the reasoning auditable.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/>
  <rect x="90" y="120" width="430" height="540" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="305" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5A6570">RETRIEVE</text><text x="305" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#18324A">5/8 &gt; 3/5</text><text x="305" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#5A6570">The ordering arrives first.</text>
  <path d="M530 390h110" stroke="#7652A8" stroke-width="7" marker-end="url(#arrow)"/><text x="585" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#553A78">then check</text>
  <rect x="660" y="120" width="450" height="540" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5" stroke-dasharray="14 9"/><text x="885" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#12545A">VERIFY</text><text x="885" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#18324A">3 ÷ 5 = 0.600</text><text x="885" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" fill="#18324A">5 ÷ 8 = 0.625</text><path d="M770 455h230" stroke="#18324A" stroke-width="4"/><text x="885" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#7A2525">0.600 &lt; 0.625</text>
</svg>
