<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Subtract forty from seventy-two and add one back</title><desc id="desc">A leftward forty-unit number-line arc moves from seventy-two to the explicitly intermediate thirty-two, then a rightward one-unit correction ends at a double-marked thirty-three. Thirty-nine equals forty minus one.</desc><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Subtract 40; repair by +1</text><rect x="420" y="115" width="360" height="75" rx="38" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="164" font-size="30" font-weight="700">39 = 40 − 1</text><path d="M140 470H1060" stroke="#24312D" stroke-width="6"/><path d="M200 445v50M225 445v50M1000 445v50" stroke="#24312D" stroke-width="5"/><text x="190" y="540" font-size="25" text-anchor="end">32</text><text x="235" y="540" font-size="25" text-anchor="start">33</text><text x="1000" y="540" font-size="25">72</text><path d="M990 425Q600 110 210 425" fill="none" stroke="#C2413B" stroke-width="7" marker-end="url(#qa-arrow)"/><text x="600" y="245" font-size="34" font-weight="700" fill="#C2413B">−40</text><path d="M205 405Q215 350 225 405" fill="none" stroke="#D97706" stroke-width="6" marker-end="url(#qa-arrow)"/><text x="250" y="360" font-size="29" fill="#D97706">+1</text><circle cx="200" cy="470" r="15" fill="#FFFDF8" stroke="#68707A" stroke-width="5"/><text x="200" y="590" font-size="26" fill="#52605A">intermediate</text><circle cx="225" cy="470" r="19" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="600" y="700" font-size="36" font-weight="700">72 − 40 + 1 = 33</text></g>
</svg>
