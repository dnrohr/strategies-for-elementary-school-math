<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Eleven equal groups of twelve combine to one hundred thirty-two</title><desc id="desc">Eleven large labeled group cards are arranged in two rows, each card representing exactly twelve counters. A brace spans all eleven groups and points to the equality eleven times twelve equals one hundred thirty-two without a pouring metaphor.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Brace eleven equal groups of twelve</text>
