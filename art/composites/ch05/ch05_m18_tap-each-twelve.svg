<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Eleven taps track repeated additions of twelve</title>
  <desc id="desc">One hand taps a strip containing exactly eleven vector beat marks. The running totals are 12, 24, 36, 48, 60, 72, 84, 96, 108, 120, and 132.</desc>
  <image href="../../raster/ch05/ch05_m18_tap-each-twelve_raster.png" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
  <g font-family="Arial,sans-serif" fill="#24312D">
    <rect x="42" y="28" width="1116" height="96" rx="24" fill="#FFFDF8" fill-opacity=".94"/>
    <text x="600" y="68" text-anchor="middle" font-size="35" font-weight="700">Tap once for each group of 12</text>
    <text x="600" y="103" text-anchor="middle" font-size="22">Eleven beats keep place; the numerals keep the amount.</text>
    <g class="beat-eleven" text-anchor="middle" font-weight="700">
      <g fill="#E7EEF8" fill-opacity=".96" stroke="#2764B8" stroke-width="5">
        <circle cx="105" cy="410" r="37"/><circle cx="204" cy="410" r="37"/><circle cx="303" cy="410" r="37"/><circle cx="402" cy="410" r="37"/><circle cx="501" cy="410" r="37"/><circle cx="600" cy="410" r="37"/><circle cx="699" cy="410" r="37"/><circle cx="798" cy="410" r="37"/><circle cx="897" cy="410" r="37"/><circle cx="996" cy="410" r="37"/><circle cx="1095" cy="410" r="37"/>
      </g>
      <g font-size="21"><text x="105" y="417">12</text><text x="204" y="417">24</text><text x="303" y="417">36</text><text x="402" y="417">48</text><text x="501" y="417">60</text><text x="600" y="417">72</text><text x="699" y="417">84</text><text x="798" y="417">96</text><text x="897" y="417">108</text><text x="996" y="417">120</text><text x="1095" y="417">132</text></g>
      <g font-size="18" fill="#7652A8"><text x="105" y="472">1</text><text x="204" y="472">2</text><text x="303" y="472">3</text><text x="402" y="472">4</text><text x="501" y="472">5</text><text x="600" y="472">6</text><text x="699" y="472">7</text><text x="798" y="472">8</text><text x="897" y="472">9</text><text x="996" y="472">10</text><text x="1095" y="472">11</text></g>
    </g>
    <rect x="360" y="666" width="480" height="88" rx="44" fill="#E8F3ED" fill-opacity=".96" stroke="#287A55" stroke-width="7"/>
    <text x="600" y="722" text-anchor="middle" font-size="36" font-weight="700">11 taps → 132</text>
  </g>
</svg>
