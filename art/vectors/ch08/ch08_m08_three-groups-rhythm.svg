<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Three rhythmic beats mark three groups of five</title>
  <desc id="desc">Four five-dot groups preserve the whole of twenty. Above the first three groups, exact vector beat marks numbered one, two, and three align with the spoken totals five, ten, and fifteen. No hand or body is depicted.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">Three beats: five, ten, fifteen</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">The beats track three groups—not twenty separate counters.</text>
  <g transform="translate(74 190)" font-family="Arial,sans-serif" text-anchor="middle"><g fill="#E8F3ED" stroke="#287A55" stroke-width="6"><rect width="244" height="330" rx="24"/><rect x="270" width="244" height="330" rx="24"/><rect x="540" width="244" height="330" rx="24"/></g><rect x="810" width="244" height="330" rx="24" fill="#F2F2EF" stroke="#68707A" stroke-width="5" stroke-dasharray="12 9"/>
    <g fill="#287A55" stroke="#183D2C" stroke-width="4"><circle cx="72" cy="105" r="25"/><circle cx="172" cy="105" r="25"/><circle cx="72" cy="190" r="25"/><circle cx="172" cy="190" r="25"/><circle cx="122" cy="270" r="25"/><circle cx="342" cy="105" r="25"/><circle cx="442" cy="105" r="25"/><circle cx="342" cy="190" r="25"/><circle cx="442" cy="190" r="25"/><circle cx="392" cy="270" r="25"/><circle cx="612" cy="105" r="25"/><circle cx="712" cy="105" r="25"/><circle cx="612" cy="190" r="25"/><circle cx="712" cy="190" r="25"/><circle cx="662" cy="270" r="25"/></g><g fill="#D9DDDA" stroke="#68707A" stroke-width="4"><circle cx="882" cy="105" r="25"/><circle cx="982" cy="105" r="25"/><circle cx="882" cy="190" r="25"/><circle cx="982" cy="190" r="25"/><circle cx="932" cy="270" r="25"/></g>
    <g fill="#D97706" stroke="#24312D" stroke-width="4"><path d="M92-46h60l-12 40H104z"/><path d="M362-46h60l-12 40H374z"/><path d="M632-46h60l-12 40H644z"/></g><g font-size="22" font-weight="700" fill="#24312D"><text x="122" y="-18">1</text><text x="392" y="-18">2</text><text x="662" y="-18">3</text></g><g font-size="28" font-weight="700" fill="#24312D"><text x="122" y="382">“five”</text><text x="392" y="382">“ten”</text><text x="662" y="382">“fifteen”</text><text x="932" y="382" fill="#52605A">quarter left</text></g></g>
  <path d="M196 640C330 585 465 695 600 640S870 585 1004 640" fill="none" stroke="#D97706" stroke-width="6" stroke-dasharray="4 12"/><text x="600" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#24312D">5 + 5 + 5 = 15</text>
</svg>
