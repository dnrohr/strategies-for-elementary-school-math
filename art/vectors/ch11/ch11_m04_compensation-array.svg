<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Thirty conceptual rows of forty-six with exactly three removed</title><desc id="desc">A labeled row index displays exactly 30 horizontal row marks, each representing one group of 46 rather than 46 literal objects. Rows 28, 29, and 30 are visibly crossed out. Thirty times 46 is 1,380; removing three times 46, or 138, leaves 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18324A">Start with 30 groups; remove exactly 3</text><text x="95" y="140" font-family="Arial,sans-serif" font-size="21" fill="#5A6570">Each row mark represents one complete group of 46; units are not drawn literally.</text><g stroke="#176B73" stroke-width="7"><path d="M150 180h500M150 197h500M150 214h500M150 231h500M150 248h500M150 265h500M150 282h500M150 299h500M150 316h500M150 333h500M150 350h500M150 367h500M150 384h500M150 401h500M150 418h500M150 435h500M150 452h500M150 469h500M150 486h500M150 503h500M150 520h500M150 537h500M150 554h500M150 571h500M150 588h500M150 605h500M150 622h500"/></g><g stroke="#B33A3A" stroke-width="7"><path d="M150 639h500M150 656h500M150 673h500"/></g><g stroke="#B33A3A" stroke-width="6"><path d="M135 625l530 62M665 625l-530 62"/></g><text x="95" y="190" font-family="Arial,sans-serif" font-size="22">1</text><text x="90" y="630" font-family="Arial,sans-serif" font-size="22">27</text><text x="80" y="680" font-family="Arial,sans-serif" font-size="22" fill="#7A2525">28–30</text><rect x="735" y="190" width="390" height="430" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#18324A"><text x="790" y="300" font-size="35">30 × 46 = 1,380</text><text x="790" y="390" font-size="35" fill="#7A2525">3 × 46 = 138</text><path d="M780 425h300" stroke="#18324A" stroke-width="4"/><text x="790" y="500" font-size="39" font-weight="700">1,380 − 138</text><text x="790" y="570" font-size="43" font-weight="700" fill="#347C5A">= 1,242</text></g><text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18324A">27 rows remain.</text></svg>
