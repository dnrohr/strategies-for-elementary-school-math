<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Combine thirds and fourths before the ready twelfths</title>
  <desc id="desc">Three equation cards first rename three fourths and two thirds as 9 and 8 twelfths, combine them to 17 twelfths, then add the ready 5 twelfths to reach 22 twelfths, equal to 11 sixths.</desc>
  <defs><marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l18 9-18 9z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="82" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Resolve the unlike pair first</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><rect x="70" y="190" width="300" height="260" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="220" y="245" font-size="22" font-weight="700">RENAME</text><text x="220" y="325" font-size="34">3/4 = 9/12</text><text x="220" y="390" font-size="34">2/3 = 8/12</text><path d="M385 320H445" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/>
  <rect x="465" y="190" width="270" height="260" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="600" y="245" font-size="22" font-weight="700">PAIR</text><text x="600" y="330" font-size="34">9/12 + 8/12</text><text x="600" y="395" font-size="41" font-weight="700">= 17/12</text><path d="M750 320H810" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/>
  <rect x="830" y="190" width="300" height="260" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="980" y="245" font-size="22" font-weight="700">ADD READY UNIT</text><text x="980" y="325" font-size="34">17/12 + 5/12</text><text x="980" y="392" font-size="41" font-weight="700">= 22/12</text></g>
  <rect x="280" y="545" width="640" height="125" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700">22/12 ÷ 2/2 = 11/6</text><text x="600" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#347C5A">= 1 5/6</text><text x="600" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">The final five twelfths never changes units.</text>
</svg>
