<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Three fractions renamed as exact twelfths</title>
  <desc id="desc">Three equal 12-cell wholes show three fourths as 9 twelfths, two thirds as 8 twelfths, and five twelfths unchanged. The exact sum is 22 twelfths, equal to 11 sixths or one and five sixths.</desc>
  <defs><pattern id="grid" x="330" width="55" height="72" patternUnits="userSpaceOnUse"><path d="M55 0V72" stroke="#18324A" stroke-width="2"/></pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C66A12" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="75" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Rename every piece as 1/12</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><text x="75" y="205" font-size="29">3/4 → 9/12</text><rect x="330" y="150" width="495" height="72" fill="#B9D8D5"/><rect x="330" y="150" width="660" height="72" fill="url(#grid)" stroke="#18324A" stroke-width="4"/>
  <text x="75" y="345" font-size="29">2/3 → 8/12</text><rect x="330" y="290" width="440" height="72" fill="url(#hatch)"/><rect x="330" y="290" width="660" height="72" fill="url(#grid)" stroke="#18324A" stroke-width="4"/>
  <text x="75" y="485" font-size="29">5/12 stays 5/12</text><rect x="330" y="430" width="275" height="72" fill="#DDEDE4"/><rect x="330" y="430" width="660" height="72" fill="url(#grid)" stroke="#18324A" stroke-width="4"/></g>
  <rect x="220" y="590" width="760" height="130" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="600" y="647" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700">9/12 + 8/12 + 5/12 = 22/12</text><text x="600" y="696" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#347C5A">= 11/6 = 1 5/6</text><text x="600" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5A6570">Equal whole lengths; equal cell widths; labels and patterns supplement color.</text>
</svg>
