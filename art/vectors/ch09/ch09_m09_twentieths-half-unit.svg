<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Refine two complete twentieth bars into fortieths</title>
  <desc id="desc">Two equal complete wholes are first divided into twenty cells. Three fifths fills twelve cells; five eighths fills twelve and one half. The same endpoints are traced to bars divided into forty cells, where they become twenty-four and twenty-five fortieths.</desc>
  <defs>
    <pattern id="twentieths" width="40" height="64" patternUnits="userSpaceOnUse"><path d="M40 0V64" stroke="#18324A" stroke-width="2"/></pattern><pattern id="fortieths" width="20" height="64" patternUnits="userSpaceOnUse"><path d="M20 0V64" stroke="#18324A" stroke-width="1.4"/></pattern><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="9" stroke="#176B73" stroke-width="2.5"/></pattern>
    <g class="thirteen-twentieth-cells" aria-hidden="true"><rect x="125" y="180" width="70" height="95"/><rect x="195" y="180" width="70" height="95"/><rect x="265" y="180" width="70" height="95"/><rect x="335" y="180" width="70" height="95"/><rect x="405" y="180" width="70" height="95"/><rect x="475" y="180" width="70" height="95"/><rect x="545" y="180" width="70" height="95"/><rect x="615" y="180" width="70" height="95"/><rect x="685" y="180" width="70" height="95"/><rect x="755" y="180" width="70" height="95"/><rect x="825" y="180" width="70" height="95"/><rect x="895" y="180" width="70" height="95"/><rect x="965" y="180" width="70" height="95"/><rect x="965" y="180" width="35" height="95"/></g>
    <text id="legacy-magnified-label">MAGNIFIED THIRTEENTH CELL</text><text id="legacy-half-count">12 1/2 twentieths = 5/8</text>
  </defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="58" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18324A">Split each twentieth in half</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><text x="58" y="125" font-size="26" font-weight="700">1. Locate both endpoints in twentieths</text><text x="58" y="205" font-size="23" font-weight="700">3/5</text><text x="58" y="315" font-size="23" font-weight="700">5/8</text></g>
  <rect x="220" y="155" width="480" height="64" fill="url(#hatch)"/><rect x="220" y="155" width="800" height="64" fill="url(#twentieths)" stroke="#18324A" stroke-width="4"/>
  <rect x="220" y="265" width="500" height="64" fill="#F2B35F"/><rect x="220" y="265" width="800" height="64" fill="url(#twentieths)" stroke="#18324A" stroke-width="4"/><rect x="700" y="265" width="20" height="64" fill="none" stroke="#B33A3A" stroke-width="5"/>
  <g font-family="Arial,sans-serif" font-size="21" text-anchor="middle"><text x="460" y="245" fill="#12545A">12/20</text><text x="710" y="360" fill="#7A2525" font-weight="700">half of cell 13</text></g>
  <path d="M700 342V485M720 342V485" stroke="#7652A8" stroke-width="3" stroke-dasharray="8 7"/><text x="748" y="408" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#553A78">same endpoints</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><text x="58" y="455" font-size="26" font-weight="700">2. Bisect every cell to make fortieths</text><text x="58" y="535" font-size="23" font-weight="700">3/5</text><text x="58" y="645" font-size="23" font-weight="700">5/8</text></g>
  <rect x="220" y="485" width="480" height="64" fill="url(#hatch)"/><rect x="220" y="485" width="800" height="64" fill="url(#fortieths)" stroke="#18324A" stroke-width="4"/>
  <rect x="220" y="595" width="500" height="64" fill="#F2B35F"/><rect x="220" y="595" width="800" height="64" fill="url(#fortieths)" stroke="#18324A" stroke-width="4"/><rect x="700" y="595" width="20" height="64" fill="none" stroke="#B33A3A" stroke-width="5"/>
  <g font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle"><text x="460" y="582" fill="#12545A">24/40</text><text x="470" y="700" fill="#8A450D">25/40</text><text x="810" y="735" fill="#287A55">24/40 &lt; 25/40, so 3/5 &lt; 5/8</text></g>
</svg>
