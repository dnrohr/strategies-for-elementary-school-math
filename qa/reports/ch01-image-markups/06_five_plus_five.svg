<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 6 use five plus five</title><desc id="d">Three callouts identify incorrect color provenance, unclear ownership of the extras, and an incomplete brace hierarchy.</desc><image href="../../../art/vectors/ch01/ch01_m06_five-plus-five.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="820" y="265" width="260" height="260" rx="30"/><path d="M130 245Q300 175 465 245M820 245Q950 175 1080 245"/><path d="M120 590H780"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1065" cy="280" r="28"/><circle cx="820" cy="250" r="28"/><circle cx="785" cy="590" r="28"/></g><g fill="#fff" font-size="28"><text x="1065" y="290">1</text><text x="820" y="260">2</text><text x="785" y="600">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 06 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · MAJOR: provenance</tspan><tspan x="1240" dy="32">The orange extras visually belong</tspan><tspan x="1240" dy="29">to the orange 5, creating 5 + 7.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Preserve the original 7</tspan><tspan x="1240" dy="32">Its five and its two must share a</tspan><tspan x="1240" dy="29">color/pattern or enclosing brace.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Two-stage braces</tspan><tspan x="1240" dy="32">First show 7 = 5 + 2; then show</tspan><tspan x="1240" dy="29">5 + 5 = 10.</tspan></text></g>
</svg>
