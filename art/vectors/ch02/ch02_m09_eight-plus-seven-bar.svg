<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A fifteen-unit bar split into eight covered and seven uncovered units</title><desc id="desc">One bar contains exactly fifteen equal square cells. The first eight are diagonally hatched and labeled known part eight; the last seven are double-bracketed and labeled unknown part seven. No motion arrow appears.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#2764B8" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Find the missing part of the whole</text><text x="64" y="110" font-size="24" fill="#52605A">The bar is static: 8 and 7 fit together to make 15.</text><path d="M90 235v-30h1020v30" fill="none" stroke="#2764B8" stroke-width="6"/><text x="600" y="175" text-anchor="middle" font-size="28" font-weight="700" fill="#2764B8">WHOLE = 15</text><g transform="translate(90 280)" stroke="#24312D" stroke-width="4"><rect width="1020" height="170" fill="#FFFDF8" stroke-width="7"/><path d="M0 0h544v170H0z" fill="url(#h)"/><path d="M68 0v170M136 0v170M204 0v170M272 0v170M340 0v170M408 0v170M476 0v170M544 0v170M612 0v170M680 0v170M748 0v170M816 0v170M884 0v170M952 0v170"/></g><path d="M90 510v30h544v-30" fill="none" stroke="#2764B8" stroke-width="6"/><path d="M634 510v38h476v-38" fill="none" stroke="#287A55" stroke-width="9"/><path d="M634 520v28h476v-28" fill="none" stroke="#287A55" stroke-width="4"/><text x="362" y="595" text-anchor="middle" font-size="29" font-weight="700" fill="#2764B8">known part = 8</text><text x="872" y="595" text-anchor="middle" font-size="29" font-weight="700" fill="#287A55">missing part = 7</text><text x="600" y="700" text-anchor="middle" font-size="38" font-weight="700">15 = 8 + 7</text></g></svg>
