<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Unbundle a ten rod and remove thirty-nine</title><desc id="desc">Three countable base-ten panels show seven rods and two cubes for seventy-two, then six rods and twelve cubes after unbundling one ten, then three rods and three cubes after removing three tens and nine ones. The result is thirty-three.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/>
  <g font-family="Arial,sans-serif" fill="#24312D"><text x="600" y="65" text-anchor="middle" font-size="38" font-weight="700">Unbundle one ten, then remove 39</text>
    <g transform="translate(35 120)"><rect width="335" height="500" rx="24" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="168" y="43" text-anchor="middle" font-size="23" font-weight="700">BEFORE · 7 tens + 2 ones</text><g class="before-seven-rods" fill="#2764B8" stroke="#24312D" stroke-width="2"><rect x="35" y="85" width="28" height="220"/><rect x="75" y="85" width="28" height="220"/><rect x="115" y="85" width="28" height="220"/><rect x="155" y="85" width="28" height="220"/><rect x="195" y="85" width="28" height="220"/><rect x="235" y="85" width="28" height="220"/><rect x="275" y="85" width="28" height="220"/></g><g class="before-two-cubes" fill="#D97706" stroke="#24312D" stroke-width="3"><rect x="125" y="350" width="38" height="38"/><rect x="178" y="350" width="38" height="38"/></g><text x="168" y="455" text-anchor="middle" font-size="32" font-weight="700">72</text></g>
    <path d="M382 370H422" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10" marker-end="url(#a)"/>
    <g transform="translate(435 120)"><rect width="335" height="500" rx="24" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="168" y="43" text-anchor="middle" font-size="22" font-weight="700">REGROUP · 6 tens + 12 ones</text><g class="regroup-six-rods" fill="#2764B8" stroke="#24312D" stroke-width="2"><rect x="42" y="85" width="31" height="205"/><rect x="86" y="85" width="31" height="205"/><rect x="130" y="85" width="31" height="205"/><rect x="174" y="85" width="31" height="205"/><rect x="218" y="85" width="31" height="205"/><rect x="262" y="85" width="31" height="205"/></g><g class="regroup-twelve-cubes" fill="#D97706" stroke="#24312D" stroke-width="2"><rect x="52" y="330" width="30" height="30"/><rect x="92" y="330" width="30" height="30"/><rect x="132" y="330" width="30" height="30"/><rect x="172" y="330" width="30" height="30"/><rect x="212" y="330" width="30" height="30"/><rect x="252" y="330" width="30" height="30"/><rect x="52" y="370" width="30" height="30"/><rect x="92" y="370" width="30" height="30"/><rect x="132" y="370" width="30" height="30"/><rect x="172" y="370" width="30" height="30"/><rect x="212" y="370" width="30" height="30"/><rect x="252" y="370" width="30" height="30"/></g><text x="168" y="455" text-anchor="middle" font-size="22" font-weight="700">72 = 60 + 12</text></g>
    <path d="M782 370H822" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10" marker-end="url(#a)"/>
    <g transform="translate(835 120)"><rect width="330" height="500" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="165" y="43" text-anchor="middle" font-size="23" font-weight="700">AFTER · 3 tens + 3 ones</text><g class="after-three-rods" fill="#2764B8" stroke="#24312D" stroke-width="2"><rect x="75" y="105" width="42" height="220"/><rect x="144" y="105" width="42" height="220"/><rect x="213" y="105" width="42" height="220"/></g><g class="after-three-cubes" fill="#D97706" stroke="#24312D" stroke-width="3"><rect x="90" y="365" width="38" height="38"/><rect x="146" y="365" width="38" height="38"/><rect x="202" y="365" width="38" height="38"/></g><text x="165" y="468" text-anchor="middle" font-size="48" font-weight="700">33</text></g>
    <text x="800" y="658" text-anchor="middle" font-size="22" font-weight="700" fill="#C2413B">remove 3 tens + 9 ones</text><text x="600" y="718" text-anchor="middle" font-size="34" font-weight="700">72 = 60 + 12 · 12 − 9 = 3 · 6 − 3 = 3</text>
  </g>
</svg>
