<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Exchange ten of fifteen ones for one new ten rod</title><desc id="desc">The before panel contains exactly seven tens rods and fifteen unit cubes. Ten cubes are enclosed by an exchange bracket. The after panel contains exactly eight rods and five cubes, labeled eighty-five.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Ten ones become one ten</text><g transform="translate(55 130)"><rect width="500" height="555" rx="25" fill="#F7F0E5" stroke="#24312D" stroke-width="5"/><text x="250" y="45" text-anchor="middle" font-size="25" font-weight="700">BEFORE · 7 tens + 15 ones</text><g fill="#2764B8" stroke="#24312D" stroke-width="3"><rect x="30" y="80" width="38" height="240"/><rect x="82" y="80" width="38" height="240"/><rect x="134" y="80" width="38" height="240"/><rect x="186" y="80" width="38" height="240"/><rect x="238" y="80" width="38" height="240"/><rect x="290" y="80" width="38" height="240"/><rect x="342" y="80" width="38" height="240"/></g><g fill="#D97706" stroke="#24312D" stroke-width="3"><rect x="30" y="360" width="34" height="34"/><rect x="75" y="360" width="34" height="34"/><rect x="120" y="360" width="34" height="34"/><rect x="165" y="360" width="34" height="34"/><rect x="210" y="360" width="34" height="34"/><rect x="30" y="405" width="34" height="34"/><rect x="75" y="405" width="34" height="34"/><rect x="120" y="405" width="34" height="34"/><rect x="165" y="405" width="34" height="34"/><rect x="210" y="405" width="34" height="34"/><rect x="305" y="360" width="34" height="34"/><rect x="350" y="360" width="34" height="34"/><rect x="395" y="360" width="34" height="34"/><rect x="327" y="405" width="34" height="34"/><rect x="372" y="405" width="34" height="34"/></g><path d="M22 350v105h232V350" fill="none" stroke="#C2413B" stroke-width="6" stroke-dasharray="10 7"/><text x="138" y="495" text-anchor="middle" font-size="22" fill="#C2413B">exchange exactly 10</text></g><path d="M575 405H655" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10" marker-end="url(#a)"/><g transform="translate(685 130)"><rect width="460" height="555" rx="25" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="230" y="45" text-anchor="middle" font-size="25" font-weight="700">AFTER · 8 tens + 5 ones</text><g fill="#2764B8" stroke="#24312D" stroke-width="3"><rect x="25" y="80" width="36" height="240"/><rect x="75" y="80" width="36" height="240"/><rect x="125" y="80" width="36" height="240"/><rect x="175" y="80" width="36" height="240"/><rect x="225" y="80" width="36" height="240"/><rect x="275" y="80" width="36" height="240"/><rect x="325" y="80" width="36" height="240"/><rect x="375" y="80" width="36" height="240"/></g><g fill="#D97706" stroke="#24312D" stroke-width="3"><rect x="95" y="375" width="38" height="38"/><rect x="153" y="375" width="38" height="38"/><rect x="211" y="375" width="38" height="38"/><rect x="269" y="375" width="38" height="38"/><rect x="327" y="375" width="38" height="38"/></g><text x="230" y="505" text-anchor="middle" font-size="44" font-weight="700">85</text></g></g></svg>
