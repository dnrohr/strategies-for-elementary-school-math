<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Eighty-five appears before an optional place-value check</title><desc id="desc">Thirty-seven plus forty-eight crosses a quiet field of negative space to a double-outlined eighty-five result. Below, a subordinate verification reads thirty plus forty plus seven plus eight equals eighty-five. No brain or mystical imagery appears.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="68" font-size="38" font-weight="700" fill="#24312D">The answer first; explanation second</text><rect x="80" y="210" width="390" height="190" rx="34" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="275" y="328" font-size="55" font-weight="700">37 + 48</text><path d="M505 305H735" stroke="#7652A8" stroke-width="5" stroke-dasharray="3 18" marker-end="url(#a)"/><text x="620" y="265" font-size="22" fill="#52605A">no reported sequence</text><rect x="770" y="185" width="350" height="240" rx="40" fill="#E8F3ED" stroke="#287A55" stroke-width="10"/><rect x="785" y="200" width="320" height="210" rx="30" fill="none" stroke="#287A55" stroke-width="4"/><text x="945" y="345" font-size="92" font-weight="700">85</text><path d="M945 465C945 610 255 610 255 445" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="7 12" marker-end="url(#a)"/><rect x="320" y="605" width="560" height="90" rx="45" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="662" font-size="31" font-weight="700">check: 30 + 40 + 7 + 8 = 85</text></g></svg>
