<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 5: Split five into three and two to make ten</title><desc id="desc">Seven blue counters occupy a ten-frame. Five faint source tiles split along motion paths into three orange hatched counters that fill the frame and two orange hatched counters that remain outside.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><path d="M0 0v12" stroke="#D97706" stroke-width="5"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4 0 8Z" fill="#7652A8"/></marker></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.m{font-size:32px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 05 · DECOMPOSITION</text><text x="70" y="116" class="h">Split 5: move 3, leave 2</text><text x="70" y="154" class="s">The same five units are traced from their source to their destination.</text><rect x="64" y="190" width="1072" height="455" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <text x="887" y="232" class="l" text-anchor="middle">the added 5</text><g opacity=".5" fill="#FFF9EF" stroke="#D97706" stroke-width="4" stroke-dasharray="8 7"><rect x="720" y="250" width="54" height="54" rx="9"/><rect x="790" y="250" width="54" height="54" rx="9"/><rect x="860" y="250" width="54" height="54" rx="9"/><rect x="930" y="250" width="54" height="54" rx="9"/><rect x="1000" y="250" width="54" height="54" rx="9"/></g>
  <g fill="none" stroke="#7652A8" stroke-width="4" stroke-dasharray="5 9" marker-end="url(#a)"><path d="M747 310Q650 345 360 460"/><path d="M817 310Q690 360 460 460"/><path d="M887 310Q760 375 560 460"/><path d="M957 310Q970 385 980 460"/><path d="M1027 310Q1060 385 1070 460"/></g>
  <g stroke="#68707A" stroke-width="3" fill="#FFFDF8"><rect x="110" y="350" width="100" height="100"/><rect x="210" y="350" width="100" height="100"/><rect x="310" y="350" width="100" height="100"/><rect x="410" y="350" width="100" height="100"/><rect x="510" y="350" width="100" height="100"/><rect x="110" y="450" width="100" height="100"/><rect x="210" y="450" width="100" height="100"/><rect x="310" y="450" width="100" height="100"/><rect x="410" y="450" width="100" height="100"/><rect x="510" y="450" width="100" height="100"/></g>
  <g fill="#2764B8" stroke="#174478" stroke-width="5"><circle cx="160" cy="400" r="32"/><circle cx="260" cy="400" r="32"/><circle cx="360" cy="400" r="32"/><circle cx="460" cy="400" r="32"/><circle cx="560" cy="400" r="32"/><circle cx="160" cy="500" r="32"/><circle cx="260" cy="500" r="32"/></g><g fill="url(#h)" stroke="#A95805" stroke-width="5"><circle cx="360" cy="500" r="32"/><circle cx="460" cy="500" r="32"/><circle cx="560" cy="500" r="32"/><circle cx="980" cy="500" r="32"/><circle cx="1070" cy="500" r="32"/></g>
  <text x="360" y="610" class="l" text-anchor="middle">full frame = 10</text><text x="1025" y="560" class="l" text-anchor="middle">2 left</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 = 7 + 3 + 2 = 10 + 2 = 12</text>
</svg>
