<svg data-qa-image-pass="2026-09-28" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Long division records twenty-three divided by five as four remainder three</title>
  <desc id="desc">A written division workspace shows five outside twenty-three, quotient four above, product twenty beneath, and subtraction leaving an enclosed remainder three. Two thin numbered leader callouts identify four times five equals twenty and twenty-three minus twenty equals three without crossing the numeral workspace.</desc>
  <rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="90" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">The written algorithm exposes the remainder</text>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="70" font-weight="700"><text x="350" y="390">5</text><text x="500" y="260">4</text><text x="475" y="390">23</text><text x="475" y="500">−20</text><text x="520" y="620">3</text></g>
  <path d="M430 315q0-55 55-55h170M455 520h210" fill="none" stroke="#18324A" stroke-width="7"/>
  <rect x="450" y="550" width="165" height="95" rx="18" fill="none" stroke="#B33A3A" stroke-width="5" stroke-dasharray="10 7"/>
  <g font-family="Arial,sans-serif"><path d="M620 245H735V300" fill="none" stroke="#7652A8" stroke-width="3"/><circle cx="770" cy="300" r="25" fill="#7652A8"/><text x="770" y="309" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFDF8">1</text><text x="815" y="309" font-size="28" fill="#553A78">4 × 5 = 20</text><path d="M620 595H735V520" fill="none" stroke="#C66A12" stroke-width="3" stroke-dasharray="9 7"/><circle cx="770" cy="520" r="25" fill="#C66A12"/><text x="770" y="529" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFDF8">2</text><text x="815" y="529" font-size="28" fill="#8A4308">23 − 20 = 3</text></g>
  <text x="600" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#7A2525">23 ÷ 5 = 4 R3</text>
</svg>
