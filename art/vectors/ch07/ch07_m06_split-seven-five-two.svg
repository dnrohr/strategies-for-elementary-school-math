<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Split seven rows into five rows and two rows</title><desc id="desc">An exact seven-by-nine grid is split horizontally after five rows. Its five-by-nine region is 45 and its two-by-nine region is 18, making 63.</desc>
  <defs><pattern id="top" x="195" y="145" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="bottom" x="195" y="495" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#F7EFE3" stroke="#24312D" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8" fill-opacity=".72"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Partition 7 as 5 + 2</text><rect class="five-by-nine" x="195" y="145" width="810" height="350" fill="url(#top)" stroke="#2764B8" stroke-width="7"/><rect class="two-by-nine" x="195" y="495" width="810" height="140" fill="url(#bottom)" stroke="#D97706" stroke-width="7"/><rect x="405" y="275" width="390" height="95" rx="24" fill="#FFFDF8" fill-opacity=".9"/><text x="600" y="338" font-size="42" font-weight="700">5 × 9 = 45</text><rect x="420" y="515" width="360" height="95" rx="24" fill="#FFFDF8" fill-opacity=".9"/><text x="600" y="578" font-size="39" font-weight="700">2 × 9 = 18</text><text x="600" y="710" font-size="37" font-weight="700">45 + 18 = 63 square units</text></g>
</svg>
