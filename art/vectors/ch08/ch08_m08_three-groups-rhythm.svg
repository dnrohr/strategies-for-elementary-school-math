<svg data-qa-image-pass="2026-09-28" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Three beats track three selected groups while a fourth group preserves the whole</title>
  <desc id="desc">Four equal cards each contain exactly five counters, preserving twenty. Three selected cards have aligned beat markers and cumulative words five, ten, and fifteen. A fourth gray dashed card is not selected and is labeled whole check, twenty.</desc>
  <rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="64" y="72" font-family="Arial,sans-serif" fill="#18324A" font-size="36" font-weight="700">Three beats align with three selected groups</text>
  <text x="64" y="112" font-family="Arial,sans-serif" fill="#5A6570" font-size="23">The fourth group stays visible to preserve the whole twenty.</text>
  <path d="M105 190H825" stroke="#7652A8" stroke-width="4"/>
  <g fill="#7652A8"><circle cx="195" cy="190" r="15"/><circle cx="460" cy="190" r="15"/><circle cx="725" cy="190" r="15"/></g>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="23" font-weight="700" text-anchor="middle"><text x="195" y="157">beat 1</text><text x="460" y="157">beat 2</text><text x="725" y="157">beat 3</text></g>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle">
    <g transform="translate(80 240)"><rect width="230" height="285" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><g fill="#347C5A" stroke="#18324A" stroke-width="3"><circle cx="58" cy="82" r="22"/><circle cx="172" cy="82" r="22"/><circle cx="115" cy="143" r="22"/><circle cx="58" cy="204" r="22"/><circle cx="172" cy="204" r="22"/></g><text x="115" y="332" font-size="29" font-weight="700">five</text></g>
    <g transform="translate(345 240)"><rect width="230" height="285" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><g fill="#347C5A" stroke="#18324A" stroke-width="3"><circle cx="58" cy="82" r="22"/><circle cx="172" cy="82" r="22"/><circle cx="115" cy="143" r="22"/><circle cx="58" cy="204" r="22"/><circle cx="172" cy="204" r="22"/></g><text x="115" y="332" font-size="29" font-weight="700">ten</text></g>
    <g transform="translate(610 240)"><rect width="230" height="285" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><g fill="#347C5A" stroke="#18324A" stroke-width="3"><circle cx="58" cy="82" r="22"/><circle cx="172" cy="82" r="22"/><circle cx="115" cy="143" r="22"/><circle cx="58" cy="204" r="22"/><circle cx="172" cy="204" r="22"/></g><text x="115" y="332" font-size="29" font-weight="700">fifteen</text></g>
    <g transform="translate(875 240)"><rect width="230" height="285" rx="24" fill="#F2F2EF" stroke="#68707A" stroke-width="5" stroke-dasharray="12 9"/><g fill="#D9DDDA" stroke="#52605A" stroke-width="3"><ellipse cx="58" cy="82" rx="22" ry="22"/><ellipse cx="172" cy="82" rx="22" ry="22"/><ellipse cx="115" cy="143" rx="22" ry="22"/><ellipse cx="58" cy="204" rx="22" ry="22"/><ellipse cx="172" cy="204" rx="22" ry="22"/></g><text x="115" y="325" font-size="24" fill="#52605A">whole check: 20</text></g>
  </g>
  <path d="M80 635v24h760v-24" fill="none" stroke="#347C5A" stroke-width="7"/>
  <text x="460" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">5 + 5 + 5 = 15</text>
  <text x="990" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5A6570">quarter left · not selected</text>
