<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Turn fifteen minus eight into a missing-addend equation</title><desc id="desc">A transformation changes fifteen minus eight equals a blank into eight plus a blank equals fifteen. Below, an eight-unit bar and a seven-unit double-outlined bar exactly fill a fifteen-unit whole.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#287A55" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Ask the inverse question</text><g text-anchor="middle" font-size="43" font-weight="700"><rect x="85" y="165" width="390" height="125" rx="22" fill="#E7EEF8" stroke="#2764B8" stroke-width="6"/><text x="280" y="244">15 − 8 = □</text><path d="M505 227H680" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#a)"/><rect x="715" y="165" width="400" height="125" rx="22" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="915" y="244">8 + □ = 15</text></g><text x="600" y="360" text-anchor="middle" font-size="25" fill="#52605A">What part joins 8 to make the whole 15?</text><g transform="translate(100 430)" text-anchor="middle"><rect width="1000" height="150" rx="18" fill="#FFFDF8" stroke="#24312D" stroke-width="7"/><rect width="533.333" height="150" rx="15" fill="#E7EEF8" stroke="#2764B8" stroke-width="6"/><rect x="533.333" width="466.667" height="150" rx="15" fill="url(#h)" stroke="#287A55" stroke-width="9"/><rect x="546" y="13" width="441" height="124" rx="10" fill="none" stroke="#287A55" stroke-width="3"/><text x="266" y="92" font-size="40" font-weight="700">8</text><text x="766" y="92" font-size="40" font-weight="700">7</text><text x="500" y="210" font-size="35" font-weight="700" fill="#287A55">8 + 7 = 15</text></g></g></svg>
