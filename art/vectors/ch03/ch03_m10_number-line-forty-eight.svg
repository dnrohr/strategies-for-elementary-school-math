<svg data-qa-image-pass="2026-09-26" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Walk from thirty-seven to eighty-five by forty and eight</title><desc id="desc">A proportional number line uses twenty pixels per unit. A forty-unit arc runs from thirty-seven to seventy-seven, then an eight-unit arc runs from seventy-seven to eighty-five. Separate matching arrowheads stop above the landing ticks.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Addition as directed distance</text><text x="60" y="108" font-size="24" fill="#52605A">One scale throughout: 40 units, then 8 units.</text><path d="M100 490H1120" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="4"><path d="M140 465v50M200 475v30M400 465v50M600 465v50M800 465v50M940 465v50M1000 475v30M1100 465v50"/></g><g text-anchor="middle" font-size="26"><text x="140" y="550">37</text><text x="200" y="550">40</text><text x="400" y="550">50</text><text x="600" y="550">60</text><text x="800" y="550">70</text><text x="940" y="550">77</text><text x="1000" y="550">80</text><text x="1100" y="550">85</text></g><path d="M140 450Q530 105 922 438" fill="none" stroke="#087E8B" stroke-width="8"/><path d="M922 426L946 451 913 451Z" fill="#087E8B"/><path d="M940 420Q1015 325 1082 425" fill="none" stroke="#D97706" stroke-width="8"/><path d="M1077 414L1105 451 1068 440Z" fill="#D97706"/><text x="540" y="185" text-anchor="middle" font-size="35" font-weight="700" fill="#087E8B">+40</text><text x="1020" y="322" text-anchor="middle" font-size="29" font-weight="700" fill="#D97706">+8</text><text x="600" y="680" text-anchor="middle" font-size="36" font-weight="700">37 + 40 + 8 = 85</text></g></svg>
