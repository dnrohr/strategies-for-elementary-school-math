<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 10: Five spacious number-line hops from seven to twelve</title><desc id="desc">A focused number line from seven to twelve uses the full diagram width. Exactly five equal arcs, each subtly labeled plus one, land at eight through twelve.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4 0 8Z" fill="#087E8B"/></marker></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:21px;font-weight:700}.n{font-size:30px;font-weight:700;text-anchor:middle}.m{font-size:36px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 10 · SPATIAL NUMBER LINE</text><text x="70" y="116" class="h">Five equal hops to the right</text><text x="70" y="154" class="s">Only the active region is shown, so every unit interval has room.</text><rect x="64" y="190" width="1072" height="455" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <path d="M135 480H1065" stroke="#68707A" stroke-width="6"/><g stroke="#68707A" stroke-width="5"><path d="M140 445v70M325 445v70M510 445v70M695 445v70M880 445v70M1065 445v70"/></g><g fill="none" stroke="#087E8B" stroke-width="7" marker-end="url(#a)"><path d="M150 430q82-170 165 0"/><path d="M335 430q82-170 165 0"/><path d="M520 430q82-170 165 0"/><path d="M705 430q82-170 165 0"/><path d="M890 430q82-170 165 0"/></g><g class="l" text-anchor="middle" fill="#52615B"><text x="232" y="300">+1</text><text x="417" y="300">+1</text><text x="602" y="300">+1</text><text x="787" y="300">+1</text><text x="972" y="300">+1</text></g>
  <g class="n"><text x="140" y="565">7</text><text x="325" y="565">8</text><text x="510" y="565">9</text><text x="695" y="565">10</text><text x="880" y="565">11</text><text x="1065" y="565">12</text></g><ellipse cx="140" cy="480" rx="20" ry="20" fill="#2764B8" stroke="#174478" stroke-width="5"/><ellipse cx="1065" cy="480" rx="25" ry="25" fill="#E6F2EA" stroke="#287A55" stroke-width="7"/><text x="140" y="620" class="l" text-anchor="middle">start</text><text x="1065" y="620" class="l" text-anchor="middle">landing</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 = 12</text>
</svg>
