<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Twelve by twelve square minus one row of twelve</title><desc id="desc">A labeled twelve-by-twelve grid of 144 cells has one complete row of twelve crossed out, leaving eleven rows of twelve or 132.</desc><defs><pattern id="g" x="300" y="125" width="50" height="45" patternUnits="userSpaceOnUse"><rect width="50" height="45" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">One row less than 12 × 12</text><rect x="300" y="125" width="600" height="540" fill="url(#g)" stroke="#24312D" stroke-width="6"/><rect x="300" y="620" width="600" height="45" fill="#F7ECEA" stroke="#C2413B" stroke-width="6"/><path d="M305 625L895 660M895 625L305 660" stroke="#C2413B" stroke-width="5"/><text x="1040" y="650" font-size="25" fill="#C2413B">remove 1 row = 12</text><text x="150" y="400" font-size="26">12 rows</text><text x="600" y="725" font-size="34" font-weight="700">144 − 12 = 132 · 11 rows remain</text></g></svg>
