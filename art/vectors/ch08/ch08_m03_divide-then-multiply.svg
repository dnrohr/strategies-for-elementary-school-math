<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Operator path from twenty to five to fifteen</title>
  <desc id="desc">A precise symbolic flow divides twenty by four to reach five, then multiplies five by three to reach fifteen. A small verification strip shows four equal groups of five with three marked.</desc>
  <defs><marker id="m03-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker><pattern id="m03-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#287A55" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="74" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">A two-step operator route</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#E7EEF8" stroke="#2764B8" stroke-width="6"><circle cx="170" cy="320" r="92"/></g><text x="170" y="338" font-size="58" font-weight="700" fill="#24312D">20</text><path d="M272 320H470" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#m03-arrow)"/><text x="370" y="282" font-size="30" font-weight="700" fill="#7652A8">÷ 4</text><g fill="#F4EBFA" stroke="#7652A8" stroke-width="6"><circle cx="580" cy="320" r="92"/></g><text x="580" y="338" font-size="58" font-weight="700" fill="#24312D">5</text><path d="M682 320H880" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#m03-arrow)"/><text x="780" y="282" font-size="30" font-weight="700" fill="#7652A8">× 3</text><g fill="#E8F3ED" stroke="#287A55" stroke-width="9"><circle cx="990" cy="320" r="94"/><circle cx="990" cy="320" r="81" fill="none" stroke-width="4"/></g><text x="990" y="338" font-size="58" font-weight="700" fill="#24312D">15</text></g>
  <g transform="translate(150 560)" font-family="Arial,sans-serif"><text x="0" y="-35" font-size="24" fill="#52605A">Structure check: four equal groups of five</text><g stroke="#24312D" stroke-width="4"><rect width="225" height="90" rx="12" fill="url(#m03-hatch)"/><rect x="225" width="225" height="90" fill="url(#m03-hatch)"/><rect x="450" width="225" height="90" fill="url(#m03-hatch)"/><rect x="675" width="225" height="90" rx="12" fill="#E5E7E5" stroke-dasharray="11 8"/></g><g font-size="27" font-weight="700" text-anchor="middle" fill="#24312D"><text x="112" y="56">5</text><text x="337" y="56">5</text><text x="562" y="56">5</text><text x="787" y="56">5</text></g><text x="450" y="142" text-anchor="middle" font-size="30" font-weight="700" fill="#287A55">(20 ÷ 4) × 3 = 15</text></g>
</svg>
