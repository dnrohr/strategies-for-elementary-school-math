<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 12 counting rhythm</title><desc id="d">Three callouts replace bar-chart-like beat marks, remove repeated labels, and rebalance the held start.</desc><image href="../../../art/vectors/ch01/ch01_m12_counting-rhythm.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="305" y="305" width="770" height="230" rx="30"/><rect x="300" y="535" width="790" height="100" rx="20"/><rect x="75" y="240" width="195" height="290" rx="28"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1070" cy="320" r="28"/><circle cx="1080" cy="590" r="28"/><circle cx="270" cy="255" r="28"/></g><g fill="#fff" font-size="28"><text x="1070" y="330">1</text><text x="1080" y="600">2</text><text x="270" y="265">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 12 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Avoid bar-chart semantics</tspan><tspan x="1240" dy="32">Use beat discs or tap marks rather</tspan><tspan x="1240" dy="29">than tall quantitative-looking bars.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Remove triple labeling</tspan><tspan x="1240" dy="32">Numerals plus one “five beats” label</tspan><tspan x="1240" dy="29">are sufficient.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Rebalance held 7</tspan><tspan x="1240" dy="32">Shrink the start card so the five</tspan><tspan x="1240" dy="29">beats own the horizontal rhythm.</tspan></text></g>
</svg>
