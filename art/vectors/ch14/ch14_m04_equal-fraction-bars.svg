<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Equal whole bars compose 9, 8, and 5 twelfths</title>
  <desc id="desc">Three equal-length bars each have 12 equal cells, with exactly 9, 8, and 5 cells marked. A result row shows one complete 12-cell whole plus 10 more twelfths, all at the same 50-pixel cell width as the source bars, equal to one and five sixths.</desc>
  <defs><pattern id="g" x="300" width="50" height="60" patternUnits="userSpaceOnUse"><path d="M50 0V60" stroke="#18324A" stroke-width="2"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C66A12" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="75" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Three equal wholes on one twelfths ruler</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><text x="95" y="190" font-size="27">3/4 = 9/12</text><rect x="300" y="145" width="450" height="60" fill="#B9D8D5"/><rect x="300" y="145" width="600" height="60" fill="url(#g)" stroke="#18324A" stroke-width="4"/><text x="935" y="185" font-size="23">9 cells</text>
  <text x="95" y="305" font-size="27">2/3 = 8/12</text><rect x="300" y="260" width="400" height="60" fill="url(#h)"/><rect x="300" y="260" width="600" height="60" fill="url(#g)" stroke="#18324A" stroke-width="4"/><text x="935" y="300" font-size="23">8 cells</text>
  <text x="95" y="420" font-size="27">5/12</text><rect x="300" y="375" width="250" height="60" fill="#DDEDE4"/><rect x="300" y="375" width="600" height="60" fill="url(#g)" stroke="#18324A" stroke-width="4"/><text x="935" y="415" font-size="23">5 cells</text></g>
  <path d="M220 500H980" stroke="#7652A8" stroke-width="5" stroke-dasharray="12 9"/><text x="600" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#553A78">9 + 8 + 5 = 22 equal cells</text>
<rect x="50" y="570" width="600" height="75" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><rect x="650" y="570" width="500" height="75" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><path d="M100 570v75M150 570v75M200 570v75M250 570v75M300 570v75M350 570v75M400 570v75M450 570v75M500 570v75M550 570v75M600 570v75M650 570v75M700 570v75M750 570v75M800 570v75M850 570v75M900 570v75M950 570v75M1000 570v75M1050 570v75M1100 570v75" stroke="#18324A" stroke-width="2"/><path d="M650 570v75" stroke="#18324A" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#18324A"><text x="350" y="680">12 cells = 1 whole</text><text x="900" y="680">10 cells = 10/12</text></g><text x="600" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#347C5A">22/12 = 1 + 10/12 = 1 5/6</text>
</svg>
