<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Multiply twenty by three, then divide sixty into four equal fifteens</title>
  <desc id="desc">Three twenty-unit bars form sixty. A transformation arrow leads to the same length repartitioned into four equal bars of fifteen, demonstrating twenty times three divided by four equals fifteen.</desc>
  <defs><pattern id="m04-blue" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6h12" stroke="#2764B8" stroke-width="3"/></pattern><marker id="m04-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">Multiply first; divide second</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">20 × 3 = 60 · 60 ÷ 4 = 15</text>
  <g transform="translate(70 185)" font-family="Arial,sans-serif" text-anchor="middle"><text x="230" y="0" font-size="25" font-weight="700" fill="#2764B8">THREE COPIES OF 20</text><g fill="url(#m04-blue)" stroke="#2764B8" stroke-width="6"><rect y="35" width="460" height="90" rx="14"/><rect y="150" width="460" height="90" rx="14"/><rect y="265" width="460" height="90" rx="14"/></g><g font-size="32" font-weight="700" fill="#24312D"><text x="230" y="93">20</text><text x="230" y="208">20</text><text x="230" y="323">20</text></g><text x="230" y="410" font-size="34" font-weight="700" fill="#2764B8">total = 60</text></g>
  <path d="M555 385H685" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 11" marker-end="url(#m04-arrow)"/><text x="620" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#7652A8">÷ 4</text>
  <g transform="translate(720 185)" font-family="Arial,sans-serif" text-anchor="middle"><text x="205" y="0" font-size="25" font-weight="700" fill="#287A55">FOUR EQUAL SHARES</text><g fill="#E8F3ED" stroke="#287A55" stroke-width="6"><rect y="35" width="410" height="72" rx="12"/><rect y="124" width="410" height="72" rx="12"/><rect y="213" width="410" height="72" rx="12"/><rect y="302" width="410" height="72" rx="12"/></g><g font-size="29" font-weight="700" fill="#24312D"><text x="205" y="82">15</text><text x="205" y="171">15</text><text x="205" y="260">15</text><text x="205" y="349">15</text></g><text x="205" y="424" font-size="34" font-weight="700" fill="#287A55">each share = 15</text></g>
  <rect x="337" y="680" width="526" height="72" rx="36" fill="#F4EBFA" stroke="#7652A8" stroke-width="4"/><text x="600" y="727" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#24312D">(20 × 3) ÷ 4 = 15</text>
</svg>
