<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Proportion matching three of four parts to fifteen of twenty units</title>
  <desc id="desc">Two aligned bars share four equal columns. The upper bar identifies three selected parts out of four; the lower bar assigns five units per column, so the same selected span is fifteen out of twenty. Beside them, x over twenty equals three over four and solves to fifteen.</desc>
  <defs><pattern id="m09-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#287A55" stroke-width="4"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">Match the same ratio at a new scale</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">Aligned partitions show that 3 out of 4 matches 15 out of 20.</text>
  <g transform="translate(80 200)" font-family="Arial,sans-serif"><text x="0" y="55" font-size="25" font-weight="700" fill="#24312D">parts</text><rect x="100" width="640" height="120" rx="14" fill="#F2F2EF" stroke="#24312D" stroke-width="6"/><path d="M100 0h480v120H100z" fill="url(#m09-hatch)"/><path d="M260 0v120M420 0v120M580 0v120" stroke="#24312D" stroke-width="5"/><g font-size="28" font-weight="700" text-anchor="middle" fill="#24312D"><text x="180" y="75">1</text><text x="340" y="75">1</text><text x="500" y="75">1</text><text x="660" y="75">1</text></g>
    <text x="0" y="275" font-size="25" font-weight="700" fill="#24312D">units</text><rect x="100" y="220" width="640" height="120" rx="14" fill="#F2F2EF" stroke="#24312D" stroke-width="6"/><path d="M100 220h480v120H100z" fill="url(#m09-hatch)"/><path d="M260 220v120M420 220v120M580 220v120" stroke="#24312D" stroke-width="5"/><g font-size="28" font-weight="700" text-anchor="middle" fill="#24312D"><text x="180" y="295">5</text><text x="340" y="295">5</text><text x="500" y="295">5</text><text x="660" y="295">5</text></g><path d="M100 375v30h480v-30" fill="none" stroke="#287A55" stroke-width="7"/><text x="340" y="457" text-anchor="middle" font-size="29" font-weight="700" fill="#287A55">same selected span</text></g>
  <g transform="translate(875 230)" font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="110" y="45" font-size="35" font-weight="700">x / 20 = 3 / 4</text><path d="M15 78h190" stroke="#7652A8" stroke-width="5" stroke-dasharray="6 10"/><text x="110" y="140" font-size="31">4x = 60</text><text x="110" y="205" font-size="31">x = 15</text><rect x="25" y="240" width="170" height="100" rx="20" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><rect x="36" y="251" width="148" height="78" rx="14" fill="none" stroke="#287A55" stroke-width="3"/><text x="110" y="307" font-size="45" font-weight="700">15</text></g>
<g data-qa-detail="development-note"><text x="600" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">x names the unknown matching amount; the aligned bars carry the main explanation.</text></g></svg>
