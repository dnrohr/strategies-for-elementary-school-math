<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Count upward from eight to fifteen using two and five</title><desc id="desc">A proportional number line shows a two-unit forward arc from eight to ten and a five-unit forward arc from ten to fifteen. A bracket spans the full seven-unit distance without removal imagery.</desc>
<defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#087E8B"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Build the distance upward</text><text x="64" y="110" font-size="24" fill="#52605A">8 → 10 is 2 · 10 → 15 is 5</text><path d="M160 470H1040" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="4"><path d="M180 450v40M300 450v40M420 450v40M540 450v40M660 450v40M780 450v40M900 450v40M1020 450v40"/></g><g font-size="25" text-anchor="middle" fill="#24312D"><text x="180" y="530">8</text><text x="300" y="530">9</text><text x="420" y="530">10</text><text x="540" y="530">11</text><text x="660" y="530">12</text><text x="780" y="530">13</text><text x="900" y="530">14</text><text x="1020" y="530">15</text></g><path d="M180 420Q300 230 420 420" fill="none" stroke="#087E8B" stroke-width="7" marker-end="url(#a)"/><path d="M420 420Q720 110 1020 420" fill="none" stroke="#087E8B" stroke-width="7" marker-end="url(#a)"/><text x="300" y="270" text-anchor="middle" font-size="32" font-weight="700" fill="#087E8B">+2</text><text x="720" y="175" text-anchor="middle" font-size="32" font-weight="700" fill="#087E8B">+5</text><path d="M180 575v32h840v-32" fill="none" stroke="#287A55" stroke-width="9"/><path d="M180 584v23h840v-23" fill="none" stroke="#287A55" stroke-width="4"/><text x="600" y="675" text-anchor="middle" font-size="37" font-weight="700" fill="#287A55">gap = 2 + 5 = 7</text></g></svg>
