<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 11: Build seven plus five with ten-frame blocks</title>
  <desc id="desc">Two labeled stages show the same quantities before and after regrouping. Stage one has seven blue blocks in a ten-frame and five orange hatched blocks in a tray. Stage two has a full ten-frame containing seven blue and three orange blocks, plus two loose orange blocks. Ten plus two equals twelve.</desc>
  <defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFF3DF"/><line y2="10" stroke="#D97706" stroke-width="4"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:24px;fill:#52615B}.label{font-size:21px;font-weight:700}.math{font-size:34px;font-weight:700}.cell{fill:#FFFDF8;stroke:#68707A;stroke-width:4}.blue{fill:#2764B8;stroke:#174478;stroke-width:4}.orange{fill:url(#hatch);stroke:#A95805;stroke-width:4}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 11 · PHYSICAL GROUPING</text><text x="70" y="116" class="heading">Build a full ten-frame</text><text x="70" y="154" class="sub">The stage labels separate “before” from “after”; quantities are not cumulative.</text>
  <rect x="64" y="190" width="500" height="448" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/><text x="95" y="232" class="label">STAGE 1 · before moving</text><text x="95" y="267" class="math">7 in frame + 5 in tray</text>
  <g aria-label="stage one ten-frame with seven blue blocks"><g class="cell"><rect x="95" y="305" width="72" height="72"/><rect x="167" y="305" width="72" height="72"/><rect x="239" y="305" width="72" height="72"/><rect x="311" y="305" width="72" height="72"/><rect x="383" y="305" width="72" height="72"/><rect x="95" y="377" width="72" height="72"/><rect x="167" y="377" width="72" height="72"/><rect x="239" y="377" width="72" height="72"/><rect x="311" y="377" width="72" height="72"/><rect x="383" y="377" width="72" height="72"/></g><rect class="blue" x="105" y="315" width="52" height="52" rx="8"/><rect class="blue" x="177" y="315" width="52" height="52" rx="8"/><rect class="blue" x="249" y="315" width="52" height="52" rx="8"/><rect class="blue" x="321" y="315" width="52" height="52" rx="8"/><rect class="blue" x="393" y="315" width="52" height="52" rx="8"/><rect class="blue" x="105" y="387" width="52" height="52" rx="8"/><rect class="blue" x="177" y="387" width="52" height="52" rx="8"/></g>
  <g aria-label="stage one tray with five orange blocks"><rect x="95" y="487" width="390" height="100" rx="18" fill="#FFF9EF" stroke="#D97706" stroke-width="4" stroke-dasharray="10 8"/><rect class="orange" x="112" y="508" width="54" height="54" rx="8"/><rect class="orange" x="187" y="508" width="54" height="54" rx="8"/><rect class="orange" x="262" y="508" width="54" height="54" rx="8"/><rect class="orange" x="337" y="508" width="54" height="54" rx="8"/><rect class="orange" x="412" y="508" width="54" height="54" rx="8"/></g>
  <path d="M584 416h70" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="4 13" marker-end="url(#arrow)"/><text x="619" y="374" class="label" text-anchor="middle">move 3</text><text x="619" y="470" class="label" text-anchor="middle">leave 2</text>
  <rect x="674" y="190" width="462" height="448" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/><text x="705" y="232" class="label">STAGE 2 · after moving</text><text x="705" y="267" class="math">10 in frame + 2 loose</text>
  <g aria-label="stage two full ten-frame with seven blue and three orange blocks"><g class="cell"><rect x="705" y="305" width="72" height="72"/><rect x="777" y="305" width="72" height="72"/><rect x="849" y="305" width="72" height="72"/><rect x="921" y="305" width="72" height="72"/><rect x="993" y="305" width="72" height="72"/><rect x="705" y="377" width="72" height="72"/><rect x="777" y="377" width="72" height="72"/><rect x="849" y="377" width="72" height="72"/><rect x="921" y="377" width="72" height="72"/><rect x="993" y="377" width="72" height="72"/></g><rect class="blue" x="715" y="315" width="52" height="52" rx="8"/><rect class="blue" x="787" y="315" width="52" height="52" rx="8"/><rect class="blue" x="859" y="315" width="52" height="52" rx="8"/><rect class="blue" x="931" y="315" width="52" height="52" rx="8"/><rect class="blue" x="1003" y="315" width="52" height="52" rx="8"/><rect class="blue" x="715" y="387" width="52" height="52" rx="8"/><rect class="blue" x="787" y="387" width="52" height="52" rx="8"/><rect class="orange" x="859" y="387" width="52" height="52" rx="8"/><rect class="orange" x="931" y="387" width="52" height="52" rx="8"/><rect class="orange" x="1003" y="387" width="52" height="52" rx="8"/></g>
  <g aria-label="stage two two loose orange blocks"><rect class="orange" x="800" y="515" width="70" height="70" rx="10"/><rect class="orange" x="900" y="515" width="70" height="70" rx="10"/><path d="M785 600v18h200v-18" fill="none" stroke="#D97706" stroke-width="4"/><text x="885" y="630" class="label" text-anchor="middle">2 loose</text></g>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 → 10 + 2 = 12</text>
</svg>
