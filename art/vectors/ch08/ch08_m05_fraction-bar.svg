<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fraction bar showing three fourths of twenty</title>
  <desc id="desc">One bar labeled whole equals twenty is partitioned into four exactly equal regions of five. Three regions have diagonal hatching and a heavy bracket labeled selected fifteen; the fourth is unselected.</desc>
  <defs><pattern id="m05-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="14" stroke="#287A55" stroke-width="5"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">Three of four equal regions</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">The whole is 20; every quarter has equal length and value 5.</text>
  <text x="600" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2764B8">WHOLE = 20</text><path d="M100 230v-28h1000v28" fill="none" stroke="#2764B8" stroke-width="6"/>
  <g transform="translate(100 270)"><rect width="1000" height="240" rx="18" fill="#F2F2EF" stroke="#24312D" stroke-width="7"/><path d="M250 0v240M500 0v240M750 0v240" stroke="#24312D" stroke-width="7"/><path d="M18 18h714v204H18z" fill="url(#m05-hatch)"/><g font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#24312D"><text x="125" y="137">5</text><text x="375" y="137">5</text><text x="625" y="137">5</text><text x="875" y="137">5</text></g></g>
  <path d="M100 560v34h750v-34" fill="none" stroke="#287A55" stroke-width="9"/><path d="M100 575v19h750v-19" fill="none" stroke="#287A55" stroke-width="4"/><text x="475" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#287A55">selected: 5 + 5 + 5 = 15</text>
  <path d="M850 560v26h250v-26" fill="none" stroke="#68707A" stroke-width="5" stroke-dasharray="10 8"/><text x="975" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#52605A">one quarter not selected</text>
</svg>
