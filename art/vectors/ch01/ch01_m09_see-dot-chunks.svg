<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 9: See seven and five as two five-dot chunks and two extras</title>
  <desc id="desc">Exactly twelve dots are grouped into two boxed five-dot patterns and one separately outlined pair. The two five-patterns make ten and the two extras make twelve. Seven plus five equals five plus two plus five equals ten plus two equals twelve.</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><line y2="12" stroke="#D97706" stroke-width="5"/></pattern></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:22px;font-weight:700}.math{font-size:34px;font-weight:700}.a{fill:#2764B8;stroke:#174478;stroke-width:5}.b{fill:url(#hatch);stroke:#A95805;stroke-width:5}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 09 · DOT CHUNKING</text><text x="70" y="116" class="heading">See two fives and two extras</text><text x="70" y="154" class="sub">Small patterns stay visible; twelve is assembled from the chunks.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="105" y="238" width="475" height="302" rx="26" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="342" y="278" class="label" text-anchor="middle">7-card = five-pattern + two extras</text>
  <g aria-label="boxed five-dot pattern from seven"><rect x="140" y="300" width="255" height="200" rx="20" fill="#FFFDF8" stroke="#2764B8" stroke-width="5"/><circle class="a" cx="185" cy="345" r="23"/><circle class="a" cx="350" cy="345" r="23"/><circle class="a" cx="268" cy="400" r="23"/><circle class="a" cx="185" cy="455" r="23"/><circle class="a" cx="350" cy="455" r="23"/></g><g aria-label="two extra dots from seven"><rect x="425" y="325" width="120" height="150" rx="20" fill="#FFFDF8" stroke="#2764B8" stroke-width="5" stroke-dasharray="10 8"/><circle class="a" cx="485" cy="370" r="23"/><circle class="a" cx="485" cy="430" r="23"/></g>
  <rect x="620" y="238" width="475" height="302" rx="26" fill="#FFF9EF" stroke="#D97706" stroke-width="5"/><text x="857" y="278" class="label" text-anchor="middle">5-card = five-pattern</text><g aria-label="boxed five-dot pattern from five"><rect x="730" y="300" width="255" height="200" rx="20" fill="#FFFDF8" stroke="#D97706" stroke-width="5"/><circle class="b" cx="775" cy="345" r="23"/><circle class="b" cx="940" cy="345" r="23"/><circle class="b" cx="858" cy="400" r="23"/><circle class="b" cx="775" cy="455" r="23"/><circle class="b" cx="940" cy="455" r="23"/></g>
  <path d="M140 572v22h845v-22" fill="none" stroke="#287A55" stroke-width="6"/><text x="562" y="628" class="label" text-anchor="middle">two boxed fives = 10 · outlined pair = 2</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 = (5 + 2) + 5 = 10 + 2 = 12</text>
</svg>
