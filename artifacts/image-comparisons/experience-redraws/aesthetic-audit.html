<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aesthetic audit — 19 revised method images</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", sans-serif; color: #17324d; background: #eee8dc; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    header { max-width: 1100px; margin: 0 auto 24px; }
    h1 { margin: 0 0 8px; font: 700 34px/1.08 Georgia, serif; }
    p { margin: 0; color: #52606b; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; max-width: 1500px; margin: auto; }
    figure { margin: 0; padding: 12px; border: 1px solid #c9c2b5; border-radius: 14px; background: #fffdf8; box-shadow: 0 4px 14px #17324d12; }
    img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: contain; background: #f5efe3; border-radius: 9px; }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 1px; font-size: 14px; font-weight: 700; }
    .status { flex: none; padding: 3px 7px; border-radius: 999px; font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
    .changed { color: #12545a; background: #ddefea; }
    .passed { color: #52606b; background: #ece9e2; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 580px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
