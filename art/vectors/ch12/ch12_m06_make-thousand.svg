<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Use 622 from the subtotal 843 to make one thousand</title><desc id="desc">First 596 plus 247 becomes 843. An exact bridge shows 378 needs 622 to reach 1,000. Removing 622 from 843 leaves 221, so the conserved total is 1,000 plus 221 equals 1,221.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Make 1,000 first</text><rect x="75" y="155" width="330" height="170" rx="24" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="240" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="27">596 + 247</text><text x="240" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700">= 843</text><path d="M450 410H1060" stroke="#18324A" stroke-width="7"/><path d="M500 375v70M950 375v70" stroke="#18324A" stroke-width="5"/><text x="500" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="29">378</text><text x="950" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="29">1,000</text><path d="M515 355Q725 175 935 355" fill="none" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="725" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#553A78">needs exactly 622</text><rect x="705" y="545" width="400" height="130" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="905" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="28">843 − 622 = 221</text><text x="600" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#347C5A">1,000 + 221 = 1,221</text></svg>
