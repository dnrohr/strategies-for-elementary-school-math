<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Eleven tallies count groups while one card defines a group of twelve</title><desc id="desc">Eleven large tally marks are grouped five, five, and one. A separate twelve-dot card defines one group. No hands are shown, avoiding an irrelevant ten-finger quantity while preserving exact group tracking.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Tallies—not fingers—count the eleven groups</text>
  <rect x="65" y="155" width="760" height="390" rx="28" fill="#FFFDF8" stroke="#2764B8" stroke-width="5"/><text x="445" y="215" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="26" font-weight="700">exactly 11 group tallies</text>
  <g class="tally-eleven" stroke="#2764B8" stroke-width="11" stroke-linecap="round"><line x1="130" y1="285" x2="130" y2="410"/><line x1="191" y1="285" x2="191" y2="410"/><line x1="252" y1="285" x2="252" y2="410"/><line x1="313" y1="285" x2="313" y2="410"/><line x1="374" y1="285" x2="374" y2="410"/><line x1="435" y1="285" x2="435" y2="410"/><line x1="496" y1="285" x2="496" y2="410"/><line x1="557" y1="285" x2="557" y2="410"/><line x1="618" y1="285" x2="618" y2="410"/><line x1="679" y1="285" x2="679" y2="410"/><line x1="740" y1="285" x2="740" y2="410"/></g><path d="M115 455v25h300v-25M425 455v25h300v-25M735 455v25h61v-25" fill="none" stroke="#176B73" stroke-width="5"/><g font-family="Arial,sans-serif" fill="#18324A" font-size="26" text-anchor="middle"><text x="265" y="520">5 groups</text><text x="575" y="520">5 groups</text><text x="765" y="520">1 group</text></g>
  <rect x="875" y="155" width="260" height="390" rx="28" fill="#FFF3DF" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="1005" y="215" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25" font-weight="700">one group = 12</text><g class="counters-twelve" fill="#F2B35F" stroke="#18324A" stroke-width="2"><circle cx="930" cy="285" r="18"/><circle cx="1005" cy="285" r="18"/><circle cx="1080" cy="285" r="18"/><circle cx="930" cy="350" r="18"/><circle cx="1005" cy="350" r="18"/><circle cx="1080" cy="350" r="18"/><circle cx="930" cy="415" r="18"/><circle cx="1005" cy="415" r="18"/><circle cx="1080" cy="415" r="18"/><circle cx="930" cy="480" r="18"/><circle cx="1005" cy="480" r="18"/><circle cx="1080" cy="480" r="18"/></g>
  <rect x="270" y="625" width="660" height="95" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#347C5A">11 groups × 12 = 132</text></svg>
