<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A mental written workspace computes seven times nine</title><desc id="desc">A translucent imagined page displays seven times nine equals 63 and labels square units. A faint exact seven-row by nine-column grid supplies context without implying it was counted.</desc>
  <defs><pattern id="faint-grid" x="825" y="240" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#E7EEF8" fill-opacity=".45" stroke="#2764B8" stroke-opacity=".55" stroke-width="1.5"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Numerals are the workspace</text><rect x="180" y="135" width="580" height="530" rx="42" fill="#F4EBFA" fill-opacity=".7" stroke="#7652A8" stroke-width="6" stroke-dasharray="10 8"/><text x="470" y="210" font-size="24" fill="#52605A">MENTAL PAGE</text><text x="470" y="390" font-size="82" font-weight="700">7 × 9 = 63</text><text x="470" y="470" font-size="31">63 square units</text><rect class="faint-seven-by-nine" x="825" y="240" width="270" height="210" fill="url(#faint-grid)" stroke="#2764B8" stroke-width="5"/><text x="960" y="500" font-size="22" fill="#52605A">exact 7-by-9 context</text></g>
</svg>
