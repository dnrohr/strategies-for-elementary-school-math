<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Direct retrieval of eleven times twelve</title><desc id="desc">Eleven times twelve crosses quiet negative space to a double-outlined result of 132, with no intermediate objects.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="80" font-size="38" font-weight="700">The answer arrives</text><rect x="90" y="240" width="380" height="220" rx="35" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="280" y="375" font-size="62" font-weight="700">11 × 12</text><path d="M510 350H730" stroke="#7652A8" stroke-width="5" stroke-dasharray="3 18"/><rect x="770" y="210" width="350" height="280" rx="42" fill="#E8F3ED" stroke="#287A55" stroke-width="10"/><rect x="785" y="225" width="320" height="250" rx="32" fill="none" stroke="#287A55" stroke-width="4"/><text x="945" y="390" font-size="92" font-weight="700">132</text></g></svg>
