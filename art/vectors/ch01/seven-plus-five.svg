<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Seven plus five shown as groups and equal number-line steps</title><desc id="desc">Two equally sized panels compare a twelve-unit grouping model with a large number line from seven to twelve. Five rightward unit intervals are marked by small landing dots and labels.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">7 + 5 = 12 · two equally visible routes</text>
  <rect x="55" y="135" width="520" height="545" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="315" y="200" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="30" font-weight="700">Combine two groups</text><g stroke="#18324A" stroke-width="3"><rect x="95" y="260" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="200" y="260" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="305" y="260" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="410" y="260" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="95" y="365" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="200" y="365" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="305" y="365" width="75" height="75" rx="12" fill="#F2B35F"/><rect x="95" y="475" width="75" height="75" rx="12" fill="#347C5A"/><rect x="200" y="475" width="75" height="75" rx="12" fill="#347C5A"/><rect x="305" y="475" width="75" height="75" rx="12" fill="#347C5A"/><rect x="410" y="475" width="75" height="75" rx="12" fill="#347C5A"/><rect x="95" y="565" width="75" height="75" rx="12" fill="#347C5A"/></g><text x="315" y="665" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31" font-weight="700">7 units + 5 units = 12</text>
  <rect x="625" y="135" width="520" height="545" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="885" y="200" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="30" font-weight="700">Count on five</text><path d="M700 470H1070" stroke="#18324A" stroke-width="6"/><g stroke="#18324A" stroke-width="4"><path d="M700 445v50"/><path d="M774 445v50"/><path d="M848 445v50"/><path d="M922 445v50"/><path d="M996 445v50"/><path d="M1070 445v50"/></g><g fill="#176B73"><circle cx="700" cy="470" r="9"/><circle cx="774" cy="470" r="9"/><circle cx="848" cy="470" r="9"/><circle cx="922" cy="470" r="9"/><circle cx="996" cy="470" r="9"/><circle cx="1070" cy="470" r="9"/></g><g font-family="Arial,sans-serif" fill="#18324A" font-size="26" text-anchor="middle"><text x="700" y="540">7</text><text x="774" y="540">8</text><text x="848" y="540">9</text><text x="922" y="540">10</text><text x="996" y="540">11</text><text x="1070" y="540">12</text></g><path d="M700 390Q885 250 1070 390" fill="none" stroke="#C66A12" stroke-width="6" stroke-dasharray="13 9"/><text x="885" y="300" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="29" font-weight="700">five equal +1 intervals</text><text x="885" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">7 → 12</text>
  <text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">Same total; different visual route.</text></svg>
