<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 14: A quiet symbolic relation without a concrete scene</title><desc id="desc">Three expressions sit on one baseline with equals signs: seven plus five, ten plus two, and twelve. Small labels above the equalities name same total and two more than ten. No objects, containers, number line, or directional arrows appear.</desc><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:21px;font-weight:700}.x{font-size:72px;font-weight:700}.e{font-size:62px;font-weight:400;fill:#7652A8}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 14 · ABSTRACT RELATION</text><text x="70" y="116" class="h">A relation, without a scene</text><text x="70" y="154" class="s">Only the mathematics is placed on the page; no imagined journey is supplied.</text><rect x="64" y="190" width="1072" height="460" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <path d="M150 470H1050" stroke="#D7D0C4" stroke-width="3"/><text x="270" y="450" class="x" text-anchor="middle">7 + 5</text><text x="500" y="450" class="e" text-anchor="middle">=</text><text x="730" y="450" class="x" text-anchor="middle">10 + 2</text><text x="920" y="450" class="e" text-anchor="middle">=</text><text x="1020" y="450" class="x" text-anchor="middle" fill="#287A55">12</text><text x="500" y="330" class="l" text-anchor="middle">same total</text><text x="920" y="330" class="l" text-anchor="middle">two more than ten</text><text x="600" y="575" class="l" text-anchor="middle" fill="#52615B">symbolic relation only · no objects · no sound · no motion</text>
</svg>
