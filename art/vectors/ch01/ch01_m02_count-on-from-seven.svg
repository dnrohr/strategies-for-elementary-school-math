<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 2: Count on five times from seven</title>
  <desc id="desc">Seven is held as the starting total. Exactly five equal one-unit jumps land on eight, nine, ten, eleven, and twelve. Five aligned tap bars track the five increments. Seven plus five equals twelve.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:22px;font-weight:700}.n{font-size:27px;font-weight:700;text-anchor:middle}.equation{font-size:38px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 02 · COUNT-ON</text><text x="70" y="116" class="heading">Keep 7; count five more</text><text x="70" y="154" class="sub">The starting seven is held, not counted again.</text>
  <rect x="64" y="190" width="1072" height="448" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="92" y="232" width="170" height="110" rx="22" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="177" y="272" class="label" text-anchor="middle">held start</text><text x="177" y="321" class="heading" text-anchor="middle">7</text>
  <line x1="286" y1="430" x2="1070" y2="430" stroke="#68707A" stroke-width="5" marker-end="url(#arrow)"/>
  <g stroke="#24312D" stroke-width="4"><path d="M332 410v40 M472 410v40 M612 410v40 M752 410v40 M892 410v40 M1032 410v40"/></g>
  <g class="n"><text x="332" y="486">7</text><text x="472" y="486">8</text><text x="612" y="486">9</text><text x="752" y="486">10</text><text x="892" y="486">11</text><text x="1032" y="486">12</text></g>
  <g fill="none" stroke="#087E8B" stroke-width="6" marker-end="url(#arrow)"><path d="M340 398Q402 300 464 398"/><path d="M480 398Q542 300 604 398"/><path d="M620 398Q682 300 744 398"/><path d="M760 398Q822 300 884 398"/><path d="M900 398Q962 300 1024 398"/></g>
  <g class="label" text-anchor="middle"><text x="402" y="326">+1</text><text x="542" y="326">+1</text><text x="682" y="326">+1</text><text x="822" y="326">+1</text><text x="962" y="326">+1</text></g>
  <g aria-label="exactly five tap bars"><rect x="368" y="535" width="68" height="38" rx="14" fill="#FFF3DF" stroke="#D97706" stroke-width="4"/><rect x="508" y="535" width="68" height="38" rx="14" fill="#FFF3DF" stroke="#D97706" stroke-width="4"/><rect x="648" y="535" width="68" height="38" rx="14" fill="#FFF3DF" stroke="#D97706" stroke-width="4"/><rect x="788" y="535" width="68" height="38" rx="14" fill="#FFF3DF" stroke="#D97706" stroke-width="4"/><rect x="928" y="535" width="68" height="38" rx="14" fill="#FFF3DF" stroke="#D97706" stroke-width="4"/></g><text x="682" y="612" class="label" text-anchor="middle">five increments · five landings · five tracking taps</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="105" y="731" class="equation">7 → 8 → 9 → 10 → 11 → 12</text><text x="1092" y="730" class="label" text-anchor="end">5 unit steps</text>
</svg>
