<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Treat a quick impression as a prediction, then verify it exactly</title>
  <desc id="desc">A small dotted prediction panel tentatively asks whether five eighths is greater than three fifths. A larger exact-check panel renames the fractions as twenty-four and twenty-five fortieths before stating the final order. Legacy labels RETRIEVE and VERIFY identify the two stages.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/>
  <rect x="90" y="170" width="360" height="440" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="4" stroke-dasharray="12 9"/><text x="270" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7652A8">PREDICTION · RETRIEVE</text><text x="270" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#18324A">5/8 ? 3/5</text><text x="270" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#5A6570">Tentative until checked.</text>
  <path d="M470 390h90" stroke="#7652A8" stroke-width="7" marker-end="url(#arrow)"/><text x="515" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#553A78">then check</text>
  <rect x="580" y="105" width="540" height="590" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5" stroke-dasharray="14 9"/><text x="850" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#12545A">EXACT CHECK · VERIFY</text><text x="850" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" fill="#18324A">3/5 = 24/40</text><text x="850" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" fill="#18324A">5/8 = 25/40</text><path d="M710 435h280" stroke="#18324A" stroke-width="4"/><text x="850" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#7A2525">24 &lt; 25</text><text x="850" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#287A55">5/8 &gt; 3/5</text>
</svg>
