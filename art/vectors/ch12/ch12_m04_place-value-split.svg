<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split three addends into hundreds, tens, and ones</title><desc id="desc">Three labeled place-value columns total the parts independently: hundreds make 1,000, tens make 200, and ones make 21. The recombination 1,000 plus 200 plus 21 equals 1,221.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Add like units, then recombine</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="150" width="320" height="410" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="235" y="215" font-size="25" font-weight="700">HUNDREDS</text><text x="235" y="305" font-size="31">300 + 500 + 200</text><path d="M125 345h220" stroke="#18324A" stroke-width="4"/><text x="235" y="430" font-size="42" font-weight="700">1,000</text><rect x="440" y="150" width="320" height="410" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="600" y="215" font-size="25" font-weight="700">TENS</text><text x="600" y="305" font-size="31">70 + 90 + 40</text><path d="M490 345h220" stroke="#18324A" stroke-width="4"/><text x="600" y="430" font-size="42" font-weight="700">200</text><rect x="805" y="150" width="320" height="410" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5"/><text x="965" y="215" font-size="25" font-weight="700">ONES</text><text x="965" y="305" font-size="31">8 + 6 + 7</text><path d="M855 345h220" stroke="#18324A" stroke-width="4"/><text x="965" y="430" font-size="42" font-weight="700">21</text><text x="600" y="660" font-size="42" font-weight="700" fill="#347C5A">1,000 + 200 + 21 = 1,221</text><text x="600" y="725" font-size="24" fill="#5A6570">21 ones may regroup as 2 tens and 1 one.</text></g></svg>
