<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Regroup fifteen as zero tens and fifteen ones, then subtract eight</title><desc id="desc">A written-work sequence aligns fifteen above zero eight, explicitly exchanges one ten and five ones for zero tens and fifteen ones, then subtracts eight ones to leave seven ones. The aligned result zero seven is labeled as seven.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Regroup in a written workspace</text><text x="64" y="110" font-size="24" fill="#52605A">One ten becomes ten ones; the value stays 15.</text><g transform="translate(70 180)"><rect width="290" height="390" rx="24" fill="#E7EEF8" stroke="#2764B8" stroke-width="6"/><g font-family="Consolas,monospace" font-size="64" text-anchor="end" fill="#24312D"><text x="215" y="120">15</text><text x="215" y="215">−08</text><path d="M70 245h165" stroke="#24312D" stroke-width="6"/><text x="215" y="335">□</text></g><text x="145" y="375" text-anchor="middle" font-size="22" fill="#52605A">aligned ones column</text></g><path d="M390 375H475" stroke="#7652A8" stroke-width="6" stroke-dasharray="7 11" marker-end="url(#a)"/><g transform="translate(500 180)"><rect width="300" height="390" rx="24" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="150" y="58" text-anchor="middle" font-size="23" font-weight="700">REGROUP</text><g font-size="31" text-anchor="middle" fill="#24312D"><text x="150" y="130">1 ten + 5 ones</text><text x="150" y="190">=</text><text x="150" y="250" font-weight="700">0 tens + 15 ones</text><text x="150" y="330" fill="#7652A8">same value: 15</text></g></g><path d="M830 375H900" stroke="#7652A8" stroke-width="6" stroke-dasharray="7 11" marker-end="url(#a)"/><g transform="translate(920 180)"><rect width="220" height="390" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><rect x="13" y="13" width="194" height="364" rx="17" fill="none" stroke="#287A55" stroke-width="3"/><g font-family="Consolas,monospace" text-anchor="end" font-size="57" fill="#24312D"><text x="175" y="120">15</text><text x="175" y="210">−08</text><path d="M45 238h145" stroke="#24312D" stroke-width="6"/><text x="175" y="325">07</text></g><text x="110" y="365" text-anchor="middle" font-size="22" font-weight="700">07 means 7</text></g><text x="600" y="675" text-anchor="middle" font-size="35" font-weight="700">15 ones − 8 ones = 7 ones</text></g></svg>
