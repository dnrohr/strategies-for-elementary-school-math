<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 9: See matching five-dot patterns and a pair</title><desc id="desc">A blue seven-card contains one familiar five-dot pattern and one pair. A hatched orange five-dot pattern is aligned beside it. A subtle matching band joins the two fives, leaving the pair visible.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><path d="M0 0v12" stroke="#D97706" stroke-width="5"/></pattern></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h1{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.m{font-size:32px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 09 · DOT CHUNKING</text><text x="70" y="116" class="h1">Match two familiar five-patterns</text><text x="70" y="154" class="s">The eye groups five with five before attending to the pair.</text><rect x="64" y="190" width="1072" height="460" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="110" y="250" width="455" height="300" rx="30" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="337" y="290" class="l" text-anchor="middle">the 7-card</text><path d="M135 320h265v200H135Z" fill="#F7FAFE" stroke="#2764B8" stroke-width="3" opacity=".9"/><path d="M425 320h110v200H425Z" fill="none" stroke="#2764B8" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="#2764B8" stroke="#174478" stroke-width="5"><circle cx="185" cy="365" r="25"/><circle cx="350" cy="365" r="25"/><circle cx="267" cy="420" r="25"/><circle cx="185" cy="475" r="25"/><circle cx="350" cy="475" r="25"/><circle cx="480" cy="390" r="27"/><circle cx="480" cy="460" r="27"/></g>
  <rect x="650" y="250" width="430" height="300" rx="30" fill="#FFF9EF" stroke="#D97706" stroke-width="5"/><text x="865" y="290" class="l" text-anchor="middle">the 5-card</text><path d="M730 320h270v200H730Z" fill="#FFFDF8" stroke="#D97706" stroke-width="3"/><g fill="url(#h)" stroke="#A95805" stroke-width="5"><circle cx="780" cy="365" r="25"/><circle cx="950" cy="365" r="25"/><circle cx="865" cy="420" r="25"/><circle cx="780" cy="475" r="25"/><circle cx="950" cy="475" r="25"/></g>
  <path d="M135 575v22h865v-22" fill="none" stroke="#287A55" stroke-width="6"/><text x="567" y="635" class="l" text-anchor="middle">matching five-patterns = 10 · outlined pair = 2</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 = (5 + 2) + 5 = 10 + 2 = 12</text>
</svg>
