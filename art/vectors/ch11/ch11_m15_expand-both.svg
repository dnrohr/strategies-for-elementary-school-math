<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Expand both factors into four exact area regions</title><desc id="desc">A proportioned area model splits height 27 into 20 and 7 and width 46 into 40 and 6. Its four exact products are 800, 120, 280, and 42. Their sum is 1,242.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#7652A8" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">(20 + 7)(40 + 6)</text><rect x="250" y="150" width="640" height="370" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><rect x="890" y="150" width="96" height="370" fill="#F2B35F" stroke="#18324A" stroke-width="5"/><rect x="250" y="520" width="640" height="129.5" fill="url(#h)" stroke="#18324A" stroke-width="5"/><rect x="890" y="520" width="96" height="129.5" fill="#DDBBE8" stroke="#18324A" stroke-width="5"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="570" y="335" font-size="40" font-weight="700">20×40 = 800</text><text x="938" y="335" font-size="25" font-weight="700">20×6</text><text x="938" y="375" font-size="25">= 120</text><text x="570" y="590" font-size="35" font-weight="700">7×40 = 280</text><text x="938" y="580" font-size="24" font-weight="700">7×6</text><text x="938" y="620" font-size="24">= 42</text><text x="600" y="740" font-size="35" font-weight="700" fill="#347C5A">800 + 120 + 280 + 42 = 1,242</text></g><text x="570" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#5A6570">Four regions preserve one 27×46 rectangle.</text><g data-qa-detail="small-corner-callout"><path d="M930 540H1030" stroke="#7652A8" stroke-width="4"/><rect x="1015" y="475" width="155" height="115" rx="18" fill="#FFFDF8" stroke="#7652A8" stroke-width="4"/><text x="1092" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">small corner</text><text x="1092" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">7 × 6 = 42</text></g></svg>
