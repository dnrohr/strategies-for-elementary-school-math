<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 7 double seven subtract two</title><desc id="d">Three callouts improve the visibility of removed dots, group identity, and the correction label.</desc><image href="../../../art/vectors/ch01/ch01_m07_double-seven-subtract-two.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><ellipse cx="965" cy="405" rx="160" ry="120"/><rect x="570" y="250" width="520" height="300" rx="28"/><rect x="830" y="545" width="270" height="65" rx="16"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1080" cy="340" r="28"/><circle cx="600" cy="270" r="28"/><circle cx="1110" cy="575" r="28"/></g><g fill="#fff" font-size="28"><text x="1080" y="350">1</text><text x="600" y="280">2</text><text x="1110" y="585">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 07 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Keep removed dots visible</tspan><tspan x="1240" dy="32">Place translucent X marks over filled</tspan><tspan x="1240" dy="29">dots so the original 14 remains clear.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Clarify second seven</tspan><tspan x="1240" dy="32">Use stable tint/pattern, not only</tspan><tspan x="1240" dy="29">the outer frame.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Attach correction label</tspan><tspan x="1240" dy="32">Move the label beside the crossed</tspan><tspan x="1240" dy="29">pair or remove the tiny legend.</tspan></text></g>
</svg>
