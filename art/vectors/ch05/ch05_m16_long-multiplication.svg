<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Written long multiplication with aligned partial products</title><desc id="desc">Twelve times eleven is written in columns; the ones partial product is twelve, the tens partial product is 120 with an explicit place-value zero, and their sum is 132.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="75" font-size="38" font-weight="700">Partial products by place value</text><g font-family="Consolas,monospace" font-size="64" text-anchor="end"><text x="650" y="220">12</text><text x="650" y="310">×11</text><path d="M420 340h270" stroke="#24312D" stroke-width="6"/><text x="650" y="420">12</text><text x="650" y="500">120</text><path d="M420 530h270" stroke="#24312D" stroke-width="6"/><text x="650" y="620">132</text></g><text x="840" y="500" font-size="25" fill="#7652A8">0 marks the tens place</text></g></svg>
