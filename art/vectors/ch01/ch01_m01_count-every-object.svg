<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Method 1: Count every object to solve seven plus five</title>
  <desc id="desc">Exactly twelve numbered counters appear in two groups: seven solid blue counters numbered one through seven and five orange hatched counters numbered eight through twelve. One ordered touch trail visits each counter once, ending with the last word twelve. Seven plus five equals twelve.</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><line x1="0" y1="0" x2="0" y2="12" stroke="#D97706" stroke-width="5"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:23px;font-weight:700}.num{font-size:25px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.num.dark{fill:#24312D}.equation{font-size:38px;font-weight:700}.blue{fill:#2764B8;stroke:#174478;stroke-width:5}.orange{fill:url(#hatch);stroke:#A95805;stroke-width:5}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 01 · COUNT-ALL</text><text x="70" y="116" class="heading">Count every object</text><text x="70" y="154" class="sub">Touch each counter once; the final count word names the total.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <path d="M135 410 C190 330 250 330 305 410 S420 490 475 410 S590 330 645 410 S760 490 815 410 S930 330 985 410" fill="none" stroke="#087E8B" stroke-width="7" stroke-linecap="round" stroke-dasharray="5 13" marker-end="url(#arrow)"/>
  <g aria-label="first group of seven solid counters"><circle class="blue" cx="135" cy="350" r="39"/><circle class="blue" cx="275" cy="350" r="39"/><circle class="blue" cx="415" cy="350" r="39"/><circle class="blue" cx="555" cy="350" r="39"/><circle class="blue" cx="695" cy="350" r="39"/><circle class="blue" cx="835" cy="350" r="39"/><circle class="blue" cx="975" cy="350" r="39"/><text class="num" x="135" y="351">1</text><text class="num" x="275" y="351">2</text><text class="num" x="415" y="351">3</text><text class="num" x="555" y="351">4</text><text class="num" x="695" y="351">5</text><text class="num" x="835" y="351">6</text><text class="num" x="975" y="351">7</text></g>
  <g aria-label="second group of five hatched counters"><circle class="orange" cx="275" cy="500" r="39"/><circle class="orange" cx="415" cy="500" r="39"/><circle class="orange" cx="555" cy="500" r="39"/><circle class="orange" cx="695" cy="500" r="39"/><circle class="orange" cx="835" cy="500" r="39"/><text class="num dark" x="275" y="501">8</text><text class="num dark" x="415" y="501">9</text><text class="num dark" x="555" y="501">10</text><text class="num dark" x="695" y="501">11</text><text class="num dark" x="835" y="501">12</text></g>
  <path d="M96 285v-28h918v28 M218 563v28h675v-28" fill="none" stroke="#24312D" stroke-width="4"/><text x="555" y="242" class="label" text-anchor="middle">first group · 7</text><text x="555" y="624" class="label" text-anchor="middle">second group · 5</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="105" y="731" class="equation">7 + 5 = 12</text><text x="1092" y="730" class="label" text-anchor="end">last word: twelve</text>
</svg>
