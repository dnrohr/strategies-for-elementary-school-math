<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 5 make ten</title><desc id="d">Three polish callouts add visible motion, tighten residual alignment, and reduce the equation rail.</desc><image href="../../../art/vectors/ch01/ch01_m05_make-ten.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="430" y="430" width="460" height="180" rx="20"/><rect x="925" y="280" width="200" height="300" rx="24"/><rect x="70" y="680" width="1060" height="80" rx="20"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="850" cy="450" r="28"/><circle cx="1110" cy="300" r="28"/><circle cx="1100" cy="690" r="28"/></g><g fill="#fff" font-size="28"><text x="850" y="460">1</text><text x="1110" y="310">2</text><text x="1100" y="700">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 05 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Show the move</tspan><tspan x="1240" dy="32">Add a faint source tray or three</tspan><tspan x="1240" dy="29">short trajectories into the frame.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Tighten the residual pair</tspan><tspan x="1240" dy="32">Align it with the frame; reduce the</tspan><tspan x="1240" dy="29">feeling of a separate example.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Let the model lead</tspan><tspan x="1240" dy="32">Lighten the long equation rail so</tspan><tspan x="1240" dy="29">the ten-frame remains primary.</tspan></text></g>
</svg>
