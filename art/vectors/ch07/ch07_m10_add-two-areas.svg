<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Compose a seven-by-nine area from two proportional adjacent rectangles</title><desc id="desc">A proportionally exact seven-by-five rectangle of area 35 and seven-by-four rectangle of area 28 meet along one boundary with no gap or overlap. Equal side units use the same scale and their union is 63 square units.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Adjacent areas add</text><g transform="translate(180 0) scale(.7 1)"><rect x="150" y="145" width="500" height="490" fill="#E7EEF8" stroke="#2764B8" stroke-width="7" vector-effect="non-scaling-stroke"/><rect x="650" y="145" width="400" height="490" fill="#F7EFE3" stroke="#D97706" stroke-width="7" vector-effect="non-scaling-stroke"/></g><text x="460" y="340" font-size="39" font-weight="700">7 × 5</text><text x="460" y="405" font-size="55" font-weight="700">35</text><text x="775" y="340" font-size="39" font-weight="700">7 × 4</text><text x="775" y="405" font-size="55" font-weight="700">28</text><path d="M635 155v470" stroke="#24312D" stroke-width="5"/><text x="600" y="710" font-size="38" font-weight="700">35 + 28 = 63 square units</text></g>
</svg>
