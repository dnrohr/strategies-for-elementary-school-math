<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Twenty-seven tap marks form bands of ten, ten, and seven</title><desc id="desc">Exactly 27 outlined tap circles are separated into three bands containing 10, 10, and 7 marks. Each tap tracks one group of 46, not a single unit. The bands equal 460, 460, and 322, totaling 1,242.</desc><defs><circle id="t" r="13" fill="#FFFDF8" stroke="#7652A8" stroke-width="5"/></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Tap once per group of 46</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="21" fill="#5A6570">Tap circles track groups; no body or hand anatomy is implied.</text><g transform="translate(90 230)"><use href="#t"/><use href="#t" x="38"/><use href="#t" x="76"/><use href="#t" x="114"/><use href="#t" x="152"/><use href="#t" x="190"/><use href="#t" x="228"/><use href="#t" x="266"/><use href="#t" x="304"/><use href="#t" x="342"/></g><g transform="translate(470 230)"><use href="#t"/><use href="#t" x="38"/><use href="#t" x="76"/><use href="#t" x="114"/><use href="#t" x="152"/><use href="#t" x="190"/><use href="#t" x="228"/><use href="#t" x="266"/><use href="#t" x="304"/><use href="#t" x="342"/></g><g transform="translate(850 230)"><use href="#t"/><use href="#t" x="38"/><use href="#t" x="76"/><use href="#t" x="114"/><use href="#t" x="152"/><use href="#t" x="190"/><use href="#t" x="228"/></g><g fill="none" stroke="#176B73" stroke-width="5"><path d="M75 285v45h380v-45M455 285v45h380v-45M835 285v45h270v-45"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="265" y="390" font-size="31" font-weight="700">10 taps → 460</text><text x="645" y="390" font-size="31" font-weight="700">10 taps → 460</text><text x="970" y="390" font-size="31" font-weight="700">7 taps → 322</text><text x="600" y="555" font-size="43" font-weight="700">460 + 460 + 322</text><text x="600" y="635" font-size="48" font-weight="700" fill="#347C5A">= 1,242</text><text x="600" y="725" font-size="25" fill="#5A6570">The motor cue tracks 10 + 10 + 7; it does not alter the multiplication.</text></g></svg>
