<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">An external relation map records three exact common-unit stages</title>
  <desc id="desc">Three generous connected cards record the original three fractions, their equivalent twelfths, and the final improper, simplified, and mixed-number forms. The map does not claim to picture a non-sensory inner experience.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">EXTERNAL RELATION MAP · NOT AN INNER-SCENE CLAIM</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="130" y="120" width="940" height="150" rx="30" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="200" y="165" text-anchor="start" font-size="22" font-weight="700" fill="#5A6570">1 · START WITH THREE DIFFERENT UNITS</text><text x="600" y="225" font-size="48" font-weight="700" fill="#18324A">3/4 + 2/3 + 5/12</text>
    <path d="M600 280V330" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/>
    <rect x="130" y="345" width="940" height="165" rx="30" fill="#F4EBFA" stroke="#7652A8" stroke-width="5" stroke-dasharray="12 8"/><text x="200" y="390" text-anchor="start" font-size="22" font-weight="700" fill="#553A78">2 · RENAME EACH PART IN TWELFTHS</text><text x="600" y="470" font-size="46" font-weight="700" fill="#18324A">9/12 + 8/12 + 5/12</text>
    <path d="M600 520V570" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/>
    <rect x="130" y="585" width="940" height="150" rx="30" fill="#DDEDE4" stroke="#287A55" stroke-width="6"/><text x="200" y="630" text-anchor="start" font-size="22" font-weight="700" fill="#12545A">3 · ADD, SIMPLIFY, AND NAME THE MIXED NUMBER</text><text x="600" y="695" font-size="48" font-weight="700" fill="#287A55">22/12 = 11/6 = 1 5/6</text>
  </g>
</svg>
