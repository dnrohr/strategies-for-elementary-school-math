<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Add fifty as a benchmark and correct by subtracting two</title><desc id="desc">Forty-eight temporarily becomes fifty with an explicit extra two tag. Thirty-seven plus fifty reaches eighty-seven; a red two-unit correction returns to the double-outlined result eighty-five.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="68" font-size="38" font-weight="700" fill="#24312D">Use 50, then undo the extra 2</text><rect x="80" y="180" width="260" height="130" rx="24" fill="#F7EFE3" stroke="#D97706" stroke-width="6"/><text x="210" y="260" font-size="43" font-weight="700">48 → 50</text><text x="210" y="350" font-size="25" fill="#C2413B">temporary extra: +2</text><path d="M370 245H520" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 11" marker-end="url(#a)"/><rect x="555" y="180" width="260" height="130" rx="24" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="685" y="260" font-size="40" font-weight="700">37 + 50 = 87</text><path d="M845 245H965" stroke="#C2413B" stroke-width="7" marker-end="url(#a)"/><text x="905" y="210" font-size="29" font-weight="700" fill="#C2413B">−2</text><rect x="990" y="160" width="160" height="170" rx="30" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><rect x="1002" y="172" width="136" height="146" rx="21" fill="none" stroke="#287A55" stroke-width="3"/><text x="1070" y="270" font-size="58" font-weight="700">85</text><path d="M180 470H1020" stroke="#24312D" stroke-width="5"/><path d="M180 450v40M980 450v40M1020 450v40" stroke="#24312D" stroke-width="5"/><text x="180" y="535" font-size="24">37</text><text x="980" y="535" font-size="24">85</text><text x="1020" y="535" font-size="24">87</text><path d="M180 430Q600 350 1020 430" fill="none" stroke="#D97706" stroke-width="6"/><path d="M1020 405Q1000 360 980 405" fill="none" stroke="#C2413B" stroke-width="6"/><text x="600" y="680" font-size="36" font-weight="700">37 + 50 − 2 = 85</text></g></svg>
