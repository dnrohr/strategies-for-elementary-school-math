<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Eleven rightward jumps of twelve reach one hundred thirty-two</title><desc id="desc">Two enlarged number-line rows show six jumps and then five jumps. Every rightward arc has a small terminal arrowhead and every landing is labeled with its multiple of twelve, so all eleven equal jumps are readable.</desc><rect width="1200" height="800" fill="#F8F2E7"/><defs><marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#176B73"/></marker></defs><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Eleven equal +12 jumps, shown in two readable rows</text>
