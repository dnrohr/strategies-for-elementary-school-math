<svg data-qa-image-pass="2026-10-01" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Three exact base-ten block piles combine and regroup to 1,221</title>
  <desc id="desc">Three source cards show 378 as 3 hundreds, 7 tens, and 8 ones; 596 as 5 hundreds, 9 tens, and 6 ones; and 247 as 2 hundreds, 4 tens, and 7 ones. Combining gives 10 hundreds, 20 tens, and 21 ones. Exact exchanges produce 1 thousand, 2 hundreds, 2 tens, and 1 one.</desc>
  <rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="60" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Build three piles, then regroup</text>
  <text x="60" y="100" font-family="Arial,sans-serif" font-size="23" fill="#5A6570">Representative block shapes · multiplicity labels give every exact count</text>
  <defs>
    <pattern id="hundred-grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#176B73" stroke-width="1.4"/></pattern>
  </defs>
  <g font-family="Arial,sans-serif" fill="#18324A">
    <g transform="translate(60 135)"><rect width="340" height="220" rx="24" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="170" y="48" text-anchor="middle" font-size="32" font-weight="700">378</text><rect x="35" y="82" width="62" height="62" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="35" y="82" width="62" height="62" fill="url(#hundred-grid)"/><text x="66" y="178" text-anchor="middle" font-size="23" font-weight="700">3 × 100</text><rect x="145" y="82" width="20" height="62" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><text x="155" y="178" text-anchor="middle" font-size="23" font-weight="700">7 × 10</text><circle cx="265" cy="113" r="11" fill="#FFFDF8" stroke="#7652A8" stroke-width="3"/><text x="265" y="178" text-anchor="middle" font-size="23" font-weight="700">8 × 1</text></g>
    <g transform="translate(430 135)"><rect width="340" height="220" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="4"/><text x="170" y="48" text-anchor="middle" font-size="32" font-weight="700">596</text><rect x="35" y="82" width="62" height="62" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="35" y="82" width="62" height="62" fill="url(#hundred-grid)"/><text x="66" y="178" text-anchor="middle" font-size="23" font-weight="700">5 × 100</text><rect x="145" y="82" width="20" height="62" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><text x="155" y="178" text-anchor="middle" font-size="23" font-weight="700">9 × 10</text><circle cx="265" cy="113" r="11" fill="#FFFDF8" stroke="#7652A8" stroke-width="3"/><text x="265" y="178" text-anchor="middle" font-size="23" font-weight="700">6 × 1</text></g>
    <g transform="translate(800 135)"><rect width="340" height="220" rx="24" fill="#FFFDF8" stroke="#7652A8" stroke-width="4" stroke-dasharray="12 8"/><text x="170" y="48" text-anchor="middle" font-size="32" font-weight="700">247</text><rect x="35" y="82" width="62" height="62" fill="#B9D8D5" stroke="#18324A" stroke-width="3"/><rect x="35" y="82" width="62" height="62" fill="url(#hundred-grid)"/><text x="66" y="178" text-anchor="middle" font-size="23" font-weight="700">2 × 100</text><rect x="145" y="82" width="20" height="62" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><text x="155" y="178" text-anchor="middle" font-size="23" font-weight="700">4 × 10</text><circle cx="265" cy="113" r="11" fill="#FFFDF8" stroke="#7652A8" stroke-width="3"/><text x="265" y="178" text-anchor="middle" font-size="23" font-weight="700">7 × 1</text></g>
    <rect x="60" y="395" width="310" height="230" rx="24" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="215" y="440" text-anchor="middle" font-size="24" font-weight="700">COMBINE LIKE UNITS</text><text x="215" y="495" text-anchor="middle" font-size="27">10 hundreds</text><text x="215" y="540" text-anchor="middle" font-size="27">20 tens</text><text x="215" y="585" text-anchor="middle" font-size="27">21 ones</text>
    <path d="M385 508H425" stroke="#7652A8" stroke-width="5"/><path d="M425 499l18 9-18 9z" fill="#7652A8"/>
    <rect x="450" y="395" width="390" height="230" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="4" stroke-dasharray="11 8"/><text x="645" y="438" text-anchor="middle" font-size="24" font-weight="700">EXCHANGE IN ORDER</text><text x="480" y="485" font-size="22">1 · 21 ones → 2 tens + 1 one</text><text x="480" y="530" font-size="22">2 · 22 tens → 2 hundreds + 2 tens</text><text x="480" y="575" font-size="22">3 · 12 hundreds →</text><text x="515" y="605" font-size="22">1 thousand + 2 hundreds</text>
