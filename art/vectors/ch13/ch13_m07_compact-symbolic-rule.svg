<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Unpack the common denominator rule in two labeled rows</title><desc id="desc">One straight row multiplies two thirds by eight eighths to make sixteen twenty-fourths. A second straight row multiplies five eighths by three thirds to make fifteen twenty-fourths. The rows converge only after both units match.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Rename each fraction; combine only matching units</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="70" y="160" width="300" height="150" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="220" y="252" font-size="43" font-weight="700">2/3</text><text x="470" y="252" font-size="34">× 8/8</text><path d="M370 235H410 M535 235H590" stroke="#176B73" stroke-width="5"/><rect x="610" y="160" width="450" height="150" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="835" y="252" font-size="40" font-weight="700">= 16/24</text>
  <rect x="70" y="370" width="300" height="150" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="220" y="462" font-size="43" font-weight="700">5/8</text><text x="470" y="462" font-size="34">× 3/3</text><path d="M370 445H410 M535 445H590" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><rect x="610" y="370" width="450" height="150" rx="24" fill="#FFF3DF" stroke="#C66A12" stroke-width="5"/><text x="835" y="462" font-size="40" font-weight="700">= 15/24</text></g>
  <path d="M835 540v35" stroke="#7652A8" stroke-width="4"/><rect x="320" y="590" width="560" height="115" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#347C5A">16/24 + 15/24 = 31/24</text><text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">The denominator is 3 × 8 = 24—not 3 + 8.</text></svg>
