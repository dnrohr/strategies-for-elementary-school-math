<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Three aligned beats track three groups of five</title><desc id="desc">Three equal group cards each contain exactly five counters. Three identical beat markers sit directly above the centers of the cards, and the spoken values five, ten, and fifteen align below them.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Three beats align with three groups</text>
  <path d="M170 190H1030" stroke="#7652A8" stroke-width="4"/><g fill="#7652A8"><circle cx="300" cy="190" r="16"/><circle cx="600" cy="190" r="16"/><circle cx="900" cy="190" r="16"/></g><g font-family="Arial,sans-serif" fill="#18324A" font-size="24" font-weight="700" text-anchor="middle"><text x="300" y="150">beat 1</text><text x="600" y="150">beat 2</text><text x="900" y="150">beat 3</text></g>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="175" y="245" width="250" height="300" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><g fill="#347C5A" stroke="#18324A" stroke-width="3"><circle cx="240" cy="330" r="24"/><circle cx="360" cy="330" r="24"/><circle cx="300" cy="400" r="24"/><circle cx="240" cy="470" r="24"/><circle cx="360" cy="470" r="24"/></g><text x="300" y="595" font-size="31" font-weight="700">five</text><rect x="475" y="245" width="250" height="300" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><g fill="#347C5A" stroke="#18324A" stroke-width="3"><circle cx="540" cy="330" r="24"/><circle cx="660" cy="330" r="24"/><circle cx="600" cy="400" r="24"/><circle cx="540" cy="470" r="24"/><circle cx="660" cy="470" r="24"/></g><text x="600" y="595" font-size="31" font-weight="700">ten</text><rect x="775" y="245" width="250" height="300" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><g fill="#347C5A" stroke="#18324A" stroke-width="3"><circle cx="840" cy="330" r="24"/><circle cx="960" cy="330" r="24"/><circle cx="900" cy="400" r="24"/><circle cx="840" cy="470" r="24"/><circle cx="960" cy="470" r="24"/></g><text x="900" y="595" font-size="31" font-weight="700">fifteen</text></g>
  <text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#347C5A">5 + 5 + 5 = 15</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#5A6570">three quarters selected · one quarter left</text></svg>
