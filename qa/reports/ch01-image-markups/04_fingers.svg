<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 4 fingers as counters</title><desc id="d">Four callouts address visual style, movement cues, unit-form consistency, and hand scale.</desc><image href="../../../art/composites/ch01/ch01_m04_fingers-make-ten.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="20" y="120" width="1160" height="560" rx="24"/><ellipse cx="600" cy="300" rx="170" ry="120"/><circle cx="1110" cy="415" r="85"/><path d="M20 650H1180"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1150" cy="140" r="28"/><circle cx="780" cy="245" r="28"/><circle cx="1085" cy="340" r="28"/><circle cx="1100" cy="650" r="28"/></g><g fill="#fff" font-size="28"><text x="1150" y="150">1</text><text x="780" y="255">2</text><text x="1085" y="350">3</text><text x="1100" y="660">4</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 04 · MARKUP</text><text x="1240" y="125" font-size="22"><tspan font-weight="700">1 · Aesthetic fit</tspan><tspan x="1240" dy="30">Unify the photoreal raster with the</tspan><tspan x="1240" dy="27">book's illustrated/vector voice.</tspan><tspan x="1240" dy="54" font-weight="700">2 · Movement clarity</tspan><tspan x="1240" dy="30">Higher-contrast cues should show</tspan><tspan x="1240" dy="27">where the three fingers came from.</tspan><tspan x="1240" dy="54" font-weight="700">3 · Keep unit form</tspan><tspan x="1240" dy="30">Two fingers becoming two counters</tspan><tspan x="1240" dy="27">needs explanation or redesign.</tspan><tspan x="1240" dy="54" font-weight="700">4 · Normalize scale</tspan><tspan x="1240" dy="30">Align wrists and hand size across</tspan><tspan x="1240" dy="27">all three panels.</tspan></text></g>
</svg>
