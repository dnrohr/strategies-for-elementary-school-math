<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sparse three-fraction common-unit transformation</title><desc id="desc">On an open neutral field, an equation transforms three fourths plus two thirds plus five twelfths into 9 plus 8 plus 5 twelfths, then 22 twelfths, then 11 sixths or one and five sixths. No concrete or sensory metaphor is shown.</desc><defs><marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l18 9-18 9z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="600" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">No bar, voice, or imagined workspace is required.</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="600" y="245" font-size="49" font-weight="700">3/4 + 2/3 + 5/12</text><path d="M600 285v65" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/><text x="600" y="435" font-size="46" font-weight="700">9/12 + 8/12 + 5/12</text><path d="M600 475v60" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/><text x="600" y="630" font-size="51" font-weight="700" fill="#347C5A">22/12 = 11/6 = 1 5/6</text><text x="600" y="735" font-size="23" fill="#5A6570">Same common-unit mathematics; reported format may differ or be absent.</text></g>
</svg>
