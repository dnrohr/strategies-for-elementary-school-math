<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Calculate the compact fraction-addition rule in two labeled rows</title><desc id="desc">The numerator row calculates two times eight plus five times three as sixteen plus fifteen, or thirty-one. The separate denominator row calculates three times eight as twenty-four, not three plus eight. The exact formula then gives thirty-one twenty-fourths, equal to one and seven twenty-fourths.</desc>
<rect width="1200" height="800" fill="#F8F2E7"/>
<g font-family="Arial,sans-serif" fill="#18324A">
<text x="70" y="85" font-size="34" font-weight="700">Unpack the compact rule</text>
<rect x="70" y="150" width="1060" height="190" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/>
<text x="115" y="205" font-size="25" font-weight="700">NUMERATOR · count the renamed pieces</text>
<text x="600" y="270" text-anchor="middle" font-size="43" font-weight="700">2 × 8 + 5 × 3 = 16 + 15 = 31</text><text x="600" y="315" text-anchor="middle" font-size="25">2/3 × 8/8 = 16/24; 5/8 × 3/3 = 15/24</text>
<rect x="70" y="380" width="1060" height="160" rx="28" fill="#FFF3DF" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/>
<text x="115" y="435" font-size="25" font-weight="700">DENOMINATOR · name the common unit</text>
<text x="600" y="500" text-anchor="middle" font-size="43" font-weight="700">3 × 8 = 24</text>
<rect x="70" y="585" width="1060" height="125" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/>
<text x="600" y="660" text-anchor="middle" font-size="35" font-weight="700">(2 × 8 + 5 × 3)/(3 × 8) = 31/24 = 1 7/24</text>
<text x="600" y="760" text-anchor="middle" font-size="25">Multiply denominators: 3 × 8 = 24—not 3 + 8.</text></g></svg>
