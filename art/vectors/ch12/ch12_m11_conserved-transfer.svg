<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Four units move from two hundred forty-seven to five hundred ninety-six</title><desc id="desc">Before and after equations show four separate units leaving 247 and landing at 596. Source and destination dots and a thin connector make the direction explicit: 596 gains four while 247 loses four, preserving 1,221.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Move 4 from 247 to 596; preserve the total</text>
  <rect x="85" y="145" width="1030" height="150" rx="26" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="600" y="238" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="43" font-weight="700">378 + 596 + 247 = 1,221</text>
  <circle cx="500" cy="335" r="10" fill="#176B73"/><circle cx="785" cy="335" r="10" fill="#C66A12"/><path d="M775 360Q645 500 510 360" fill="none" stroke="#7652A8" stroke-width="5" stroke-dasharray="11 8"/>
  <g fill="#F2B35F" stroke="#18324A" stroke-width="2"><circle cx="710" cy="430" r="14"/><circle cx="670" cy="450" r="14"/><circle cx="630" cy="450" r="14"/><circle cx="590" cy="430" r="14"/></g>
  <text x="785" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#8A450D">source: 247 − 4</text><text x="500" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#12545A">destination: 596 + 4</text>
  <rect x="85" y="515" width="1030" height="150" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="608" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="43" font-weight="700">378 + 600 + 243 = 1,221</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">+4 and −4 cancel, so the sum is conserved.</text><g data-qa-detail="destination-head"><path d="M525 355l-17 9 17 9z" fill="#7652A8"/></g></svg>
