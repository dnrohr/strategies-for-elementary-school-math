<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Exact staged place-map trades from raw sums to 1,221</title><desc id="desc">Four sequential states show the corrected regrouping. Raw counts are 10 hundreds, 20 tens, 21 ones. Trading 20 ones makes 10 hundreds, 22 tens, 1 one. Trading 20 tens makes 12 hundreds, 2 tens, 1 one. Trading 10 hundreds makes 1 thousand, 2 hundreds, 2 tens, 1 one. Three separate arrows connect the four states.</desc><defs><marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l18 9-18 9z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="60" y="75" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">Trade in stages—never skip a place</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><rect x="45" y="145" width="245" height="435" rx="24" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="168" y="195" text-anchor="middle" font-size="22" font-weight="700">1 · RAW SUMS</text><text x="85" y="285" font-size="25">10 hundreds</text><text x="85" y="365" font-size="25">20 tens</text><text x="85" y="445" font-size="25">21 ones</text>
  <rect x="335" y="145" width="245" height="435" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="458" y="195" text-anchor="middle" font-size="22" font-weight="700">2 · TRADE ONES</text><text x="375" y="285" font-size="25">10 hundreds</text><text x="375" y="365" font-size="25">22 tens</text><text x="375" y="445" font-size="25">1 one</text><text x="458" y="530" text-anchor="middle" font-size="20" fill="#8A4308">20 ones → 2 tens</text>
  <rect x="625" y="145" width="245" height="435" rx="24" fill="#FFFDF8" stroke="#7652A8" stroke-width="5"/><text x="748" y="195" text-anchor="middle" font-size="22" font-weight="700">3 · TRADE TENS</text><text x="665" y="285" font-size="25">12 hundreds</text><text x="665" y="365" font-size="25">2 tens</text><text x="665" y="445" font-size="25">1 one</text><text x="748" y="530" text-anchor="middle" font-size="20" fill="#553A78">20 tens → 2 hundreds</text>
  <rect x="915" y="145" width="245" height="435" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="1038" y="185" text-anchor="middle" font-size="20" font-weight="700">4 · TRADE</text><text x="1038" y="215" text-anchor="middle" font-size="20" font-weight="700">HUNDREDS</text><text x="950" y="285" font-size="24">1 thousand</text><text x="950" y="350" font-size="24">2 hundreds</text><text x="950" y="415" font-size="24">2 tens</text><text x="950" y="480" font-size="24">1 one</text><text x="1038" y="530" text-anchor="middle" font-size="19" fill="#12545A">10 hundreds → 1 thousand</text></g>
  <path d="M297 365h25" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/><path d="M587 365h25" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/><path d="M877 365h25" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/>
  <text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">1 thousand + 2 hundreds + 2 tens + 1 one = 1,221</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5A6570">Every state represents the same total.</text>
</svg>
