<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Chapter 1 opening picture</title><desc id="d">The opening picture is annotated with three improvement callouts.</desc>
  <image href="../../../art/vectors/ch01/seven-plus-five.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><ellipse cx="885" cy="390" rx="210" ry="125"/><rect x="78" y="235" width="430" height="420" rx="28"/><rect x="45" y="25" width="760" height="82" rx="18"/></g>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1080" cy="300" r="28"/><circle cx="505" cy="250" r="28"/><circle cx="805" cy="70" r="28"/></g><g fill="#fff" font-size="28"><text x="1080" y="310">1</text><text x="505" y="260">2</text><text x="805" y="80">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">OPENING · IMPROVEMENTS</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Route accuracy</tspan><tspan x="1240" dy="32">Show five separate +1 intervals;</tspan><tspan x="1240" dy="29">the single arch reads as one jump.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Faster quantity recognition</tspan><tspan x="1240" dy="32">Use a five-pattern + two for 7</tspan><tspan x="1240" dy="29">and a familiar five-pattern for 5.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Quieter book aesthetic</tspan><tspan x="1240" dy="32">Reduce the repeated in-image title;</tspan><tspan x="1240" dy="29">let the two routes lead.</tspan></text></g>
</svg>
