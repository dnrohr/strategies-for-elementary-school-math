<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Twenty-seven equal jumps of forty-six grouped at ten, twenty, and twenty-seven</title><desc id="desc">A progress line contains exactly 27 evenly spaced group ticks. Brackets group ticks 1 through 10, 11 through 20, and 21 through 27. Milestones are labeled 10 equals 460, 20 equals 920, and 27 equals 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Skip-count in equal +46 beats</text><text x="70" y="135" font-family="Arial,sans-serif" font-size="25" fill="#5A6570">Ticks count groups; they do not depict 1,242 objects.</text><path d="M90 380H1116" stroke="#18324A" stroke-width="7"/><path d="M128 350v60M166 350v60M204 350v60M242 350v60M280 350v60M318 350v60M356 350v60M394 350v60M432 350v60M470 340v80M508 350v60M546 350v60M584 350v60M622 350v60M660 350v60M698 350v60M736 350v60M774 350v60M812 350v60M850 340v80M888 350v60M926 350v60M964 350v60M1002 350v60M1040 350v60M1078 350v60M1116 340v80" stroke="#176B73" stroke-width="5"/><g fill="none" stroke="#7652A8" stroke-width="5"><path d="M109 300v-35h380v35M489 300v-35h380v35M869 300v-35h266v35"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="299" y="235" font-size="25">groups 1–10</text><text x="679" y="235" font-size="25">groups 11–20</text><text x="1002" y="235" font-size="25">groups 21–27</text><text x="470" y="485" font-size="29" font-weight="700">10 → 460</text><text x="850" y="485" font-size="29" font-weight="700">20 → 920</text><text x="1116" y="485" font-size="29" font-weight="700">27 → 1,242</text><text x="600" y="625" font-size="39" font-weight="700" fill="#347C5A">27 equal jumps × 46 = 1,242</text><text x="600" y="700" font-size="25" fill="#5A6570">460 + 460 + 322 = 1,242</text></g></svg>
