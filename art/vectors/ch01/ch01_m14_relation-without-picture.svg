<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 14: Recognize the relation seven plus five equals ten plus two equals twelve</title>
  <desc id="desc">A sparse abstract network contains only three symbolic nodes: seven plus five, ten plus two, and twelve. Dotted connectors label the same-total relation and the fact that the sum is two more than ten. No objects, number line, fingers, or sensory imagery appear.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:22px;font-weight:700}.node{font-size:46px;font-weight:700;text-anchor:middle}.answer{font-size:72px;font-weight:700;fill:#287A55;text-anchor:middle}.math{font-size:38px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 14 · ABSTRACT RELATION</text><text x="70" y="116" class="heading">A relation, without a scene</text><text x="70" y="154" class="sub">The mathematics is visible here; the account describes no picture or sound.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="110" y="318" width="280" height="160" rx="28" fill="#E9F0FA" stroke="#2764B8" stroke-width="6"/><text x="250" y="416" class="node">7 + 5</text>
  <path d="M420 398h178" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="4 13" marker-end="url(#arrow)"/><text x="509" y="352" class="label" text-anchor="middle">same total</text>
  <rect x="630" y="318" width="280" height="160" rx="28" fill="#F1EAF8" stroke="#7652A8" stroke-width="6"/><text x="770" y="416" class="node">10 + 2</text>
  <path d="M770 500v54h198" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="4 13" marker-end="url(#arrow)"/><text x="854" y="590" class="label" text-anchor="middle">two more than ten</text>
  <rect x="940" y="318" width="160" height="160" rx="34" fill="#E6F2EA" stroke="#287A55" stroke-width="7"/><rect x="954" y="332" width="132" height="132" rx="25" fill="none" stroke="#287A55" stroke-width="4"/><text x="1020" y="423" class="answer">12</text>
  <text x="600" y="255" class="label" text-anchor="middle">symbolic nodes only · no sensory objects</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 = 10 + 2 = 12</text>
</svg>
