<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Five equal shares satisfy the whole-number remainder condition</title>
  <desc id="desc">Five identical bowls each contain four whole candies, and a separate remainder plate contains exactly three. The equation twenty-three equals five times four plus three and the condition three is less than five establish the result without social or emotional cues.</desc>
  <defs><circle id="c" r="15" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><g id="b"><path d="M-70 0h140l-22 95h-96z" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><use href="#c" x="-36" y="30"/><use href="#c" x="36" y="30"/><use href="#c" x="-28" y="68"/><use href="#c" x="28" y="68"/></g></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="95" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Check the quotient and remainder conditions</text>
  <g transform="translate(140 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(370 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(600 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(830 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(1060 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g>
  <rect x="400" y="465" width="400" height="120" rx="52" fill="#FFFDF8" stroke="#B33A3A" stroke-width="6" stroke-dasharray="14 9"/><use href="#c" x="520" y="525"/><use href="#c" x="600" y="525"/><use href="#c" x="680" y="525"/><text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#7A2525">3 candies remain</text><rect x="255" y="660" width="690" height="92" rx="24" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18324A">23 = 5 × 4 + 3</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#7A2525">3 &lt; 5, so another equal whole-candy round is impossible.</text></svg>
