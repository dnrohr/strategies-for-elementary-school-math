<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Cross-products feed a common denominator without adding denominators</title>
<desc id="desc">Arrows map 2 times 8 to 16 and 5 times 3 to 15 while 3 times 8 makes denominator 24. The combined numerator is 31. A warning explicitly says the denominator is not 3 plus 8.</desc>
<defs>
<marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0l18 9-18 9z" fill="#7652A8"/>
</marker>
</defs>
<rect width="1200" height="800" fill="#F8F2E7"/>
<text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Compact rule, unpacked</text>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A">
<text x="260" y="290" font-size="64" font-weight="700">2/3</text>
<text x="600" y="290" font-size="50">+</text>
<text x="900" y="290" font-size="64" font-weight="700">5/8</text>
<path d="M300 330Q450 460 550 500" fill="none" stroke="#176B73" stroke-width="7" marker-end="url(#a)"/>
<path d="M860 330Q750 460 650 500" fill="none" stroke="#C66A12" stroke-width="7" stroke-dasharray="12 8" marker-end="url(#a)"/>
<text x="410" y="430" font-size="27" fill="#12545A">2 × 8 = 16</text>
<text x="790" y="430" font-size="27" fill="#8A4308">5 × 3 = 15</text>
<rect x="390" y="500" width="420" height="150" rx="25" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/>
<text x="600" y="560" font-size="32">(16 + 15) / (3 × 8)</text>
<text x="600" y="620" font-size="40" font-weight="700">= 31/24 = 1 7/24</text>
<rect x="390" y="685" width="420" height="70" rx="18" fill="#FFFDF8" stroke="#B33A3A" stroke-width="4" stroke-dasharray="10 7"/>
<text x="600" y="730" font-size="25" font-weight="700" fill="#7A2525">denominator 3 × 8 = 24 — not 3 + 8</text>
</g>
</svg>
