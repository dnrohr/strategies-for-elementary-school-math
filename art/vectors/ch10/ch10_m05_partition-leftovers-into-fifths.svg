<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Three leftover candies become fifteen fifth-pieces shared among five bowls</title>
  <desc id="desc">A before panel shows three candies, each divided by five radial boundaries into five equal sectors, totaling fifteen fifth-pieces. An arrow leads to five bowls, each containing exactly three marked fifth-pieces, one from each original candy.</desc>
  <defs><g id="cut"><circle r="62" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><path d="M0 0V-62M0 0L59-19M0 0L36 50M0 0L-36 50M0 0L-59-19" stroke="#18324A" stroke-width="3"/></g><g id="b"><rect x="-66" y="-35" width="132" height="100" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4"/><path d="M-30 5l20-15 20 15-20 15zM0 35l20-15 20 15-20 15zM-40 45l20-15 20 15-20 15z" fill="#F2B35F" stroke="#18324A" stroke-width="2"/></g><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18324A">Cut, then share the pieces equally</text><rect x="55" y="125" width="460" height="555" rx="28" fill="#FFFDF8" stroke="#A7A095" stroke-width="3"/><text x="285" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">BEFORE · 3 leftovers</text><use href="#cut" x="150" y="330"/><use href="#cut" x="360" y="330"/><use href="#cut" x="255" y="515"/><text x="285" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">3 × 5 = 15 fifth-pieces</text>
  <path d="M530 405h95" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><rect x="650" y="125" width="495" height="555" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4" stroke-dasharray="13 9"/><text x="898" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">AFTER · 5 equal bowls</text><use href="#b" x="760" y="280"/><use href="#b" x="895" y="280"/><use href="#b" x="1030" y="280"/><use href="#b" x="825" y="475"/><use href="#b" x="965" y="475"/><text x="898" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">3 pieces per bowl = 3/5 candy</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#18324A">Each child receives one fifth from each leftover.</text>
</svg>
