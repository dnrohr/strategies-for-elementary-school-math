<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 13: A complete four-line imagined derivation</title><desc id="desc">A lined mental page keeps every term visible: seven plus five, seven plus open parenthesis three plus two close parenthesis, open parenthesis seven plus three close parenthesis plus two, and ten plus two equals twelve. Small downward labels name each action.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5 0 7Z" fill="#7652A8"/></marker></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:20px;font-weight:700}.line{font-size:34px;font-weight:700}.m{font-size:32px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 13 · VISUAL-SYMBOLIC</text><text x="70" y="116" class="h">A tiny written workspace</text><text x="70" y="154" class="s">Every line preserves the entire expression while regrouping it.</text><rect x="64" y="190" width="1072" height="460" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="190" y="220" width="700" height="400" rx="22" fill="#FFFDF8" stroke="#2764B8" stroke-width="5"/><g stroke="#D7D0C4" stroke-width="3"><path d="M225 312H850M225 402H850M225 492H850M225 582H850"/></g><g class="line"><text x="270" y="285">7 + 5</text><text x="270" y="375">= 7 + (3 + 2)</text><text x="270" y="465">= (7 + 3) + 2</text><text x="270" y="555" fill="#287A55">= 10 + 2 = 12</text></g>
  <g fill="none" stroke="#7652A8" stroke-width="4" marker-end="url(#a)"><path d="M760 292v48"/><path d="M760 382v48"/><path d="M760 472v48"/></g><g class="l" text-anchor="end" fill="#7652A8"><text x="735" y="333">split 5</text><text x="735" y="423">regroup</text><text x="735" y="513">make 10</text></g><g aria-label="small non-countable pen-nib cue"><path d="M1010 400l34 34-50 50-24 8 8-24Z" fill="#F1EAF8" stroke="#7652A8" stroke-width="5"/><path d="M978 468l16 16" stroke="#7652A8" stroke-width="4"/></g><text x="1005" y="535" class="l" text-anchor="middle">imagined writing</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 = 7 + (3 + 2) = (7 + 3) + 2 = 12</text>
</svg>
