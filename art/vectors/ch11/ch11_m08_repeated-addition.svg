<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Twenty-seven additions grouped as ten, ten, and seven</title><desc id="desc">Exactly 27 tally marks represent 27 equal additions of 46. Brackets group the first ten, second ten, and final seven. Their subtotals are 460, 460, and 322, which sum to 1,242.</desc><defs><g id="t"><path d="M0 0v70" stroke="#18324A" stroke-width="7" stroke-linecap="round"/></g></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">27 equal additions of 46</text><text x="70" y="135" font-family="Arial,sans-serif" font-size="22" fill="#5A6570">Each tally is one complete +46, not one unit.</text><g transform="translate(90 220)"><use href="#t"/><use href="#t" x="38"/><use href="#t" x="76"/><use href="#t" x="114"/><use href="#t" x="152"/><use href="#t" x="190"/><use href="#t" x="228"/><use href="#t" x="266"/><use href="#t" x="304"/><use href="#t" x="342"/></g><g transform="translate(470 220)"><use href="#t"/><use href="#t" x="38"/><use href="#t" x="76"/><use href="#t" x="114"/><use href="#t" x="152"/><use href="#t" x="190"/><use href="#t" x="228"/><use href="#t" x="266"/><use href="#t" x="304"/><use href="#t" x="342"/></g><g transform="translate(850 220)"><use href="#t"/><use href="#t" x="38"/><use href="#t" x="76"/><use href="#t" x="114"/><use href="#t" x="152"/><use href="#t" x="190"/><use href="#t" x="228"/></g><g fill="none" stroke="#176B73" stroke-width="5"><path d="M85 325v35h355v-35M465 325v35h355v-35M845 325v35h245v-35"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="262" y="410" font-size="30">10 × 46 = 460</text><text x="642" y="410" font-size="30">10 × 46 = 460</text><text x="967" y="410" font-size="30">7 × 46 = 322</text><text x="600" y="560" font-size="42" font-weight="700">460 + 460 + 322</text><text x="600" y="635" font-size="48" font-weight="700" fill="#347C5A">= 1,242</text><text x="600" y="725" font-size="25" fill="#5A6570">10 + 10 + 7 = 27 groups</text></g></svg>
