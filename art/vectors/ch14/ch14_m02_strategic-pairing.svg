<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Strategically pair three fourths and five twelfths before adding two thirds</title><desc id="desc">Three large numbered stages first rename three fourths as nine twelfths, then combine nine twelfths and five twelfths to get fourteen twelfths or seven sixths, and finally add four sixths to get eleven sixths.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Pair first, simplify, then add</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><g transform="translate(65 165)"><circle cx="35" cy="35" r="28" fill="#176B73"/><text x="35" y="45" font-size="27" font-weight="700" fill="#FFFDF8">1</text><rect x="0" y="85" width="330" height="350" rx="26" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="165" y="155" font-size="29" font-weight="700">Rename</text><text x="165" y="235" font-size="35">3/4 = 9/12</text><text x="165" y="305" font-size="35">5/12 stays</text><text x="165" y="380" font-size="25" fill="#5A6570">same-size twelfths</text></g>
  <g transform="translate(435 165)"><circle cx="35" cy="35" r="28" fill="#C66A12"/><text x="35" y="45" font-size="27" font-weight="700" fill="#FFFDF8">2</text><rect x="0" y="85" width="330" height="350" rx="26" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="13 9"/><text x="165" y="150" font-size="29" font-weight="700">Pair</text><text x="165" y="225" font-size="27">9/12 + 5/12 = 14/12</text><text x="165" y="300" font-size="27">14/12 ÷ 2/2 = 7/6</text><text x="165" y="380" font-size="25" fill="#5A6570">simplify the pair</text></g>
  <g transform="translate(805 165)"><circle cx="35" cy="35" r="28" fill="#347C5A"/><text x="35" y="45" font-size="27" font-weight="700" fill="#FFFDF8">3</text><rect x="0" y="85" width="330" height="350" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="165" y="150" font-size="29" font-weight="700">Add 2/3 = 4/6</text><text x="165" y="225" font-size="29">7/6 + 4/6 = 11/6</text><text x="165" y="305" font-size="34" font-weight="700" fill="#347C5A">11/6 = 1 5/6</text><text x="165" y="380" font-size="25" fill="#5A6570">rename the result</text></g></g>
  <path d="M405 425H425M775 425H795" stroke="#7652A8" stroke-width="4"/><text x="600" y="745" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">Each stage keeps the unit explicit.</text></svg>
