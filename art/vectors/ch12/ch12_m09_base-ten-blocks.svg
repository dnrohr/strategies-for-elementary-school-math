<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Representative base-ten blocks regroup to 1,221</title><desc id="desc">Three source cards label 378, 596, and 247. A compact combined state uses exact multiplicity labels: 10 hundreds, 20 tens, and 21 ones. Regrouping produces 1 thousand, 2 hundreds, 2 tens, and 1 one, preserving 1,221 units.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="80" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18324A">Combine like place-value blocks</text><text x="65" y="120" font-family="Arial,sans-serif" font-size="21" fill="#5A6570">Representative shapes use exact multiplicity labels, not literal drawn counts.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="160" width="250" height="120" rx="22" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="200" y="235" font-size="37" font-weight="700">378</text><rect x="475" y="160" width="250" height="120" rx="22" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="600" y="235" font-size="37" font-weight="700">596</text><rect x="875" y="160" width="250" height="120" rx="22" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="1000" y="235" font-size="37" font-weight="700">247</text></g>
  <rect x="95" y="355" width="420" height="245" rx="26" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="305" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">COMBINED RAW COUNTS</text><g font-family="Arial,sans-serif" font-size="29"><text x="160" y="475">10 hundreds</text><text x="160" y="520">20 tens</text><text x="160" y="565">21 ones</text></g>
  <text x="597" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#553A78">valid ten-for-one</text><text x="597" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#553A78">trades</text><path d="M535 485h120" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/>
  <rect x="680" y="355" width="425" height="245" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="892" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">REGROUPED</text><g font-family="Arial,sans-serif" font-size="28"><text x="755" y="455">1 thousand</text><text x="755" y="495">2 hundreds</text><text x="755" y="535">2 tens</text><text x="755" y="575">1 one</text></g><text x="600" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">1,000 + 200 + 20 + 1 = 1,221</text>
</svg>
