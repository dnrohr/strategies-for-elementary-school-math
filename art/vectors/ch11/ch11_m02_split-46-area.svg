<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Split forty-six into forty and six with an enlarged callout</title><desc id="desc">A proportioned area rectangle shows 27 times 40 and a narrow 27 times 6 strip. A dashed connector leads to a large inset that repeats the six-wide contribution as 162, preserving proportional meaning while making the small region legible.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">27 × (40 + 6)</text>
  <text x="95" y="355" font-family="Arial,sans-serif" fill="#18324A" font-size="27" transform="rotate(-90 95 355)">height 27</text><rect x="165" y="165" width="650" height="400" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><rect x="815" y="165" width="98" height="400" fill="#F2B35F" stroke="#18324A" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="490" y="335" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="38" font-weight="700">27 × 40</text><text x="490" y="395" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="34">= 1,080</text><text x="864" y="360" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="26" font-weight="700" transform="rotate(-90 864 360)">27 × 6</text>
  <path d="M913 310H950" stroke="#7652A8" stroke-width="4" stroke-dasharray="8 7"/><rect x="950" y="205" width="210" height="245" rx="23" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="1055" y="260" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="26" font-weight="700">ENLARGED STRIP</text><text x="1055" y="335" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31" font-weight="700">27 × 6</text><text x="1055" y="395" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="34">= 162</text>
  <path d="M165 615v30h650v-30M815 615v30h98v-30" fill="none" stroke="#18324A" stroke-width="4"/><text x="490" y="690" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">width 40</text><text x="864" y="690" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">6</text><text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text></svg>
