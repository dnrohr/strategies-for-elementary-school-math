<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Representative place-value blocks regroup to one thousand two hundred twenty-one</title><desc id="desc">Labeled representative block shapes show ten hundreds, twenty tens, and twenty-one ones. Two explicit trades change ten hundreds to one thousand, ten tens to one hundred, and twenty ones to two tens, leaving 1 thousand, 2 hundreds, 2 tens, and 1 one.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Regroup a place-value inventory</text>
  <text x="64" y="118" font-family="Arial,sans-serif" font-size="26" fill="#5A6570">Each shape is schematic; its label gives the exact multiplicity.</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="75" y="180" width="270" height="175" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><text x="210" y="250" font-size="30" font-weight="700">10 hundreds</text><text x="210" y="300" font-size="24">= 1 thousand</text><rect x="465" y="180" width="90" height="175" fill="#F2B35F" stroke="#18324A" stroke-width="5"/><text x="510" y="395" font-size="28" font-weight="700">20 tens</text><rect x="690" y="220" width="250" height="95" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="12 8"/><text x="815" y="278" font-size="28" font-weight="700">21 ones</text></g>
  <path d="M150 470H1050" stroke="#176B73" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#18324A" font-size="25" text-anchor="middle"><text x="300" y="455">trade 10 hundreds</text><text x="600" y="455">trade 10 tens</text><text x="900" y="455">trade 20 ones</text></g>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="110" y="525" width="980" height="125" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="580" font-size="29">1 thousand + 2 hundreds + 2 tens + 1 one</text><text x="600" y="625" font-size="38" font-weight="700" fill="#347C5A">= 1,221</text><text x="600" y="725" font-size="25" fill="#5A6570">The total stays fixed while units are renamed.</text></g></svg>
