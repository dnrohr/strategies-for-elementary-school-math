<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Twenty dollars represented as four five-dollar tokens</title>
  <desc id="desc">Four exact vector money tokens are each labeled five dollars and together total twenty dollars. Three tokens have a heavy double outline and check marks, so the selected value is fifteen dollars; one is unselected.</desc>
  <defs><pattern id="m07-lines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#287A55" stroke-width="4"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">Twenty dollars as four equal shares</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">Money changes the context, not the fraction: select three $5 tokens.</text>
  <g transform="translate(65 195)" font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(0)"><rect width="250" height="330" rx="28" fill="url(#m07-lines)" stroke="#287A55" stroke-width="9"/><rect x="13" y="13" width="224" height="304" rx="20" fill="none" stroke="#287A55" stroke-width="4"/><circle cx="125" cy="145" r="72" fill="#FFFDF8" stroke="#24312D" stroke-width="5"/><text x="125" y="169" font-size="67" font-weight="700" fill="#24312D">$5</text><text x="125" y="281" font-size="27" font-weight="700" fill="#287A55">✓ SELECTED</text></g><g transform="translate(275)"><rect width="250" height="330" rx="28" fill="url(#m07-lines)" stroke="#287A55" stroke-width="9"/><rect x="13" y="13" width="224" height="304" rx="20" fill="none" stroke="#287A55" stroke-width="4"/><circle cx="125" cy="145" r="72" fill="#FFFDF8" stroke="#24312D" stroke-width="5"/><text x="125" y="169" font-size="67" font-weight="700" fill="#24312D">$5</text><text x="125" y="281" font-size="27" font-weight="700" fill="#287A55">✓ SELECTED</text></g><g transform="translate(550)"><rect width="250" height="330" rx="28" fill="url(#m07-lines)" stroke="#287A55" stroke-width="9"/><rect x="13" y="13" width="224" height="304" rx="20" fill="none" stroke="#287A55" stroke-width="4"/><circle cx="125" cy="145" r="72" fill="#FFFDF8" stroke="#24312D" stroke-width="5"/><text x="125" y="169" font-size="67" font-weight="700" fill="#24312D">$5</text><text x="125" y="281" font-size="27" font-weight="700" fill="#287A55">✓ SELECTED</text></g><g transform="translate(825)"><rect width="250" height="330" rx="28" fill="#F2F2EF" stroke="#68707A" stroke-width="5" stroke-dasharray="12 9"/><circle cx="125" cy="145" r="72" fill="#FFFDF8" stroke="#68707A" stroke-width="5"/><text x="125" y="169" font-size="67" font-weight="700" fill="#52605A">$5</text><text x="125" y="281" font-size="24" fill="#52605A">NOT SELECTED</text></g></g>
  <path d="M65 590v30h800v-30" fill="none" stroke="#287A55" stroke-width="8"/><text x="465" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#287A55">$5 + $5 + $5 = $15</text><text x="1015" y="628" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#52605A">all four = $20</text>
</svg>
