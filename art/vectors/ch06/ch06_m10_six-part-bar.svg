<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A twenty-four-unit bar split into six equal parts</title><desc id="desc">One horizontal bar labeled whole equals twenty-four is partitioned into six congruent segments. Every segment is labeled four and a brace labels six equal groups.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">The quotient is the size of one part</text><path d="M100 220v-30h1000v30" fill="none" stroke="#2764B8" stroke-width="6"/><text x="600" y="160" font-size="28" font-weight="700">WHOLE = 24</text><g transform="translate(100 280)" stroke="#24312D" stroke-width="6"><rect width="1000" height="220" rx="18" fill="#E8F3ED"/><path d="M166.667 0v220M333.334 0v220M500 0v220M666.667 0v220M833.334 0v220"/></g><g font-size="38" font-weight="700"><text x="183" y="410">4</text><text x="350" y="410">4</text><text x="517" y="410">4</text><text x="683" y="410">4</text><text x="850" y="410">4</text><text x="1017" y="410">4</text></g><path d="M100 555v35h1000v-35" fill="none" stroke="#287A55" stroke-width="8"/><text x="600" y="655" font-size="34" font-weight="700">6 equal parts · 24 ÷ 6 = 4</text></g></svg>
