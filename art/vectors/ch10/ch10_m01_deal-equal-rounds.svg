<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Five equal bowls receive four candies each, with three left over</title>
  <desc id="desc">Five outlined bowls each contain exactly four round candies, using twenty candies. A separate central remainder dish contains exactly three candies. The equation reads twenty-three equals five times four plus three.</desc>
  <defs><circle id="c" r="16" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><g id="b"><rect x="-82" y="-34" width="164" height="115" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><use href="#c" x="-38"/><use href="#c" x="38"/><use href="#c" x="-38" y="42"/><use href="#c" x="38" y="42"/></g></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Four complete dealing rounds</text>
  <g transform="translate(140 260)"><use href="#b"/><text y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Bowl 1 · 4</text></g><g transform="translate(370 260)"><use href="#b"/><text y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Bowl 2 · 4</text></g><g transform="translate(600 260)"><use href="#b"/><text y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Bowl 3 · 4</text></g><g transform="translate(830 260)"><use href="#b"/><text y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Bowl 4 · 4</text></g><g transform="translate(1060 260)"><use href="#b"/><text y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">Bowl 5 · 4</text></g>
  <rect x="470" y="500" width="260" height="125" rx="48" fill="#FFFDF8" stroke="#B33A3A" stroke-width="6" stroke-dasharray="14 9"/><use href="#c" x="535" y="560"/><use href="#c" x="600" y="560"/><use href="#c" x="665" y="560"/><text x="600" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7A2525">separate remainder · 3</text><text x="600" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">23 = 5 × 4 + 3</text>
</svg>
