  <title id="t">Markup of Method 3 switch the addends and count</title><desc id="d">Three callouts identify competing lessons, dense arcs, and detached labels.</desc><image href="../../../art/vectors/ch01/ch01_m03_count-on-from-five.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="110" y="215" width="870" height="95" rx="22"/><ellipse cx="610" cy="445" rx="480" ry="110"/><rect x="100" y="525" width="1000" height="85" rx="18"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1010" cy="250" r="28"/><circle cx="1090" cy="420" r="28"/><circle cx="1090" cy="570" r="28"/></g><g fill="#fff" font-size="28"><text x="1010" y="260">1</text><text x="1090" y="430">2</text><text x="1090" y="580">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 03 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Sequence the lesson</tspan><tspan x="1240" dy="32">Make the commutative swap a small</tspan><tspan x="1240" dy="29">premise, not a competing panel.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Calm seven hops</tspan><tspan x="1240" dy="32">Lighten arcs or emphasize landing</tspan><tspan x="1240" dy="29">dots to avoid a saw-tooth band.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Attach labels</tspan><tspan x="1240" dy="32">Place start and landing labels</tspan><tspan x="1240" dy="29">directly under 5 and 12.</tspan></text></g>
</svg>
