<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Refine twentieths into fortieths to compare an exact half-cell endpoint</title>
  <desc id="desc">A three-step sequence shows twelve full twentieths for three fifths, a half-filled thirteenth twentieth for five eighths, and the exact renaming as twenty-four fortieths versus twenty-five fortieths.</desc>
  <rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="60" y="68" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18324A">A half twentieth becomes one whole fortieth</text>
  <g font-family="Arial,sans-serif">
    <circle cx="82" cy="132" r="24" fill="#176B73"/><text x="82" y="141" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFDF8">1</text><text x="125" y="142" font-size="28" font-weight="700" fill="#18324A">Locate both endpoints in twentieths</text>
    <g class="thirteen-twentieth-cells" stroke="#18324A" stroke-width="3">
      <rect x="125" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="195" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="265" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="335" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="405" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="475" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="545" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="615" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="685" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="755" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="825" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="895" y="180" width="70" height="95" fill="#B9D8D5"/><rect x="965" y="180" width="70" height="95" fill="#FFFDF8"/><rect x="965" y="180" width="35" height="95" fill="#F2B35F"/>
    </g>
    <text x="545" y="315" text-anchor="middle" font-size="25" font-weight="700" fill="#176B73">12/20 = 3/5</text><text x="985" y="315" text-anchor="middle" font-size="22" fill="#8A450D">half of cell 13</text>
    <circle cx="82" cy="405" r="24" fill="#7652A8"/><text x="82" y="414" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFDF8">2</text><text x="125" y="415" font-size="28" font-weight="700" fill="#18324A">Magnify and split the thirteenth cell</text>
    <rect x="350" y="445" width="500" height="120" rx="18" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="12 8"/><text x="600" y="478" text-anchor="middle" font-size="20" font-weight="700" fill="#553A78">MAGNIFIED THIRTEENTH CELL</text><rect x="455" y="505" width="145" height="38" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><rect x="600" y="505" width="145" height="38" fill="#FFFDF8" stroke="#18324A" stroke-width="3"/><text x="527" y="533" text-anchor="middle" font-size="19" fill="#18324A">1/40</text><text x="672" y="533" text-anchor="middle" font-size="19" fill="#18324A">1/40</text>
    <circle cx="82" cy="640" r="24" fill="#287A55"/><text x="82" y="649" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFDF8">3</text><text x="125" y="650" font-size="28" font-weight="700" fill="#18324A">Compare</text>
    <rect x="350" y="600" width="700" height="135" rx="24" fill="#DDEDE4" stroke="#287A55" stroke-width="5"/><text x="700" y="652" text-anchor="middle" font-size="28" font-weight="700" fill="#18324A">12 1/2 twentieths = 5/8</text><text x="700" y="700" text-anchor="middle" font-size="32" font-weight="700" fill="#287A55">24/40 &lt; 25/40, so 3/5 &lt; 5/8</text>
  </g>
</svg>
