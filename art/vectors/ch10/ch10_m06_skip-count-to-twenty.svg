<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Four rightward jumps of five reach twenty, with three left over</title><desc id="desc">A number line starts at zero. Four separate rightward arcs land at 5, 10, 15, and 20. Small arrowheads sit above the landing ticks and do not cover them. A bracket from 20 to 23 marks the remainder of three.</desc><rect width="1200" height="800" fill="#F8F2E7"/><defs><marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#7652A8"/></marker></defs><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Count complete groups of five</text>
  <path d="M130 500H1070" stroke="#18324A" stroke-width="6"/>
  <g stroke="#18324A" stroke-width="4"><path d="M150 475v50M350 475v50M550 475v50M750 475v50M950 465v70M1070 465v70"/></g>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="27" text-anchor="middle"><text x="150" y="575">0</text><text x="350" y="575">5</text><text x="550" y="575">10</text><text x="750" y="575">15</text><text x="950" y="575">20</text><text x="1070" y="575">23</text></g>
  <g fill="none" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"><path d="M160 450Q250 270 340 450"/><path d="M360 450Q450 270 540 450"/><path d="M560 450Q650 270 740 450"/><path d="M760 450Q850 270 940 450"/></g>
  <g font-family="Arial,sans-serif" font-size="25" text-anchor="middle" fill="#553A78"><text x="250" y="295">+5</text><text x="450" y="295">+5</text><text x="650" y="295">+5</text><text x="850" y="295">+5</text></g>
  <circle cx="150" cy="500" r="9" fill="#176B73"/><g fill="#7652A8"><circle cx="350" cy="500" r="8"/><circle cx="550" cy="500" r="8"/><circle cx="750" cy="500" r="8"/><circle cx="950" cy="500" r="8"/></g>
  <path d="M950 640v25h120v-25" fill="none" stroke="#B33A3A" stroke-width="5"/><text x="1010" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#7A2525">3 left over</text>
  <text x="600" y="760" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27" font-weight="700">0 → 5 → 10 → 15 → 20; then 3 remains</text></svg>
