<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Fifteen minus eight shown as removal and distance</title><desc id="desc">Two equally large panels contrast removing eight counters from fifteen with measuring the seven-unit distance from eight to fifteen. Both panels use large labels and exact countable marks.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">15 − 8 = 7 · removal and distance</text>
  <rect x="55" y="135" width="520" height="545" rx="28" fill="#FFFDF8" stroke="#B33A3A" stroke-width="5"/><text x="315" y="200" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="30" font-weight="700">Remove 8 from 15</text><g stroke="#18324A" stroke-width="3"><circle cx="115" cy="285" r="28" fill="#347C5A" /><circle cx="215" cy="285" r="28" fill="#347C5A" /><circle cx="315" cy="285" r="28" fill="#347C5A" /><circle cx="415" cy="285" r="28" fill="#347C5A" /><circle cx="515" cy="285" r="28" fill="#347C5A" /><circle cx="115" cy="385" r="28" fill="#347C5A" /><circle cx="215" cy="385" r="28" fill="#347C5A" /><circle cx="315" cy="385" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="415" cy="385" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="515" cy="385" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="115" cy="485" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="215" cy="485" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="315" cy="485" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="415" cy="485" r="28" fill="#F2B35F" stroke-dasharray="8 6"/><circle cx="515" cy="485" r="28" fill="#F2B35F" stroke-dasharray="8 6"/></g><path d="M100 530h430" stroke="#B33A3A" stroke-width="5"/><text x="315" y="605" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="33" font-weight="700">8 removed · 7 remain</text>
  <rect x="625" y="135" width="520" height="545" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="885" y="200" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="30" font-weight="700">Measure 8 → 15</text><path d="M700 455H1070" stroke="#18324A" stroke-width="6"/><g stroke="#18324A" stroke-width="4"><path d="M700 430v50"/><path d="M752 430v50"/><path d="M804 430v50"/><path d="M856 430v50"/><path d="M908 430v50"/><path d="M960 430v50"/><path d="M1012 430v50"/><path d="M1064 430v50"/></g><circle cx="700" cy="455" r="11" fill="#176B73"/><circle cx="1064" cy="455" r="13" fill="#347C5A"/><path d="M700 380Q882 235 1064 380" fill="none" stroke="#176B73" stroke-width="6"/><text x="882" y="280" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="32" font-weight="700">distance = 7</text><g font-family="Arial,sans-serif" fill="#18324A" font-size="24" text-anchor="middle"><text x="700" y="525">8</text><text x="752" y="525">9</text><text x="804" y="525">10</text><text x="856" y="525">11</text><text x="908" y="525">12</text><text x="960" y="525">13</text><text x="1012" y="525">14</text><text x="1064" y="525">15</text></g><text x="885" y="605" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="33" font-weight="700">8 + 7 = 15</text>
  <text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">Same difference; different meaning.</text></svg>
