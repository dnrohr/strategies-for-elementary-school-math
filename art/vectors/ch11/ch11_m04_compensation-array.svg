<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Thirty groups of forty-six with three groups removed</title><desc id="desc">Three large blocks each represent ten rows of forty-six. A separate dashed group of three rows is removed from the thirty-row benchmark, leaving twenty-seven rows. Equations verify 1,380 minus 138 equals 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Use 30 groups, then remove 3 groups</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><g transform="translate(80 180)"><rect width="285" height="240" rx="20" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><text x="142" y="105" font-size="31" font-weight="700">10 × 46</text><text x="142" y="155" font-size="27">460</text></g><g transform="translate(395 180)"><rect width="285" height="240" rx="20" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><text x="142" y="105" font-size="31" font-weight="700">10 × 46</text><text x="142" y="155" font-size="27">460</text></g><g transform="translate(710 180)"><rect width="285" height="240" rx="20" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><text x="142" y="105" font-size="31" font-weight="700">10 × 46</text><text x="142" y="155" font-size="27">460</text></g>
  <rect x="850" y="465" width="270" height="120" rx="18" fill="#FFFDF8" stroke="#B33A3A" stroke-width="5" stroke-dasharray="12 8"/><text x="985" y="515" font-size="27" font-weight="700" fill="#7A2525">remove 3 × 46</text><text x="985" y="558" font-size="27" fill="#7A2525">= 138</text></g>
  <path d="M900 430L1070 465" stroke="#B33A3A" stroke-width="5"/><text x="540" y="515" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="32">30 × 46 = 1,380</text><text x="600" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#347C5A">1,380 − 138 = 1,242</text></svg>
