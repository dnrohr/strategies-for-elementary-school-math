<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Thirty-seven plus forty-eight equals eighty-five</title>
  <desc id="desc">A base-ten addition model combines 3 tens and 7 ones with 4 tens and 8 ones. The 15 ones are regrouped as 1 ten and 5 ones, leaving 8 tens and 5 ones, or 85.</desc>
  <style>
    .ink { fill: #24312d; }
    .muted { fill: #5b6962; }
    .orange { fill: #d98b2b; stroke: #24312d; stroke-width: 3; }
    .green { fill: #347c5a; stroke: #24312d; stroke-width: 3; }
    .blue { fill: #467a9b; stroke: #24312d; stroke-width: 3; }
    .pale { fill: #f5efe3; stroke: #24312d; stroke-width: 3; }
    text { font-family: Georgia, serif; }
    .label { font-size: 30px; }
    .math { font-size: 40px; font-weight: 700; }
    .small { font-size: 21px; }
  </style>
  <rect width="1200" height="800" fill="#fffdf8"/>
  <text x="68" y="76" class="ink math">37 + 48 = 85</text>
  <text x="68" y="116" class="muted small">Combine ones first; regroup ten ones as one ten.</text>
  <rect x="68" y="160" width="720" height="470" rx="16" class="pale"/>
  <text x="96" y="210" class="ink label">Base-ten model</text>
  <text x="96" y="266" class="muted small">37: 3 tens + 7 ones</text>
  <text x="96" y="312" class="muted small">48: 4 tens + 8 ones</text>
  <rect x="96" y="350" width="210" height="66" rx="9" class="orange"/>
  <text x="120" y="392" class="ink label">7 + 8 = 15 ones</text>
  <path d="M330 382h100" stroke="#24312d" stroke-width="4"/>
  <text x="342" y="356" class="muted small">trade 10</text>
  <rect x="454" y="350" width="120" height="66" rx="9" class="green"/>
  <text x="480" y="392" class="ink label">1 ten</text>
  <rect x="96" y="454" width="478" height="66" rx="9" class="blue"/>
  <text x="120" y="496" class="ink label">3 + 4 + 1 = 8 tens</text>
  <path d="M96 552h478" stroke="#24312d" stroke-width="2"/>
  <text x="96" y="604" class="ink label">8 tens + 5 ones = 85</text>
  <rect x="840" y="160" width="292" height="470" rx="16" class="pale"/>
  <text x="868" y="218" class="ink label">Column route</text>
  <text x="868" y="292" class="ink label">ones: 15</text>
  <text x="868" y="346" class="ink label">write 5, carry 1</text>
  <text x="868" y="410" class="ink label">tens: 8</text>
  <path d="M868 438h220" stroke="#24312d" stroke-width="2"/>
  <text x="868" y="500" class="ink label">answer: 85</text>
  <text x="868" y="560" class="muted small">same quantity, two views</text>
</svg>
