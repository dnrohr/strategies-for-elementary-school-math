<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Four complete groups of five plus a remainder of three</title>
  <desc id="desc">Four outlined rows each contain exactly five candies, totaling twenty. A separate dashed remainder group contains exactly three candies. The equations show five times four equals twenty and twenty-three minus twenty equals three.</desc>
  <defs><circle id="c" r="18" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><g id="row"><use href="#c"/><use href="#c" x="75"/><use href="#c" x="150"/><use href="#c" x="225"/><use href="#c" x="300"/></g></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="85" y="95" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Build the largest complete groups</text>
  <g transform="translate(170 190)"><rect x="-45" y="-45" width="390" height="90" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4"/><use href="#row"/></g><g transform="translate(170 315)"><rect x="-45" y="-45" width="390" height="90" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4"/><use href="#row"/></g><g transform="translate(170 440)"><rect x="-45" y="-45" width="390" height="90" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4"/><use href="#row"/></g><g transform="translate(170 565)"><rect x="-45" y="-45" width="390" height="90" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="4"/><use href="#row"/></g>
  <rect x="700" y="245" width="330" height="145" rx="40" fill="#FFFDF8" stroke="#B33A3A" stroke-width="5" stroke-dasharray="13 9"/><use href="#c" x="790" y="315"/><use href="#c" x="865" y="315"/><use href="#c" x="940" y="315"/><text x="865" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#7A2525">remainder 3</text><g font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A"><text x="690" y="535">5 × 4 = 20</text><text x="690" y="600">23 − 20 = 3</text><text x="690" y="665">quotient 4 R3</text></g>
</svg>
