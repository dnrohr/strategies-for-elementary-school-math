<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 3: Switch the addends and count seven times from five</title><desc id="desc">A compact matching-line diagram shows that the same addends trade places: seven plus five equals five plus seven. A large number line then shows seven light one-unit arcs from five to twelve.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M0 0L7 3.5 0 7Z" fill="#087E8B"/></marker></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.m{font-size:34px;font-weight:700}.n{font-size:23px;font-weight:700;text-anchor:middle}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 03 · COMMUTATIVITY + COUNT-ON</text><text x="70" y="116" class="h">Switch, then count from 5</text><text x="70" y="154" class="s">The order changes the route, not the total.</text><rect x="64" y="190" width="1072" height="500" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="300" y="212" width="600" height="108" rx="20" fill="#F1EAF8" stroke="#7652A8" stroke-width="4"/><g fill="none" stroke="#7652A8" stroke-width="3" opacity=".8"><path d="M390 252C500 210 700 210 810 252"/><path d="M470 296C550 318 650 318 730 296"/></g><g class="m" text-anchor="middle"><text x="390" y="286">7</text><text x="430" y="286">+</text><text x="470" y="286">5</text><text x="600" y="286">=</text><text x="730" y="286">5</text><text x="770" y="286">+</text><text x="810" y="286">7</text></g>
  <path d="M130 510H1070" stroke="#68707A" stroke-width="5"/><g stroke="#68707A" stroke-width="4"><path d="M170 480v60M295 480v60M420 480v60M545 480v60M670 480v60M795 480v60M920 480v60M1045 480v60"/></g><g fill="none" stroke="#087E8B" stroke-width="5" marker-end="url(#a)"><path d="M177 468q55-100 110 0"/><path d="M302 468q55-100 110 0"/><path d="M427 468q55-100 110 0"/><path d="M552 468q55-100 110 0"/><path d="M677 468q55-100 110 0"/><path d="M802 468q55-100 110 0"/><path d="M927 468q55-100 110 0"/></g><g class="l" text-anchor="middle"><text x="232" y="382">+1</text><text x="357" y="382">+1</text><text x="482" y="382">+1</text><text x="607" y="382">+1</text><text x="732" y="382">+1</text><text x="857" y="382">+1</text><text x="982" y="382">+1</text></g><g class="n"><text x="170" y="580">5</text><text x="295" y="580">6</text><text x="420" y="580">7</text><text x="545" y="580">8</text><text x="670" y="580">9</text><text x="795" y="580">10</text><text x="920" y="580">11</text><text x="1045" y="580">12</text></g><text x="170" y="635" class="l" text-anchor="middle">held start</text><text x="1045" y="635" class="l" text-anchor="middle" fill="#287A55">seventh landing</text><text x="600" y="750" class="m" text-anchor="middle" fill="#287A55">5 + 7 = 12, so 7 + 5 = 12</text>
</svg>
