<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Compare each fraction with one half on aligned mini number lines</title><desc id="desc">Two aligned magnified number lines share the same scale from one half to five eighths. The first marks three fifths one tenth above one half. The second marks five eighths one eighth above one half, showing the second gap is larger.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Compare each distance from 1/2</text>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="28"><text x="80" y="245" font-weight="700">3/5</text><text x="80" y="485" font-weight="700">5/8</text></g>
  <g stroke="#18324A" stroke-width="6"><path d="M240 250H1040M240 490H1040"/></g><g stroke="#18324A" stroke-width="4"><path d="M240 215v70M880 215v70M1040 215v70M240 455v70M880 455v70M1040 455v70"/></g>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="25" text-anchor="middle"><text x="240" y="330">1/2</text><text x="880" y="330">3/5</text><text x="1040" y="330">5/8</text><text x="240" y="570">1/2</text><text x="880" y="570">3/5</text><text x="1040" y="570">5/8</text></g>
  <path d="M240 180v-35h640v35" fill="none" stroke="#176B73" stroke-width="6"/><text x="560" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#12545A">3/5 − 1/2 = 1/10</text>
  <path d="M240 420v-35h800v35" fill="none" stroke="#C66A12" stroke-width="6" stroke-dasharray="14 9"/><text x="640" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#8A450D">5/8 − 1/2 = 1/8</text>
  <circle cx="880" cy="250" r="12" fill="#176B73"/><circle cx="1040" cy="490" r="12" fill="#C66A12"/><text x="600" y="710" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">1/8 &gt; 1/10, so 5/8 &gt; 3/5</text></svg>
