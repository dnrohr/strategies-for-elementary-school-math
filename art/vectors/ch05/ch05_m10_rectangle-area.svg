<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Area of an eleven by twelve rectangle</title><desc id="desc">A rectangle is divided into exactly eleven by twelve square units, with side labels and area 132 square units; perimeter is not indicated.</desc><defs><pattern id="g" x="180" y="150" width="70" height="45" patternUnits="userSpaceOnUse"><rect width="70" height="45" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Area, not perimeter</text><rect x="180" y="150" width="840" height="495" fill="url(#g)" stroke="#2764B8" stroke-width="8"/><text x="600" y="125" font-size="27">12 units</text><text x="120" y="400" font-size="27">11 units</text><rect x="380" y="315" width="440" height="150" rx="25" fill="#FFFDF8" fill-opacity=".9" stroke="#287A55" stroke-width="8"/><text x="600" y="385" font-size="34" font-weight="700">area = 132</text><text x="600" y="430" font-size="25">square units</text></g></svg>
