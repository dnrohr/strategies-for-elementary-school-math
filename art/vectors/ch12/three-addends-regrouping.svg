<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Add three hundred seventy-eight, five hundred ninety-six, and two hundred forty-seven</title><desc id="desc">A large written column aligns all three addends. Large carry labels show twenty-one ones becoming two tens and one one, twenty-two tens becoming two hundreds and two tens, and twelve hundreds becoming one thousand and two hundreds, yielding 1,221.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Regroup each place once, then carry</text>
  <rect x="80" y="145" width="500" height="540" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="5"/><g font-family="Consolas,monospace"  text-anchor="end" fill="#18324A"><text x="440" y="260" font-size="58">378</text><text x="440" y="350" font-size="58">596</text><text x="440" y="440" font-size="58">+247</text><path d="M190 475H475" stroke="#18324A" stroke-width="6"/><text x="440" y="575" font-size="68" font-weight="700">1,221</text></g>
  <rect x="640" y="145" width="480" height="540" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><g font-family="Arial,sans-serif" fill="#18324A"><text x="690" y="225" font-size="29" font-weight="700">1 · ONES</text><text x="690" y="275" font-size="28">8 + 6 + 7 = 21</text><text x="690" y="320" font-size="25" fill="#5A6570">write 1; carry 2 tens</text><text x="690" y="395" font-size="29" font-weight="700">2 · TENS</text><text x="690" y="445" font-size="28">7 + 9 + 4 + 2 = 22</text><text x="690" y="490" font-size="25" fill="#5A6570">write 2; carry 2 hundreds</text><text x="690" y="565" font-size="29" font-weight="700">3 · HUNDREDS</text><text x="690" y="615" font-size="28">3 + 5 + 2 + 2 = 12</text><text x="690" y="660" font-size="25" fill="#5A6570">write 2 hundreds; carry 1 thousand</text></g>
  <text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#347C5A">total = 1,221</text></svg>
