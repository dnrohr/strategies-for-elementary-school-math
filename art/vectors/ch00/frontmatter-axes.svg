<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Two-axis legend for the arithmetic atlas</title>
  <desc id="desc">A visual legend keeps computational strategy separate from mental representation. The strategy axis lists counting, retrieval, decomposition, compensation, geometry, and pattern. The representation axis lists words, numerals, objects, space, movement, and abstraction. The axes describe a changing mixture, not fixed learner types.</desc>
  <style>
    .ink { fill: #24312d; }
    .muted { fill: #5b6962; }
    .orange { fill: #d98b2b; stroke: #24312d; stroke-width: 3; }
    .green { fill: #347c5a; stroke: #24312d; stroke-width: 3; }
    .pale { fill: #f5efe3; stroke: #24312d; stroke-width: 3; }
    text { font-family: Georgia, serif; }
    .label { font-size: 29px; }
    .math { font-size: 39px; font-weight: 700; }
    .small { font-size: 21px; }
  </style>
  <rect width="1200" height="800" fill="#fffdf8"/>
  <text x="68" y="76" class="ink math">How did the mathematics appear?</text>
  <text x="68" y="116" class="muted small">Two independent questions describe a changing mixture, not a fixed type of learner.</text>
  <rect x="68" y="160" width="506" height="510" rx="16" class="pale"/>
  <text x="98" y="214" class="ink label">A · Computational strategy</text>
  <text x="98" y="254" class="muted small">What route did the solver use?</text>
  <g class="orange">
    <rect x="98" y="286" width="190" height="50" rx="8"/><rect x="308" y="286" width="190" height="50" rx="8"/>
    <rect x="98" y="354" width="190" height="50" rx="8"/><rect x="308" y="354" width="190" height="50" rx="8"/>
    <rect x="98" y="422" width="190" height="50" rx="8"/><rect x="308" y="422" width="190" height="50" rx="8"/>
  </g>
  <text x="148" y="320" class="ink label">counting</text><text x="358" y="320" class="ink label">retrieval</text>
  <text x="126" y="388" class="ink small">decomposition</text><text x="328" y="388" class="ink small">compensation</text>
  <text x="154" y="456" class="ink label">geometry</text><text x="366" y="456" class="ink label">pattern</text>
  <text x="98" y="548" class="muted small">A route can change from one problem</text><text x="98" y="580" class="muted small">or moment to the next.</text>
  <rect x="626" y="160" width="506" height="510" rx="16" class="pale"/>
  <text x="656" y="214" class="ink label">B · Mental representation</text>
  <text x="656" y="254" class="muted small">What form did the route take?</text>
  <g class="green">
    <rect x="656" y="286" width="190" height="50" rx="8"/><rect x="866" y="286" width="190" height="50" rx="8"/>
    <rect x="656" y="354" width="190" height="50" rx="8"/><rect x="866" y="354" width="190" height="50" rx="8"/>
    <rect x="656" y="422" width="190" height="50" rx="8"/><rect x="866" y="422" width="190" height="50" rx="8"/>
  </g>
  <text x="720" y="320" class="ink label">words</text><text x="908" y="320" class="ink label">numerals</text>
  <text x="710" y="388" class="ink label">objects</text><text x="916" y="388" class="ink label">space</text>
  <text x="716" y="456" class="ink label">movement</text><text x="900" y="456" class="ink label">abstraction</text>
  <text x="656" y="548" class="muted small">Forms can overlap or recede;</text><text x="656" y="580" class="muted small">none is a permanent category.</text>
</svg>
