<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A mental page shows the regrouped subtraction marks</title><desc id="desc">A translucent mental-workspace page aligns seventy-two over thirty-nine, annotates seven becoming six tens and two becoming twelve ones, and writes thirty-three below the line. A dotted trace suggests imagined marking without a hand.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Written marks on an imagined page</text><rect x="270" y="125" width="660" height="560" rx="42" fill="#F4EBFA" fill-opacity=".65" stroke="#7652A8" stroke-width="6" stroke-dasharray="10 8"/><text x="600" y="175" font-size="23" fill="#52605A">MENTAL WORKSPACE</text><g font-family="Consolas,monospace" font-size="78" text-anchor="end"><text x="690" y="335">72</text><text x="690" y="455">−39</text><path d="M420 490h315" stroke="#24312D" stroke-width="7"/><text x="690" y="610">33</text><text x="555" y="245" font-size="36" fill="#7652A8">6</text><text x="690" y="245" font-size="36" fill="#7652A8">12</text></g><text x="600" y="720" font-size="29" font-weight="700">7 tens → 6 tens · 2 ones → 12 ones</text></g></svg>
