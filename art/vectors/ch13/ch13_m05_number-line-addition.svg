<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Fifteen exact twenty-fourth jumps start at sixteen twenty-fourths</title><desc id="desc">A proportional line from zero to two has 48 equal intervals, 24 per whole. The start is 16 twenty-fourths. Exactly fifteen small rightward arcs advance to 31 twenty-fourths, equal to one and seven twenty-fourths.</desc><defs><pattern id="ticks" x="100" width="20" height="50" patternUnits="userSpaceOnUse"><path d="M20 0V50" stroke="#18324A" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18324A">Add as displacement in 1/24 units</text><rect x="100" y="430" width="960" height="50" fill="url(#ticks)"/><path d="M100 455H1060" stroke="#18324A" stroke-width="6"/><path d="M100 420v70M580 410v90M1060 420v70" stroke="#18324A" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><text x="100" y="535">0</text><text x="580" y="535">1 = 24/24</text><text x="1060" y="535">2</text></g><circle cx="420" cy="455" r="13" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="420" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">start 16/24</text><g fill="none" stroke="#C66A12" stroke-width="4"><path d="M420 430q10-30 20 0M440 430q10-30 20 0M460 430q10-30 20 0M480 430q10-30 20 0M500 430q10-30 20 0M520 430q10-30 20 0M540 430q10-30 20 0M560 430q10-30 20 0M580 430q10-30 20 0M600 430q10-30 20 0M620 430q10-30 20 0M640 430q10-30 20 0M660 430q10-30 20 0M680 430q10-30 20 0M700 430q10-30 20 0"/></g><circle cx="720" cy="455" r="15" fill="#347C5A" stroke="#18324A" stroke-width="4"/><text x="720" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#347C5A">endpoint 31/24 = 1 7/24</text><path d="M420 255v-35h300v35" fill="none" stroke="#7652A8" stroke-width="5"/><text x="570" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#553A78">15 exact jumps of 1/24</text><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#5A6570">Eight jumps reach one whole; seven continue beyond it.</text></svg>
