<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Jump backward thirty, then nine, from seventy-two</title><desc id="desc">A number line has exactly two backward arrows: thirty from seventy-two to forty-two and nine from forty-two to thirty-three. A bracket groups the two jumps as thirty-nine.</desc><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><defs><marker id="qa-arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18"><path d="M0 0l18 9-18 9z" fill="#087E8B"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Two backward jumps total 39</text><path d="M120 470H1080" stroke="#24312D" stroke-width="6"/><path d="M180 445v50M420 445v50M1020 445v50" stroke="#24312D" stroke-width="5"/><text x="180" y="545" font-size="25">33</text><text x="420" y="545" font-size="25">42</text><text x="1020" y="545" font-size="25">72</text><path d="M1010 420Q715 100 430 420" fill="none" stroke="#087E8B" stroke-width="8" marker-end="url(#qa-arrow)"/><path d="M410 415Q295 275 190 415" fill="none" stroke="#087E8B" stroke-width="8" marker-end="url(#qa-arrow)"/><text x="720" y="200" font-size="34" fill="#087E8B">−30</text><text x="300" y="310" font-size="30" fill="#087E8B">−9</text><path d="M180 590v35h840v-35" fill="none" stroke="#C2413B" stroke-width="7" stroke-dasharray="12 8"/><text x="600" y="690" font-size="36" font-weight="700">72 − 30 − 9 = 33</text></g></svg>
