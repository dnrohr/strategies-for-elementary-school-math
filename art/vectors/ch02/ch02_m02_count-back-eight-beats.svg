<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Count backward eight beats from fifteen to seven</title><desc id="desc">A number line from seven through fifteen shows eight separate leftward unit arrows. Eight numbered beat marks correspond to fourteen, thirteen, twelve, eleven, ten, nine, eight, and seven.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M10 0L0 5l10 5z" fill="#087E8B"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Eight backward beats</text><text x="64" y="110" font-size="24" fill="#52605A">15 is the start—not the first subtraction step.</text>
<path d="M130 440H1070" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="5"><path d="M150 420v40M262 420v40M374 420v40M486 420v40M598 420v40M710 420v40M822 420v40M934 420v40M1046 420v40"/></g><g text-anchor="middle" font-size="25" font-weight="700" fill="#24312D"><text x="150" y="500">7</text><text x="262" y="500">8</text><text x="374" y="500">9</text><text x="486" y="500">10</text><text x="598" y="500">11</text><text x="710" y="500">12</text><text x="822" y="500">13</text><text x="934" y="500">14</text><text x="1046" y="500">15</text></g>
<g stroke="#087E8B" stroke-width="6" marker-end="url(#a)"><path d="M1036 385H944"/><path d="M924 355H832"/><path d="M812 385H720"/><path d="M700 355H608"/><path d="M588 385H496"/><path d="M476 355H384"/><path d="M364 385H272"/><path d="M252 355H160"/></g>
<g text-anchor="middle" font-size="21" font-weight="700" fill="#D97706"><text x="990" y="320">beat 1</text><text x="878" y="290">2</text><text x="766" y="320">3</text><text x="654" y="290">4</text><text x="542" y="320">5</text><text x="430" y="290">6</text><text x="318" y="320">7</text><text x="206" y="290">8</text></g>
<rect x="420" y="600" width="360" height="90" rx="45" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="600" y="658" text-anchor="middle" font-size="36" font-weight="700" fill="#24312D">15 − 8 = 7</text></g></svg>
