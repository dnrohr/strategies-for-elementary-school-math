<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Seven fingers become ten, with two counters from the added five remaining</title>
  <desc id="desc">Three equal panels use consistently scaled, anatomically plausible illustrated hands. The first shows seven raised fingers. The second shows ten raised fingers and exactly three teal arrows. The third shows ten raised fingers plus exactly two orange counters, explicitly identified as the part of the added five not used to make ten.</desc>
  <image href="../../raster/ch01/ch01_m04_fingers-make-ten_raster.png" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid meet"/>
  <g font-family="Trebuchet MS, Arial, sans-serif" text-anchor="middle" fill="#24312D">
    <g transform="translate(45 25)"><rect width="300" height="66" rx="28" fill="#FFFDF8" fill-opacity=".94" stroke="#2764B8" stroke-width="4"/><text x="150" y="43" font-size="27" font-weight="700">1 · show 7 fingers</text></g>
    <g transform="translate(450 25)"><rect width="300" height="66" rx="28" fill="#FFFDF8" fill-opacity=".94" stroke="#087E8B" stroke-width="4"/><text x="150" y="43" font-size="27" font-weight="700">2 · add 3 → make 10</text></g>
    <g transform="translate(855 25)"><rect width="300" height="66" rx="28" fill="#FFFDF8" fill-opacity=".94" stroke="#287A55" stroke-width="4"/><text x="150" y="43" font-size="27" font-weight="700">3 · 10 + 2 = 12</text></g>
    <rect x="335" y="710" width="830" height="60" rx="22" fill="#FFFDF8" fill-opacity=".95" stroke="#D97706" stroke-width="3"/><text x="750" y="748" font-size="23" font-weight="700">the 2 counters are the part of the added 5 not used to make ten</text>
  </g>
</svg>
