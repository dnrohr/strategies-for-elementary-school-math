<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Exact lattice multiplication for twenty-seven times forty-six</title><desc id="desc">A two-by-two lattice places 27 across the top and 46 down the side. Cell products are 08, 28, 12, and 42. Right-to-left diagonal sums produce 2, then 14 writing 4 carry 1, then 12 writing 2 carry 1, then 1, yielding 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Lattice: every digit product stays visible</text><g stroke="#18324A" stroke-width="5" fill="#FFFDF8"><rect x="250" y="170" width="500" height="500"/><path d="M500 170v500M250 420h500M250 170l250 250M500 170l250 250M250 420l250 250M500 420l250 250"/></g><g font-family="Arial,sans-serif" font-size="45" font-weight="700" text-anchor="middle" fill="#18324A"><text x="375" y="145">2</text><text x="625" y="145">7</text><text x="790" y="315">4</text><text x="790" y="565">6</text></g><g font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A"><text x="285" y="230">0</text><text x="455" y="385">8</text><text x="535" y="230">2</text><text x="705" y="385">8</text><text x="285" y="480">1</text><text x="455" y="635">2</text><text x="535" y="480">4</text><text x="705" y="635">2</text></g><rect x="840" y="175" width="300" height="490" rx="25" fill="#FFFDF8" stroke="#7652A8" stroke-width="4" stroke-dasharray="12 8"/><g font-family="Arial,sans-serif" fill="#18324A"><text x="880" y="235" font-size="24" font-weight="700">Cell products</text><text x="880" y="285" font-size="24">2×4 = 08</text><text x="880" y="325" font-size="24">7×4 = 28</text><text x="880" y="365" font-size="24">2×6 = 12</text><text x="880" y="405" font-size="24">7×6 = 42</text><text x="880" y="470" font-size="23" font-weight="700">Diagonals, right → left</text><text x="880" y="512" font-size="22">2</text><text x="880" y="550" font-size="22">14 → write 4, carry 1</text><text x="880" y="588" font-size="22">12 → write 2, carry 1</text><text x="880" y="626" font-size="22">1</text></g><text x="500" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#347C5A">1,242</text></svg>
