<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">A remembered multiplication-table phrase</title><desc id="desc">A subtle horizontal thought ribbon carries the selectable words eleven twelves are one hundred thirty-two. Eleven evenly spaced cadence marks lead to the exact written fact without a cartoon speech-bubble tail.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">A remembered table phrase</text>
  <rect x="100" y="160" width="1000" height="155" rx="70" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><path d="M140 235Q300 205 460 235T780 235T1060 235" fill="none" stroke="#7652A8" stroke-width="2" opacity=".35"/><text x="600" y="250" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="38" font-weight="700">“eleven twelves are one hundred thirty-two”</text>
  <path d="M155 420H1045" stroke="#C66A12" stroke-width="4" stroke-dasharray="5 28"/><g fill="#C66A12"><circle cx="155" cy="420" r="6"/><circle cx="244" cy="420" r="6"/><circle cx="333" cy="420" r="6"/><circle cx="422" cy="420" r="6"/><circle cx="511" cy="420" r="6"/><circle cx="600" cy="420" r="6"/><circle cx="689" cy="420" r="6"/><circle cx="778" cy="420" r="6"/><circle cx="867" cy="420" r="6"/><circle cx="956" cy="420" r="6"/><circle cx="1045" cy="420" r="6"/></g><text x="600" y="480" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">eleven evenly tracked beats</text>
  <rect x="300" y="560" width="600" height="130" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#347C5A">11 × 12 = 132</text></svg>
