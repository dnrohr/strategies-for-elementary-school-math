<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Move exactly four units from 247 to 596</title><desc id="desc">A before panel shows addends 378, 596, and 247 with exactly four outlined unit tokens beside 247. A motion arrow carries those four tokens to 596. The after panel reads 378 plus 600 plus 243, preserving the total 1,221.</desc><defs><circle id="u" r="17" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Concrete transfer: four visible units move</text><rect x="70" y="145" width="470" height="470" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="305" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">BEFORE</text><text x="305" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700">378 + 596 + 247</text><g><use href="#u" x="215" y="430"/><use href="#u" x="275" y="430"/><use href="#u" x="335" y="430"/><use href="#u" x="395" y="430"/></g><text x="305" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="26">exactly 4 units from 247</text><path d="M550 385h90" stroke="#7652A8" stroke-width="8" marker-end="url(#a)"/><text x="595" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#553A78">move 4</text><rect x="670" y="145" width="460" height="470" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="900" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">AFTER</text><text x="900" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700">378 + 600 + 243</text><text x="900" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="29">596 + 4 = 600</text><text x="900" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="29">247 − 4 = 243</text><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">378 + 596 + 247 = 378 + 600 + 243 = 1,221</text></svg>
