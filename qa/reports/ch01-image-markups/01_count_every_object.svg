<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 1 count every object</title><desc id="d">Three numbered callouts identify the inaccurate touch path, misleading endpoint, and excess grouping furniture.</desc>
  <image href="../../../art/vectors/ch01/ch01_m01_count-every-object.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><ellipse cx="560" cy="420" rx="450" ry="125"/><circle cx="985" cy="410" r="70"/><path d="M90 270h950M210 580h700"/></g>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="565" cy="420" r="28"/><circle cx="1040" cy="390" r="28"/><circle cx="1040" cy="270" r="28"/></g><g fill="#fff" font-size="28"><text x="565" y="430">1</text><text x="1040" y="400">2</text><text x="1040" y="280">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 01 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · MAJOR: path order</tspan><tspan x="1240" dy="32">The trail does not visibly touch</tspan><tspan x="1240" dy="29">counters 1 through 12 in order.</tspan><tspan x="1240" dy="62" font-weight="700">2 · MAJOR: wrong endpoint</tspan><tspan x="1240" dy="32">The arrow ends near 7; the final</tspan><tspan x="1240" dy="29">count word must end on 12.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Simplify grouping</tspan><tspan x="1240" dy="32">Demote brackets so the one-to-one</tspan><tspan x="1240" dy="29">touch sequence becomes primary.</tspan></text></g>
</svg>
