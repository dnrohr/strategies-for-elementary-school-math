<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Twenty-four objects arranged as four groups of six</title><desc id="desc">Four large outlined cards each contain exactly six countable circles in a two-by-three arrangement. Braces and labels identify groups one through four, and the equality six plus six plus six plus six equals twenty-four is prominent.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Four clearly countable groups of six</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="65" y="175" width="245" height="340" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="187" y="230" font-size="25" font-weight="700">group 1</text><g fill="#B9D8D5" stroke="#18324A" stroke-width="3"><circle cx="130" cy="285" r="24"/><circle cx="245" cy="285" r="24"/><circle cx="130" cy="360" r="24"/><circle cx="245" cy="360" r="24"/><circle cx="130" cy="435" r="24"/><circle cx="245" cy="435" r="24"/></g><text x="187" y="490" font-size="27">6 objects</text><rect x="350" y="175" width="245" height="340" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="472" y="230" font-size="25" font-weight="700">group 2</text><g fill="#B9D8D5" stroke="#18324A" stroke-width="3"><circle cx="415" cy="285" r="24"/><circle cx="530" cy="285" r="24"/><circle cx="415" cy="360" r="24"/><circle cx="530" cy="360" r="24"/><circle cx="415" cy="435" r="24"/><circle cx="530" cy="435" r="24"/></g><text x="472" y="490" font-size="27">6 objects</text><rect x="635" y="175" width="245" height="340" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="757" y="230" font-size="25" font-weight="700">group 3</text><g fill="#B9D8D5" stroke="#18324A" stroke-width="3"><circle cx="700" cy="285" r="24"/><circle cx="815" cy="285" r="24"/><circle cx="700" cy="360" r="24"/><circle cx="815" cy="360" r="24"/><circle cx="700" cy="435" r="24"/><circle cx="815" cy="435" r="24"/></g><text x="757" y="490" font-size="27">6 objects</text><rect x="920" y="175" width="245" height="340" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="1042" y="230" font-size="25" font-weight="700">group 4</text><g fill="#B9D8D5" stroke="#18324A" stroke-width="3"><circle cx="985" cy="285" r="24"/><circle cx="1100" cy="285" r="24"/><circle cx="985" cy="360" r="24"/><circle cx="1100" cy="360" r="24"/><circle cx="985" cy="435" r="24"/><circle cx="1100" cy="435" r="24"/></g><text x="1042" y="490" font-size="27">6 objects</text></g>
  <g class="four-group-brackets" fill="none" stroke="#176B73" stroke-width="4"><path d="M80 525v20h215v-20"/><path d="M365 525v20h215v-20"/><path d="M650 525v20h215v-20"/><path d="M935 525v20h215v-20"/></g>
  <text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="37" font-weight="700">6 + 6 + 6 + 6 = 24</text><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">24 ÷ 6 = 4 groups</text></svg>
