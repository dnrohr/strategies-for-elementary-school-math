<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Seven horizontal rows of nine square units</title><desc id="desc">An exact seven-by-nine square grid has seven alternating horizontal bands and nine visible columns. Exterior running row totals are 9, 18, 27, 36, 45, 54, and 63.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Seven equal rows, nine in each</text>
    <g class="seven-row-bands" stroke="#24312D" stroke-width="4"><rect x="285" y="150" width="630" height="70" fill="#E7EEF8"/><rect x="285" y="220" width="630" height="70" fill="#E8F3ED"/><rect x="285" y="290" width="630" height="70" fill="#E7EEF8"/><rect x="285" y="360" width="630" height="70" fill="#E8F3ED"/><rect x="285" y="430" width="630" height="70" fill="#E7EEF8"/><rect x="285" y="500" width="630" height="70" fill="#E8F3ED"/><rect x="285" y="570" width="630" height="70" fill="#E7EEF8"/></g>
    <path d="M355 150v490M425 150v490M495 150v490M565 150v490M635 150v490M705 150v490M775 150v490M845 150v490" stroke="#24312D" stroke-width="3"/><g font-size="24" font-weight="700"><text x="980" y="193">9</text><text x="980" y="263">18</text><text x="980" y="333">27</text><text x="980" y="403">36</text><text x="980" y="473">45</text><text x="980" y="543">54</text><text x="980" y="613">63</text></g><text x="600" y="710" font-size="31" font-weight="700">9 + 9 + 9 + 9 + 9 + 9 + 9 = 63</text></g>
</svg>
