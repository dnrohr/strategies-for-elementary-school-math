<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Division and multiplication form an inverse fact family</title><desc id="desc">Three horizontal equation cards show six times four equals twenty-four, four times six equals twenty-four, and twenty-four divided by six equals four. Thin equality connectors and a verification brace replace the geometric triangle.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Division asks for a missing factor</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="70" y="210" width="300" height="190" rx="28" fill="#FFF3DF" stroke="#C66A12" stroke-width="5"/><text x="220" y="325" font-size="39" font-weight="700">6 × 4 = 24</text><rect x="450" y="210" width="300" height="190" rx="28" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="325" font-size="39" font-weight="700">4 × 6 = 24</text><rect x="830" y="210" width="300" height="190" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="980" y="325" font-size="39" font-weight="700">24 ÷ 6 = 4</text></g><text x="410" y="320" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="42">=</text><text x="790" y="320" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="42">=</text>
  <path d="M70 485v35h1060v-35" fill="none" stroke="#176B73" stroke-width="5"/><text x="600" y="585" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="30">The multiplication facts verify the quotient.</text><text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#347C5A">6 groups of 4 and 4 groups of 6 both make 24</text></svg>
