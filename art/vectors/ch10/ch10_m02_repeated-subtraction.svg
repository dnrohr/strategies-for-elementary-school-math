<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Four subtraction jumps of five leave three</title>
  <desc id="desc">A number line shows exactly four leftward jumps: twenty-three to eighteen, eighteen to thirteen, thirteen to eight, and eight to three. Each jump removes one group of five; three remains.</desc>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">One group of five per jump</text><path d="M160 520H1040" stroke="#18324A" stroke-width="7"/>
  <g stroke="#18324A" stroke-width="5"><path d="M180 490v60M380 490v60M580 490v60M780 490v60M980 490v60"/></g><g font-family="Arial,sans-serif" font-size="27" text-anchor="middle" fill="#18324A"><text x="180" y="600">3</text><text x="380" y="600">8</text><text x="580" y="600">13</text><text x="780" y="600">18</text><text x="980" y="600">23</text></g>
  <g fill="none" stroke="#7652A8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M970 475Q880 250 790 475"/><path d="M770 475Q680 250 590 475"/><path d="M570 475Q480 250 390 475"/><path d="M370 475Q280 250 190 475"/></g><g fill="#7652A8"><path d="M790 475L805 458 791 452Z"/><path d="M590 475L605 458 591 452Z"/><path d="M390 475L405 458 391 452Z"/><path d="M190 475L205 458 191 452Z"/><circle cx="780" cy="520" r="8"/><circle cx="580" cy="520" r="8"/><circle cx="380" cy="520" r="8"/><circle cx="180" cy="520" r="8"/></g><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#553A78"><text x="880" y="280">−5</text><text x="680" y="280">−5</text><text x="480" y="280">−5</text><text x="280" y="280">−5</text></g><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#7A2525">23 → 18 → 13 → 8 → 3 · four groups, remainder 3</text>
</svg>
