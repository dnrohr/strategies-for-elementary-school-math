<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Three fourths plus two thirds plus five twelfths</title><desc id="desc">Three spacious twelve-cell bars show nine twelfths, eight twelfths, and five twelfths using color plus distinct patterns. One compact calculation adds the unit counts to twenty-two twelfths and simplifies to eleven sixths.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Rename once; add the same-size units</text>
  <defs><pattern id="g" width="60" height="70" patternUnits="userSpaceOnUse"><path d="M60 0V70" stroke="#18324A" stroke-width="2" opacity=".45"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C66A12" stroke-width="3"/></pattern></defs>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="28"><text x="65" y="205">3/4 = 9/12</text><rect x="300" y="155" width="720" height="70" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><rect x="300" y="155" width="540" height="70" fill="#B9D8D5"/><rect x="300" y="155" width="720" height="70" fill="url(#g)"/>
  <text x="65" y="340">2/3 = 8/12</text><rect x="300" y="290" width="720" height="70" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><rect x="300" y="290" width="480" height="70" fill="url(#h)"/><rect x="300" y="290" width="720" height="70" fill="url(#g)"/>
  <text x="65" y="475">5/12</text><rect x="300" y="425" width="720" height="70" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><rect x="300" y="425" width="300" height="70" fill="#347C5A"/><rect x="300" y="425" width="720" height="70" fill="url(#g)"/></g>
  <rect x="215" y="575" width="770" height="125" rx="27" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="630" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">(9 + 8 + 5)/12 = 22/12</text><text x="600" y="678" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">= 11/6 = 1 5/6</text><text x="600" y="760" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">All three bars preserve one equal whole.</text></svg>
