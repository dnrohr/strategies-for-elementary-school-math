<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">A repeating decimal verifies but does not replace the exact fraction</title><desc id="desc">A clearly labeled verification display shows 2 divided by 3 plus 5 divided by 8 equals 1.291666 repeating. Beside it, an exact card derives 16 twenty-fourths plus 15 twenty-fourths equals 31 twenty-fourths. Approximate and exact representations remain separate.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Use the decimal as a check</text><rect x="70" y="150" width="500" height="470" rx="30" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/><text x="320" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#553A78">DECIMAL VERIFICATION</text><rect x="125" y="270" width="390" height="160" rx="18" fill="#FFFDF8" stroke="#7652A8" stroke-width="4"/><text x="320" y="340" text-anchor="middle" font-family="monospace" font-size="29" fill="#18324A">2 ÷ 3 + 5 ÷ 8</text><text x="320" y="400" text-anchor="middle" font-family="monospace" font-size="38" font-weight="700" fill="#C66A12">1.291666…</text><text x="320" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">repeating / approximate display</text><rect x="630" y="150" width="500" height="470" rx="30" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="880" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#12545A">EXACT EXPLANATION</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><text x="880" y="315" font-size="34">2/3 = 16/24</text><text x="880" y="385" font-size="34">5/8 = 15/24</text><path d="M740 420h280" stroke="#18324A" stroke-width="4"/><text x="880" y="490" font-size="39" font-weight="700">31/24</text><text x="880" y="555" font-size="32" fill="#347C5A">= 1 7/24</text><text x="600" y="715" font-size="25" fill="#5A6570">The decimal checks scale; twenty-fourths establish exactness.</text></g></svg>
