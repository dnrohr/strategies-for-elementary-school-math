<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 2 count on from seven</title><desc id="d">Three callouts recommend clearer tracking marks, lighter arrows, and less repetition.</desc><image href="../../../art/vectors/ch01/ch01_m02_count-on-from-seven.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="355" y="490" width="630" height="90" rx="28"/><ellipse cx="700" cy="385" rx="360" ry="105"/><rect x="70" y="680" width="1060" height="78" rx="20"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1010" cy="540" r="28"/><circle cx="1040" cy="350" r="28"/><circle cx="1100" cy="690" r="28"/></g><g fill="#fff" font-size="28"><text x="1010" y="550">1</text><text x="1040" y="360">2</text><text x="1100" y="700">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 02 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Tracking marks</tspan><tspan x="1240" dy="32">Empty rounded boxes resemble fields.</tspan><tspan x="1240" dy="29">Use taps, dots, or fingertip marks.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Landing hierarchy</tspan><tspan x="1240" dy="32">Make endpoints stronger and arrow</tspan><tspan x="1240" dy="29">heads lighter.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Remove repetition</tspan><tspan x="1240" dy="32">Keep one summary: sequence or</tspan><tspan x="1240" dy="29">equation, not two equal rails.</tspan></text></g>
</svg>
