<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Method 13: Write a tiny mental make-ten algorithm</title>
  <desc id="desc">A vector-only imagined page contains four selectable equation lines: seven plus five; five equals three plus two; seven plus three equals ten; and ten plus two equals twelve. Dotted connectors label the actions split, make ten, and add what remains.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M0 0L10 5 0 10Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:21px;font-weight:700}.line{font-size:36px;font-weight:700}.math{font-size:34px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 13 · VISUAL-SYMBOLIC</text><text x="70" y="116" class="heading">A tiny written workspace</text><text x="70" y="154" class="sub">The imagined marks show the route; decomposition supplies the reason.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="160" y="226" width="720" height="378" rx="22" fill="#FFFDF8" stroke="#2764B8" stroke-width="5"/><path d="M205 310h630M205 392h630M205 474h630M205 556h630" stroke="#D7D0C4" stroke-width="4"/>
  <text x="240" y="286" class="line">7 + 5</text><text x="240" y="368" class="line">5 = 3 + 2</text><text x="240" y="450" class="line">7 + 3 = 10</text><text x="240" y="532" class="line" fill="#287A55">10 + 2 = 12</text>
  <g fill="none" stroke="#7652A8" stroke-width="5" stroke-dasharray="4 12" marker-end="url(#arrow)"><path d="M530 276h230"/><path d="M530 358h230"/><path d="M530 440h230"/></g><g class="label"><text x="550" y="258">split 5</text><text x="550" y="340">make ten</text><text x="550" y="422">add what remains</text></g>
  <g aria-label="non-countable pen-nib cue"><path d="M1000 405l42 42-58 58-28 9 9-28Z" fill="#F1EAF8" stroke="#7652A8" stroke-width="6"/><path d="M965 486l19 19M956 514l38-9" fill="none" stroke="#7652A8" stroke-width="5"/></g><text x="1000" y="550" class="label" text-anchor="middle">imagined writing</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 = 7 + 3 + 2 = 10 + 2 = 12</text>
</svg>
