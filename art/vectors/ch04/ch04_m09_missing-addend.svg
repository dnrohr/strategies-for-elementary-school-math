<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Find the missing addend from thirty-nine to seventy-two</title><desc id="desc">The equation thirty-nine plus a blank equals seventy-two becomes a two-step route: add thirty to reach sixty-nine, then add three to reach seventy-two. The blank fills with thirty-three.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Turn subtraction into related addition</text><rect x="300" y="125" width="600" height="100" rx="25" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="600" y="190" font-size="42" font-weight="700">39 + □ = 72</text><g font-size="48" font-weight="700"><circle cx="180" cy="430" r="90" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="180" y="448">39</text><circle cx="600" cy="430" r="90" fill="#F7EFE3" stroke="#D97706" stroke-width="7"/><text x="600" y="448">69</text><circle cx="1020" cy="430" r="95" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="1020" y="448">72</text></g><path d="M280 430H495M700 430H915" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10"/><text x="390" y="385" font-size="29">+30</text><text x="810" y="385" font-size="29">+3</text><text x="600" y="680" font-size="36" font-weight="700">□ = 30 + 3 = 33 · 39 + 33 = 72</text></g></svg>
