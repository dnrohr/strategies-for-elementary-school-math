<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Trade one ten in seventy-two before subtracting thirty-nine</title><desc id="desc">A place-value sequence rewrites seven tens and two ones as six tens and twelve ones, removes three tens and nine ones, and leaves three tens and three ones, or thirty-three.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Regroup before subtracting</text><g font-size="30" font-weight="700"><rect x="60" y="175" width="300" height="180" rx="25" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="210" y="250">72</text><text x="210" y="305">7 tens + 2 ones</text><path d="M390 265H475" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10"/><rect x="505" y="175" width="320" height="180" rx="25" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="665" y="245">60 + 12</text><text x="665" y="305">6 tens + 12 ones</text><path d="M855 265H930" stroke="#C2413B" stroke-width="7" stroke-dasharray="12 8"/><rect x="955" y="160" width="190" height="210" rx="30" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="1050" y="250">33</text><text x="1050" y="305">3T + 3O</text></g><rect x="260" y="470" width="680" height="150" rx="25" fill="#F7ECEA" stroke="#C2413B" stroke-width="6"/><text x="600" y="530" font-size="30" font-weight="700">remove 39 = 3 tens + 9 ones</text><text x="600" y="580" font-size="29">12 − 9 = 3 · 6 − 3 = 3</text><text x="600" y="710" font-size="36" font-weight="700">72 = 60 + 12 · 72 − 39 = 33</text></g></svg>
