<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A twenty-seven by forty-six array grouped into forty and six columns</title>
  <desc id="desc">A proportioned rectangle represents 27 rows by 46 columns. Grouped edge ticks identify 27 rows and the width split 40 plus 6; the diagram intentionally avoids drawing 1,242 tiny objects. Areas are 1,080 and 162, totaling 1,242.</desc>
  <defs><pattern id="rows" height="14" width="20" patternUnits="userSpaceOnUse"><path d="M0 14H20" stroke="#18324A" stroke-width="1"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#176B73" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">27 rows × 46 columns</text><text x="70" y="128" font-family="Arial,sans-serif" font-size="21" fill="#5A6570">Grouped grid lines encode dimensions; individual unit squares are intentionally omitted.</text>
  <rect x="210" y="170" width="696" height="378" fill="#F2B35F"/><rect x="906" y="170" width="104.4" height="378" fill="url(#h)"/><rect x="210" y="170" width="800.4" height="378" fill="url(#rows)" stroke="#18324A" stroke-width="5"/><path d="M906 170v378" stroke="#18324A" stroke-width="6"/>
  <text x="558" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700">27 × 40 = 1,080</text><text x="958" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700">27 × 6</text><text x="958" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">= 162</text>
  <path d="M175 170h-30v378h30M210 595v35h696v-35M906 595v35h104v-35" fill="none" stroke="#18324A" stroke-width="4"/><text x="110" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">27</text><text x="558" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">40 columns</text><text x="958" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">6</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text>
</svg>
