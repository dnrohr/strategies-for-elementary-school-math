<svg data-qa-image-pass="2026-09-29" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Thirty groups of forty-six split into twenty-seven kept and three removed</title><desc id="desc">Three large blocks each begin as ten groups of forty-six. The final block is partitioned into seven kept groups and a hatched three-group correction, so twenty-seven groups remain. Equations verify 1,380 minus 138 equals 1,242.</desc><defs><pattern id="removed" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#B33A3A" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Use 30 groups, then remove exactly 3</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><g transform="translate(80 180)"><rect width="285" height="240" rx="20" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><text x="142" y="105" font-size="31" font-weight="700">10 × 46</text><text x="142" y="155" font-size="27">460</text></g><g transform="translate(395 180)"><rect width="285" height="240" rx="20" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><text x="142" y="105" font-size="31" font-weight="700">10 × 46</text><text x="142" y="155" font-size="27">460</text></g><g transform="translate(710 180)"><rect width="285" height="240" rx="20" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><path d="M0 168H285V220Q285 240 265 240H20Q0 240 0 220Z" fill="#F8E5E1"/><path d="M0 168H285V220Q285 240 265 240H20Q0 240 0 220Z" fill="url(#removed)" opacity=".7"/><line x1="0" y1="168" x2="285" y2="168" stroke="#B33A3A" stroke-width="5" stroke-dasharray="12 8"/><text x="142" y="35" font-size="22" font-weight="700">10 × 46</text><text x="142" y="64" font-size="21">460</text><text x="142" y="105" font-size="27" font-weight="700">keep 7 × 46</text><text x="142" y="140" font-size="24">= 322</text><text x="142" y="198" font-size="22" font-weight="700" fill="#7A2525">remove 3 × 46 = 138</text></g></g>
  <text x="600" y="515" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31">30 × 46 = 1,380</text><text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" fill="#5A6570" font-size="27">10 + 10 + 7 kept = 27 groups</text><text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#347C5A">1,380 − 138 = 1,242</text></svg>
