<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Check 63 against a seven-by-ten benchmark</title><desc id="desc">An exact seven-by-ten grid labeled 70 is compared with an exact seven-by-nine grid labeled 63. One complete column of seven visible cells is hatched as the exact difference.</desc>
  <defs><pattern id="ten-grid" x="80" y="180" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#E7EEF8" stroke="#24312D" stroke-width="1.5"/></pattern><pattern id="nine-grid" x="720" y="180" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#E8F3ED" stroke="#24312D" stroke-width="1.5"/></pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C2413B" stroke-width="3"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Use 70 as an exact benchmark check</text>
    <rect class="seven-by-ten" x="80" y="180" width="400" height="280" fill="url(#ten-grid)" stroke="#2764B8" stroke-width="6"/><rect class="seven-cell-difference" x="440" y="180" width="40" height="280" fill="url(#hatch)" stroke="#C2413B" stroke-width="6"/><text x="280" y="525" font-size="30" font-weight="700">7 × 10 = 70</text><text x="460" y="555" font-size="21" fill="#C2413B" font-weight="700">7 cells</text>
    <path d="M535 320H660" stroke="#7652A8" stroke-width="7" marker-end="url(#arrow)"/><text x="595" y="285" font-size="22" fill="#7652A8" font-weight="700">remove 7</text>
    <rect class="seven-by-nine" x="720" y="180" width="360" height="280" fill="url(#nine-grid)" stroke="#287A55" stroke-width="8"/><text x="900" y="525" font-size="30" font-weight="700">7 × 9 = 63</text>
    <text x="600" y="680" font-size="38" font-weight="700">70 − 7 = 63 square units</text>
  </g>
</svg>
