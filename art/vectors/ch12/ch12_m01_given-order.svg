<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Add the three numbers in their given order</title><desc id="desc">A running-total route adds 378 and 596 to make 974, then adds 247 to reach the exact total 1,221. Directional arrows and numbered stages prevent double-counting.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Keep one running total</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="245" width="245" height="180" rx="25" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="198" y="310" font-size="22">1 · start</text><text x="198" y="380" font-size="48" font-weight="700">378</text><path d="M335 335h150" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="410" y="295" font-size="26" fill="#553A78">+596</text><rect x="510" y="245" width="245" height="180" rx="25" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="633" y="310" font-size="22">2 · subtotal</text><text x="633" y="380" font-size="48" font-weight="700">974</text><path d="M770 335h150" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="845" y="295" font-size="26" fill="#553A78">+247</text><rect x="945" y="245" width="205" height="180" rx="25" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="1048" y="310" font-size="22">3 · total</text><text x="1048" y="380" font-size="48" font-weight="700">1,221</text><text x="600" y="560" font-size="37" font-weight="700" fill="#18324A">(378 + 596) + 247 = 974 + 247 = 1,221</text><text x="600" y="650" font-size="25" fill="#5A6570">Each addend enters exactly once.</text></g></svg>
