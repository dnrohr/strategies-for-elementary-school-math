<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Written partial products align 162 and 1,080</title><desc id="desc">A place-value column shows 27 times 46. The ones partial product 27 times 6 equals 162 and the tens partial product 27 times 40 equals 1,080 are right-aligned. Their exact sum is 1,242.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="75" y="90" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Written partial products</text><rect x="300" y="135" width="600" height="560" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><g font-family="monospace" font-size="52" fill="#18324A" text-anchor="end"><text x="700" y="235">27</text><text x="700" y="310">× 46</text><path d="M440 335h290" stroke="#18324A" stroke-width="5"/><text x="700" y="410">162</text><text x="700" y="490">1,080</text><path d="M400 520h330" stroke="#18324A" stroke-width="5"/><text x="700" y="610" font-weight="700">1,242</text></g><g font-family="Arial,sans-serif" font-size="24"><text x="755" y="405" fill="#8A4308">27 × 6</text><text x="755" y="485" fill="#12545A">27 × 40</text><text x="755" y="605" fill="#347C5A">exact total</text></g><path d="M520 650v25h180v-25" fill="none" stroke="#7652A8" stroke-width="4"/><text x="610" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#553A78">ones, tens, hundreds, thousands aligned</text></svg>
