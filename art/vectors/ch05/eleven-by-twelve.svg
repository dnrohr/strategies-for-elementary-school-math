<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Eleven times twelve as ten rows plus one row</title><desc id="desc">A large grouped array uses a ten-row block plus one separate row of twelve, making the 10 plus 1 structure auditable without asking the reader to count 132 tiny dots. A side panel also splits twelve into ten plus two.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">11 × 12 = 132 · see the grouped structure</text>
  <rect x="65" y="145" width="720" height="520" rx="26" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="425" y="200" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28" font-weight="700">10 rows of 12, then 1 more row</text><rect x="130" y="245" width="590" height="250" fill="#B9D8D5" stroke="#18324A" stroke-width="5"/><g stroke="#18324A" stroke-width="2" opacity=".45"><path d="M130 270H720"/><path d="M130 295H720"/><path d="M130 320H720"/><path d="M130 345H720"/><path d="M130 370H720"/><path d="M130 395H720"/><path d="M130 420H720"/><path d="M130 445H720"/><path d="M130 470H720"/><path d="M179 245v250"/><path d="M228 245v250"/><path d="M277 245v250"/><path d="M326 245v250"/><path d="M375 245v250"/><path d="M424 245v250"/><path d="M473 245v250"/><path d="M522 245v250"/><path d="M571 245v250"/><path d="M620 245v250"/><path d="M669 245v250"/></g><rect x="130" y="525" width="590" height="40" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><g stroke="#18324A" stroke-width="2"><path d="M179 525v40"/><path d="M228 525v40"/><path d="M277 525v40"/><path d="M326 525v40"/><path d="M375 525v40"/><path d="M424 525v40"/><path d="M473 525v40"/><path d="M522 525v40"/><path d="M571 525v40"/><path d="M620 525v40"/><path d="M669 525v40"/></g><text x="425" y="620" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="31" font-weight="700">120 + 12 = 132</text>
  <rect x="835" y="145" width="300" height="520" rx="26" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="985" y="205" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28" font-weight="700">Split 12</text><rect x="890" y="270" width="180" height="130" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><rect x="1070" y="270" width="36" height="130" fill="#347C5A" stroke="#18324A" stroke-width="4"/><text x="980" y="345" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">10</text><text x="1088" y="345" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27" font-weight="700">2</text><text x="985" y="475" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="26">11 × 10 = 110</text><text x="985" y="525" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="26">11 × 2 = 22</text><text x="985" y="605" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="32" font-weight="700">110 + 22 = 132</text></svg>
