<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Seven plus five equals twelve</title>
  <desc id="desc">Seven orange units and five green units form a row of twelve units. A number line starts at seven and makes five one-unit jumps to twelve, showing that 7 plus 5 equals 12.</desc>
  <style>
    .ink { fill: #24312d; }
    .muted { fill: #5b6962; }
    .orange { fill: #d98b2b; stroke: #24312d; stroke-width: 3; }
    .green { fill: #347c5a; stroke: #24312d; stroke-width: 3; }
    .blue { fill: #467a9b; stroke: #24312d; stroke-width: 3; }
    .pale { fill: #f5efe3; stroke: #24312d; stroke-width: 3; }
    text { font-family: Georgia, serif; }
    .label { font-size: 31px; }
    .math { font-size: 40px; font-weight: 700; }
    .small { font-size: 21px; }
  </style>
  <rect width="1200" height="800" fill="#fffdf8"/>
  <text x="68" y="76" class="ink math">7 + 5 = 12</text>
  <text x="68" y="116" class="muted small">Count on five from seven, or combine two visible groups.</text>
  <rect x="68" y="160" width="720" height="470" rx="16" class="pale"/>
  <text x="96" y="210" class="ink label">Two groups · one total</text>
  <g aria-label="Seven orange units and five green units">
    <rect class="orange" x="96" y="270" width="70" height="70" rx="9"/><rect class="orange" x="176" y="270" width="70" height="70" rx="9"/><rect class="orange" x="256" y="270" width="70" height="70" rx="9"/><rect class="orange" x="336" y="270" width="70" height="70" rx="9"/><rect class="orange" x="416" y="270" width="70" height="70" rx="9"/><rect class="orange" x="496" y="270" width="70" height="70" rx="9"/><rect class="orange" x="576" y="270" width="70" height="70" rx="9"/>
    <rect class="green" x="96" y="370" width="70" height="70" rx="9"/><rect class="green" x="176" y="370" width="70" height="70" rx="9"/><rect class="green" x="256" y="370" width="70" height="70" rx="9"/><rect class="green" x="336" y="370" width="70" height="70" rx="9"/><rect class="green" x="416" y="370" width="70" height="70" rx="9"/>
  </g>
  <text x="96" y="494" class="ink label">7 units + 5 units = 12 units</text>
  <path d="M96 538h550" stroke="#24312d" stroke-width="2"/>
  <text x="96" y="590" class="muted small">The addends remain distinct; the total includes every unit once.</text>
  <rect x="840" y="160" width="292" height="470" rx="16" class="pale"/>
  <text x="868" y="212" class="ink label">Count on</text>
  <line x1="868" y1="340" x2="1080" y2="340" stroke="#24312d" stroke-width="4"/>
  <circle cx="868" cy="340" r="9" class="blue"/><circle cx="910" cy="340" r="9" class="blue"/><circle cx="952" cy="340" r="9" class="blue"/><circle cx="994" cy="340" r="9" class="blue"/><circle cx="1036" cy="340" r="9" class="blue"/><circle cx="1080" cy="340" r="9" class="blue"/>
  <text x="858" y="392" class="ink small">7</text><text x="900" y="392" class="ink small">8</text><text x="942" y="392" class="ink small">9</text><text x="980" y="392" class="ink small">10</text><text x="1025" y="392" class="ink small">11</text><text x="1068" y="392" class="ink small">12</text>
  <path d="M876 314h196" stroke="#467a9b" stroke-width="6"/>
  <text x="904" y="284" class="ink small">five +1 jumps</text>
  <path d="M868 456h220" stroke="#24312d" stroke-width="2"/>
  <text x="868" y="512" class="ink label">7 + 5 = 12</text>
  <text x="868" y="568" class="muted small">five steps, one total</text>
</svg>
