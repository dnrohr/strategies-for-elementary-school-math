<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Equal forty-unit bars show twenty-four fortieths and twenty-five fortieths</title>
  <desc id="desc">Two equal 800-unit bars are divided into forty exact 20-unit cells. Three fifths fills 24 cells; five eighths fills 25 cells. An outlined final cell marks the one-fortieth difference.</desc>
  <defs><pattern id="grid" x="230" width="20" height="100" patternUnits="userSpaceOnUse"><path d="M20 0V100" stroke="#18324A" stroke-width="2"/></pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#176B73" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="100" y="100" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18324A">Rename with one common unit</text>
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="27" fill="#18324A">3/5</text><rect x="230" y="210" width="480" height="100" fill="url(#hatch)"/><rect x="230" y="210" width="800" height="100" fill="url(#grid)" stroke="#18324A" stroke-width="5"/><text x="630" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#12545A">24/40</text>
  <text x="90" y="530" font-family="Arial, sans-serif" font-size="27" fill="#18324A">5/8</text><rect x="230" y="470" width="500" height="100" fill="#F2B35F"/><rect x="230" y="470" width="800" height="100" fill="url(#grid)" stroke="#18324A" stroke-width="5"/><rect x="710" y="470" width="20" height="100" fill="none" stroke="#B33A3A" stroke-width="7"/><text x="630" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#8A4308">25/40</text><text x="720" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7A2525">one more fortieth</text>
</svg>
