<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Equivalent schematic bundles represent forty and six</title><desc id="desc">Two equally schematic cards show one labeled forty-unit bundle and one labeled six-unit bundle. Each bundle is repeated twenty-seven times by notation, giving 1,080 and 162 without mixing literal singles and representative scale.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Use the same schematic scale for both parts of 46</text>
  <text x="64" y="120" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Written multiplicity gives the exact count; the cards are representative.</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="80" y="180" width="480" height="390" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><rect x="175" y="255" width="290" height="100" rx="18" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="320" y="318" font-size="31" font-weight="700">40-unit bundle</text><text x="320" y="440" font-size="35" font-weight="700">27 × 40</text><text x="320" y="505" font-size="35" fill="#12545A">= 1,080</text>
  <rect x="640" y="180" width="480" height="390" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><rect x="735" y="255" width="290" height="100" rx="18" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><text x="880" y="318" font-size="31" font-weight="700">6-unit bundle</text><text x="880" y="440" font-size="35" font-weight="700">27 × 6</text><text x="880" y="505" font-size="35" fill="#8A450D">= 162</text></g>
  <text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">27 × (40 + 6)</text></svg>
