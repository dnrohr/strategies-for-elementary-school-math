<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 6: Use five plus five, then add two</title>
  <desc id="desc">Two outlined cards each contain exactly five dots. A separate dashed group contains exactly two more dots. The two fives make ten, then two more make twelve. Seven plus five equals five plus five plus two equals twelve.</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><line y2="12" stroke="#D97706" stroke-width="5"/></pattern></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:23px;font-weight:700}.math{font-size:35px;font-weight:700}.dotA{fill:#2764B8;stroke:#174478;stroke-width:5}.dotB{fill:url(#hatch);stroke:#A95805;stroke-width:5}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 06 · NEAR-DOUBLE</text><text x="70" y="116" class="heading">Anchor on two fives</text><text x="70" y="154" class="sub">The familiar 5 + 5 makes ten; the extra two finish the sum.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <g aria-label="first card with five solid dots"><rect x="130" y="250" width="310" height="260" rx="24" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><circle class="dotA" cx="195" cy="315" r="27"/><circle class="dotA" cx="375" cy="315" r="27"/><circle class="dotA" cx="285" cy="380" r="27"/><circle class="dotA" cx="195" cy="445" r="27"/><circle class="dotA" cx="375" cy="445" r="27"/><text x="285" y="551" class="label" text-anchor="middle">five</text></g>
  <g aria-label="second card with five hatched dots"><rect x="470" y="250" width="310" height="260" rx="24" fill="#FFF9EF" stroke="#D97706" stroke-width="5"/><circle class="dotB" cx="535" cy="315" r="27"/><circle class="dotB" cx="715" cy="315" r="27"/><circle class="dotB" cx="625" cy="380" r="27"/><circle class="dotB" cx="535" cy="445" r="27"/><circle class="dotB" cx="715" cy="445" r="27"/><text x="625" y="551" class="label" text-anchor="middle">five</text></g>
  <g aria-label="two extra hatched dots"><rect x="840" y="295" width="230" height="170" rx="24" fill="#FFF9EF" stroke="#D97706" stroke-width="5" stroke-dasharray="12 10"/><circle class="dotB" cx="910" cy="380" r="30"/><circle class="dotB" cx="1000" cy="380" r="30"/><text x="955" y="520" class="label" text-anchor="middle">two extra</text></g>
  <path d="M130 583v22h650v-22" fill="none" stroke="#287A55" stroke-width="6"/><text x="455" y="631" class="label" text-anchor="middle">5 + 5 = 10</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 = (5 + 5) + 2 = 10 + 2 = 12</text>
</svg>
