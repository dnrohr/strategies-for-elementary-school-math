<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 12: Track five spoken counts with five rhythm markers</title>
  <desc id="desc">Seven is held as the starting count. Exactly five vertical tap markers align one-to-one with the spoken numbers eight, nine, ten, eleven, and twelve. The markers are exact tracking aids, not a measured tempo or a claim about auditory traits. Seven plus five equals twelve.</desc>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:21px;font-weight:700}.word{font-size:44px;font-weight:700;text-anchor:middle}.math{font-size:38px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 12 · VERBAL RHYTHM</text><text x="70" y="116" class="heading">One beat for each new number word</text><text x="70" y="154" class="sub">Five exact markers keep the count; they do not prescribe a tempo.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="92" y="258" width="160" height="250" rx="28" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="172" y="320" class="label" text-anchor="middle">held start</text><text x="172" y="422" class="word">7</text><text x="172" y="468" class="label" text-anchor="middle">no tap</text>
  <line x1="300" y1="520" x2="1080" y2="520" stroke="#68707A" stroke-width="4"/>
  <g aria-label="five exact rhythm markers"><rect x="332" y="366" width="70" height="154" rx="28" fill="#FFF3DF" stroke="#D97706" stroke-width="5"/><rect x="492" y="326" width="70" height="194" rx="28" fill="#FFF3DF" stroke="#D97706" stroke-width="5"/><rect x="652" y="286" width="70" height="234" rx="28" fill="#FFF3DF" stroke="#D97706" stroke-width="5"/><rect x="812" y="326" width="70" height="194" rx="28" fill="#FFF3DF" stroke="#D97706" stroke-width="5"/><rect x="972" y="366" width="70" height="154" rx="28" fill="#FFF3DF" stroke="#D97706" stroke-width="5"/></g>
  <g class="word"><text x="367" y="334">8</text><text x="527" y="294">9</text><text x="687" y="254">10</text><text x="847" y="294">11</text><text x="1007" y="334">12</text></g><g class="label" text-anchor="middle"><text x="367" y="572">tap 1</text><text x="527" y="572">tap 2</text><text x="687" y="572">tap 3</text><text x="847" y="572">tap 4</text><text x="1007" y="572">tap 5</text></g>
  <text x="687" y="620" class="label" text-anchor="middle">8 · 9 · 10 · 11 · 12 — one word per marker</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="105" y="731" class="math">7 + 5 = 12</text><text x="1092" y="730" class="label" text-anchor="end">5 beats · 5 increments</text>
</svg>
