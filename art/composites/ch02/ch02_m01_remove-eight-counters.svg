<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Move eight counters out of a fifteen-counter array</title>
  <desc id="desc">A plausible hand moves from a work mat toward a tray. The mat starts with fifteen counters in three rows of five: seven solid green counters remain and eight red hatched positions are marked to move. The tray contains exactly eight matching moved counters. Labels state that fifteen minus eight leaves seven.</desc>
  <defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C2413B" stroke-width="3"/></pattern><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker></defs>
  <image href="../../raster/ch02/ch02_m01_remove-eight-counters_raster.png" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
  <g font-family="Arial,sans-serif" fill="#24312D">
    <rect x="42" y="28" width="1116" height="74" rx="22" fill="#FFFDF8" fill-opacity=".94"/><text x="65" y="75" font-size="36" font-weight="700">Start with 15 · move exactly 8 · leave 7</text>
    <text x="325" y="145" text-anchor="middle" font-size="26" font-weight="700">START: 15 in a 3 × 5 array</text><text x="945" y="145" text-anchor="middle" font-size="26" font-weight="700">AFTER: 8 moved to the tray</text>
    <g stroke="#24312D" stroke-width="4">
      <g class="remaining-seven" fill="#287A55"><circle cx="145" cy="240" r="26"/><circle cx="235" cy="240" r="26"/><circle cx="325" cy="240" r="26"/><circle cx="415" cy="240" r="26"/><circle cx="505" cy="240" r="26"/><circle cx="145" cy="340" r="26"/><circle cx="235" cy="340" r="26"/></g>
      <g class="to-move-eight" fill="url(#h)" opacity=".72"><circle cx="325" cy="340" r="26"/><circle cx="415" cy="340" r="26"/><circle cx="505" cy="340" r="26"/><circle cx="145" cy="440" r="26"/><circle cx="235" cy="440" r="26"/><circle cx="325" cy="440" r="26"/><circle cx="415" cy="440" r="26"/><circle cx="505" cy="440" r="26"/></g>
      <g class="moved-eight" fill="url(#h)"><circle cx="815" cy="260" r="29"/><circle cx="945" cy="260" r="29"/><circle cx="1075" cy="260" r="29"/><circle cx="815" cy="385" r="29"/><circle cx="945" cy="385" r="29"/><circle cx="1075" cy="385" r="29"/><circle cx="880" cy="510" r="29"/><circle cx="1010" cy="510" r="29"/></g>
    </g>
    <path d="M515 555Q650 625 785 555" fill="none" stroke="#7652A8" stroke-width="4" stroke-dasharray="9 12" marker-end="url(#a)"/><text x="650" y="655" text-anchor="middle" font-size="24" font-weight="700" fill="#7652A8">move the 8 hatched counters</text>
    <rect x="350" y="684" width="500" height="78" rx="39" fill="#E8F3ED" fill-opacity=".95" stroke="#287A55" stroke-width="7"/><text x="600" y="735" text-anchor="middle" font-size="35" font-weight="700">15 − 8 = 7 remaining</text>
  </g>
</svg>
