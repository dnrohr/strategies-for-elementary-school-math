<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Round forty-six to fifty, then remove the exact correction</title><desc id="desc">A number line moves from 46 to the friendly value 50 by adding four per group. The calculation shows 27 times 50 equals 1,350, then removes the exact correction 27 times 4 equals 108, yielding 1,242.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="95" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Use 50, then correct</text><path d="M150 300H650" stroke="#18324A" stroke-width="7"/><path d="M200 270v60M600 270v60" stroke="#18324A" stroke-width="5"/><text x="200" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="30">46</text><text x="600" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="30">50</text><path d="M215 250Q400 100 585 250" fill="none" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="400" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#553A78">+4 per group</text><rect x="700" y="150" width="410" height="470" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#18324A"><text x="755" y="260" font-size="34">27 × 50 = 1,350</text><text x="755" y="360" font-size="34" fill="#7A2525">27 × 4 = 108</text><text x="755" y="420" font-size="22" fill="#5A6570">remove what rounding added</text><path d="M745 460h320" stroke="#18324A" stroke-width="4"/><text x="755" y="545" font-size="43" font-weight="700" fill="#347C5A">1,350 − 108</text><text x="840" y="600" font-size="43" font-weight="700" fill="#347C5A">= 1,242</text></g><text x="600" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#18324A">27 × (50 − 4) = 1,242</text></svg>
