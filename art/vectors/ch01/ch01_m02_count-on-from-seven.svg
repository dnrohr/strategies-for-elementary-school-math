<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 2: Count on five times from seven</title><desc id="desc">Seven is held as the start. Five equal one-unit jumps land on eight through twelve. Each landing has a tap dot immediately before its spoken number.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M0 0L8 4 0 8Z" fill="#087E8B"/></marker></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.n{font-size:24px;font-weight:700;text-anchor:middle}.tapword{font-size:22px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 02 · COUNT-ON</text><text x="70" y="116" class="h">Hold 7; count five more</text><text x="70" y="154" class="s">Each landing and each tap records one new number word.</text><rect x="64" y="190" width="1072" height="500" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="95" y="245" width="170" height="110" rx="24" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="180" y="282" class="l" text-anchor="middle">held start</text><text x="180" y="335" class="h" text-anchor="middle">7</text>
  <path d="M330 430H1060" stroke="#68707A" stroke-width="5"/><g stroke="#68707A" stroke-width="4"><path d="M360 400v60M500 400v60M640 400v60M780 400v60M920 400v60M1060 400v60"/></g><g fill="none" stroke="#087E8B" stroke-width="6" marker-end="url(#a)"><path d="M368 390q62-112 124 0"/><path d="M508 390q62-112 124 0"/><path d="M648 390q62-112 124 0"/><path d="M788 390q62-112 124 0"/><path d="M928 390q62-112 124 0"/></g>
  <g class="l" text-anchor="middle"><text x="430" y="300">+1</text><text x="570" y="300">+1</text><text x="710" y="300">+1</text><text x="850" y="300">+1</text><text x="990" y="300">+1</text></g><g class="n"><text x="360" y="500">7</text><text x="500" y="500">8</text><text x="640" y="500">9</text><text x="780" y="500">10</text><text x="920" y="500">11</text><text x="1060" y="500">12</text></g>
  <g fill="#FFF3DF" stroke="#D97706" stroke-width="4"><ellipse cx="482" cy="580" rx="11" ry="9"/><ellipse cx="622" cy="580" rx="11" ry="9"/><ellipse cx="762" cy="580" rx="11" ry="9"/><ellipse cx="902" cy="580" rx="11" ry="9"/><ellipse cx="1042" cy="580" rx="11" ry="9"/></g><g class="tapword"><text x="502" y="588">8</text><text x="642" y="588">9</text><text x="782" y="588">10</text><text x="922" y="588">11</text><text x="1062" y="588">12</text></g><text x="780" y="650" class="l" text-anchor="middle">five landings · five tap-and-say beats</text>
</svg>
