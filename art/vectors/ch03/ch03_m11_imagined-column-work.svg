<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">An imagined page performs exact column addition</title><desc id="desc">A translucent mental-workspace panel aligns thirty-seven over forty-eight, shows one carried ten, and ends at eighty-five. A dotted motion trace suggests imagined writing without depicting a hand.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 11 11"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">A calculation on an imagined page</text><rect x="280" y="125" width="640" height="560" rx="42" fill="#F4EBFA" fill-opacity=".65" stroke="#7652A8" stroke-width="6" stroke-dasharray="10 8"/><text x="600" y="175" text-anchor="middle" font-size="26" fill="#52605A">MENTAL WORKSPACE</text><g font-family="Consolas,monospace" font-size="82" text-anchor="end" fill="#24312D"><text x="675" y="325">37</text><text x="675" y="445">+48</text><path d="M420 480h300" stroke="#24312D" stroke-width="7"/><text x="675" y="600">85</text><text x="555" y="235" font-size="38" fill="#7652A8">1</text></g><path d="M770 260Q850 330 770 400T770 560" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="4 13" marker-end="url(#a)"/><text x="1000" y="340" text-anchor="middle" font-size="25" fill="#52605A">imagined</text><text x="1000" y="375" text-anchor="middle" font-size="25" fill="#52605A">writing trace</text><text x="150" y="325" text-anchor="middle" font-size="24" font-weight="700" fill="#D97706">7 + 8 = 15</text><text x="150" y="380" text-anchor="middle" font-size="26" fill="#7652A8">carry 1 ten</text></g></svg>
