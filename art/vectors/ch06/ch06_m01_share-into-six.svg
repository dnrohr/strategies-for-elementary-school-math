<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Share twenty-four counters into six equal groups</title><desc id="desc">Six outlined bowls each contain exactly four counters. The twenty-four counters are arranged as four complete dealing rounds across six groups, so the group size is four.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Known: 6 groups · Find: how many in each</text><g fill="#F7F0E5" stroke="#2764B8" stroke-width="6"><rect x="55" y="155" width="340" height="230" rx="28"/><rect x="430" y="155" width="340" height="230" rx="28"/><rect x="805" y="155" width="340" height="230" rx="28"/><rect x="55" y="425" width="340" height="230" rx="28"/><rect x="430" y="425" width="340" height="230" rx="28"/><rect x="805" y="425" width="340" height="230" rx="28"/></g><g fill="#287A55" stroke="#24312D" stroke-width="4"><circle cx="155" cy="245" r="27"/><circle cx="295" cy="245" r="27"/><circle cx="155" cy="315" r="27"/><circle cx="295" cy="315" r="27"/><circle cx="530" cy="245" r="27"/><circle cx="670" cy="245" r="27"/><circle cx="530" cy="315" r="27"/><circle cx="670" cy="315" r="27"/><circle cx="905" cy="245" r="27"/><circle cx="1045" cy="245" r="27"/><circle cx="905" cy="315" r="27"/><circle cx="1045" cy="315" r="27"/><circle cx="155" cy="515" r="27"/><circle cx="295" cy="515" r="27"/><circle cx="155" cy="585" r="27"/><circle cx="295" cy="585" r="27"/><circle cx="530" cy="515" r="27"/><circle cx="670" cy="515" r="27"/><circle cx="530" cy="585" r="27"/><circle cx="670" cy="585" r="27"/><circle cx="905" cy="515" r="27"/><circle cx="1045" cy="515" r="27"/><circle cx="905" cy="585" r="27"/><circle cx="1045" cy="585" r="27"/></g><text x="600" y="730" font-size="36" font-weight="700">24 shared among 6 → 4 in each</text></g></svg>
