<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Thirty-one twenty-fourths separates into one whole and seven twenty-fourths</title><desc id="desc">A 31-cell sequence is visibly split into a first bar of 24 equal cells bracketed as one whole and a second bar of 7 equal cells bracketed as the remainder. The equation reads 31 over 24 equals 24 over 24 plus 7 over 24.</desc><defs><pattern id="g" x="150" width="35" height="100" patternUnits="userSpaceOnUse"><path d="M35 0V100" stroke="#18324A" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Set aside one complete whole</text><rect x="150" y="245" width="840" height="100" fill="#B9D8D5"/><rect x="150" y="245" width="840" height="100" fill="url(#g)" stroke="#18324A" stroke-width="5"/><path d="M150 395v45h840v-45" fill="none" stroke="#176B73" stroke-width="6"/><text x="570" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="28">24 cells = 24/24 = 1 whole</text><rect x="150" y="540" width="245" height="100" fill="#F2B35F"/><rect x="150" y="540" width="245" height="100" fill="url(#g)" stroke="#18324A" stroke-width="5"/><path d="M150 680v30h245v-30" fill="none" stroke="#C66A12" stroke-width="5"/><text x="520" y="610" font-family="Arial,sans-serif" font-size="29">7 cells = 7/24</text><text x="600" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700">31/24 = 24/24 + 7/24</text><text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">= 1 7/24</text></svg>
