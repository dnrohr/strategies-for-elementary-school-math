<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Traverse seven rows by jumps of nine</title><desc id="desc">An exact square-celled seven-row by nine-column grid has a teal scan across every row and six directional moves between successive row endpoints. Exterior totals 9 through 63 mark seven groups of nine.</desc>
  <defs><pattern id="g" x="285" y="145" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#FFFDF8" stroke="#24312D" stroke-width="2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0 0L7 3.5L0 7Z" fill="#087E8B"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Attention scans one row at a time</text><rect x="285" y="145" width="630" height="490" fill="url(#g)" stroke="#24312D" stroke-width="6"/>
    <g class="seven-row-scans" fill="none" stroke="#087E8B" stroke-width="5" stroke-dasharray="10 8"><path d="M320 180H880"/><path d="M880 250H320"/><path d="M320 320H880"/><path d="M880 390H320"/><path d="M320 460H880"/><path d="M880 530H320"/><path d="M320 600H880"/></g>
    <g class="six-row-moves" fill="none" stroke="#087E8B" stroke-width="5" marker-end="url(#arrow)"><path d="M880 188Q950 215 880 242"/><path d="M320 258Q250 285 320 312"/><path d="M880 328Q950 355 880 382"/><path d="M320 398Q250 425 320 452"/><path d="M880 468Q950 495 880 522"/><path d="M320 538Q250 565 320 592"/></g>
    <g fill="#087E8B"><path d="M880 242l20-14-2 20z"/><path d="M320 312l-20-14 2 20z"/><path d="M880 382l20-14-2 20z"/><path d="M320 452l-20-14 2 20z"/><path d="M880 522l20-14-2 20z"/><path d="M320 592l-20-14 2 20z"/></g><g font-size="25" font-weight="700" fill="#287A55"><text x="1000" y="188">9</text><text x="200" y="258">18</text><text x="1000" y="328">27</text><text x="200" y="398">36</text><text x="1000" y="468">45</text><text x="200" y="538">54</text><text x="1000" y="608">63</text></g><text x="600" y="710" font-size="34" font-weight="700">seven row totals · six moves between rows · endpoint 63</text></g>
