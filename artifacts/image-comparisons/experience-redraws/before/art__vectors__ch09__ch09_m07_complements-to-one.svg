<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Complements to one compare three fifths with five eighths</title>
  <desc id="desc">Two equal whole bars show unfilled complements. Three fifths leaves 0.400 of the whole; five eighths leaves 0.375. The smaller outlined and hatched gap belongs to the larger fraction, five eighths.</desc>
  <defs><pattern id="gap" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#B33A3A" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18324A">Look at what is missing from 1</text>
  <text x="95" y="280" font-family="Arial, sans-serif" font-size="28" fill="#18324A">3/5</text><rect x="230" y="215" width="480" height="110" fill="#B9D8D5"/><rect x="710" y="215" width="320" height="110" fill="url(#gap)"/><rect x="230" y="215" width="800" height="110" fill="none" stroke="#18324A" stroke-width="5"/><text x="870" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#7A2525">gap = 2/5 = 0.400</text>
  <text x="95" y="535" font-family="Arial, sans-serif" font-size="28" fill="#18324A">5/8</text><rect x="230" y="470" width="500" height="110" fill="#F2B35F"/><rect x="730" y="470" width="300" height="110" fill="url(#gap)"/><rect x="230" y="470" width="800" height="110" fill="none" stroke="#18324A" stroke-width="5"/><text x="880" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#7A2525">gap = 3/8 = 0.375</text><text x="600" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18324A">Smaller gap → larger fraction</text>
</svg>
