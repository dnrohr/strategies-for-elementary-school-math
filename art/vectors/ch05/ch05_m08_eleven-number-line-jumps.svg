<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Eleven equal number-line jumps of twelve</title><desc id="desc">A number line from zero to 132 has exactly eleven distinct arc segments, each individually labeled plus twelve.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">11 equal jumps × 12 units</text><path d="M60 500H1140" stroke="#24312D" stroke-width="6"/><g class="eleven-jumps" fill="none" stroke="#087E8B" stroke-width="6"><path d="M70 460q48-110 96 0"/><path d="M166 460q48-110 96 0"/><path d="M262 460q48-110 96 0"/><path d="M358 460q48-110 96 0"/><path d="M454 460q48-110 96 0"/><path d="M550 460q48-110 96 0"/><path d="M646 460q48-110 96 0"/><path d="M742 460q48-110 96 0"/><path d="M838 460q48-110 96 0"/><path d="M934 460q48-110 96 0"/><path d="M1030 460q48-110 96 0"/></g><g class="eleven-jump-labels" font-size="18" font-weight="700" fill="#087E8B"><text x="118" y="330">+12</text><text x="214" y="330">+12</text><text x="310" y="330">+12</text><text x="406" y="330">+12</text><text x="502" y="330">+12</text><text x="598" y="330">+12</text><text x="694" y="330">+12</text><text x="790" y="330">+12</text><text x="886" y="330">+12</text><text x="982" y="330">+12</text><text x="1078" y="330">+12</text></g><text x="70" y="550" font-size="24">0</text><text x="1126" y="550" font-size="24">132</text><text x="600" y="630" font-size="30" font-weight="700">eleven arcs total 132</text></g></svg>
