<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Rotate a seven-by-nine rectangle into nine rows of seven</title><desc id="desc">Two exact square grids, seven rows by nine columns and nine rows by seven columns, are connected by a directional rotation arrow. Both contain the same 63 square units.</desc>
  <defs><pattern id="a" x="80" y="180" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="b" x="750" y="130" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#E8F3ED" stroke="#24312D" stroke-width="2"/></pattern><marker id="rotate-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 9 9"><path d="M0 0L9 4.5L0 9Z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Rotation preserves area</text><rect x="80" y="180" width="450" height="350" fill="url(#a)" stroke="#2764B8" stroke-width="7"/><text x="305" y="585" font-size="27">7 rows × 9 columns = 63</text><path class="rotation-arrow" d="M570 365C610 220 680 220 715 330" fill="none" stroke="#7652A8" stroke-width="7" marker-end="url(#rotate-arrow)"/><path d="M723 348L697 329L718 321Z" fill="#7652A8"/><text x="650" y="210" font-size="24" fill="#7652A8">rotate 90°</text><rect x="750" y="130" width="350" height="450" fill="url(#b)" stroke="#287A55" stroke-width="7"/><text x="925" y="635" font-size="27">9 rows × 7 columns = 63</text></g>
</svg>
