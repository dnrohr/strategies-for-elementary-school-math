<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 9 dot chunks</title><desc id="d">Three callouts distinguish perceptual chunking from Method 6 and simplify nested frames and labels.</desc><image href="../../../art/vectors/ch01/ch01_m09_see-dot-chunks.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="110" y="230" width="1000" height="340" rx="34"/><rect x="120" y="245" width="460" height="290" rx="30"/><rect x="120" y="550" width="970" height="80" rx="18"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1090" cy="250" r="28"/><circle cx="570" cy="260" r="28"/><circle cx="1090" cy="590" r="28"/></g><g fill="#fff" font-size="28"><text x="1090" y="260">1</text><text x="570" y="270">2</text><text x="1090" y="600">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 09 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Differentiate the method</tspan><tspan x="1240" dy="32">Emphasize pattern matching, not a</tspan><tspan x="1240" dy="29">second stepwise decomposition.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Reduce nested boxes</tspan><tspan x="1240" dy="32">Use soft fields/halos so the dot</tspan><tspan x="1240" dy="29">patterns carry the composition.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Shorten the footer</tspan><tspan x="1240" dy="32">A compact “two fives + two” brace</tspan><tspan x="1240" dy="29">is enough.</tspan></text></g>
</svg>
