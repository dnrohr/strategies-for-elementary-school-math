<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Moving numerals show a distributive transformation</title><desc id="desc">A three-stage vector workspace transforms eleven times twelve into ten times twelve plus one times twelve, then into 120 plus 12 and finally 132. Dashed motion paths rearrange symbols while equality is preserved.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6L0 12Z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D">
    <text x="600" y="72" font-size="38" font-weight="700">The symbols move; the value stays equal</text>
    <rect x="50" y="180" width="280" height="330" rx="34" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="190" y="280" font-size="31" font-weight="700">start</text><text x="190" y="390" font-size="50" font-weight="700">11 × 12</text>
    <rect x="460" y="145" width="310" height="400" rx="34" fill="#F6EAF4" stroke="#7652A8" stroke-width="7"/><text x="615" y="220" font-size="31" font-weight="700">split 11</text><text x="615" y="325" font-size="34" font-weight="700">(10 × 12)</text><text x="615" y="380" font-size="34" font-weight="700">+</text><text x="615" y="435" font-size="34" font-weight="700">(1 × 12)</text>
    <rect x="900" y="180" width="250" height="330" rx="34" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="1025" y="280" font-size="31" font-weight="700">combine</text><text x="1025" y="365" font-size="31">120 + 12</text><text x="1025" y="445" font-size="58" font-weight="700">132</text>
    <path d="M345 345C390 300 405 270 445 265" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="10 12" marker-end="url(#arrow)"/><path d="M785 345C830 300 850 285 885 275" fill="none" stroke="#7652A8" stroke-width="6" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <rect x="270" y="620" width="660" height="95" rx="48" fill="#FFFDF8" stroke="#287A55" stroke-width="7"/><text x="600" y="681" font-size="33" font-weight="700">11 × 12 = (10 × 12) + (1 × 12) = 132</text>
  </g>
</svg>
