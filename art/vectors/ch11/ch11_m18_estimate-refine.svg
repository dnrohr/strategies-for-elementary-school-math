<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">An approximate twelve hundred benchmark checks the exact product one thousand two hundred forty-two</title><desc id="desc">Two clearly separated cards distinguish the estimate 30 times 40, approximately 1,200, from the exact calculation 27 times 46 equals 1,242. On a proportional line from zero at x 300 to 1,242 at x 900, the 1,200 mark is near x 880 and a 42-unit bracket spans the remaining distance.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Estimate first; refine exactly</text><rect x="85" y="155" width="440" height="330" rx="30" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/><text x="305" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#553A78">APPROXIMATE</text><text x="305" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700">30 × 40</text><text x="305" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#553A78">≈ 1,200</text><rect x="675" y="155" width="440" height="330" rx="30" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="895" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#12545A">EXACT</text><text x="895" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700">27 × 46</text><text x="895" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#347C5A">= 1,242</text>
  <path d="M300 610H900" stroke="#18324A" stroke-width="6"/><path d="M300 580v60M880 575v70M900 575v70" stroke="#18324A" stroke-width="5"/><text x="300" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">0</text><text x="850" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#553A78">1,200 estimate</text><text x="930" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#12545A">1,242 exact</text><path d="M880 540v-35h20v35" fill="none" stroke="#B33A3A" stroke-width="5"/><text x="890" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#7A2525">difference 42</text>
</svg>
