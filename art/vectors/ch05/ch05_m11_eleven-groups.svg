-size="25">group 8</text><rect x="515" y="380" width="140" height="145" rx="20" fill="#FFF3DF" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="585" y="448" font-size="32" font-weight="700">12</text><text x="585" y="492" font-size="25">group 9</text><rect x="685" y="380" width="140" height="145" rx="20" fill="#FFF3DF" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="755" y="448" font-size="32" font-weight="700">12</text><text x="755" y="492" font-size="25">group 10</text><rect x="855" y="380" width="140" height="145" rx="20" fill="#FFF3DF" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="925" y="448" font-size="32" font-weight="700">12</text><text x="925" y="492" font-size="25">group 11</text></g>
