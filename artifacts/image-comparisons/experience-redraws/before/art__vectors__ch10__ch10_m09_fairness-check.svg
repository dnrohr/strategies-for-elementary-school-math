<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Five equal shares pass the fairness check with three left over</title>
  <desc id="desc">Five identically outlined bowls are each labeled four whole candies. A physically separate dashed remainder plate holds exactly three candies. A comparison states three is less than five, so the remainder cannot form another equal whole-candy round.</desc>
  <defs><circle id="c" r="15" fill="#F2B35F" stroke="#18324A" stroke-width="3"/><g id="b"><path d="M-70 0h140l-22 95h-96z" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><use href="#c" x="-36" y="30"/><use href="#c" x="36" y="30"/><use href="#c" x="-28" y="68"/><use href="#c" x="28" y="68"/></g></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="95" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Fair means every bowl has the same whole count</text>
  <g transform="translate(140 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(370 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(600 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(830 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g><g transform="translate(1060 240)"><use href="#b"/><text y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="22">4 whole</text></g>
  <rect x="400" y="485" width="400" height="130" rx="55" fill="#FFFDF8" stroke="#B33A3A" stroke-width="6" stroke-dasharray="14 9"/><use href="#c" x="520" y="550"/><use href="#c" x="600" y="550"/><use href="#c" x="680" y="550"/><text x="600" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#7A2525">separate remainder plate · 3</text><text x="600" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">3 &lt; 5, so no fifth equal whole-candy round</text>
</svg>
