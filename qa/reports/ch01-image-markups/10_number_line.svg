<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 10 number-line hops</title><desc id="d">Three callouts enlarge the active region, reduce repeated labels, and remove duplicate summaries.</desc><image href="../../../art/vectors/ch01/ch01_m10_number-line-hops.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="95" y="420" width="470" height="150" rx="20"/><ellipse cx="820" cy="390" rx="290" ry="120"/><rect x="110" y="220" width="980" height="100" rx="20"/><rect x="70" y="680" width="1060" height="80" rx="20"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="550" cy="550" r="28"/><circle cx="1090" cy="360" r="28"/><circle cx="1090" cy="700" r="28"/></g><g fill="#fff" font-size="28"><text x="550" y="560">1</text><text x="1090" y="370">2</text><text x="1090" y="710">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 10 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · Enlarge active range</tspan><tspan x="1240" dy="32">De-emphasize 0–6 so 7–12 gets</tspan><tspan x="1240" dy="29">more room and clearer spacing.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Reduce hop labels</tspan><tspan x="1240" dy="32">Label unit size once; let equal arcs</tspan><tspan x="1240" dy="29">and ticks carry repetition.</tspan><tspan x="1240" dy="62" font-weight="700">3 · One summary only</tspan><tspan x="1240" dy="32">Keep the sequence strip or equation</tspan><tspan x="1240" dy="29">rail, not both.</tspan></text></g>
</svg>
