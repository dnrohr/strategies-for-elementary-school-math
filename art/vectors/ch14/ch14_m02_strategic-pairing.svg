<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pair fourths with twelfths before adding thirds</title>
  <desc id="desc">A first stage combines 9 twelfths and 5 twelfths to make 14 twelfths, then simplifies to 7 sixths. A second same-length sixths stage adds 4 sixths, equivalent to two thirds, producing 11 sixths or one and five sixths.</desc>
  <defs><marker id="a" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l18 9-18 9z" fill="#7652A8"/></marker><pattern id="twelve" x="100" width="34" height="66" patternUnits="userSpaceOnUse"><path d="M34 0V66" stroke="#18324A" stroke-width="2"/></pattern><pattern id="six" x="690" width="68" height="66" patternUnits="userSpaceOnUse"><path d="M68 0V66" stroke="#18324A" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="78" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Choose a helpful pair, then change units</text>
  <rect x="70" y="140" width="470" height="500" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="305" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">STAGE 1 · TWELFTHS</text><text x="305" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700">9/12 + 5/12 = 14/12</text><rect x="100" y="290" width="408" height="66" fill="#B9D8D5"/><rect x="100" y="290" width="408" height="66" fill="url(#twelve)" stroke="#18324A" stroke-width="4"/><rect x="100" y="390" width="68" height="66" fill="#B9D8D5"/><rect x="100" y="390" width="68" height="66" fill="url(#twelve)" stroke="#18324A" stroke-width="4"/><text x="185" y="430" font-family="Arial,sans-serif" font-size="21">2/12 remain</text><text x="305" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="32">14/12 ÷ 2/2 = 7/6</text><text x="305" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5A6570">one whole + 2 twelfths</text>
  <path d="M555 390H630" stroke="#7652A8" stroke-width="6" marker-end="url(#a)"/><text x="592" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#553A78">to sixths</text>
  <rect x="650" y="140" width="480" height="500" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="890" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">STAGE 2 · SIXTHS</text><text x="890" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700">7/6 + 4/6 = 11/6</text><rect x="690" y="290" width="408" height="66" fill="#F2B35F"/><rect x="690" y="290" width="408" height="66" fill="url(#six)" stroke="#18324A" stroke-width="4"/><rect x="690" y="390" width="340" height="66" fill="#F2B35F"/><rect x="690" y="390" width="340" height="66" fill="url(#six)" stroke="#18324A" stroke-width="4"/><text x="890" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">2/3 = 4/6 joins 7/6</text><text x="890" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#347C5A">11/6 = 1 5/6</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#5A6570">Associativity changes the pairing, not the total.</text>
</svg>
