  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 08 · RETRIEVAL</text><text x="70" y="116" class="heading">The fact comes directly</text><text x="70" y="154" class="sub">A later check can explain the result without being the experienced route.</text>
