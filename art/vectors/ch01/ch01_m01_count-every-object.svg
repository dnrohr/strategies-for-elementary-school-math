<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 1: Count every object in exact order</title><desc id="desc">Exactly twelve numbered counters appear in two groups. A single touch trail runs through counters one to twelve in order and ends with a ring on twelve.</desc>
  <defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><path d="M0 0v12" stroke="#D97706" stroke-width="5"/></pattern></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.n{font-size:24px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.w{fill:#fff}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 01 · COUNT-ALL</text><text x="70" y="116" class="h">Touch every object once</text><text x="70" y="154" class="s">Follow the numbered trail; the final touch names the total.</text><rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <path d="M200 340H980V500H460" fill="none" stroke="#087E8B" stroke-width="7" stroke-dasharray="6 13" stroke-linecap="round"/><text x="200" y="255" class="l" text-anchor="middle">START</text><text x="460" y="590" class="l" text-anchor="middle" fill="#287A55">FINISH · TWELVE</text>
  <g stroke="#174478" stroke-width="5" fill="#2764B8"><circle cx="200" cy="340" r="39"/><circle cx="330" cy="340" r="39"/><circle cx="460" cy="340" r="39"/><circle cx="590" cy="340" r="39"/><circle cx="720" cy="340" r="39"/><circle cx="850" cy="340" r="39"/><circle cx="980" cy="340" r="39"/></g>
  <g stroke="#A95805" stroke-width="5" fill="url(#h)"><circle cx="980" cy="500" r="39"/><circle cx="850" cy="500" r="39"/><circle cx="720" cy="500" r="39"/><circle cx="590" cy="500" r="39"/><circle cx="460" cy="500" r="39"/></g>
  <g class="n w"><text x="200" y="341">1</text><text x="330" y="341">2</text><text x="460" y="341">3</text><text x="590" y="341">4</text><text x="720" y="341">5</text><text x="850" y="341">6</text><text x="980" y="341">7</text></g><g class="n"><text x="980" y="501">8</text><text x="850" y="501">9</text><text x="720" y="501">10</text><text x="590" y="501">11</text><text x="460" y="501">12</text></g><ellipse cx="460" cy="500" rx="50" ry="50" fill="none" stroke="#287A55" stroke-width="7"/>
  <g class="l" text-anchor="middle"><text x="590" y="285">first group · 7</text><text x="720" y="575">second group · 5</text></g><text x="600" y="722" class="h" text-anchor="middle" fill="#287A55">7 + 5 = 12</text>
</svg>
