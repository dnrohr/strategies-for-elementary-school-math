<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Rename two thirds and five eighths in exact twenty-fourths</title><desc id="desc">Equal whole strips show two of three parts becoming sixteen of twenty-four cells and five of eight parts becoming fifteen of twenty-four cells. Adding the same-sized cells gives thirty-one twenty-fourths, equal to one and seven twenty-fourths.</desc><defs><pattern id="g24" x="300" width="30" height="70" patternUnits="userSpaceOnUse"><path d="M30 0V70" stroke="#5A6570" stroke-width="1.2" opacity=".32"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#176B73" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="80" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Make one shared unit: 1/24</text><g font-family="Arial,sans-serif" fill="#18324A"><text x="80" y="210" font-size="29">2/3</text><rect x="300" y="160" width="480" height="70" fill="#B9D8D5"/><rect x="300" y="160" width="720" height="70" fill="url(#g24)" stroke="#18324A" stroke-width="4"/><text x="1040" y="207" font-size="27">= 16/24</text><path d="M540 150v90M780 150v90" stroke="#176B73" stroke-width="8"/><text x="80" y="360" font-size="29">5/8</text><rect x="300" y="310" width="450" height="70" fill="url(#h)"/><rect x="300" y="310" width="720" height="70" fill="url(#g24)" stroke="#18324A" stroke-width="4"/><text x="1040" y="357" font-size="27">= 15/24</text><path d="M390 300v90M480 300v90M570 300v90M660 300v90M750 300v90M840 300v90M930 300v90" stroke="#C66A12" stroke-width="7"/></g><rect x="245" y="480" width="710" height="170" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="600" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700">16/24 + 15/24 = 31/24</text><text x="600" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#347C5A">= 1 7/24</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Equal-length wholes; exact equal partitions; pattern supplements color.</text></svg>
