<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Column addition with exact carries produces 1,221</title><desc id="desc">The aligned addends 378, 596, and 247 show ones sum 21, writing 1 and carrying 2 tens; tens sum 22 including the first carry, writing 2 and carrying 2 hundreds; hundreds sum 12 including the second carry, producing 1,221. The two carry digits are separately aligned above their destination columns.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Written columns and carries</text>
  <rect x="130" y="135" width="420" height="570" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><g font-family="monospace" font-size="54" text-anchor="end" fill="#18324A"><text x="430" y="260">378</text><text x="430" y="340">596</text><text x="430" y="420">+ 247</text><path d="M210 450h250" stroke="#18324A" stroke-width="5"/><text x="430" y="545" font-weight="700">1,221</text></g><g font-family="monospace" font-size="31" text-anchor="middle" fill="#B33A3A" font-weight="700"><text x="350" y="190">2</text><text x="382" y="190">2</text></g><text x="340" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#5A6570">carry 2 tens, then 2 hundreds</text>
  <rect x="625" y="135" width="480" height="570" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5" stroke-dasharray="12 8"/><g font-family="Arial,sans-serif" fill="#18324A"><text x="680" y="220" font-size="28" font-weight="700">ONES</text><text x="680" y="265" font-size="27">8 + 6 + 7 = 21</text><text x="680" y="305" font-size="23" fill="#7A2525">write 1 · carry 2 tens</text><text x="680" y="385" font-size="28" font-weight="700">TENS</text><text x="680" y="430" font-size="27">7 + 9 + 4 + 2 = 22</text><text x="680" y="470" font-size="23" fill="#7A2525">write 2 · carry 2 hundreds</text><text x="680" y="550" font-size="28" font-weight="700">HUNDREDS</text><text x="680" y="595" font-size="27">3 + 5 + 2 + 2 = 12</text><text x="680" y="650" font-size="30" font-weight="700" fill="#347C5A">result 1,221</text></g>
</svg>
