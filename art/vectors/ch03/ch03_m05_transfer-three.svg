<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Transfer three units from forty-eight to thirty-seven</title><desc id="desc">Two quantity bars labeled thirty-seven and forty-eight exchange exactly three separately marked units. The balanced result is forty plus forty-five, preserving the total eighty-five.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 11 11"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#D97706" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Redistribute without changing the total</text><text x="280" y="175" text-anchor="middle" font-size="29" font-weight="700">37</text><rect x="80" y="205" width="400" height="120" rx="20" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="920" y="175" text-anchor="middle" font-size="29" font-weight="700">48</text><rect x="660" y="205" width="460" height="120" rx="20" fill="#F7EFE3" stroke="#D97706" stroke-width="7"/><g fill="url(#h)" stroke="#24312D" stroke-width="4"><circle cx="750" cy="390" r="30"/><circle cx="850" cy="390" r="30"/><circle cx="950" cy="390" r="30"/></g><path d="M930 435Q600 590 340 435" fill="none" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#a)"/><text x="620" y="555" text-anchor="middle" font-size="28" font-weight="700" fill="#7652A8">move exactly 3</text><rect x="80" y="610" width="430" height="100" rx="20" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="295" y="675" text-anchor="middle" font-size="35" font-weight="700">37 + 3 = 40</text><rect x="690" y="610" width="430" height="100" rx="20" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="905" y="675" text-anchor="middle" font-size="35" font-weight="700">48 − 3 = 45</text><text x="600" y="760" text-anchor="middle" font-size="28" font-weight="700">40 + 45 = 85</text></g></svg>
