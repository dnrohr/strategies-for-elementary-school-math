<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Split seven rows into five rows and two rows</title><desc id="desc">An exact square-celled seven-by-nine grid is split horizontally after five rows. Exterior cards align with the five-by-nine region of area 45 and the two-by-nine region of area 18, making 63 without covering any cell.</desc>
  <defs><pattern id="top" x="195" y="145" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="bottom" x="195" y="495" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#F7EFE3" stroke="#24312D" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Partition 7 as 5 + 2</text><g transform="translate(-11.6667 0) scale(.777777778 1)"><rect class="five-by-nine" x="195" y="145" width="810" height="350" fill="url(#top)" stroke="#2764B8" stroke-width="7" vector-effect="non-scaling-stroke"/><rect class="two-by-nine" x="195" y="495" width="810" height="140" fill="url(#bottom)" stroke="#D97706" stroke-width="7" vector-effect="non-scaling-stroke"/></g>
    <rect x="820" y="260" width="300" height="110" rx="24" fill="#E7EEF8" stroke="#2764B8" stroke-width="5"/><text x="970" y="305" font-size="25" font-weight="700">5 rows of 9</text><text x="970" y="345" font-size="34" font-weight="700">5 × 9 = 45</text><path d="M770 320H810" stroke="#2764B8" stroke-width="5"/>
    <rect x="820" y="510" width="300" height="110" rx="24" fill="#F7EFE3" stroke="#D97706" stroke-width="5"/><text x="970" y="555" font-size="25" font-weight="700">2 rows of 9</text><text x="970" y="595" font-size="34" font-weight="700">2 × 9 = 18</text><path d="M770 565H810" stroke="#D97706" stroke-width="5"/>
    <text x="600" y="710" font-size="37" font-weight="700">45 + 18 = 63 square units</text></g>
</svg>
