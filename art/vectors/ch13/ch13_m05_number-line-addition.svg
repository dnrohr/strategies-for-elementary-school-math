<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Add fifteen twenty-fourths in two comprehensible moves</title><desc id="desc">A proportional line from zero to two starts at sixteen twenty-fourths. One rightward jump of eight twenty-fourths lands exactly at one whole, and a second rightward jump of seven twenty-fourths lands at thirty-one twenty-fourths, equal to one and seven twenty-fourths.</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14"><path d="M0 0L14 7L0 14Z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><defs><pattern id="ticks" x="100" width="20" height="54" patternUnits="userSpaceOnUse"><path d="M20 0V54" stroke="#18324A" stroke-width="2"/></pattern></defs><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Add 15/24 as 8/24, then 7/24</text>
  <rect x="100" y="475" width="960" height="54" fill="url(#ticks)"/><path d="M100 502H1060" stroke="#18324A" stroke-width="6"/><path d="M100 460v85M580 450v105M1060 460v85" stroke="#18324A" stroke-width="5"/>
  <g font-family="Arial,sans-serif" fill="#18324A" font-size="27" text-anchor="middle"><text x="100" y="600">0</text><text x="580" y="600">1 = 24/24</text><text x="1060" y="600">2</text></g>
  <circle cx="420" cy="502" r="12" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="420" y="650" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="25">start 16/24</text>
  <path d="M420 490C420 285 580 285 580 478" marker-end="url(#a)" fill="none" stroke="#176B73" stroke-width="6"/><path d="M580 492C580 360 720 360 720 474" marker-end="url(#a)" fill="none" stroke="#C66A12" stroke-width="6" stroke-dasharray="14 9"/>
  <text x="500" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#12545A">+8/24 reaches 1 whole</text><text x="790" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#8A450D">+7/24 beyond</text>
  <circle cx="580" cy="502" r="10" fill="#176B73"/><circle cx="720" cy="502" r="14" fill="#347C5A" stroke="#18324A" stroke-width="4"/>
  <text x="720" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#347C5A">31/24 = 1 7/24</text></svg>
