<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 7: Double seven, then visibly remove two</title><desc id="desc">A blue group of seven and an orange hatched group of seven show fourteen original dots. Two filled orange dots remain visible beneath dashed red X marks, leaving twelve uncancelled units.</desc><defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><path d="M0 0v12" stroke="#D97706" stroke-width="5"/></pattern></defs><style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:700}.s{font-size:24px;fill:#52615B}.l{font-size:22px;font-weight:700}.m{font-size:33px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="k">METHOD 07 · COMPENSATION</text><text x="70" y="116" class="h">Build 14; cross out exactly 2</text><text x="70" y="154" class="s">The X marks sit on two of the original fourteen dots.</text><rect x="64" y="190" width="1072" height="455" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <text x="600" y="250" class="m" text-anchor="middle">7 + 7 = 14</text><rect x="95" y="285" width="455" height="280" rx="28" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><rect x="650" y="285" width="455" height="280" rx="28" fill="#FFF9EF" stroke="#D97706" stroke-width="5"/>
  <g fill="#2764B8" stroke="#174478" stroke-width="5"><circle cx="175" cy="365" r="28"/><circle cx="325" cy="365" r="28"/><circle cx="475" cy="365" r="28"/><circle cx="175" cy="485" r="28"/><circle cx="275" cy="485" r="28"/><circle cx="375" cy="485" r="28"/><circle cx="475" cy="485" r="28"/></g><g fill="url(#h)" stroke="#A95805" stroke-width="5"><circle cx="725" cy="365" r="28"/><circle cx="875" cy="365" r="28"/><circle cx="1025" cy="365" r="28"/><circle cx="725" cy="485" r="28"/><circle cx="825" cy="485" r="28"/><circle cx="925" cy="485" r="28"/><circle cx="1025" cy="485" r="28"/></g>
  <g fill="none" stroke="#C23B32" stroke-width="9" stroke-linecap="round"><path d="M900 460l50 50M950 460l-50 50"/><path d="M1000 460l50 50M1050 460l-50 50"/></g><g fill="none" stroke="#C23B32" stroke-width="4" stroke-dasharray="7 6"><ellipse cx="925" cy="485" rx="42" ry="42"/><ellipse cx="1025" cy="485" rx="42" ry="42"/></g>
  <text x="323" y="615" class="l" text-anchor="middle">first 7 · unchanged</text><text x="878" y="615" class="l" text-anchor="middle">second 7 · remove these 2</text><text x="600" y="735" class="m" text-anchor="middle" fill="#287A55">7 + 5 = 7 + 7 − 2 = 14 − 2 = 12</text>
</svg>
