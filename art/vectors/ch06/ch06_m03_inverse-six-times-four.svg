<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Use the fact family for six, four, and twenty-four</title>
  <desc id="desc">A relational triangle links six, four, and twenty-four. Three equation cards show six times four equals twenty-four, four times six equals twenty-four, and twenty-four divided by six equals four.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D">
    <text x="600" y="64" font-size="38" font-weight="700">Division asks for a missing factor</text>
    <path d="M600 115L300 420H900Z" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/>
    <circle cx="600" cy="165" r="60" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="600" y="183" font-size="46" font-weight="700">24</text>
    <circle cx="360" cy="385" r="60" fill="#F7EFE3" stroke="#D97706" stroke-width="7"/><text x="360" y="403" font-size="46" font-weight="700">6</text>
    <circle cx="840" cy="385" r="64" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="840" y="403" font-size="46" font-weight="700">4</text>
    <g class="fact-family-equations" font-size="30" font-weight="700">
      <rect x="85" y="535" width="320" height="105" rx="24" fill="#F7EFE3" stroke="#D97706" stroke-width="5"/><text x="245" y="600">6 × 4 = 24</text>
      <rect x="440" y="535" width="320" height="105" rx="24" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="600">4 × 6 = 24</text>
      <rect x="795" y="535" width="320" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="7"/><text x="955" y="600">24 ÷ 6 = 4</text>
    </g>
    <text x="600" y="720" font-size="28">multiply back to verify the quotient</text>
  </g>
</svg>
