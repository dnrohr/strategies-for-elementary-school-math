<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Walk from thirty-seven to eighty-five by forty and eight</title><desc id="desc">A proportional number line from thirty-seven to eighty-five shows one long forty-unit arc ending at seventy-seven and a shorter eight-unit arc ending at eighty-five. Decade ticks reinforce the scale.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 11 11"><path d="M0 0L11 5.5 0 11z" fill="#087E8B"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Addition as directed distance</text><text x="60" y="108" font-size="24" fill="#52605A">The drawn lengths are proportional: 40 units, then 8 units.</text><path d="M100 490H1100" stroke="#24312D" stroke-width="6"/><g stroke="#24312D" stroke-width="4"><path d="M140 465v50M202 475v30M410 465v50M618 465v50M826 465v50M972 475v30M1005 475v30M1038 475v30M1070 465v50"/></g><g text-anchor="middle" font-size="26"><text x="140" y="550">37</text><text x="202" y="550">40</text><text x="410" y="550">50</text><text x="618" y="550">60</text><text x="826" y="550">70</text><text x="972" y="550">77</text><text x="1070" y="550">85</text></g><path d="M140 450Q556 100 972 450" fill="none" stroke="#087E8B" stroke-width="8" marker-end="url(#a)"/><path d="M972 430Q1021 330 1070 430" fill="none" stroke="#D97706" stroke-width="8" marker-end="url(#a)"/><text x="556" y="185" text-anchor="middle" font-size="35" font-weight="700" fill="#087E8B">+40</text><text x="1020" y="330" text-anchor="middle" font-size="29" font-weight="700" fill="#D97706">+8</text><text x="600" y="680" text-anchor="middle" font-size="36" font-weight="700">37 + 40 + 8 = 85</text></g></svg>
