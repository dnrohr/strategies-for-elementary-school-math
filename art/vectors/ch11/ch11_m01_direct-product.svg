<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">The product 1,242 arrives, then an estimate checks its size</title><desc id="desc">A direct arrow carries 27 times 46 to the exact result 1,242. A separate dashed check compares it with the clearly approximate benchmark 30 times 40, about 1,200.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="95" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Retrieve, then check</text><rect x="90" y="180" width="400" height="230" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="290" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#18324A">27 × 46</text><path d="M510 295h160" stroke="#7652A8" stroke-width="8" marker-end="url(#a)"/><rect x="700" y="180" width="410" height="230" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="905" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="68" font-weight="700" fill="#18324A">1,242</text><path d="M200 540H1000" stroke="#A7A095" stroke-width="4" stroke-dasharray="14 10"/><text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#5A6570">magnitude check</text><text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#553A78">30 × 40 ≈ 1,200</text><text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#18324A">Exact 1,242 is reasonably close to the estimate.</text></svg>
