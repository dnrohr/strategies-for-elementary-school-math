<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A minimal equality network for eleven times twelve</title><desc id="desc">Three vector nodes connect eleven times twelve, ten times twelve plus one times twelve, and 132. Equality labels show that every node represents the same value without sensory imagery.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="78" font-size="38" font-weight="700">A silent equality</text><text x="600" y="116" font-size="23">One relation, written three ways</text><path d="M340 360H470M730 360H860" stroke="#24312D" stroke-width="6"/><g font-size="30" font-weight="700"><text x="405" y="347">=</text><text x="795" y="347">=</text></g><rect x="80" y="250" width="260" height="220" rx="42" fill="#E7EEF8" stroke="#2764B8" stroke-width="8"/><text x="210" y="385" font-size="48" font-weight="700">11 × 12</text><rect x="470" y="215" width="260" height="290" rx="42" fill="#F6EAF4" stroke="#7652A8" stroke-width="8"/><text x="600" y="330" font-size="35" font-weight="700">10 × 12</text><text x="600" y="380" font-size="32">+</text><text x="600" y="430" font-size="35" font-weight="700">1 × 12</text><rect x="860" y="250" width="260" height="220" rx="42" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="990" y="385" font-size="64" font-weight="700">132</text><text x="600" y="620" font-size="31" font-weight="700">All three expressions are equal throughout.</text></g></svg>
