<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">A valid place-value trade reveals one thousand, two hundreds, four tens, and two ones</title><desc id="desc">A representative, explicitly labeled before state has 12 hundreds, 4 tens, and 2 ones, totaling 1,242. A trade arrow exchanges 10 hundreds for 1 thousand. The after state reads 1 thousand, 2 hundreds, 4 tens, and 2 ones.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Regroup without changing the amount</text><text x="70" y="125" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Representative blocks use exact multiplicity labels, not literal drawn counts.</text>
  <rect x="70" y="175" width="440" height="435" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="290" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">BEFORE · 1,242</text><g font-family="Arial,sans-serif" fill="#18324A"><rect x="135" y="280" width="130" height="130" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="300" y="355" font-size="30">× 12 hundreds</text><rect x="135" y="450" width="130" height="32" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><text x="300" y="477" font-size="28">× 4 tens</text><circle cx="165" cy="540" r="16" fill="#DDBBE8" stroke="#18324A" stroke-width="3"/><text x="300" y="550" font-size="28">× 2 ones</text></g>
  <path d="M530 390h130" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="595" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#553A78">trade 10 hundreds</text><text x="595" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#553A78">for 1 thousand</text><rect x="690" y="175" width="440" height="435" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="910" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700">AFTER · 1,242</text><g font-family="Arial,sans-serif" font-size="31" fill="#18324A"><text x="765" y="315">1 thousand</text><text x="765" y="380">2 hundreds</text><text x="765" y="445">4 tens</text><text x="765" y="510">2 ones</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">1,000 + 200 + 40 + 2 = 1,242</text><text x="600" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#5A6570">Packaging changes; value does not.</text>
</svg>
