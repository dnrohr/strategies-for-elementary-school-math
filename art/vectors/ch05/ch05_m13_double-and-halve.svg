<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Double eleven and halve twelve while preserving the product</title><desc id="desc">A balanced transformation maps eleven to twenty-two and twelve to six. Exactly six equal group cards of 22 are shown, totaling 132.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="65" font-size="36" font-weight="700">Double one factor; halve the other</text><rect x="100" y="120" width="400" height="120" rx="28" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="300" y="194" font-size="42">11 → 22</text><text x="300" y="280" font-size="23">double</text><rect x="700" y="120" width="400" height="120" rx="28" fill="#F7EFE3" stroke="#D97706" stroke-width="7"/><text x="900" y="194" font-size="42">12 → 6</text><text x="900" y="280" font-size="23">halve</text><g class="six-groups-of-twenty-two" font-size="30" font-weight="700"><rect x="85" y="370" width="150" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="5"/><text x="160" y="435">22</text><rect x="261" y="370" width="150" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="5"/><text x="336" y="435">22</text><rect x="437" y="370" width="150" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="5"/><text x="512" y="435">22</text><rect x="613" y="370" width="150" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="5"/><text x="688" y="435">22</text><rect x="789" y="370" width="150" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="5"/><text x="864" y="435">22</text><rect x="965" y="370" width="150" height="105" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="5"/><text x="1040" y="435">22</text></g><text x="600" y="585" font-size="40" font-weight="700">11 × 12 = 22 × 6 = 132</text><text x="600" y="645" font-size="25">six equal groups of 22</text></g></svg>
