<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Count every square in a seven-by-nine grid</title><desc id="desc">An exact seven-row by nine-column grid contains 63 unit squares. A serpentine path visits all rows once and checkpoint labels mark 1, 9, 18, 27, 36, 45, 54, and 63.</desc><defs><pattern id="g" x="210" y="150" width="86" height="70" patternUnits="userSpaceOnUse"><rect width="86" height="70" fill="#FFFDF8" stroke="#24312D" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Visit each unit square once</text><rect x="210" y="150" width="774" height="490" fill="url(#g)" stroke="#24312D" stroke-width="6"/><path d="M253 185H941V255H253V325H941V395H253V465H941V535H253V605H941" fill="none" stroke="#087E8B" stroke-width="6" stroke-dasharray="10 8"/><g font-size="22" font-weight="700" fill="#287A55"><text x="253" y="180">1</text><text x="941" y="180">9</text><text x="253" y="250">18</text><text x="941" y="320">27</text><text x="253" y="390">36</text><text x="941" y="460">45</text><text x="253" y="530">54</text><text x="941" y="600">63</text></g><text x="600" y="710" font-size="35" font-weight="700">7 × 9 = 63 square units</text></g></svg>
