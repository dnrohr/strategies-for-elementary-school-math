<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Estimate each addend, then calculate the exact sum</title>
  <desc id="desc">A two-stage layout gives each rounding decision its own line, then stacks the original addends for an exact sum. A separate result strip compares 1,200 with 1,221 and identifies the difference of twenty-one.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18324A">Estimate first. Then keep the exact calculation separate.</text>
  <rect x="70" y="125" width="500" height="455" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/><rect x="630" y="125" width="500" height="455" rx="28" fill="#DDEDE4" stroke="#287A55" stroke-width="6"/>
  <g font-family="Arial,sans-serif" fill="#18324A">
    <circle cx="120" cy="180" r="24" fill="#7652A8"/><text x="120" y="189" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFDF8">1</text><text x="160" y="190" font-size="26" font-weight="700">ROUND EACH ADDEND</text>
    <g font-size="34" font-weight="700"><text x="155" y="285">378</text><text x="155" y="375">596</text><text x="155" y="465">247</text></g>
    <g stroke="#7652A8" stroke-width="5" marker-end="url(#arrow)"><path d="M255 274H345"/><path d="M255 364H345"/><path d="M255 454H345"/></g>
    <g font-size="34" font-weight="700" fill="#553A78"><text x="385" y="285">400</text><text x="385" y="375">600</text><text x="385" y="465">200</text></g><text x="320" y="535" text-anchor="middle" font-size="29" font-weight="700" fill="#553A78">400 + 600 + 200 ≈ 1,200</text>
    <circle cx="680" cy="180" r="24" fill="#287A55"/><text x="680" y="189" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFDF8">2</text><text x="720" y="190" font-size="26" font-weight="700">CALCULATE EXACTLY</text>
    <g text-anchor="end" font-family="Consolas,monospace" font-size="42" font-weight="700"><text x="910" y="285">378</text><text x="910" y="365">596</text><text x="910" y="445">+ 247</text><path d="M760 470H940" stroke="#18324A" stroke-width="4"/><text x="910" y="530" fill="#287A55">1,221</text></g>
  </g>
  <rect x="190" y="640" width="820" height="105" rx="26" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="685" font-size="29" fill="#18324A">estimate 1,200 ↔ exact 1,221</text><text x="600" y="725" font-size="34" font-weight="700" fill="#B33A3A">difference = 21</text></g>
</svg>
