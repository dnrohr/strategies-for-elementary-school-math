<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Estimate near one half, then prove with fortieths</title>
  <desc id="desc">The first panel places both fractions just above one half. The second panel uses equal 40-unit bars: three fifths is 24 fortieths and five eighths is 25 fortieths, an exact one-unit difference.</desc>
  <defs><pattern id="grid" x="230" width="12" height="70" patternUnits="userSpaceOnUse"><path d="M12 0V70" stroke="#18324A" stroke-width="1.5"/></pattern><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="9" stroke="#176B73" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18324A">1. Estimate</text><rect x="80" y="125" width="1040" height="205" rx="24" fill="#FFFDF8" stroke="#A7A095" stroke-width="3"/><path d="M190 240H1010" stroke="#18324A" stroke-width="6"/><path d="M190 215v50M600 200v80M682 205v70M703 205v70M1010 215v50" stroke="#18324A" stroke-width="4"/><text x="600" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#18324A">1/2</text><text x="682" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#12545A">3/5</text><text x="703" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#8A4308">5/8</text><text x="855" y="185" font-family="Arial, sans-serif" font-size="22" fill="#5A6570">Both are close.</text>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18324A">2. Prove</text><text x="90" y="505" font-family="Arial, sans-serif" font-size="24" fill="#18324A">24/40</text><rect x="230" y="450" width="288" height="70" fill="url(#hatch)"/><rect x="230" y="450" width="480" height="70" fill="url(#grid)" stroke="#18324A" stroke-width="4"/><text x="90" y="625" font-family="Arial, sans-serif" font-size="24" fill="#18324A">25/40</text><rect x="230" y="570" width="300" height="70" fill="#F2B35F"/><rect x="230" y="570" width="480" height="70" fill="url(#grid)" stroke="#18324A" stroke-width="4"/><rect x="518" y="570" width="12" height="70" fill="none" stroke="#B33A3A" stroke-width="5"/><text x="780" y="560" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#7A2525">24/40 &lt; 25/40</text><text x="780" y="610" font-family="Arial, sans-serif" font-size="23" fill="#5A6570">one exact fortieth apart</text>
</svg>
