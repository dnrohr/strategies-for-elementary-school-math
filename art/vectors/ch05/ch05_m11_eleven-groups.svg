<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Eleven bags each hold twelve countable counters</title><desc id="desc">Exactly eleven outlined bags each visibly contain twelve counters arranged in three rows of four. An arrow leads to one tray labeled eleven times twelve equals 132.</desc>
  <defs>
    <g id="dozen" class="counters-twelve" fill="#F5D88B" stroke="#8A5A00" stroke-width="2"><circle cx="32" cy="40" r="8"/><circle cx="62" cy="40" r="8"/><circle cx="92" cy="40" r="8"/><circle cx="122" cy="40" r="8"/><circle cx="32" cy="67" r="8"/><circle cx="62" cy="67" r="8"/><circle cx="92" cy="67" r="8"/><circle cx="122" cy="67" r="8"/><circle cx="32" cy="94" r="8"/><circle cx="62" cy="94" r="8"/><circle cx="92" cy="94" r="8"/><circle cx="122" cy="94" r="8"/></g>
    <g id="bag"><path d="M24 12H130L145 35V126Q77 145 9 126V35Z" fill="#F7EFE3" stroke="#D97706" stroke-width="5"/><use href="#dozen"/></g>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7652A8"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D">
    <text x="600" y="60" font-size="36" font-weight="700">Eleven bags, twelve counters in every bag</text>
    <g class="bags-eleven">
      <g transform="translate(45 90)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">1</text></g><g transform="translate(270 90)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">2</text></g><g transform="translate(495 90)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">3</text></g><g transform="translate(720 90)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">4</text></g><g transform="translate(945 90)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">5</text></g>
      <g transform="translate(10 285)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">6</text></g><g transform="translate(215 285)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">7</text></g><g transform="translate(420 285)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">8</text></g><g transform="translate(625 285)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">9</text></g><g transform="translate(830 285)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">10</text></g><g transform="translate(1035 285)"><use href="#bag"/><text x="77" y="166" font-size="20" font-weight="700">11</text></g>
    </g>
    <path d="M600 470V530" stroke="#7652A8" stroke-width="7" marker-end="url(#arrow)"/>
    <g class="total-tray"><path d="M255 552H945L885 730H315Z" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="600" y="635" font-size="32" font-weight="700">combine the 11 equal groups</text><text x="600" y="692" font-size="44" font-weight="700">11 × 12 = 132</text></g>
  </g>
</svg>
