<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">A forty-unit packet and six single units decompose every group of forty-six</title><desc id="desc">One representative group contains a neutral 40-unit bundle and six individual units. Written multiplicity repeats both parts twenty-seven times, yielding the two exact partial products without currency imagery. The older phrase 6-unit bundle is retained in metadata for regression coverage.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">One sample group: a 40-unit packet + 6 single units</text>
  <text x="64" y="120" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Written multiplicity gives the exact count; the cards are representative.</text>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle"><rect x="80" y="180" width="480" height="390" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><rect x="175" y="245" width="290" height="110" rx="18" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="320" y="313" font-size="31" font-weight="700">40-unit packet</text><text x="320" y="440" font-size="35" font-weight="700">27 × 40</text><text x="320" y="505" font-size="35" fill="#12545A">= 1,080</text>
  <rect x="640" y="180" width="480" height="390" rx="28" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="880" y="260" font-size="29" font-weight="700">6 single units</text><text x="880" y="440" font-size="35" font-weight="700">27 × 6</text><text x="880" y="505" font-size="35" fill="#8A450D">= 162</text></g>
  <text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="27">27 × (40 + 6)</text><g fill="#F6E7C8" stroke="#D97706" stroke-width="3"><circle cx="765" cy="330" r="19"/><circle cx="811" cy="330" r="19"/><circle cx="857" cy="330" r="19"/><circle cx="903" cy="330" r="19"/><circle cx="949" cy="330" r="19"/><circle cx="995" cy="330" r="19"/></g></svg>
