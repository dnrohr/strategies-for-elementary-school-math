<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Estimate near two, then verify 11 sixths exactly</title><desc id="desc">A dashed benchmark panel places a rough estimate near 1.8 on a proportional zero-to-two line. A separate exact panel shows 9 plus 8 plus 5 twelfths equals 22 twelfths, 11 sixths, approximately 1.833.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="78" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Estimate first; keep exact proof separate</text>
  <rect x="70" y="135" width="1060" height="270" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/><text x="120" y="195" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#553A78">ESTIMATE</text><path d="M180 305H1020" stroke="#18324A" stroke-width="6"/><path d="M180 275v60M600 275v60M1020 275v60M936 260v90" stroke="#18324A" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle"><text x="180" y="370">0</text><text x="600" y="370">1</text><text x="1020" y="370">2</text><text x="936" y="248" fill="#553A78">near 1.8 · closer to 2</text></g>
  <rect x="70" y="455" width="1060" height="230" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="120" y="515" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12545A">EXACT</text><text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700">9/12 + 8/12 + 5/12 = 22/12</text><text x="600" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#347C5A">11/6 = 1 5/6 ≈ 1.833</text><text x="600" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Between 1 and 2 and close to 2, as predicted.</text>
</svg>
