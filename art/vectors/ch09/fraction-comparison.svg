<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Compare three fifths and five eighths with common fortieths</title><desc id="desc">Two large equal whole bars use the same forty-unit scale. Three fifths fills twenty-four units and five eighths fills twenty-five. Strong five-unit group boundaries and one highlighted extra unit show that five eighths is larger by one fortieth.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Same whole · common fortieths</text>
