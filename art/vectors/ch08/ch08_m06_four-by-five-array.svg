<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Four by five array with three rows selected</title>
  <desc id="desc">Twenty dots form four equal horizontal rows of five. Heavy outlined row bands and solid dots mark the first three rows as fifteen; a dashed gray band marks the fourth row as unselected.</desc>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#24312D">See twenty as a 4 × 5 array</text><text x="64" y="112" font-family="Arial,sans-serif" font-size="24" fill="#52605A">Three complete rows are three quarters of the array.</text>
  <g transform="translate(125 175)"><g fill="#E8F3ED" stroke="#287A55" stroke-width="6"><rect width="810" height="105" rx="18"/><rect y="125" width="810" height="105" rx="18"/><rect y="250" width="810" height="105" rx="18"/></g><rect y="375" width="810" height="105" rx="18" fill="#F2F2EF" stroke="#68707A" stroke-width="5" stroke-dasharray="12 9"/>
    <g stroke="#24312D" stroke-width="4"><g fill="#287A55"><circle cx="85" cy="52" r="28"/><circle cx="245" cy="52" r="28"/><circle cx="405" cy="52" r="28"/><circle cx="565" cy="52" r="28"/><circle cx="725" cy="52" r="28"/><circle cx="85" cy="177" r="28"/><circle cx="245" cy="177" r="28"/><circle cx="405" cy="177" r="28"/><circle cx="565" cy="177" r="28"/><circle cx="725" cy="177" r="28"/><circle cx="85" cy="302" r="28"/><circle cx="245" cy="302" r="28"/><circle cx="405" cy="302" r="28"/><circle cx="565" cy="302" r="28"/><circle cx="725" cy="302" r="28"/></g><g fill="#D9DDDA"><circle cx="85" cy="427" r="28"/><circle cx="245" cy="427" r="28"/><circle cx="405" cy="427" r="28"/><circle cx="565" cy="427" r="28"/><circle cx="725" cy="427" r="28"/></g></g>
    <g font-family="Arial,sans-serif" font-size="24" font-weight="700"><text x="845" y="61" fill="#287A55">row 1 · five</text><text x="845" y="186" fill="#287A55">row 2 · five</text><text x="845" y="311" fill="#287A55">row 3 · five</text><text x="845" y="436" fill="#52605A">row 4 · five</text></g></g>
  <path d="M92 175h-30v355h30" fill="none" stroke="#287A55" stroke-width="7"/><text x="70" y="590" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#287A55">3 rows</text><text x="530" y="725" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#24312D">4 × 5 = 20 · 3 × 5 = 15</text>
</svg>
