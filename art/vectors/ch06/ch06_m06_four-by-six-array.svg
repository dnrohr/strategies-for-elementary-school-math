<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Four rows of six form an array of twenty-four</title><desc id="desc">An exact four-row by six-column dot array contains twenty-four dots. A horizontal brace labels six in each row and a vertical brace labels four rows.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">The divisor sets the row length</text><g fill="#D97706" stroke="#24312D" stroke-width="4"><circle cx="350" cy="220" r="25"/><circle cx="450" cy="220" r="25"/><circle cx="550" cy="220" r="25"/><circle cx="650" cy="220" r="25"/><circle cx="750" cy="220" r="25"/><circle cx="850" cy="220" r="25"/><circle cx="350" cy="320" r="25"/><circle cx="450" cy="320" r="25"/><circle cx="550" cy="320" r="25"/><circle cx="650" cy="320" r="25"/><circle cx="750" cy="320" r="25"/><circle cx="850" cy="320" r="25"/><circle cx="350" cy="420" r="25"/><circle cx="450" cy="420" r="25"/><circle cx="550" cy="420" r="25"/><circle cx="650" cy="420" r="25"/><circle cx="750" cy="420" r="25"/><circle cx="850" cy="420" r="25"/><circle cx="350" cy="520" r="25"/><circle cx="450" cy="520" r="25"/><circle cx="550" cy="520" r="25"/><circle cx="650" cy="520" r="25"/><circle cx="750" cy="520" r="25"/><circle cx="850" cy="520" r="25"/></g><path d="M325 155v-28h550v28M290 190h-28v360h28" fill="none" stroke="#2764B8" stroke-width="7"/><text x="600" y="120" font-size="27">6 per row</text><text x="210" y="380" font-size="27">4 rows</text><text x="600" y="675" font-size="38" font-weight="700">4 × 6 = 24 → 24 ÷ 6 = 4</text></g></svg>
