<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Subtract six four times until zero</title><desc id="desc">A five-node subtraction ladder reads twenty-four, eighteen, twelve, six, zero, connected by exactly four arrows each labeled minus six. The four removals are counted separately from their size.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#C2413B"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Count equal removals</text><g font-size="44" font-weight="700"><circle cx="120" cy="350" r="70" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="120" y="365">24</text><circle cx="360" cy="350" r="70" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="360" y="365">18</text><circle cx="600" cy="350" r="70" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="600" y="365">12</text><circle cx="840" cy="350" r="70" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="840" y="365">6</text><circle cx="1080" cy="350" r="75" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="1080" y="365">0</text></g><g class="four-subtraction-arrows" stroke="#C2413B" stroke-width="7" stroke-dasharray="11 8" marker-end="url(#arrow)"><path d="M200 350H280"/><path d="M440 350H520"/><path d="M680 350H760"/><path d="M920 350H1000"/></g><g font-size="25" fill="#C2413B"><text x="240" y="310">1 · −6</text><text x="480" y="310">2 · −6</text><text x="720" y="310">3 · −6</text><text x="960" y="310">4 · −6</text></g><text x="600" y="620" font-size="36" font-weight="700">24 − 6 − 6 − 6 − 6 = 0 → 4 groups</text></g></svg>
