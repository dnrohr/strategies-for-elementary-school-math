<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Three rounding decisions lead to an estimate clearly separated from the exact sum</title><desc id="desc">Dashed approximation cards show 378 near 400, 596 near 600, and 247 near 200, producing about 1,200. A solid exact card gives 1,221 and an exact proportional bracket marks the difference of twenty-one.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Round each addend, then calculate exactly</text><rect x="75" y="125" width="475" height="300" rx="28" fill="#FFFDF8" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/><text x="312" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#553A78">APPROXIMATE</text><text x="312" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700">378 ≈ 400 · 596 ≈ 600 · 247 ≈ 200</text><text x="312" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#553A78">≈ 1,200</text><rect x="650" y="125" width="475" height="300" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="888" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12545A">EXACT</text><text x="888" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700">378 + 596 + 247</text><text x="888" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#347C5A">= 1,221</text><path d="M300 570H900" stroke="#18324A" stroke-width="6"/><path d="M300 545v50M890 535v70M900 535v70" stroke="#18324A" stroke-width="5"/><text x="300" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="24">0</text><text x="855" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#553A78">1,200 estimate</text><text x="940" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#12545A">1,221 exact</text><path d="M890 510v-35h10v35" fill="none" stroke="#B33A3A" stroke-width="5"/><text x="895" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7A2525">gap 21</text><text x="312" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#5A6570">400 + 600 + 200</text></svg>
