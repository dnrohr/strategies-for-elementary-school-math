<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Column addition with an explained carried ten</title><desc id="desc">Thirty-seven and forty-eight are aligned by tens and ones. Seven plus eight makes fifteen ones, explicitly exchanged for one carried ten and five written ones; three plus four plus one gives eight tens and the result eighty-five.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="68" font-size="38" font-weight="700" fill="#24312D">Line up tens and ones</text><g transform="translate(100 150)"><rect width="430" height="500" rx="25" fill="#F7F0E5" stroke="#24312D" stroke-width="5"/><text x="175" y="70" text-anchor="middle" font-size="22" fill="#52605A">TENS</text><text x="315" y="70" text-anchor="middle" font-size="22" fill="#52605A">ONES</text><g font-family="Consolas,monospace" font-size="70" text-anchor="end"><text x="355" y="180">37</text><text x="355" y="280">+48</text><path d="M90 310h285" stroke="#24312D" stroke-width="7"/><text x="355" y="405">85</text><text x="215" y="115" font-size="35" fill="#7652A8">1</text></g><text x="215" y="455" text-anchor="middle" font-size="22" fill="#7652A8">carried 1 ten</text></g><path d="M565 390H665" stroke="#7652A8" stroke-width="6" stroke-dasharray="7 10" marker-end="url(#a)"/><g transform="translate(700 170)"><rect width="420" height="190" rx="24" fill="#F7EFE3" stroke="#D97706" stroke-width="6"/><text x="210" y="72" text-anchor="middle" font-size="30" font-weight="700">7 + 8 = 15 ones</text><text x="210" y="135" text-anchor="middle" font-size="27">15 ones = 1 ten + 5 ones</text><rect y="260" width="420" height="190" rx="24" fill="#E8F3ED" stroke="#287A55" stroke-width="7"/><text x="210" y="335" text-anchor="middle" font-size="30" font-weight="700">3 + 4 + 1 = 8 tens</text><text x="210" y="397" text-anchor="middle" font-size="29">8 tens + 5 ones = 85</text></g></g></svg>
