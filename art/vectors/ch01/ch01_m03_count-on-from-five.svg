<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 3: Switch the addends and count seven times from five</title>
  <desc id="desc">The equation seven plus five is switched to five plus seven without changing the total. Starting at five, exactly seven equal one-unit jumps land on six through twelve. The result is twelve.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:24px;fill:#52615B}.label{font-size:21px;font-weight:700}.n{font-size:25px;font-weight:700;text-anchor:middle}.equation{font-size:36px;font-weight:700}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 03 · COMMUTATIVITY + COUNT-ON</text><text x="70" y="116" class="heading">Switch the route, keep the total</text><text x="70" y="154" class="sub">Start with 5 and add seven unit steps.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <rect x="100" y="224" width="350" height="82" rx="18" fill="#E9F0FA" stroke="#2764B8" stroke-width="5"/><text x="275" y="276" class="equation" text-anchor="middle">7 + 5</text><path d="M474 266h150" fill="none" stroke="#7652A8" stroke-width="5" stroke-dasharray="4 12" marker-end="url(#arrow)"/><text x="549" y="238" class="label" text-anchor="middle">switch addends</text><rect x="650" y="224" width="350" height="82" rx="18" fill="#F1EAF8" stroke="#7652A8" stroke-width="5"/><text x="825" y="276" class="equation" text-anchor="middle">5 + 7</text>
  <line x1="134" y1="486" x2="1074" y2="486" stroke="#68707A" stroke-width="5" marker-end="url(#arrow)"/>
  <g stroke="#24312D" stroke-width="4"><path d="M174 466v40 M294 466v40 M414 466v40 M534 466v40 M654 466v40 M774 466v40 M894 466v40 M1014 466v40"/></g>
  <g class="n"><text x="174" y="543">5</text><text x="294" y="543">6</text><text x="414" y="543">7</text><text x="534" y="543">8</text><text x="654" y="543">9</text><text x="774" y="543">10</text><text x="894" y="543">11</text><text x="1014" y="543">12</text></g>
  <circle cx="174" cy="486" r="18" fill="#2764B8" stroke="#174478" stroke-width="5"/><g fill="none" stroke="#087E8B" stroke-width="5" marker-end="url(#arrow)"><path d="M183 454Q234 374 285 454"/><path d="M303 454Q354 374 405 454"/><path d="M423 454Q474 374 525 454"/><path d="M543 454Q594 374 645 454"/><path d="M663 454Q714 374 765 454"/><path d="M783 454Q834 374 885 454"/><path d="M903 454Q954 374 1005 454"/></g>
  <g class="label" text-anchor="middle"><text x="234" y="398">+1</text><text x="354" y="398">+1</text><text x="474" y="398">+1</text><text x="594" y="398">+1</text><text x="714" y="398">+1</text><text x="834" y="398">+1</text><text x="954" y="398">+1</text></g><text x="174" y="596" class="label" text-anchor="middle">held start</text><text x="1014" y="596" class="label" text-anchor="middle">seventh landing</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="105" y="731" class="equation">7 + 5 = 5 + 7 = 12</text><text x="1092" y="730" class="label" text-anchor="end">7 unit steps</text>
</svg>
