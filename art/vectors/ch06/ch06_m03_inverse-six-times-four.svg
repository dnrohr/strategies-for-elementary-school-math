<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Division and multiplication form an inverse fact family</title>
  <desc id="desc">Three equation cards show six times four equals twenty-four, four times six equals twenty-four, and twenty-four divided by six equals four. Labeled arrows identify a same-product rearrangement and an inverse relation without falsely joining the complete equations by equality signs.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0L12 6L0 12Z" fill="#176B73"/></marker></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle">
    <text x="600" y="78" font-size="34" font-weight="700">Division asks for a missing factor</text>
    <rect x="70" y="210" width="300" height="190" rx="28" fill="#FFF3DF" stroke="#C66A12" stroke-width="5"/><text x="220" y="325" font-size="39" font-weight="700">6 × 4 = 24</text>
    <rect x="450" y="210" width="300" height="190" rx="28" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="600" y="325" font-size="39" font-weight="700">4 × 6 = 24</text>
    <rect x="830" y="210" width="300" height="190" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="980" y="325" font-size="39" font-weight="700">24 ÷ 6 = 4</text>
    <g fill="none" stroke="#176B73" stroke-width="5" marker-end="url(#arrow)"><path d="M375 305H435"/><path d="M755 305H815"/></g>
    <g fill="#176B73" font-size="21" font-weight="700"><text x="405" y="450">same product</text><text x="785" y="450">inverse relation</text></g>
    <path d="M70 485v35h1060v-35" fill="none" stroke="#176B73" stroke-width="5"/>
    <text x="600" y="585" font-size="30">Each card is a true related fact; the arrows name the relationship.</text>
    <text x="600" y="690" font-size="39" font-weight="700" fill="#347C5A">6 groups of 4 make 24, so 24 ÷ 6 = 4</text>
  </g>
</svg>
