<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A twenty-three-unit bar split into four blocks of five and a tail of three</title>
  <desc id="desc">One exact bar has twenty-three equal 34-unit cells. The first twenty cells are bracketed as four equal blocks of five. A dashed and hatched three-cell tail is labeled remainder and kept separate from the four shares.</desc>
  <defs><pattern id="cells" x="200" width="34" height="130" patternUnits="userSpaceOnUse"><path d="M34 0V130" stroke="#18324A" stroke-width="2"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#B33A3A" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="90" y="110" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">One whole: 23 equal units</text>
  <rect x="200" y="300" width="680" height="130" fill="#B9D8D5"/><rect x="880" y="300" width="102" height="130" fill="url(#h)"/><rect x="200" y="300" width="782" height="130" fill="url(#cells)" stroke="#18324A" stroke-width="5"/><g stroke="#176B73" stroke-width="7"><path d="M370 290v150M540 290v150M710 290v150M880 290v150"/></g>
  <g font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#12545A"><text x="285" y="485">5</text><text x="455" y="485">5</text><text x="625" y="485">5</text><text x="795" y="485">5</text></g><text x="931" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7A2525">3 tail</text><path d="M880 535v45h102v-45" fill="none" stroke="#B33A3A" stroke-width="5" stroke-dasharray="10 7"/><text x="931" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#7A2525">not a fifth share</text><text x="600" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">23 = 5 + 5 + 5 + 5 + 3 = 5 × 4 + 3</text>
</svg>
