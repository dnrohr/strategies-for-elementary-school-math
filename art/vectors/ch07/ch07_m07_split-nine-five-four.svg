<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Split nine columns into five columns and four columns</title><desc id="desc">An exact seven-by-nine grid is split vertically after five columns. Its seven-by-five region is 35 and its seven-by-four region is 28, making 63.</desc>
  <defs><pattern id="left" x="195" y="145" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="right" x="645" y="145" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#F7EFE3" stroke="#24312D" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8" fill-opacity=".72"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Partition 9 as 5 + 4</text><rect class="seven-by-five" x="195" y="145" width="450" height="490" fill="url(#left)" stroke="#2764B8" stroke-width="7"/><rect class="seven-by-four" x="645" y="145" width="360" height="490" fill="url(#right)" stroke="#D97706" stroke-width="7"/><rect x="260" y="330" width="320" height="100" rx="24" fill="#FFFDF8" fill-opacity=".9"/><text x="420" y="395" font-size="40" font-weight="700">7 × 5 = 35</text><rect x="685" y="330" width="280" height="100" rx="24" fill="#FFFDF8" fill-opacity=".9"/><text x="825" y="395" font-size="40" font-weight="700">7 × 4 = 28</text><text x="600" y="710" font-size="37" font-weight="700">35 + 28 = 63 square units</text></g>
</svg>
