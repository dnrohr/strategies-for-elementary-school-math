<svg data-qa-image-pass="2026-09-26" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Eleven visible groups of twelve counters total one hundred thirty-two</title>
  <desc id="desc">Eleven outlined group cards are arranged in two rows. Every card contains a visible three-by-four array of twelve counters and a group number. A brace spans all eleven groups and labels the exact product 11 times 12 equals 132.</desc>
  <defs>
    <g id="dozen" fill="#F0A33A" stroke="#18324A" stroke-width="1.5">
      <circle cx="-30" cy="-24" r="6"/><circle cx="-10" cy="-24" r="6"/><circle cx="10" cy="-24" r="6"/><circle cx="30" cy="-24" r="6"/>
      <circle cx="-30" cy="0" r="6"/><circle cx="-10" cy="0" r="6"/><circle cx="10" cy="0" r="6"/><circle cx="30" cy="0" r="6"/>
      <circle cx="-30" cy="24" r="6"/><circle cx="-10" cy="24" r="6"/><circle cx="10" cy="24" r="6"/><circle cx="30" cy="24" r="6"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="#F8F2E7"/>
  <text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Eleven equal groups of twelve</text>
  <g fill="#FFF3DF" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8">
    <rect x="90" y="150" width="140" height="170" rx="20"/><rect x="260" y="150" width="140" height="170" rx="20"/><rect x="430" y="150" width="140" height="170" rx="20"/><rect x="600" y="150" width="140" height="170" rx="20"/><rect x="770" y="150" width="140" height="170" rx="20"/><rect x="940" y="150" width="140" height="170" rx="20"/>
    <rect x="175" y="370" width="140" height="170" rx="20"/><rect x="345" y="370" width="140" height="170" rx="20"/><rect x="515" y="370" width="140" height="170" rx="20"/><rect x="685" y="370" width="140" height="170" rx="20"/><rect x="855" y="370" width="140" height="170" rx="20"/>
  </g>
  <g>
    <use href="#dozen" transform="translate(160 220)"/><use href="#dozen" transform="translate(330 220)"/><use href="#dozen" transform="translate(500 220)"/><use href="#dozen" transform="translate(670 220)"/><use href="#dozen" transform="translate(840 220)"/><use href="#dozen" transform="translate(1010 220)"/>
    <use href="#dozen" transform="translate(245 440)"/><use href="#dozen" transform="translate(415 440)"/><use href="#dozen" transform="translate(585 440)"/><use href="#dozen" transform="translate(755 440)"/><use href="#dozen" transform="translate(925 440)"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle" font-size="17" font-weight="700">
    <text x="160" y="275">12</text><text x="330" y="275">12</text><text x="500" y="275">12</text><text x="670" y="275">12</text><text x="840" y="275">12</text><text x="1010" y="275">12</text>
    <text x="245" y="495">12</text><text x="415" y="495">12</text><text x="585" y="495">12</text><text x="755" y="495">12</text><text x="925" y="495">12</text>
  </g>
  <g font-family="Arial,sans-serif" fill="#18324A" text-anchor="middle" font-size="21" font-weight="700">
    <text x="160" y="300">group 1</text><text x="330" y="300">group 2</text><text x="500" y="300">group 3</text><text x="670" y="300">group 4</text><text x="840" y="300">group 5</text><text x="1010" y="300">group 6</text>
    <text x="245" y="520">group 7</text><text x="415" y="520">group 8</text><text x="585" y="520">group 9</text><text x="755" y="520">group 10</text><text x="925" y="520">group 11</text>
  </g>
  <path d="M90 625v35h955v-35" fill="none" stroke="#347C5A" stroke-width="6"/>
  <text x="567" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#347C5A">11 equal groups × 12 = 132</text>
