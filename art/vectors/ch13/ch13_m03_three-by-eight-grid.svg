<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Separate three-by-eight grids prevent overlap from being double-counted</title><desc id="desc">Two separate 3 by 8 grids each contain exactly 24 equal cells. In the first, two complete rows mark 16 cells for two thirds. In the second, five complete columns mark 15 cells for five eighths. A separate result bar shows 24 cells plus 7 cells, totaling 31 twenty-fourths.</desc><defs><pattern id="grid" x="80" y="155" width="55" height="70" patternUnits="userSpaceOnUse"><path d="M55 0V70M0 70H55" stroke="#18324A" stroke-width="2"/></pattern><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C66A12" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18324A">One 3×8 grid, used twice—not one overlap count</text>
  <rect x="80" y="155" width="440" height="140" fill="#B9D8D5"/><rect x="80" y="155" width="440" height="210" fill="url(#grid)" stroke="#18324A" stroke-width="5"/><text x="300" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="28">2 rows × 8 = 16 cells</text><rect x="680" y="155" width="275" height="210" fill="url(#h)"/><rect x="680" y="155" width="440" height="210" fill="none" stroke="#18324A" stroke-width="5"/><g stroke="#18324A" stroke-width="2"><path d="M735 155V365"/><path d="M790 155V365"/><path d="M845 155V365"/><path d="M900 155V365"/><path d="M955 155V365"/><path d="M1010 155V365"/><path d="M1065 155V365"/><path d="M680 225H1120M680 295H1120"/></g><text x="900" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="28">5 columns × 3 = 15 cells</text><path d="M600 150v250" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 10"/><text x="600" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#553A78">separate counts</text>
  <rect x="210" y="540" width="576" height="80" fill="#DDEDE4" stroke="#18324A" stroke-width="4"/><rect x="786" y="540" width="168" height="80" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><g stroke="#18324A" stroke-width="1.5" opacity=".55"><path d="M234 540V620"/><path d="M258 540V620"/><path d="M282 540V620"/><path d="M306 540V620"/><path d="M330 540V620"/><path d="M354 540V620"/><path d="M378 540V620"/><path d="M402 540V620"/><path d="M426 540V620"/><path d="M450 540V620"/><path d="M474 540V620"/><path d="M498 540V620"/><path d="M522 540V620"/><path d="M546 540V620"/><path d="M570 540V620"/><path d="M594 540V620"/><path d="M618 540V620"/><path d="M642 540V620"/><path d="M666 540V620"/><path d="M690 540V620"/><path d="M714 540V620"/><path d="M738 540V620"/><path d="M762 540V620"/><path d="M786 540V620"/><path d="M810 540V620"/><path d="M834 540V620"/><path d="M858 540V620"/><path d="M882 540V620"/><path d="M906 540V620"/><path d="M930 540V620"/></g><text x="498" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="27">24/24 · one whole</text><text x="870" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="27">7/24</text><text x="600" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#347C5A">16 + 15 = 31 cells = 1 7/24</text>
</svg>
