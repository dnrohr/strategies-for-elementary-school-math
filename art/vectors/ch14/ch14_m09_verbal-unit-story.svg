<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">One possible constructed inner script keeps the unit word twelfths visible</title><desc id="desc">Four numbered speech-like cards rename fourths and thirds as twelfths, retain five twelfths, then add the unit counts. Each phrase sits above its matching equation. The wording is explicitly constructed and inner speech is not required.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="58" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#18324A">One possible constructed inner script</text><text x="65" y="95" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">Keep saying the unit word “twelfths” while the fractions change form.</text><path d="M90 145q15-20 30 0t30 0t30 0t30 0t30 0t30 0" fill="none" stroke="#7652A8" stroke-width="5"/><text x="330" y="155" font-family="Arial,sans-serif" font-size="24" fill="#553A78">inner-speech motif · constructed account</text>
  <g font-family="Arial,sans-serif" fill="#18324A"><rect x="80" y="200" width="490" height="130" rx="24" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="115" y="255" font-size="26" font-weight="700">“Fourths are not the unit yet.”</text><text x="115" y="302" font-size="24">3/4 → 9 twelfths</text><rect x="630" y="200" width="490" height="130" rx="24" fill="#FFFDF8" stroke="#C66A12" stroke-width="5" stroke-dasharray="12 8"/><text x="665" y="255" font-size="26" font-weight="700">“Thirds become twelfths too.”</text><text x="665" y="302" font-size="24">2/3 → 8 twelfths</text><rect x="80" y="385" width="490" height="130" rx="24" fill="#FFFDF8" stroke="#347C5A" stroke-width="5"/><text x="115" y="440" font-size="26" font-weight="700">“Five twelfths is ready.”</text><text x="115" y="487" font-size="24">5/12 → 5 twelfths</text><rect x="630" y="385" width="490" height="130" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="665" y="440" font-size="26" font-weight="700">“Now add the same units.”</text><text x="665" y="487" font-size="24">9 + 8 + 5 = 22 twelfths</text></g><rect x="260" y="600" width="680" height="105" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#347C5A">22/12 = 11/6 = 1 5/6</text><text x="600" y="760" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#5A6570">Words can track a unit; they are not required for correct reasoning.</text>
<g data-qa-detail="reading-order"><g font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#FFFDF8"><circle cx="95" cy="215" r="20" fill="#176B73"/><text x="95" y="223">1</text><circle cx="645" cy="215" r="20" fill="#C66A12"/><text x="645" y="223">2</text><circle cx="95" cy="400" r="20" fill="#347C5A"/><text x="95" y="408">3</text><circle cx="645" cy="400" r="20" fill="#7652A8"/><text x="645" y="408">4</text></g></g></svg>
