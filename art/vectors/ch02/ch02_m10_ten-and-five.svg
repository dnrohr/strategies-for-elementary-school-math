<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split fifteen into ten and five, remove eight from the ten</title><desc id="desc">A two-row ten-frame has eight crossed cells and two double-outlined remaining cells. Beside it, five untouched counters join those two, making seven. Labels state ten minus eight equals two, then two plus five equals seven.</desc><defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="10" stroke="#C2413B" stroke-width="3"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Split 15 into 10 and 5</text><text x="64" y="110" font-size="24" fill="#52605A">Remove 8 from the ten-part; the five-part stays untouched.</text><text x="335" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#2764B8">TEN-FRAME</text><g transform="translate(85 210)" stroke="#24312D" stroke-width="4"><g fill="url(#h)"><rect width="100" height="100"/><rect x="100" width="100" height="100"/><rect x="200" width="100" height="100"/><rect x="300" width="100" height="100"/><rect x="400" width="100" height="100"/><rect y="100" width="100" height="100"/><rect x="100" y="100" width="100" height="100"/><rect x="200" y="100" width="100" height="100"/></g><g fill="#E8F3ED" stroke="#287A55" stroke-width="8"><rect x="300" y="100" width="100" height="100"/><rect x="400" y="100" width="100" height="100"/></g><path d="M10 10L290 190M290 10L10 190" stroke="#C2413B" stroke-width="5" opacity=".5"/></g><text x="335" y="465" text-anchor="middle" font-size="29" font-weight="700">10 − 8 = 2 remain</text><text x="870" y="175" text-anchor="middle" font-size="27" font-weight="700" fill="#2764B8">UNTOUCHED FIVE</text><g fill="#2764B8" stroke="#24312D" stroke-width="4"><circle cx="760" cy="270" r="33"/><circle cx="870" cy="270" r="33"/><circle cx="980" cy="270" r="33"/><circle cx="815" cy="380" r="33"/><circle cx="925" cy="380" r="33"/></g><path d="M585 520H700" stroke="#7652A8" stroke-width="6" stroke-dasharray="6 10"/><text x="750" y="530" font-size="32" font-weight="700" fill="#287A55">2 + 5 = 7</text><rect x="405" y="620" width="390" height="95" rx="48" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="600" y="680" text-anchor="middle" font-size="36" font-weight="700">(10 − 8) + 5 = 7</text></g></svg>
