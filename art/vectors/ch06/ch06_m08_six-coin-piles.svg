<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Twenty-four coin tokens shared into six piles</title><desc id="desc">Six labeled pile spaces each contain exactly four abstract vector coin tokens, for twenty-four total. Four horizontal rounds show the equal dealing structure without hands.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Four dealing rounds fill six piles</text><g fill="#F7F0E5" stroke="#2764B8" stroke-width="5"><rect x="50" y="150" width="170" height="480" rx="25"/><rect x="235" y="150" width="170" height="480" rx="25"/><rect x="420" y="150" width="170" height="480" rx="25"/><rect x="605" y="150" width="170" height="480" rx="25"/><rect x="790" y="150" width="170" height="480" rx="25"/><rect x="975" y="150" width="170" height="480" rx="25"/></g><g fill="#D97706" stroke="#24312D" stroke-width="4"><circle cx="135" cy="260" r="30"/><circle cx="135" cy="350" r="30"/><circle cx="135" cy="440" r="30"/><circle cx="135" cy="530" r="30"/><circle cx="320" cy="260" r="30"/><circle cx="320" cy="350" r="30"/><circle cx="320" cy="440" r="30"/><circle cx="320" cy="530" r="30"/><circle cx="505" cy="260" r="30"/><circle cx="505" cy="350" r="30"/><circle cx="505" cy="440" r="30"/><circle cx="505" cy="530" r="30"/><circle cx="690" cy="260" r="30"/><circle cx="690" cy="350" r="30"/><circle cx="690" cy="440" r="30"/><circle cx="690" cy="530" r="30"/><circle cx="875" cy="260" r="30"/><circle cx="875" cy="350" r="30"/><circle cx="875" cy="440" r="30"/><circle cx="875" cy="530" r="30"/><circle cx="1060" cy="260" r="30"/><circle cx="1060" cy="350" r="30"/><circle cx="1060" cy="440" r="30"/><circle cx="1060" cy="530" r="30"/></g><text x="600" y="710" font-size="36" font-weight="700">24 coins ÷ 6 piles = 4 coins per pile</text></g></svg>
