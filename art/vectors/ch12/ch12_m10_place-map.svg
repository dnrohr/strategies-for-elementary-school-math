<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">An external place-value map records four exact regrouping states</title>
  <desc id="desc">Four large numbered cards form a two-row sequence: raw sums, trade ones, trade tens, and trade hundreds. Every card represents the same total, ending with one thousand, two hundreds, two tens, and one one.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="60" y="62" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18324A">Trade one place at a time</text><text x="60" y="98" font-family="Arial,sans-serif" font-size="23" fill="#5A6570">External place-value record · every card still represents the same total</text>
  <g font-family="Arial,sans-serif" fill="#18324A">
    <g><rect x="70" y="145" width="470" height="225" rx="26" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><circle cx="120" cy="195" r="25" fill="#18324A"/><text x="120" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFDF8">1</text><text x="160" y="204" font-size="27" font-weight="700">RAW SUMS</text><text x="125" y="270" font-size="28">10 hundreds</text><text x="320" y="270" font-size="28">20 tens</text><text x="125" y="325" font-size="28">21 ones</text></g>
    <g><rect x="660" y="145" width="470" height="225" rx="26" fill="#FFFDF8" stroke="#D97706" stroke-width="5" stroke-dasharray="12 8"/><circle cx="710" cy="195" r="25" fill="#D97706"/><text x="710" y="204" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFDF8">2</text><text x="750" y="194" font-size="27" font-weight="700">TRADE ONES</text><text x="750" y="224" font-size="20" fill="#8A450D">20 ones → 2 tens</text><text x="715" y="285" font-size="28">10 hundreds</text><text x="910" y="285" font-size="28">22 tens</text><text x="715" y="335" font-size="28">1 one</text></g>
    <g><rect x="70" y="430" width="470" height="225" rx="26" fill="#FFFDF8" stroke="#7652A8" stroke-width="5"/><circle cx="120" cy="480" r="25" fill="#7652A8"/><text x="120" y="489" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFDF8">3</text><text x="160" y="479" font-size="27" font-weight="700">TRADE TENS</text><text x="160" y="509" font-size="20" fill="#553A78">20 tens → 2 hundreds</text><text x="125" y="570" font-size="28">12 hundreds</text><text x="330" y="570" font-size="28">2 tens</text><text x="125" y="620" font-size="28">1 one</text></g>
    <g><rect x="660" y="430" width="470" height="225" rx="26" fill="#DDEDE4" stroke="#287A55" stroke-width="6"/><circle cx="710" cy="480" r="25" fill="#287A55"/><text x="710" y="489" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFDF8">4</text><text x="750" y="479" font-size="27" font-weight="700">TRADE HUNDREDS</text><text x="750" y="509" font-size="20" fill="#12545A">10 hundreds → 1 thousand</text><text x="715" y="570" font-size="27">1 thousand</text><text x="910" y="570" font-size="27">2 hundreds</text><text x="715" y="620" font-size="27">2 tens · 1 one</text></g>
  </g>
  <g stroke="#7652A8" stroke-width="6" marker-end="url(#a)"><path d="M560 258H630"/><path d="M895 390V415"/><path d="M560 542H630"/></g>
  <rect x="250" y="695" width="700" height="70" rx="22" fill="#FFFDF8" stroke="#287A55" stroke-width="4"/><text x="600" y="741" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#287A55">1,000 + 200 + 20 + 1 = 1,221</text>
</svg>
