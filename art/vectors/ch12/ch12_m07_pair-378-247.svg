<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Pair 378 and 247 to make 625</title><desc id="desc">Three movable-looking number tiles place 378 beside 247 under one bracket. Their exact subtotal is 625. The untouched 596 then joins 625 to produce the total 1,221.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Reorder to make a friendly pair</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><rect x="110" y="185" width="250" height="150" rx="24" fill="#B9D8D5" stroke="#18324A" stroke-width="4"/><text x="235" y="280" font-size="46" font-weight="700">378</text><rect x="430" y="185" width="250" height="150" rx="24" fill="#F2B35F" stroke="#18324A" stroke-width="4"/><text x="555" y="280" font-size="46" font-weight="700">247</text><rect x="850" y="185" width="250" height="150" rx="24" fill="#FFFDF8" stroke="#7652A8" stroke-width="4" stroke-dasharray="12 8"/><text x="975" y="280" font-size="46" font-weight="700">596</text><path d="M100 375v45h590v-45" fill="none" stroke="#176B73" stroke-width="6"/><text x="395" y="475" font-size="32">378 + 247 = 625</text><path d="M700 455h130" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="765" y="420" font-size="24" fill="#553A78">then +596</text><text x="600" y="615" font-size="43" font-weight="700">625 + 596 = <tspan fill="#347C5A">1,221</tspan></text><text x="600" y="705" font-size="25" fill="#5A6570">The order changes; the quantities do not.</text></g></svg>
