<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Regroup factor tiles eleven, three, and four</title><desc id="desc">Twelve factors into tiles three and four beside tile eleven. Equality arrows regroup eleven times three into 33, then 33 times four equals 132.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Regroup factors, not values</text><g class="factor-tiles" font-size="48" font-weight="700"><rect x="165" y="140" width="190" height="145" rx="28" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="260" y="232">11</text><text x="420" y="232">×</text><rect x="485" y="140" width="190" height="145" rx="28" fill="#F7EFE3" stroke="#D97706" stroke-width="7"/><text x="580" y="232">3</text><text x="740" y="232">×</text><rect x="805" y="140" width="190" height="145" rx="28" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="900" y="232">4</text></g><text x="600" y="340" font-size="26">because 12 = 3 × 4</text><path d="M420 360C455 400 515 410 560 420" fill="none" stroke="#7652A8" stroke-width="7" marker-end="url(#arrow)"/><rect x="450" y="425" width="300" height="130" rx="30" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="600" y="510" font-size="48" font-weight="700">33 × 4</text><path d="M755 490H865" stroke="#7652A8" stroke-width="7" marker-end="url(#arrow)"/><rect x="875" y="420" width="245" height="145" rx="34" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="997" y="513" font-size="58" font-weight="700">132</text><text x="600" y="680" font-size="33" font-weight="700">11 × 12 = (11 × 3) × 4 = 33 × 4 = 132</text></g></svg>
