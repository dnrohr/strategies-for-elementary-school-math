<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Skip-count by twelves for eleven beats</title><desc id="desc">A timeline has exactly eleven numbered beat markers with multiples of twelve beneath them, ending at 132 on beat eleven.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="70" font-size="38" font-weight="700">Eleven beats of twelve</text><path d="M80 350H1120" stroke="#D97706" stroke-width="7"/><g class="beats-eleven" fill="#FFFDF8" stroke="#D97706" stroke-width="6"><circle cx="100" cy="350" r="28"/><circle cx="200" cy="350" r="28"/><circle cx="300" cy="350" r="28"/><circle cx="400" cy="350" r="28"/><circle cx="500" cy="350" r="28"/><circle cx="600" cy="350" r="28"/><circle cx="700" cy="350" r="28"/><circle cx="800" cy="350" r="28"/><circle cx="900" cy="350" r="28"/><circle cx="1000" cy="350" r="28"/><circle cx="1100" cy="350" r="28"/></g><g font-size="28" font-weight="700"><text x="100" y="357">1</text><text x="200" y="357">2</text><text x="300" y="357">3</text><text x="400" y="357">4</text><text x="500" y="357">5</text><text x="600" y="357">6</text><text x="700" y="357">7</text><text x="800" y="357">8</text><text x="900" y="357">9</text><text x="1000" y="357">10</text><text x="1100" y="357">11</text></g><text x="600" y="450" font-size="28">12 · 24 · 36 · 48 · 60 · 72 · 84 · 96 · 108 · 120 · 132</text><text x="600" y="600" font-size="38" font-weight="700">beat 11 → 132</text></g></svg>
