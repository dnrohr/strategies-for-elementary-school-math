<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d">
  <title id="t">Markup of Method 11 ten-frame blocks</title><desc id="d">Three callouts identify inconsistent unit scale, unmapped movement, and panel density.</desc><image href="../../../art/vectors/ch01/ch01_m11_ten-frame-blocks.svg" width="1200" height="800"/>
  <g fill="none" stroke="#C23B32" stroke-width="7"><rect x="770" y="485" width="235" height="120" rx="20"/><ellipse cx="615" cy="420" rx="95" ry="120"/><rect x="60" y="185" width="1085" height="460" rx="32"/></g><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><g fill="#C23B32" stroke="#fff" stroke-width="4"><circle cx="1005" cy="500" r="28"/><circle cx="655" cy="330" r="28"/><circle cx="1130" cy="205" r="28"/></g><g fill="#fff" font-size="28"><text x="1005" y="510">1</text><text x="655" y="340">2</text><text x="1130" y="215">3</text></g></g>
  <rect x="1200" width="400" height="800" fill="#18324A"/><g font-family="Arial,sans-serif" fill="#FFFDF8"><text x="1240" y="62" font-size="28" font-weight="700">METHOD 11 · MARKUP</text><text x="1240" y="125" font-size="23"><tspan font-weight="700">1 · MAJOR: unit scale</tspan><tspan x="1240" dy="32">The two loose blocks are larger than</tspan><tspan x="1240" dy="29">the same units in tray/frame.</tspan><tspan x="1240" dy="62" font-weight="700">2 · Trace conservation</tspan><tspan x="1240" dy="32">Draw three trajectories from source</tspan><tspan x="1240" dy="29">blocks; leave two visibly in place.</tspan><tspan x="1240" dy="62" font-weight="700">3 · Reduce panel density</tspan><tspan x="1240" dy="32">Use short before/after tabs and</tspan><tspan x="1240" dy="29">enlarge the actual transformation.</tspan></text></g>
</svg>
