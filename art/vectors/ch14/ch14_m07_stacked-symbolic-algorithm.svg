<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Written fraction column keeps the common denominator 12</title><desc id="desc">A conversion panel changes three fourths to 9 twelfths and two thirds to 8 twelfths. A written column aligns 9 twelfths, 8 twelfths, and 5 twelfths, adds only the numerators to get 22 twelfths, then reduces by 2 to 11 sixths.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="78" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Align the unit; add only its counts</text>
  <rect x="70" y="145" width="470" height="500" rx="28" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="305" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">RENAME</text><g font-family="Arial,sans-serif" font-size="34" text-anchor="middle" fill="#18324A"><text x="305" y="300">3/4 × 3/3 = 9/12</text><text x="305" y="390">2/3 × 4/4 = 8/12</text><text x="305" y="480">5/12 stays 5/12</text></g><text x="305" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">all pieces now mean 1/12</text>
  <rect x="650" y="145" width="480" height="500" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="890" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700">ADD THE NUMERATOR COLUMN</text><g font-family="Arial,sans-serif" font-size="38" text-anchor="end" fill="#18324A"><text x="930" y="290">9/12</text><text x="930" y="360">8/12</text><text x="930" y="430">+ 5/12</text></g><path d="M760 458H955" stroke="#18324A" stroke-width="5"/><text x="930" y="520" text-anchor="end" font-family="Arial,sans-serif" font-size="43" font-weight="700">22/12</text><text x="890" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#347C5A">÷ 2/2 → 11/6 = 1 5/6</text><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#5A6570">The denominator names the unit and remains 12 during addition.</text>
</svg>
