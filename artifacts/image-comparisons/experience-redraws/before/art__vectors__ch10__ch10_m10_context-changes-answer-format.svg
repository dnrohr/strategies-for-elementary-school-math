<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Indivisible and divisible candy scenarios stay separate</title>
  <desc id="desc">The left panel shows five equal shares of four whole candies and a separate remainder plate of three, labeled four remainder three. The right panel shows five equal shares, each with four whole candies and three fifth-pieces, labeled four and three fifths. A divider prevents mixing the scenarios.</desc>
  <defs><circle id="w" r="10" fill="#F2B35F" stroke="#18324A" stroke-width="2"/><g id="four"><use href="#w" x="-18"/><use href="#w" x="18"/><use href="#w" x="-18" y="30"/><use href="#w" x="18" y="30"/></g><g id="share"><rect x="-48" y="-30" width="96" height="98" rx="20" fill="#FFFDF8" stroke="#176B73" stroke-width="3"/><use href="#four" y="5"/></g><g id="fraction-share"><use href="#share"/><path d="M-30 58l10-8 10 8-10 8zM0 58l10-8 10 8-10 8zM30 58l10-8 10 8-10 8z" fill="#B33A3A" stroke="#18324A" stroke-width="1.5"/></g></defs><rect width="1200" height="800" fill="#F8F2E7"/><path d="M600 90V710" stroke="#7652A8" stroke-width="5" stroke-dasharray="14 12"/>
  <text x="300" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#18324A">INDIVISIBLE</text><text x="300" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#5A6570">whole candies stay whole</text><use href="#share" x="115" y="240"/><use href="#share" x="300" y="240"/><use href="#share" x="485" y="240"/><use href="#share" x="205" y="410"/><use href="#share" x="395" y="410"/><rect x="175" y="530" width="250" height="90" rx="38" fill="#FFFDF8" stroke="#B33A3A" stroke-width="5" stroke-dasharray="12 8"/><use href="#w" x="250" y="575"/><use href="#w" x="300" y="575"/><use href="#w" x="350" y="575"/><text x="300" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#7A2525">4 R3</text>
  <text x="900" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#18324A">DIVISIBLE</text><text x="900" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#5A6570">each leftover is cut into fifths</text><use href="#fraction-share" x="700" y="240"/><use href="#fraction-share" x="900" y="240"/><use href="#fraction-share" x="1100" y="240"/><use href="#fraction-share" x="800" y="440"/><use href="#fraction-share" x="1000" y="440"/><text x="900" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#7A2525">each bowl: 4 whole + 3 fifth-pieces</text><text x="900" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#7A2525">4 3/5 each</text><text x="600" y="760" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18324A">Same 23 ÷ 5 decomposition; context determines the answer format.</text>
</svg>
