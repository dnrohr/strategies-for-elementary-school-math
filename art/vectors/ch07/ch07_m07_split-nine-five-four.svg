<svg data-qa-image-pass="2026-09-27" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Split nine columns into five columns and four columns</title><desc id="desc">An exact square-celled seven-by-nine grid is split vertically after five columns. Exterior labels identify the seven-by-five region as 35 and the seven-by-four region as 28 without covering any cell.</desc>
  <defs><pattern id="left" x="195" y="145" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#E7EEF8" stroke="#24312D" stroke-width="2"/></pattern><pattern id="right" x="645" y="145" width="90" height="70" patternUnits="userSpaceOnUse"><rect width="90" height="70" fill="#F7EFE3" stroke="#24312D" stroke-width="2"/></pattern></defs>
  <rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24312D"><text x="600" y="60" font-size="38" font-weight="700">Partition 9 as 5 + 4</text><text x="460" y="132" font-size="27" font-weight="700" fill="#2764B8">5 columns · 7 × 5 = 35</text><text x="775" y="132" font-size="27" font-weight="700" fill="#9A4F00">4 columns · 7 × 4 = 28</text><g transform="translate(133.3333 20) scale(.777777778 1)"><rect class="seven-by-five" x="195" y="145" width="450" height="490" fill="url(#left)" stroke="#2764B8" stroke-width="7" vector-effect="non-scaling-stroke"/><rect class="seven-by-four" x="645" y="145" width="360" height="490" fill="url(#right)" stroke="#D97706" stroke-width="7" vector-effect="non-scaling-stroke"/></g><text x="600" y="725" font-size="37" font-weight="700">35 + 28 = 63 square units</text></g>
</svg>
