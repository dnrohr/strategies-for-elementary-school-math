<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Split eight into five and three, then subtract in stages</title><desc id="desc">A symbolic path moves from fifteen to ten by subtracting five, then from ten to seven by subtracting three. A decomposition card states eight equals five plus three, so the two removal stages total eight.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#7652A8"/></marker><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#C2413B" stroke-width="4"/></pattern></defs><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="64" y="70" font-size="38" font-weight="700" fill="#24312D">Split the amount removed</text><rect x="390" y="115" width="420" height="80" rx="40" fill="#F7ECEA" stroke="#C2413B" stroke-width="5"/><text x="600" y="167" text-anchor="middle" font-size="34" font-weight="700" fill="#24312D">8 = 5 + 3</text>
<g text-anchor="middle"><circle cx="180" cy="410" r="95" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="180" y="430" font-size="58" font-weight="700">15</text><path d="M285 410H480" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#a)"/><text x="380" y="370" font-size="30" font-weight="700" fill="#C2413B">−5</text><circle cx="590" cy="410" r="95" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="590" y="430" font-size="58" font-weight="700">10</text><path d="M695 410H890" stroke="#7652A8" stroke-width="7" stroke-dasharray="8 11" marker-end="url(#a)"/><text x="790" y="370" font-size="30" font-weight="700" fill="#C2413B">−3</text><circle cx="1000" cy="410" r="98" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><circle cx="1000" cy="410" r="84" fill="none" stroke="#287A55" stroke-width="4"/><text x="1000" y="430" font-size="58" font-weight="700">7</text></g><text x="600" y="650" text-anchor="middle" font-size="36" font-weight="700" fill="#24312D">15 − 5 − 3 = 7</text><text x="600" y="695" text-anchor="middle" font-size="24" fill="#52605A">five removed + three removed = eight removed</text></g></svg>
