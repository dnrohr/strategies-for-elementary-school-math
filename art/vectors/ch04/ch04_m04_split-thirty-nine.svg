<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split thirty-nine into thirty and nine</title><desc id="desc">A decomposition card splits thirty-nine into thirty plus nine. The operator path subtracts thirty from seventy-two to reach forty-two, then subtracts nine to reach thirty-three.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Subtract tens, then ones</text><rect x="400" y="115" width="400" height="80" rx="40" fill="#F7ECEA" stroke="#C2413B" stroke-width="5"/><text x="600" y="167" font-size="33" font-weight="700">39 = 30 + 9</text><g font-size="54" font-weight="700"><circle cx="170" cy="410" r="90" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="170" y="430">72</text><circle cx="600" cy="410" r="90" fill="#F4EBFA" stroke="#7652A8" stroke-width="7"/><text x="600" y="430">42</text><circle cx="1030" cy="410" r="95" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="1030" y="430">33</text></g><path d="M270 410H495M700 410H925" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 11"/><text x="385" y="365" font-size="30" fill="#C2413B">−30</text><text x="815" y="365" font-size="30" fill="#C2413B">−9</text><text x="600" y="680" font-size="36" font-weight="700">72 − 30 = 42 · 42 − 9 = 33</text></g></svg>
