<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Test the exact nearby fact four times six equals twenty-four</title><desc id="desc">A tentative quotient of four is visibly separated from the exact evidence: four equal blocks of six compose twenty-four, and inverse multiplication verifies twenty-four divided by six equals four.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">Test a candidate with an exact multiplication fact</text><rect x="85" y="185" width="300" height="180" rx="30" fill="#F4EBFA" stroke="#7652A8" stroke-width="7" stroke-dasharray="12 9"/><text x="235" y="250" font-size="27">tentative candidate</text><text x="235" y="330" font-size="66" font-weight="700">4?</text><path d="M420 275H525" stroke="#7652A8" stroke-width="7" stroke-dasharray="7 10"/><g class="four-blocks-of-six" fill="#E8F3ED" stroke="#287A55" stroke-width="7"><rect x="560" y="170" width="135" height="210" rx="20"/><rect x="705" y="170" width="135" height="210" rx="20"/><rect x="850" y="170" width="135" height="210" rx="20"/><rect x="995" y="170" width="135" height="210" rx="20"/></g><g font-size="38" font-weight="700"><text x="627" y="292">6</text><text x="772" y="292">6</text><text x="917" y="292">6</text><text x="1062" y="292">6</text></g><text x="845" y="440" font-size="31" font-weight="700">4 × 6 = 24 exactly</text><path class="verification-loop" d="M1020 500C1020 700 180 700 180 420" fill="none" stroke="#287A55" stroke-width="8" stroke-dasharray="10 8"/><rect x="375" y="585" width="450" height="100" rx="32" fill="#FFFDF8" stroke="#287A55" stroke-width="6"/><text x="600" y="648" font-size="36" font-weight="700">verified: 24 ÷ 6 = 4</text></g></svg>
