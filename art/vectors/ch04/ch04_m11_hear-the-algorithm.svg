<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Hear the regrouping algorithm as an ordered verbal sequence</title><desc id="desc">Four numbered speech ribbons say rename one ten, twelve minus nine is three, six tens minus three tens is three tens, and the result is thirty-three. A small aligned numeral inset verifies the procedure.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif"><text x="60" y="70" font-size="38" font-weight="700">An inner-spoken checklist</text><g font-size="28" font-weight="700"><rect x="100" y="145" width="850" height="90" rx="45" fill="#F4EBFA" stroke="#7652A8" stroke-width="5"/><text x="150" y="200">1</text><text x="230" y="200">“Rename one ten: 72 becomes 60 + 12.”</text><rect x="170" y="265" width="850" height="90" rx="45" fill="#F7EFE3" stroke="#D97706" stroke-width="5"/><text x="220" y="320">2</text><text x="300" y="320">“Twelve minus nine is three.”</text><rect x="100" y="385" width="850" height="90" rx="45" fill="#E7EEF8" stroke="#2764B8" stroke-width="5"/><text x="150" y="440">3</text><text x="230" y="440">“Six tens minus three tens is three tens.”</text><rect x="170" y="505" width="850" height="90" rx="45" fill="#E8F3ED" stroke="#287A55" stroke-width="8"/><text x="220" y="560">4</text><text x="300" y="560">“Three tens and three ones: 33.”</text></g><rect x="970" y="145" width="170" height="330" rx="22" fill="#FFFDF8" stroke="#24312D" stroke-width="5"/><g font-family="Consolas,monospace" font-size="48" text-anchor="end"><text x="1100" y="245">72</text><text x="1100" y="325">−39</text><path d="M1000 350h115" stroke="#24312D" stroke-width="5"/><text x="1100" y="425">33</text></g></g></svg>
