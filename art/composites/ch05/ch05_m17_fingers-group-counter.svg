<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fingers provide context while eleven tallies count groups of twelve</title>
  <desc id="desc">Two resting hands are not used as eleven fingers. Exactly eleven vector tally marks count eleven groups, and a separate unit shows exactly twelve counters. Eleven groups of twelve equal 132.</desc>
  <image href="../../raster/ch05/ch05_m17_fingers-group-counter_raster.png" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
  <g font-family="Arial,sans-serif" fill="#24312D">
    <rect x="42" y="28" width="1116" height="92" rx="24" fill="#FFFDF8" fill-opacity=".94"/>
    <text x="600" y="68" text-anchor="middle" font-size="34" font-weight="700">Fingers keep the rhythm; tallies count the groups</text>
    <text x="600" y="101" text-anchor="middle" font-size="22">Hands are context—not a picture of eleven fingers.</text>
    <rect x="52" y="148" width="688" height="218" rx="28" fill="#FFFDF8" fill-opacity=".93" stroke="#2764B8" stroke-width="6"/>
    <text x="396" y="190" text-anchor="middle" font-size="25" font-weight="700">exactly 11 group tallies</text>
    <g class="tally-eleven" stroke="#2764B8" stroke-width="10" stroke-linecap="round">
      <line x1="112" y1="225" x2="112" y2="302"/><line x1="167" y1="225" x2="167" y2="302"/><line x1="222" y1="225" x2="222" y2="302"/><line x1="277" y1="225" x2="277" y2="302"/><line x1="332" y1="225" x2="332" y2="302"/><line x1="387" y1="225" x2="387" y2="302"/><line x1="442" y1="225" x2="442" y2="302"/><line x1="497" y1="225" x2="497" y2="302"/><line x1="552" y1="225" x2="552" y2="302"/><line x1="607" y1="225" x2="607" y2="302"/><line x1="662" y1="225" x2="662" y2="302"/>
    </g>
    <rect x="775" y="148" width="373" height="218" rx="28" fill="#FFFDF8" fill-opacity=".93" stroke="#D97706" stroke-width="6"/>
    <text x="961" y="188" text-anchor="middle" font-size="25" font-weight="700">one group = 12</text>
    <g class="counters-twelve" fill="#F5D88B" stroke="#8A5A00" stroke-width="3">
      <circle cx="846" cy="231" r="20"/><circle cx="923" cy="231" r="20"/><circle cx="1000" cy="231" r="20"/><circle cx="1077" cy="231" r="20"/>
      <circle cx="846" cy="279" r="20"/><circle cx="923" cy="279" r="20"/><circle cx="1000" cy="279" r="20"/><circle cx="1077" cy="279" r="20"/>
      <circle cx="846" cy="327" r="20"/><circle cx="923" cy="327" r="20"/><circle cx="1000" cy="327" r="20"/><circle cx="1077" cy="327" r="20"/>
    </g>
    <rect x="315" y="675" width="570" height="82" rx="41" fill="#E8F3ED" fill-opacity=".96" stroke="#287A55" stroke-width="7"/>
    <text x="600" y="728" text-anchor="middle" font-size="35" font-weight="700">11 groups × 12 = 132</text>
  </g>
</svg>
