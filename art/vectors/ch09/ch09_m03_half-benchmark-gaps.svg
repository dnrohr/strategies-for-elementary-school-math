<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Compare both fractions by their exact gaps above one half</title>
  <desc id="desc">An exact zero-to-one line marks one half, three fifths, and five eighths. The gap from one half to three fifths is one tenth of the whole; the gap from one half to five eighths is one eighth, which is larger.</desc>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="100" y="110" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18324A">Measure the extra above 1/2</text>
  <path d="M200 390H1000" stroke="#18324A" stroke-width="7"/><path d="M200 365v50M600 350v80M680 350v80M700 350v80M1000 365v50" stroke="#18324A" stroke-width="5"/>
  <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#18324A">0</text><text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#18324A">1/2</text><text x="680" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#12545A">3/5</text><text x="700" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#8A4308">5/8</text><text x="1000" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#18324A">1</text>
  <path d="M600 300v-35h80v35" fill="none" stroke="#176B73" stroke-width="7" stroke-dasharray="12 8"/><text x="640" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#12545A">1/10</text>
  <path d="M600 560v35h100v-35" fill="none" stroke="#C66A12" stroke-width="7"/><text x="650" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#8A4308">1/8</text><text x="650" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7A2525">1/8 is the larger extra piece</text>
</svg>
