<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">An abstract two-ended arrow conserves the sum while transferring four</title><desc id="desc">Separate before and after equations show 378 plus 596 plus 247 becoming 378 plus 600 plus 243. Labels above a clear curved conservation arrow mark plus four at the 596 end and minus four at the 247 end. No concrete counters appear; both equations equal 1,221.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="85" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Abstract redistribution: +4 here, −4 there</text>
  <rect x="90" y="155" width="1020" height="170" rx="28" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="160" y="215" font-family="Arial,sans-serif" font-size="22" font-weight="700">BEFORE</text><text x="600" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="700">378 + 596 + 247 = 1,221</text>
  <text x="505" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#12545A">+4 at 596</text><text x="695" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#7A2525">−4 at 247</text><path d="M770 385C680 490 520 490 430 385" fill="none" stroke="#7652A8" stroke-width="8" marker-end="url(#a)"/><text x="600" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#553A78">one two-ended conservation move</text>
  <rect x="90" y="525" width="1020" height="170" rx="28" fill="#DDEDE4" stroke="#347C5A" stroke-width="6"/><text x="160" y="585" font-family="Arial,sans-serif" font-size="22" font-weight="700">AFTER</text><text x="600" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="700">378 + 600 + 243 = 1,221</text><text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#18324A">(596 + 4) + (247 − 4) = 596 + 247</text>
</svg>
