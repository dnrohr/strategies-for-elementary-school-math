<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Pair 596 and 247 first</title><desc id="desc">A bracket groups 596 and 247 without crossing arrows. Their subtotal is 843; adding the untouched 378 gives the exact total 1,221. All three original addends remain visible.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="70" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Move the parentheses, not the quantities</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><rect x="100" y="220" width="240" height="135" rx="23" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="220" y="305" font-size="44" font-weight="700">378</text><rect x="440" y="180" width="250" height="135" rx="23" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="565" y="265" font-size="44" font-weight="700">596</text><rect x="780" y="180" width="250" height="135" rx="23" fill="#FFFDF8" stroke="#176B73" stroke-width="5"/><text x="905" y="265" font-size="44" font-weight="700">247</text><path d="M430 350v45h610v-45" fill="none" stroke="#7652A8" stroke-width="6"/><text x="735" y="440" font-size="30" fill="#553A78">596 + 247 = 843</text><path d="M735 465v75" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"/><text x="600" y="620" font-size="40" font-weight="700">378 + 843 = <tspan fill="#347C5A">1,221</tspan></text><text x="600" y="700" font-size="25" fill="#5A6570">378 + (596 + 247)</text></g></svg>
