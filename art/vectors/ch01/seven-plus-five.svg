<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Seven plus five shown as two clear visual routes</title>
  <desc id="desc">Two equally sized panels compare seven blue units plus five orange hatched units with a number line showing five separate one-unit hops from seven to twelve.</desc>
  <defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><path d="M0 0v12" stroke="#D97706" stroke-width="5"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4 0 8Z" fill="#087E8B"/></marker></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.k{font-size:22px;font-weight:700;letter-spacing:2px}.h{font-size:32px;font-weight:700}.l{font-size:23px;font-weight:700}.s{font-size:21px;fill:#52615B}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="600" y="65" class="k" text-anchor="middle">TWO ROUTES · SAME TOTAL</text>
  <rect x="55" y="110" width="520" height="585" rx="28" fill="#F8F3EA" stroke="#2764B8" stroke-width="5"/><text x="315" y="165" class="h" text-anchor="middle">Combine two groups</text>
  <g stroke="#174478" stroke-width="4" fill="#2764B8"><circle cx="180" cy="270" r="32"/><circle cx="315" cy="270" r="32"/><circle cx="450" cy="270" r="32"/><circle cx="180" cy="385" r="32"/><circle cx="315" cy="385" r="32"/><circle cx="450" cy="385" r="32"/><circle cx="315" cy="500" r="32"/></g>
  <path d="M125 225h380v320H125Z" fill="none" stroke="#2764B8" stroke-width="3" stroke-dasharray="8 8"/><text x="315" y="580" class="l" text-anchor="middle">7 · five-pattern + two</text>
  <g stroke="#A95805" stroke-width="4" fill="url(#h)"><circle cx="180" cy="620" r="25"/><circle cx="247" cy="620" r="25"/><circle cx="315" cy="620" r="25"/><circle cx="383" cy="620" r="25"/><circle cx="450" cy="620" r="25"/></g><text x="315" y="675" class="l" text-anchor="middle">+ 5 = 12</text>
  <rect x="625" y="110" width="520" height="585" rx="28" fill="#F8F3EA" stroke="#D97706" stroke-width="5" stroke-dasharray="12 8"/><text x="885" y="165" class="h" text-anchor="middle">Count on five</text><text x="885" y="215" class="s" text-anchor="middle">five equal +1 intervals</text>
  <path d="M700 500H1070" stroke="#68707A" stroke-width="5"/><g stroke="#68707A" stroke-width="4"><path d="M700 474v52M774 474v52M848 474v52M922 474v52M996 474v52M1070 474v52"/></g>
  <g fill="none" stroke="#087E8B" stroke-width="6" marker-end="url(#a)"><path d="M705 466q32-82 64 0"/><path d="M779 466q32-82 64 0"/><path d="M853 466q32-82 64 0"/><path d="M927 466q32-82 64 0"/><path d="M1001 466q32-82 64 0"/></g>
  <g class="l" text-anchor="middle"><text x="700" y="565">7</text><text x="774" y="565">8</text><text x="848" y="565">9</text><text x="922" y="565">10</text><text x="996" y="565">11</text><text x="1070" y="565">12</text></g><text x="885" y="635" class="h" text-anchor="middle" fill="#287A55">7 → 12</text><text x="600" y="755" class="s" text-anchor="middle">Same total; different visual route.</text>
</svg>
