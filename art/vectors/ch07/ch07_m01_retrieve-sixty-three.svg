<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Retrieve sixty-three for a seven-by-nine area</title><desc id="desc">A quiet seven-by-nine rectangle silhouette accompanies a prominent double-outlined 63 card labeled square units, without implying that cells were counted.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="70" font-size="38" font-weight="700">The product arrives</text><rect x="100" y="180" width="560" height="435" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="380" y="420" font-size="42">7 units × 9 units</text><path d="M700 400H790" stroke="#7652A8" stroke-width="5" stroke-dasharray="4 14"/><rect x="830" y="210" width="280" height="380" rx="40" fill="#E8F3ED" stroke="#287A55" stroke-width="10"/><rect x="845" y="225" width="250" height="350" rx="30" fill="none" stroke="#287A55" stroke-width="4"/><text x="970" y="405" font-size="100" font-weight="700">63</text><text x="970" y="470" font-size="28">square units</text></g><g data-qa-detail="edge-labels"><text x="380" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="25">9 units wide</text><text x="75" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" transform="rotate(-90 75 380)">7 units high</text></g></svg>
