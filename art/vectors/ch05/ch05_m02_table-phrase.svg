<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">The multiplication-table phrase eleven twelves are 132</title><desc id="desc">A selectable number-word ribbon and a dashed cadence line lead to the exact written fact eleven times twelve equals 132.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="80" font-size="38" font-weight="700">A remembered table phrase</text><path d="M100 210h900q60 0 60 60t-60 60H250l-90 55 25-55h-85q-60 0-60-60t60-60z" fill="#F4EBFA" stroke="#7652A8" stroke-width="6"/><text x="550" y="285" font-size="39" font-weight="700">“eleven twelves are one hundred thirty-two”</text><path d="M150 500H1050" stroke="#D97706" stroke-width="6" stroke-dasharray="8 25"/><text x="600" y="590" font-size="48" font-weight="700">11 × 12 = 132</text></g></svg>
