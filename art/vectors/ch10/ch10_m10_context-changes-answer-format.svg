<svg data-qa-image-pass="2026-09-28" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">One shared division stage branches into two context-sensitive answer forms</title>
  <desc id="desc">A shared first stage shows five groups of four whole candies and three whole leftovers. A fork leads left to keep the three candies whole and answer four remainder three, or right to split each leftover into five equal pieces and give three fifth-pieces to each group, answering four and three fifths each.</desc>
  <defs><circle id="w" r="10" fill="#F2B35F" stroke="#18324A" stroke-width="2"/><g id="four"><use href="#w" x="-18"/><use href="#w" x="18"/><use href="#w" x="-18" y="30"/><use href="#w" x="18" y="30"/></g><g id="share"><rect x="-48" y="-30" width="96" height="98" rx="20" fill="#FFFDF8" stroke="#176B73" stroke-width="3"/><use href="#four" y="5"/></g><g id="pieceSet"><path d="M-28 5l8-7 8 7-8 7zM-8 5l8-7 8 7-8 7zM12 5l8-7 8 7-8 7z" fill="#B33A3A" stroke="#18324A" stroke-width="1.5"/><g font-family="Arial,sans-serif" font-size="7" font-weight="700" text-anchor="middle" fill="#FFFDF8"><text x="-20" y="8">A</text><text x="0" y="8">B</text><text x="20" y="8">C</text></g></g><g id="fraction-share"><use href="#share" transform="scale(.65)"/><use href="#pieceSet" transform="translate(0 35) scale(.8)"/></g><g id="fifths"><rect width="350" height="28" rx="6" fill="#F2B35F" stroke="#18324A" stroke-width="2"/><path d="M70 0v28M140 0v28M210 0v28M280 0v28" stroke="#18324A" stroke-width="2"/></g></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18324A">Same start. Two context-dependent answers.</text>
  <rect x="80" y="82" width="1040" height="205" rx="26" fill="#FFFDF8" stroke="#18324A" stroke-width="3"/><text x="105" y="122" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324A">SHARED FIRST STAGE · 4 each, 3 left</text><use href="#share" x="230" y="175"/><use href="#share" x="380" y="175"/><use href="#share" x="530" y="175"/><use href="#share" x="680" y="175"/><use href="#share" x="830" y="175"/><rect x="920" y="145" width="150" height="80" rx="32" fill="#FFFDF8" stroke="#B33A3A" stroke-width="4" stroke-dasharray="10 7"/><use href="#w" x="955" y="185"/><use href="#w" x="995" y="185"/><use href="#w" x="1035" y="185"/><text x="995" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#7A2525">3 leftovers</text>
  <path d="M600 287V325M600 325H310V360M600 325H890V360" fill="none" stroke="#7652A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="360" width="500" height="360" rx="26" fill="#FFFDF8" stroke="#B33A3A" stroke-width="4"/><text x="310" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18324A">WHOLE CANDIES</text><text x="310" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#5A6570">Keep the shared four each; leave three whole.</text><rect x="185" y="480" width="250" height="90" rx="38" fill="#FFFDF8" stroke="#B33A3A" stroke-width="5" stroke-dasharray="12 8"/><use href="#w" x="260" y="525"/><use href="#w" x="310" y="525"/><use href="#w" x="360" y="525"/><text x="310" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#7A2525">4 R3</text><text x="310" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#5A6570">indivisible outcome</text>
  <rect x="640" y="360" width="500" height="360" rx="26" fill="#FFFDF8" stroke="#176B73" stroke-width="4" stroke-dasharray="12 8"/><text x="890" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#18324A">DIVISIBLE PIECES</text><g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#18324A"><text x="700" y="460">A</text><text x="700" y="505">B</text><text x="700" y="550">C</text></g><use href="#fifths" x="725" y="440"/><use href="#fifths" x="725" y="485"/><use href="#fifths" x="725" y="530"/><text x="890" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#5A6570">one fifth from A, B, and C to every group</text><use href="#fraction-share" x="710" y="615"/><use href="#fraction-share" x="800" y="615"/><use href="#fraction-share" x="890" y="615"/><use href="#fraction-share" x="980" y="615"/><use href="#fraction-share" x="1070" y="615"/><text x="890" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#7A2525">4 3/5 each</text>
  <text x="600" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18324A">The shared decomposition stays the same; context changes the answer form.</text>
</svg>
