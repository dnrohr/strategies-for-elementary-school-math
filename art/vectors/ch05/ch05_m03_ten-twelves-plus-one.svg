<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Split eleven into ten and one for two partial products</title><desc id="desc">Eleven splits into ten and one; ten times twelve is 120 and one times twelve is 12; the two partial products join to 132.</desc><rect width="1200" height="800" fill="#FFFDF8"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="75" font-size="38" font-weight="700">Ten twelves and one more</text><rect x="80" y="185" width="300" height="150" rx="25" fill="#E7EEF8" stroke="#2764B8" stroke-width="7"/><text x="230" y="275" font-size="38" font-weight="700">11 = 10 + 1</text><rect x="460" y="160" width="300" height="100" rx="22" fill="#F7EFE3" stroke="#D97706" stroke-width="6"/><text x="610" y="225" font-size="34">10 × 12 = 120</text><rect x="460" y="300" width="300" height="100" rx="22" fill="#F7EFE3" stroke="#D97706" stroke-width="6"/><text x="610" y="365" font-size="34">1 × 12 = 12</text><rect x="850" y="205" width="260" height="170" rx="32" fill="#E8F3ED" stroke="#287A55" stroke-width="9"/><text x="980" y="310" font-size="58" font-weight="700">132</text><text x="600" y="620" font-size="39" font-weight="700">120 + 12 = 132</text></g></svg>
