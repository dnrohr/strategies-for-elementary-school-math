<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Double twenty-seven and halve forty-six without changing the product</title><desc id="desc">A balanced transformation maps 27 to 54 by doubling and 46 to 23 by halving. The equivalent product 54 times 23 is split into 54 times 20 equals 1,080 and 54 times 3 equals 162, totaling 1,242.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Balance the factors</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#18324A"><rect x="90" y="165" width="310" height="190" rx="24" fill="#FFFDF8" stroke="#18324A" stroke-width="4"/><text x="245" y="275" font-size="54" font-weight="700">27 × 46</text><path d="M430 260h250" stroke="#7652A8" stroke-width="8" marker-end="url(#a)"/><text x="555" y="210" font-size="26" fill="#553A78">double × halve</text><rect x="710" y="165" width="400" height="190" rx="24" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="910" y="275" font-size="54" font-weight="700">54 × 23</text><text x="245" y="410" font-size="25">27 → 54 (×2)</text><text x="910" y="410" font-size="25">46 → 23 (÷2)</text></g><rect x="200" y="480" width="800" height="180" rx="25" fill="#FFFDF8" stroke="#176B73" stroke-width="4" stroke-dasharray="12 8"/><g font-family="Arial,sans-serif" fill="#18324A"><text x="270" y="555" font-size="32">54 × 20 = 1,080</text><text x="650" y="555" font-size="32">54 × 3 = 162</text><text x="600" y="625" text-anchor="middle" font-size="39" font-weight="700" fill="#347C5A">1,080 + 162 = 1,242</text></g><text x="600" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">The product stays balanced.</text></svg>
