<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Equal fraction bars compare three fifths and five eighths</title>
  <desc id="desc">Two equal-length bars share aligned endpoints. Three of five equal parts reach 60 percent of the whole; five of eight equal parts reach 62.5 percent, 20 units farther on the 800-unit bar.</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="12" stroke="#176B73" stroke-width="4"/></pattern></defs>
  <rect width="1200" height="800" fill="#F8F2E7"/><text x="100" y="105" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18324A">Same whole, different partitions</text>
  <text x="100" y="245" font-family="Arial, sans-serif" font-size="30" fill="#18324A">3/5</text><rect x="240" y="190" width="480" height="110" fill="url(#hatch)"/><rect x="240" y="190" width="800" height="110" fill="none" stroke="#18324A" stroke-width="5"/><path d="M400 190v110M560 190v110M720 190v110M880 190v110" stroke="#18324A" stroke-width="3"/><text x="720" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#18324A">3 equal fifths = 0.600</text>
  <text x="100" y="505" font-family="Arial, sans-serif" font-size="30" fill="#18324A">5/8</text><rect x="240" y="450" width="500" height="110" fill="#F2B35F"/><rect x="240" y="450" width="800" height="110" fill="none" stroke="#18324A" stroke-width="5"/><path d="M340 450v110M440 450v110M540 450v110M640 450v110M740 450v110M840 450v110M940 450v110" stroke="#18324A" stroke-width="3"/><text x="740" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#18324A">5 equal eighths = 0.625</text>
  <path d="M720 650v35h20v-35" fill="none" stroke="#B33A3A" stroke-width="5"/><text x="730" y="725" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7A2525">5/8 reaches farther</text>
</svg>
