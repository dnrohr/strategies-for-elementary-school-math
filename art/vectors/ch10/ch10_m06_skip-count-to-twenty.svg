<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Four jumps of five reach twenty, with twenty-three before twenty-five</title>
  <desc id="desc">A zero-to-twenty-five number line shows exactly four equal rightward jumps: zero to five, five to ten, ten to fifteen, and fifteen to twenty. Twenty-three is marked three units after twenty and two units before twenty-five.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7652A8"/></marker></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="85" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18324A">Count complete groups of five</text><path d="M150 510H1050" stroke="#18324A" stroke-width="7"/>
  <g stroke="#18324A" stroke-width="4"><path d="M150 485v50M330 485v50M510 485v50M690 485v50M870 475v70M978 470v80M1050 475v70"/></g><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#18324A"><text x="150" y="585">0</text><text x="330" y="585">5</text><text x="510" y="585">10</text><text x="690" y="585">15</text><text x="870" y="585">20</text><text x="978" y="625" fill="#7A2525">23</text><text x="1050" y="585">25</text></g>
  <g fill="none" stroke="#7652A8" stroke-width="7" marker-end="url(#a)"><path d="M160 465Q240 255 320 465"/><path d="M340 465Q420 255 500 465"/><path d="M520 465Q600 255 680 465"/><path d="M700 465Q780 255 860 465"/></g><g font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#553A78"><text x="240" y="285">+5</text><text x="420" y="285">+5</text><text x="600" y="285">+5</text><text x="780" y="285">+5</text></g><path d="M870 665h108" stroke="#B33A3A" stroke-width="6"/><text x="924" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#7A2525">remainder 3</text><text x="600" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18324A">Four complete jumps; 23 is short of the next group at 25.</text>
</svg>
