<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-two twelfths becomes one whole and five sixths</title><desc id="desc">One bar contains exactly 12 equal twelfth cells, forming a whole. A second bar contains 10 more cells at the same width. Five brackets pair those 10 cells, showing that 10 twelfths simplifies to 5 sixths.</desc><defs><pattern id="g" x="160" width="50" height="95" patternUnits="userSpaceOnUse"><path d="M50 0V95" stroke="#18324A" stroke-width="2"/></pattern></defs><rect width="1200" height="800" fill="#F8F2E7"/><text x="65" y="78" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#18324A">Make a whole; pair the remainder</text><text x="600" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700">22/12 = 12/12 + 10/12</text>
  <rect x="160" y="210" width="600" height="95" fill="#B9D8D5"/><rect x="160" y="210" width="600" height="95" fill="url(#g)" stroke="#18324A" stroke-width="5"/><path d="M160 350v40h600v-40" fill="none" stroke="#176B73" stroke-width="6"/><text x="460" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="28">12 cells = 12/12 = 1 whole</text>
  <rect x="160" y="515" width="500" height="95" fill="#F2B35F"/><rect x="160" y="515" width="500" height="95" fill="url(#g)" stroke="#18324A" stroke-width="5"/><path d="M160 650v35h100v-35M260 650v35h100v-35M360 650v35h100v-35M460 650v35h100v-35M560 650v35h100v-35" fill="none" stroke="#C66A12" stroke-width="5"/><text x="840" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="30">10/12 ÷ 2/2</text><text x="840" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700">= 5/6</text><text x="600" y="755" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#347C5A">22/12 = 11/6 = 1 5/6</text>
</svg>
