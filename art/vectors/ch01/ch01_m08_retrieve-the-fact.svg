  <title id="title">Method 8: Retrieve seven plus five as twelve</title>
  <desc id="desc">A sparse symbolic diagram shows seven plus five traveling by one direct arrow to a double-outlined result twelve. A small dashed route labeled check afterward is secondary. No counters or sensory imagery appear.</desc>
