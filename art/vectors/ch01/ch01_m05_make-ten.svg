<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Method 5: Make ten by splitting five into three and two</title>
  <desc id="desc">An exact two-by-five ten-frame contains seven solid blue counters and three orange hatched counters that complete ten. Two orange hatched counters remain outside. The equation reads seven plus five equals seven plus three plus two equals ten plus two equals twelve.</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FFF3DF"/><line y2="12" stroke="#D97706" stroke-width="5"/></pattern></defs>
  <style>text{font-family:"Trebuchet MS",Arial,sans-serif;fill:#24312D}.eyebrow{font-size:22px;font-weight:700;letter-spacing:2px}.heading{font-size:42px;font-weight:700}.sub{font-size:25px;fill:#52615B}.label{font-size:23px;font-weight:700}.math{font-size:33px;font-weight:700}.blue{fill:#2764B8;stroke:#174478;stroke-width:5}.orange{fill:url(#hatch);stroke:#A95805;stroke-width:5}.cell{fill:#FFFDF8;stroke:#68707A;stroke-width:4}</style>
  <rect width="1200" height="800" fill="#FFFDF8"/><text x="70" y="62" class="eyebrow">METHOD 05 · DECOMPOSITION</text><text x="70" y="116" class="heading">Split 5 to make 10</text><text x="70" y="154" class="sub">Three fill the frame; two remain.</text>
  <rect x="64" y="190" width="1072" height="450" rx="28" fill="#F6F1E8" stroke="#D7D0C4" stroke-width="4"/>
  <g aria-label="ten-frame with seven starting counters and three added counters"><rect x="130" y="266" width="148" height="124" class="cell"/><rect x="278" y="266" width="148" height="124" class="cell"/><rect x="426" y="266" width="148" height="124" class="cell"/><rect x="574" y="266" width="148" height="124" class="cell"/><rect x="722" y="266" width="148" height="124" class="cell"/><rect x="130" y="390" width="148" height="124" class="cell"/><rect x="278" y="390" width="148" height="124" class="cell"/><rect x="426" y="390" width="148" height="124" class="cell"/><rect x="574" y="390" width="148" height="124" class="cell"/><rect x="722" y="390" width="148" height="124" class="cell"/><circle class="blue" cx="204" cy="328" r="40"/><circle class="blue" cx="352" cy="328" r="40"/><circle class="blue" cx="500" cy="328" r="40"/><circle class="blue" cx="648" cy="328" r="40"/><circle class="blue" cx="796" cy="328" r="40"/><circle class="blue" cx="204" cy="452" r="40"/><circle class="blue" cx="352" cy="452" r="40"/><circle class="orange" cx="500" cy="452" r="40"/><circle class="orange" cx="648" cy="452" r="40"/><circle class="orange" cx="796" cy="452" r="40"/></g>
  <g aria-label="two counters left outside"><circle class="orange" cx="966" cy="355" r="40"/><circle class="orange" cx="1062" cy="355" r="40"/></g>
  <path d="M445 548v24h410v-24" fill="none" stroke="#D97706" stroke-width="5"/><text x="650" y="609" class="label" text-anchor="middle">3 moved into the empty cells</text><path d="M912 430v24h198v-24" fill="none" stroke="#D97706" stroke-width="5"/><text x="1011" y="496" class="label" text-anchor="middle">2 left</text><text x="500" y="238" class="label" text-anchor="middle">full frame = 10</text><text x="1014" y="238" class="label" text-anchor="middle">residual = 2</text>
  <rect x="70" y="682" width="1060" height="76" rx="20" fill="#E6F2EA" stroke="#287A55" stroke-width="6"/><text x="600" y="731" class="math" text-anchor="middle">7 + 5 = 7 + 3 + 2 = 10 + 2 = 12</text>
</svg>
