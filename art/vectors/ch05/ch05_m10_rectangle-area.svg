<svg data-qa-image-fixes="2026-09-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility"><title id="title">Area of an eleven by twelve rectangle</title><desc id="desc">A fully visible eleven-row by twelve-column grid remains unobscured. Dimension labels sit outside the grid, while a separate result card below states the area is 132 square units.</desc><rect width="1200" height="800" fill="#F8F2E7"/><text x="64" y="78" font-family="Arial,sans-serif" fill="#18324A" font-size="34" font-weight="700">Area, not perimeter</text><defs><pattern id="g" x="180" y="145" width="70" height="40" patternUnits="userSpaceOnUse"><rect width="70" height="40" fill="#E7EEF8" stroke="#68707A" stroke-width="2"/></pattern></defs>
  <rect x="180" y="145" width="840" height="440" fill="url(#g)" stroke="#2764B8" stroke-width="7"/><text x="600" y="125" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28">12 columns</text><text x="125" y="365" text-anchor="middle" font-family="Arial,sans-serif" fill="#18324A" font-size="28" transform="rotate(-90 125 365)">11 rows</text>
  <rect x="350" y="635" width="500" height="105" rx="26" fill="#DDEDE4" stroke="#347C5A" stroke-width="5"/><text x="600" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#347C5A">area = 11 × 12 = 132 square units</text></svg>
